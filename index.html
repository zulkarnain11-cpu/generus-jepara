    function getWIBParts(dateObj = new Date()) {
      try {
        const formatter = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Jakarta",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
        const parts = formatter.formatToParts(dateObj);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const year = parseInt(map.year, 10);
        const month = parseInt(map.month, 10);
        const day = parseInt(map.day, 10);
        const hour = parseInt(map.hour, 10) % 24;
        const minute = parseInt(map.minute, 10);
        const hh = String(hour).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${map.year}-${map.month}-${map.day}`,
          timeStr: `${hh}:${map.minute} WIB`
        };
      } catch (e) {
        const utc = dateObj.getTime() + dateObj.getTimezoneOffset() * 60000;
        const wib = new Date(utc + 7 * 3600000);
        const year = wib.getFullYear();
        const month = wib.getMonth() + 1;
        const day = wib.getDate();
        const hour = wib.getHours();
        const minute = wib.getMinutes();
        const pad = (n) => String(n).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${year}-${pad(month)}-${pad(day)}`,
          timeStr: `${pad(hour)}:${pad(minute)} WIB`
        };
      }
    }

    function formatTanggalID(isoDateStr) {
      if (!isoDateStr) return "-";
      const clean = String(isoDateStr).slice(0, 10);
      const parts = clean.split("-");
      if (parts.length !== 3) return escapeHTML(String(isoDateStr));
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      if (!m || !d || m < 1 || m > 12) return escapeHTML(clean);
      return `${d} ${NAMA_BULAN[m - 1]} ${y}`;
    }

    function formatDateTimeWIB(isoTimestamp) {
      if (!isoTimestamp) return "-";
      const d = new Date(isoTimestamp);
      if (isNaN(d.getTime())) return "-";
      const p = getWIBParts(d);
      return `${p.day} ${NAMA_BULAN[p.month - 1].slice(0, 3)} ${p.year}, ${p.timeStr}`;
    }

    function shiftISODate(isoDateStr, deltaDays) {
      const clean = String(isoDateStr || getWIBParts().isoDate).slice(0, 10);
      const [y, m, d] = clean.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + deltaDays));
      const yy = dt.getUTCFullYear();
      const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(dt.getUTCDate()).padStart(2, "0");
      return `${yy}-${mm}-${dd}`;
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function getUserInitials(name) {
      const words = String(name || "GJ").trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "GJ";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

      const container = document.getElementById("toastContainer");
      if (!container) return;

      const styles = {
        success: "bg-emerald-900 text-white border-emerald-700",
        error: "bg-rose-900 text-white border-rose-700",
        warning: "bg-amber-500 text-slate-950 border-amber-600",
        info: "bg-slate-900 text-white border-slate-700"
      };
      const icons = {
        success: "✅",
        error: "❌",
        warning: "⚠️",
        info: "ℹ️"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;

        <div class="flex-1 leading-snug">${escapeHTML(message)}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => toast.remove(), 300);
      }, 4200);

    // INISIALISASI SUPABASE & PENGATURAN KONEKSI (KHUSUS ADMIN)
    // ============================================================================
    let supabaseClient = null;
    let isLiveSupabase = false;

    function initSupabase(url, key) {
      const cleanUrl = String(url || "").trim().replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
      if (cleanUrl && key && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(cleanUrl, key);
          isLiveSupabase = true;
          return true;
        } catch (err) {
          console.error("Gagal menginisialisasi Supabase:", err);
        }
      }
      supabaseClient = null;
      isLiveSupabase = false;
      return false;
    }

    initSupabase(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

    /**
     * Helper penulisan Supabase yang tahan perbedaan kolom migrasi:
     * Jika tabel Supabase lama belum memiliki kolom baru (misal nama_desa / avatar_url / pertemuan_per_minggu),
     * otomatis menghapus kolom yang belum dimigrasi dan mencoba ulang agar penyimpanan tetap sukses.
     */
    async function resilientSupabaseMutation(table, method, payload, matchObj = null, options = {}) {
      if (!isLiveSupabase || !supabaseClient) return { error: null };
      let currentPayload = Array.isArray(payload)
        ? payload.map(item => ({ ...item }))
        : (payload ? { ...payload } : null);

      for (let attempt = 0; attempt < 5; attempt++) {
        let query;
        if (method === "insert") {
          query = supabaseClient.from(table).insert(currentPayload);
        } else if (method === "upsert") {
          query = supabaseClient.from(table).upsert(currentPayload, options);
        } else if (method === "update") {
          query = supabaseClient.from(table).update(currentPayload);
          if (matchObj) {
            Object.entries(matchObj).forEach(([k, v]) => { query = query.eq(k, v); });
          }
        }
        const res = await query;
        if (!res.error) return res;

        const msg = String(res.error.message || "");
        const colMatch = msg.match(/Could not find the '([^']+)' column/i) || msg.match(/column "([^"]+)" of relation/i);
        if (colMatch && colMatch[1] && currentPayload) {
          const missingCol = colMatch[1];
          if (Array.isArray(currentPayload)) {
            currentPayload.forEach(item => { delete item[missingCol]; });
          } else {
            delete currentPayload[missingCol];
          }
          continue;
        }
        return res;
      }
      return { error: null };
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = sanitizeUsername(document.getElementById("loginUsername")?.value.trim() || "");
      const password = document.getElementById("loginPassword")?.value || "";

      if (!username || !password) {
        showToast("Masukkan username dan password Anda.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          const internalEmail = username + APP_CONFIG.INTERNAL_EMAIL_DOMAIN;
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: internalEmail,
            password
          });
          if (error) throw error;

          const profile = await fetchOrRepairProfile(data.user.id, username);
          if (!profile) {
            await supabaseClient.auth.signOut();
            showToast("Profil akun tidak ditemukan di database.", "error");
            return;
          }

          if (profile.status_akun === "pending") {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
            return;
          }
          if (profile.status_akun === "rejected") {
            await supabaseClient.auth.signOut();
            showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
            return;
          }
          if (!isAccountActiveStatus(profile.status_akun)) {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
            return;
          }

          await syncAllFromSupabase();
          completeUserSession(profile);
          return;
        } catch (err) {
          showToast("Login gagal: " + (err.message || "Username atau password salah."), "error");
          return;
        }
      }

      const user = dbStore.profiles.find(p => p.username === username);
      if (!user || user.password_hash !== password) {
        showToast("Username atau password tidak sesuai.", "error");
        return;
      }
      if (user.status_akun === "pending") {
        showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
        return;
      }
      if (user.status_akun === "rejected") {
        showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
        return;
      }
      if (!isAccountActiveStatus(user.status_akun)) {
        showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
        return;
      }

      completeUserSession(user);
    }

    async function syncAllFromSupabase() {
      if (!isLiveSupabase || !supabaseClient) return;
      try {
        const [
          resProfiles, resRombel, resPeserta, resJurnal,
          resPresensi, resLapBul, resLapMing, resDok, resKendala, resAnn, resLog
        ] = await Promise.all([
          supabaseClient.from("profiles").select("*").order("created_at", { ascending: true }),
          supabaseClient.from("rombel").select("*").order("urutan", { ascending: true }),
          supabaseClient.from("peserta").select("*").order("nama_peserta", { ascending: true }),
          supabaseClient.from("jurnal_guru").select("*").order("tanggal", { ascending: false }),

    async function saveAccountSettings(e) {
      e.preventDefault();
      const user = appState.currentUser;
      if (!user) return;

      const newNamaKelompok = document.getElementById("accNamaKelompok")?.value.trim() || "";
      const newUsername = sanitizeUsername(document.getElementById("accUsername")?.value || "");
      const newNamaDesa = user.role === "user" ? (document.getElementById("accNamaDesa")?.value || "") : (user.nama_desa || "");
      const newPassword = document.getElementById("accNewPassword")?.value || "";
      const confirmPassword = document.getElementById("accConfirmPassword")?.value || "";

      if (!newNamaKelompok) {
        showToast("Nama kelompok/tampilan wajib diisi.", "warning");
        return;
      }
      if (user.role === "user" && !newNamaDesa) {
        showToast("Silakan pilih Desa kelompok Anda.", "warning");
        return;
      }
      if (newUsername.length < 4) {
        showToast("Username minimal 4 karakter.", "warning");
        return;
      }
      if (newPassword) {
        if (newPassword.length < 8) {
          showToast("Password baru minimal 8 karakter.", "warning");
          return;
        }
        if (newPassword !== confirmPassword) {
          showToast("Konfirmasi password baru tidak cocok.", "error");
          return;
        }
      }

      if (dbStore.profiles.some(p => p.username === newUsername && p.id !== user.id)) {
        showToast("Username tersebut sudah digunakan akun lain.", "error");
        return;
      }

      let finalAvatarUrl = user.avatar_url || "";
      if (appState.pendingAvatarRemove) {
        finalAvatarUrl = "";
      } else if (appState.pendingAvatarDataUrl) {
        finalAvatarUrl = appState.pendingAvatarDataUrl;
        if (isLiveSupabase && supabaseClient && appState.pendingAvatarBlob) {
          try {
            const avatarPath = `${user.id}/avatar_${Date.now()}.jpg`;
            const { error: upErr } = await supabaseClient.storage
              .from(APP_CONFIG.STORAGE_BUCKET)
              .upload(avatarPath, appState.pendingAvatarBlob, { contentType: "image/jpeg", upsert: true });
            if (!upErr) {
              const { data: pubData } = supabaseClient.storage
                .from(APP_CONFIG.STORAGE_BUCKET)
                .getPublicUrl(avatarPath);
              if (pubData?.publicUrl) finalAvatarUrl = pubData.publicUrl;
            }
          } catch (err) {
            console.warn("Fallback ke dataUrl untuk avatar:", err);
          }
        }
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          if (newUsername !== user.username) {
            const { error: uErr } = await supabaseClient.rpc("update_own_username", { new_username: newUsername });
            if (uErr) throw uErr;
          }

          const profRes = await resilientSupabaseMutation(
            "profiles",
            "update",
            {
              nama_kelompok: newNamaKelompok,
              nama_desa: newNamaDesa,
              username: newUsername,
              avatar_url: finalAvatarUrl
            },
            { id: user.id }
          );
          if (profRes.error) throw profRes.error;

          if (newPassword) {
            const { error: passErr } = await supabaseClient.auth.updateUser({
              password: newPassword
            });
            if (passErr) throw passErr;
          }
        } catch (err) {
          showToast("Gagal memperbarui akun: " + (err.message || "Terjadi kesalahan."), "error");
          return;
        }
      } else {
        if (newPassword) {
          user.password_hash = newPassword;
        }
      }

      user.nama_kelompok = newNamaKelompok;
      user.nama_desa = newNamaDesa;
      user.username = newUsername;
      user.avatar_url = finalAvatarUrl;

      const idx = dbStore.profiles.findIndex(p => p.id === user.id);
      if (idx >= 0) {
        dbStore.profiles[idx] = { ...dbStore.profiles[idx], ...user };
      }

      logActivity("Perbarui Pengaturan Akun", `Memperbarui profil akun (${newNamaKelompok} / @${newUsername})`);
      closeModal();
      showToast("Pengaturan akun & foto profil berhasil disimpan!", "success");
      renderApp();
    }

    function isMudaMudiRombel(namaRombel) {

    function getRombelMeetingsPerWeek(rombelObj) {
      if (!rombelObj) return 5;
      const val = Number(rombelObj.pertemuan_per_minggu);
      if (val >= 1 && val <= 7) return val;
      return isMudaMudiRombel(rombelObj.nama_rombel) ? 2 : 5;

    function calculatePresensiSummary(kelompokId, bulan, tahun, rombelIdFilter = null) {
      const records = dbStore.presensi.filter(p =>
        p.kelompok_id === kelompokId &&
        Number(p.bulan) === Number(bulan) &&
        Number(p.tahun) === Number(tahun) &&
        (!rombelIdFilter || p.rombel_id === rombelIdFilter)
      );

      let H = 0, I = 0, S = 0, A = 0;
      const uniqueDates = new Set();
      records.forEach(r => {
        uniqueDates.add(r.tanggal);
        if (r.status === "H") H++;
        else if (r.status === "I") I++;
        else if (r.status === "S") S++;
        else if (r.status === "A") A++;
      });

      const total = H + I + S + A;
      const pctH = total > 0 ? Number(((H / total) * 100).toFixed(1)) : 0;
      const pctI = total > 0 ? Number(((I / total) * 100).toFixed(1)) : 0;
      const pctS = total > 0 ? Number(((S / total) * 100).toFixed(1)) : 0;
      const pctA = total > 0 ? Number(((A / total) * 100).toFixed(1)) : 0;

      return {
        H, I, S, A, total,
        pctH, pctI, pctS, pctA,
        uniqueDates: Array.from(uniqueDates).sort()
      };
    }

    // ============================================================================
    // KOMPRESI FOTO OTOMATIS DI BROWSER
    // ============================================================================
    async function compressImageInBrowser(file, maxWidth = APP_CONFIG.MAX_PHOTO_WIDTH, targetKB = APP_CONFIG.TARGET_PHOTO_KB) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) {
          reject(new Error("File harus berupa gambar (JPG/PNG/WebP)."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
        reader.onload = (event) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Format gambar tidak didukung."));
          img.onload = async () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            let quality = 0.85;
            let blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));

            while (blob && blob.size / 1024 > targetKB && quality > 0.35) {
              quality -= 0.08;
              blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
            }

            const dataUrl = await new Promise(res => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.readAsDataURL(blob);
            });

            resolve({
              blob,
              dataUrl,
              sizeKB: Math.round(blob.size / 1024),
              width,
              height
            });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // SHARE HASIL KEGIATAN & PRESENSI MINGGUAN KE WHATSAPP / GRUP ORANG TUA
    // ============================================================================
    function buildWeeklyWhatsAppReportText(laporanId, rombelId, weekNum) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return "";
      const kelompokName = appState.currentUser?.nama_kelompok || getKelompokName(lap.kelompok_id);
      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      const rombelName = rombelObj ? rombelObj.nama_rombel : "Semua Kelas";
      const meetingsPerWeek = getRombelMeetingsPerWeek(rombelObj);
      const bulanName = NAMA_BULAN[Number(lap.bulan) - 1];

      const dailyRows = dbStore.laporan_mingguan
        .filter(m =>
          m.laporan_id === lap.id &&
          m.rombel_id === rombelId &&
          Number(m.minggu_ke) === Number(weekNum) &&
          Number(m.pertemuan_ke || 1) <= meetingsPerWeek
        )
        .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));

      let materiLines = [];
      const weekDates = [];

      dailyRows.forEach(w => {
        const pt = Number(w.pertemuan_ke || 1);
        const tglLabel = w.tanggal ? ` (${formatTanggalID(w.tanggal)})` : "";
        if (w.tanggal) weekDates.push(w.tanggal);

        if (w.tidak_ada_kegiatan) {
          materiLines.push(`*Pertemuan ke-${pt}${tglLabel}:*\n  _Libur / Tidak ada kegiatan (${w.alasan || "-"})_`);
        } else {
          const parts = [];
          MATERI_OPTIONS_LIST.forEach(opt => {
            if (w[opt.key] && String(w[opt.key]).trim()) {
              parts.push(`  • ${opt.label}: ${String(w[opt.key]).trim()}`);
            }
          });
          if (w.keterangan && String(w.keterangan).trim()) {
            parts.push(`  • Keterangan: ${String(w.keterangan).trim()}`);
          }

          if (parts.length === 0) {
            materiLines.push(`*Pertemuan ke-${pt}${tglLabel}:*\n  _Belum ada catatan materi_`);
          } else {
            materiLines.push(`*Pertemuan ke-${pt}${tglLabel}:*\n${parts.join("\n")}`);
          }
        }
      });

      const pesertaList = dbStore.peserta.filter(p =>
        p.kelompok_id === lap.kelompok_id &&
        p.rombel_id === rombelId &&
        p.aktif
      );

      const presRecords = dbStore.presensi.filter(p =>
        p.kelompok_id === lap.kelompok_id &&
        p.rombel_id === rombelId &&
        Number(p.bulan) === Number(lap.bulan) &&
        Number(p.tahun) === Number(lap.tahun)
      );

      let presensiSection = "";
      if (pesertaList.length === 0) {
        presensiSection = "_Belum ada data peserta terdaftar di kelas ini._";
      } else {
        const weekPresRecords = weekDates.length > 0
          ? presRecords.filter(r => weekDates.includes(r.tanggal))
          : [];

        if (weekPresRecords.length > 0) {
          const sortedWeekDates = Array.from(new Set(weekPresRecords.map(r => r.tanggal))).sort();
          presensiSection = pesertaList.map((p, idx) => {
            const statuses = sortedWeekDates.map(dt => {
              const rec = weekPresRecords.find(r => r.peserta_id === p.id && r.tanggal === dt);
              return rec ? rec.status : "-";
            });
            const hadirCount = statuses.filter(s => s === "H").length;
            return `${idx + 1}. ${p.nama_peserta} : *${statuses.join(", ")}* (Hadir ${hadirCount}/${sortedWeekDates.length})`;
          }).join("\n");
        } else {
          presensiSection = pesertaList.map((p, idx) => {
            const pRecs = presRecords.filter(r => r.peserta_id === p.id);
            const H = pRecs.filter(r => r.status === "H").length;
            const I = pRecs.filter(r => r.status === "I").length;
            const S = pRecs.filter(r => r.status === "S").length;
            const A = pRecs.filter(r => r.status === "A").length;
            const tot = H + I + S + A;
            if (tot === 0) {
              return `${idx + 1}. ${p.nama_peserta} : _Belum ada absensi bulan ini_`;
            }
            const pct = Math.round((H / tot) * 100);
            return `${idx + 1}. ${p.nama_peserta} : H=${H}, I=${I}, S=${S}, A=${A} (*${pct}%*)`;
          }).join("\n");
        }
      }

        `*LAPORAN KEGIATAN PENGAJIAN GENERUS JEPARA (DIGENARA)*`,
        `Assalamu'alaikum Wr. Wb.`,
        `Berikut kami sampaikan laporan hasil kegiatan & kehadiran putra-putri Bapak/Ibu Wali Santri:`,

    async function copyWhatsAppShareText() {
      const ta = document.getElementById("waShareMessageText");
      if (!ta) return;
      try {
        await navigator.clipboard.writeText(ta.value);
        showToast("Teks laporan mingguan berhasil disalin! Siap ditempel di Grup WA.", "success");
      } catch (e) {
        ta.select();
        document.execCommand("copy");
        showToast("Teks laporan mingguan berhasil disalin!", "success");
      }
    }

    function sendToWhatsAppExternal() {
      const ta = document.getElementById("waShareMessageText");
      if (!ta || !ta.value.trim()) return;
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(ta.value)}`;
      logActivity("Share Laporan Mingguan ke WhatsApp", "Membagikan hasil kegiatan & kehadiran mingguan ke grup orang tua.");
      window.open(waUrl, "_blank", "noopener,noreferrer");

    async function saveJurnalForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        rombel_id: document.getElementById("jRombel").value || null,

        if (res.error) {
          showToast("Gagal menyimpan jurnal: " + res.error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.jurnal_guru.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.jurnal_guru[idx] = payload;
        logActivity("Edit Jurnal Guru", `Mengubah jurnal tanggal ${payload.tanggal}`);
      } else {
        dbStore.jurnal_guru.unshift(payload);
        logActivity("Tambah Jurnal Guru", `Menambah jurnal materi: ${payload.materi}`);
      }

      closeModal();
      showToast("Jurnal guru berhasil disimpan!", "success");
      renderApp();
    }

    function deleteJurnalItem(id) {
      confirmDialog("Hapus Jurnal?", "Catatan jurnal pertemuan ini akan dihapus permanen.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await supabaseClient.from("jurnal_guru").delete().eq("id", id);
        }
        dbStore.jurnal_guru = dbStore.jurnal_guru.filter(x => x.id !== id);

        renderApp();

    // MENU 2 USER: PRESENSI OTOMATIS DI TANGGAL BERIKUTNYA & RIWAYAT TERSIMPAN
    // ============================================================================
    function ensurePresensiInitializedForDate(uid, rombelId, targetDate) {
      if (!uid || !rombelId || !targetDate) return false;
      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);
      if (pesertaList.length === 0) return false;

      const [y, m] = targetDate.split("-").map(Number);
      const newlyCreated = [];

      for (const p of pesertaList) {
        const exists = dbStore.presensi.find(r => r.peserta_id === p.id && r.tanggal === targetDate);
        if (!exists) {
          const rec = {
            id: generateUUID(),
            kelompok_id: uid,
            rombel_id: rombelId,
            peserta_id: p.id,
            bulan: m,
            tahun: y,
            tanggal: targetDate,
            status: "H"
          };
          dbStore.presensi.push(rec);
          newlyCreated.push(rec);
        }
      }

      if (newlyCreated.length > 0) {
        persistPresensiBatch(newlyCreated);
        return true;
      }
      return false;
    }

    async function persistPresensiBatch(records) {
      if (!records || records.length === 0) return;
      if (appState.isOfflineMode) {
        records.forEach(rec => {
          const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === rec.peserta_id && q.tanggal === rec.tanggal);
          if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = { ...rec };
          else appState.offlinePresensiQueue.push({ ...rec });
        });
        return;
      }
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("presensi", "upsert", records, null, { onConflict: "peserta_id,tanggal" });
      }
    }

    function selectPresensiActiveDate(newDate) {
      if (!newDate) return;
      appState.presensiActiveDate = newDate;
      const [y, m] = newDate.split("-").map(Number);
      if (y && m) {
        appState.selectedYear = y;
        appState.selectedMonth = m;
      }
      const uid = appState.currentUser?.id;
      const rombelId = appState.presensiSelectedRombel;
      if (uid && rombelId) {
        const created = ensurePresensiInitializedForDate(uid, rombelId, newDate);
        if (created) {
          showToast(`Presensi tanggal ${formatTanggalID(newDate)} otomatis disiapkan (riwayat hari sebelumnya tetap tersimpan).`, "success");
        }
      }
      renderApp();
    }

    function shiftPresensiActiveDate(deltaDays) {
      const base = appState.presensiActiveDate || getWIBParts().isoDate;
      const nextDate = shiftISODate(base, deltaDays);
      selectPresensiActiveDate(nextDate);
    }

    async function setPresensiStatusForDate(pesertaId, tanggal, newStatus) {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const [y, m] = tanggal.split("-").map(Number);

      let rec = dbStore.presensi.find(r => r.peserta_id === pesertaId && r.tanggal === tanggal);
      if (!rec) {
        rec = {
          id: generateUUID(),
          kelompok_id: uid,
          rombel_id: rombelId,
          peserta_id: pesertaId,
          bulan: m,
          tahun: y,
          tanggal,
          status: newStatus
        };
        dbStore.presensi.push(rec);
      } else {
        rec.status = newStatus;
      }

      await persistPresensiRecord(rec);
      renderApp();
    }

    async function markAllPresentForActiveDate() {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const tanggal = appState.presensiActiveDate || getWIBParts().isoDate;
      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);
      if (pesertaList.length === 0) return;

      const [y, m] = tanggal.split("-").map(Number);
      const updated = [];

      for (const p of pesertaList) {
        let rec = dbStore.presensi.find(r => r.peserta_id === p.id && r.tanggal === tanggal);
        if (!rec) {
          rec = {
            id: generateUUID(),
            kelompok_id: uid,
            rombel_id: rombelId,
            peserta_id: p.id,
            bulan: m,
            tahun: y,
            tanggal,
            status: "H"
          };
          dbStore.presensi.push(rec);
        } else {
          rec.status = "H";
        }
        updated.push(rec);
      }

      await persistPresensiBatch(updated);
      showToast(`Seluruh peserta pada tanggal ${formatTanggalID(tanggal)} ditandai Hadir (H).`, "success");
      renderApp();
    }

    async function cyclePresensiCell(pesertaId, tanggal) {
      const order = ["H", "I", "S", "A"];
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const [y, m] = tanggal.split("-").map(Number);

      let rec = dbStore.presensi.find(r => r.peserta_id === pesertaId && r.tanggal === tanggal);
      if (!rec) {
        rec = {
          id: generateUUID(),
          kelompok_id: uid,
          rombel_id: rombelId,
          peserta_id: pesertaId,
          bulan: m,
          tahun: y,
          tanggal,
          status: "I"
        };
        dbStore.presensi.push(rec);
      } else {
        const nextIdx = (order.indexOf(rec.status) + 1) % order.length;
        rec.status = order[nextIdx];
      }

      await persistPresensiRecord(rec);
      renderApp();
    }

    async function persistPresensiRecord(rec) {
      if (appState.isOfflineMode) {
        const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === rec.peserta_id && q.tanggal === rec.tanggal);
        if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = { ...rec };
        else appState.offlinePresensiQueue.push({ ...rec });
        return;
      }
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("presensi", "upsert", rec, null, { onConflict: "peserta_id,tanggal" });
      }
    }

    async function processImportPesertaExcel() {
      const fileInput = document.getElementById("excelPesertaFile");
      const file = fileInput?.files?.[0];
      if (!file) {
        showToast("Pilih file Excel terlebih dahulu.", "warning");
        return;
      }
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);
          const uid = appState.currentUser.id;
          const rombelId = appState.presensiSelectedRombel;
          let added = 0;

          for (const row of json) {
            const nama = String(row["Nama Lengkap"] || row.Nama || row.nama || row["Nama Peserta"] || "").trim();
            const jkRaw = String(row.JK || row.jk || row["Jenis Kelamin"] || "L").trim().toUpperCase();
            const jk = jkRaw === "P" ? "P" : "L";
            const tempatLahir = String(row["Tempat Lahir"] || row.tempat_lahir || "Jepara").trim();
            const tglLahir = String(row["Tanggal Lahir"] || row.tanggal_lahir || "").trim().slice(0, 10) || null;
            const ortuWali = String(row["Nama Orang Tua / Wali"] || row["Orang Tua"] || row.nama_ortu_wali || "-").trim();

            if (nama) {
              const payload = {
                id: generateUUID(),
                kelompok_id: uid,
                rombel_id: rombelId,
                nama_peserta: nama,
                jenis_kelamin: jk,
                tempat_lahir: tempatLahir,
                tanggal_lahir: tglLahir,
                nama_ortu_wali: ortuWali,
                aktif: true
              };
              if (isLiveSupabase && supabaseClient) {
                await resilientSupabaseMutation("peserta", "insert", payload);
              }
              dbStore.peserta.push(payload);
              added++;
            }
          }
          closeModal();
          showToast(`Berhasil mengimpor ${added} peserta ke rombel!`, "success");
          renderApp();
        } catch (err) {
          showToast("Gagal membaca file Excel: " + err.message, "error");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function exportPresensiExcel() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.presensiSelectedRombel;
      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);
      const presRecords = dbStore.presensi.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && Number(p.bulan) === bulan && Number(p.tahun) === tahun);
      const dates = Array.from(new Set(presRecords.map(r => r.tanggal))).sort();

      const rows = pesertaList.map((p, idx) => {
        let H = 0, I = 0, S = 0, A = 0;
        const rowObj = {
          No: idx + 1,
          "Nama Lengkap": p.nama_peserta,
          JK: p.jenis_kelamin,
          "Tempat Lahir": p.tempat_lahir || "-",
          "Tanggal Lahir": p.tanggal_lahir || "-",
          "Nama Orang Tua / Wali": p.nama_ortu_wali || "-"
        };
        dates.forEach(dt => {
          const st = presRecords.find(r => r.peserta_id === p.id && r.tanggal === dt)?.status || "H";
          rowObj[dt] = st;
          if (st === "H") H++; else if (st === "I") I++; else if (st === "S") S++; else if (st === "A") A++;
        });
        const tot = H + I + S + A;
        rowObj.Hadir = H;
        rowObj.Izin = I;
        rowObj.Sakit = S;
        rowObj.Alpha = A;
        rowObj["Persentase (%)"] = tot > 0 ? Math.round((H / tot) * 100) + "%" : "0%";
        return rowObj;
      });

      exportToExcelFile(rows, "Presensi", `Presensi_${appState.currentUser.username}_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
    }

    async function setRombelMeetingsPerWeek(rombelId, countVal) {
      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      if (!rombelObj) return;
      const newFreq = Math.min(7, Math.max(1, parseInt(countVal, 10) || 1));
      rombelObj.pertemuan_per_minggu = newFreq;

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("rombel", "update", { pertemuan_per_minggu: newFreq }, { id: rombelId });
      }
      showToast(`Jadwal ${rombelObj.nama_rombel} diatur menjadi ${newFreq}x pertemuan dalam 1 minggu.`, "success");
      renderApp();
    }

    function getSelectedMateriKeysForRow(w) {
      const explicit = appState.weeklySelectedMateriMap[w.id];
      const detected = MATERI_OPTIONS_LIST
        .filter(opt => w[opt.key] && String(w[opt.key]).trim() !== "")
        .map(opt => opt.key);
      const merged = new Set([...(explicit || []), ...detected]);
      return Array.from(merged);
    }

    function toggleWeeklyMateriOption(weeklyId, materiKey) {
      const row = dbStore.laporan_mingguan.find(w => w.id === weeklyId);
      if (!row) return;
      const current = new Set(getSelectedMateriKeysForRow(row));
      if (current.has(materiKey)) {
        current.delete(materiKey);
        row[materiKey] = "";
      } else {
        current.add(materiKey);
      }
      appState.weeklySelectedMateriMap[weeklyId] = Array.from(current);
      renderApp();
    }

    function ensureMonthlyReportObject(kelompokId, bulan, tahun) {
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === kelompokId && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      const presSum = calculatePresensiSummary(kelompokId, bulan, tahun);
      const aktifCount = dbStore.peserta.filter(p => p.kelompok_id === kelompokId && p.aktif).length;

      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: kelompokId,
          bulan,
          tahun,
          jumlah_pertemuan: presSum.uniqueDates.length,
          jumlah_peserta_aktif: aktifCount,
          rekap_hadir: presSum.pctH,
          rekap_izin: presSum.pctI,
          rekap_sakit: presSum.pctS,
          rekap_alpha: presSum.pctA,
          catatan_umum: "",
          capaian_bulanan: "",
          catatan_tambahan: "",
          status: "Draft",
          komentar_admin: "",
          submitted_at: null
        };
        dbStore.laporan_bulanan.push(lap);
      } else {
        lap.rekap_hadir = presSum.pctH;
        lap.rekap_izin = presSum.pctI;
        lap.rekap_sakit = presSum.pctS;
        lap.rekap_alpha = presSum.pctA;
      }

      const rombels = getGroupRombels(kelompokId);
      rombels.forEach(r => {
        const maxMeetings = getRombelMeetingsPerWeek(r);
        for (let w = 1; w <= 5; w++) {
          for (let pt = 1; pt <= maxMeetings; pt++) {
            const exists = dbStore.laporan_mingguan.find(m =>
              m.laporan_id === lap.id &&
              m.rombel_id === r.id &&
              Number(m.minggu_ke) === w &&
              Number(m.pertemuan_ke || 1) === pt
            );
            if (!exists) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: pt,
                tanggal: "",
                pegon: "",
                bacaan: "",
                tajwid: "",
                hafalan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan: "",
                keterangan: ""
              });
            }
          }
        }
      });

      return lap;
    }

    function syncLaporanFieldsToMemory(laporanId) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;
      const elPert = document.getElementById("lapPertemuan");
      const elAktif = document.getElementById("lapPesertaAktif");
      const elCatUmum = document.getElementById("lapCatatanUmum");
      const elCapaian = document.getElementById("lapCapaianBulanan");
      const elCatTamb = document.getElementById("lapCatatanTambahan");

      if (elPert) lap.jumlah_pertemuan = parseInt(elPert.value, 10) || 0;
      if (elAktif) lap.jumlah_peserta_aktif = parseInt(elAktif.value, 10) || 0;
      if (elCatUmum) lap.catatan_umum = elCatUmum.value;
      if (elCapaian) lap.capaian_bulanan = elCapaian.value;
      if (elCatTamb) lap.catatan_tambahan = elCatTamb.value;
    }

    function updateWeeklyField(weeklyId, field, value) {
      const row = dbStore.laporan_mingguan.find(w => w.id === weeklyId);
      if (!row) return;
      row[field] = value;
    }

    function toggleWeeklyLibur(weeklyId, isLibur) {
      const row = dbStore.laporan_mingguan.find(w => w.id === weeklyId);
      if (!row) return;
      row.tidak_ada_kegiatan = Boolean(isLibur);
      renderApp();
    }

    function copyFromPreviousMeeting(laporanId, rombelId, weekNum, targetPertemuan) {
      const prev = dbStore.laporan_mingguan.find(w =>
        w.laporan_id === laporanId &&
        w.rombel_id === rombelId &&
        Number(w.minggu_ke) === weekNum &&
        Number(w.pertemuan_ke || 1) === targetPertemuan - 1
      );
      const curr = dbStore.laporan_mingguan.find(w =>
        w.laporan_id === laporanId &&
        w.rombel_id === rombelId &&
        Number(w.minggu_ke) === weekNum &&
        Number(w.pertemuan_ke || 1) === targetPertemuan
      );
      if (!prev || !curr) return;

      MATERI_OPTIONS_LIST.forEach(opt => {
        curr[opt.key] = prev[opt.key];
      });
      curr.keterangan = prev.keterangan;
      curr.tidak_ada_kegiatan = false;
      appState.weeklySelectedMateriMap[curr.id] = getSelectedMateriKeysForRow(prev);

      showToast(`Materi Pertemuan ke-${targetPertemuan - 1} berhasil disalin ke Pertemuan ke-${targetPertemuan}.`, "success");
      renderApp();
    }

    function copyWholeWeekFromPrevious(laporanId, rombelId, targetWeek, meetingsPerWeek) {
      for (let pt = 1; pt <= meetingsPerWeek; pt++) {
        const prev = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === targetWeek - 1 &&
          Number(w.pertemuan_ke || 1) === pt
        );
        const curr = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === targetWeek &&
          Number(w.pertemuan_ke || 1) === pt
        );
        if (prev && curr) {
          MATERI_OPTIONS_LIST.forEach(opt => {
            curr[opt.key] = prev[opt.key];
          });
          curr.keterangan = prev.keterangan;
          curr.tidak_ada_kegiatan = prev.tidak_ada_kegiatan;
          curr.alasan = prev.alasan;
          appState.weeklySelectedMateriMap[curr.id] = getSelectedMateriKeysForRow(prev);
        }
      }
      showToast(`Seluruh pertemuan Minggu ke-${targetWeek - 1} disalin ke Minggu ke-${targetWeek}.`, "success");
      renderApp();
    }

    async function saveMonthlyReport(laporanId, targetStatus) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;

      syncLaporanFieldsToMemory(laporanId);

      // Pastikan rekap presensi bulanan terbaru ikut dilampirkan dalam laporan
      const presSum = calculatePresensiSummary(lap.kelompok_id, lap.bulan, lap.tahun);
      lap.rekap_hadir = presSum.pctH;
      lap.rekap_izin = presSum.pctI;
      lap.rekap_sakit = presSum.pctS;
      lap.rekap_alpha = presSum.pctA;

      if (targetStatus === "Dikirim") {
        if (!lap.capaian_bulanan.trim()) {
          showToast("Capaian Pembelajaran Bulan Ini (Bagian C) wajib diisi sebelum dikirim.", "error");
          return;
        }

        const rombels = getGroupRombels(lap.kelompok_id);
        const maxWeek = appState.showWeek5 ? 5 : 4;

        for (const r of rombels) {
          const maxMeetings = getRombelMeetingsPerWeek(r);
          const rows = dbStore.laporan_mingguan.filter(m =>
            m.laporan_id === lap.id &&
            m.rombel_id === r.id &&
            Number(m.minggu_ke) <= maxWeek &&
            Number(m.pertemuan_ke || 1) <= maxMeetings
          );
          for (const w of rows) {
            const pt = Number(w.pertemuan_ke || 1);
            if (w.tidak_ada_kegiatan) {
              if (!w.alasan.trim()) {
                showToast(`Rombel "${r.nama_rombel}" Minggu ${w.minggu_ke} Pertemuan ${pt}: Alasan tidak ada kegiatan wajib diisi.`, "error");
                return;
              }
            } else {
              const hasAnyMaterial = MATERI_OPTIONS_LIST.some(opt => w[opt.key] && String(w[opt.key]).trim() !== "");
              if (!hasAnyMaterial) {
                showToast(`Rombel "${r.nama_rombel}" Minggu ${w.minggu_ke} Pertemuan ${pt}: Minimal 1 materi harus dipilih & diisi (atau centang Tidak ada kegiatan).`, "error");
                return;
              }
            }
          }
        }
        lap.submitted_at = new Date().toISOString();
      }

      lap.status = targetStatus;

      if (isLiveSupabase && supabaseClient) {
        const lapRes = await resilientSupabaseMutation("laporan_bulanan", "upsert", lap);
        if (lapRes.error) {
          showToast("Gagal menyimpan laporan: " + lapRes.error.message, "error");
          return;
        }
        const weeklyToSave = dbStore.laporan_mingguan.filter(m => m.laporan_id === lap.id).map(w => ({
          ...w,
          pertemuan_ke: Number(w.pertemuan_ke || 1),
          tanggal: w.tanggal || null
        }));
        await resilientSupabaseMutation("laporan_mingguan", "upsert", weeklyToSave, null, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });

        // Sinkronkan juga seluruh catatan presensi bulan ini ke Supabase agar Admin Daerah menerima data presensi terkini
        const presRecordsToSync = dbStore.presensi.filter(p =>
          p.kelompok_id === lap.kelompok_id &&
          Number(p.bulan) === Number(lap.bulan) &&
          Number(p.tahun) === Number(lap.tahun)
        );
        if (presRecordsToSync.length > 0) {
          await resilientSupabaseMutation("presensi", "upsert", presRecordsToSync, null, { onConflict: "peserta_id,tanggal" });
        }
      }

      logActivity(
        targetStatus === "Dikirim" ? "Mengirim Laporan Bulanan & Presensi" : "Menyimpan Draft Laporan",
        `Laporan ${NAMA_BULAN[lap.bulan - 1]} ${lap.tahun} (${targetStatus})`
      );
      showToast(targetStatus === "Dikirim" ? "Laporan kegiatan & rekap presensi berhasil dikirim ke Admin Daerah!" : "Draft laporan tersimpan.", "success");
      renderApp();
    }

    async function handlePhotoBatchUpload(event) {
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;

      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const existing = dbStore.dokumentasi_kegiatan.filter(d => d.kelompok_id === uid && Number(d.bulan) === bulan && Number(d.tahun) === tahun);

      const remainingSlots = APP_CONFIG.MAX_PHOTOS_PER_MONTH - existing.length;
      if (remainingSlots <= 0) {
        showToast(`Kuota maksimal ${APP_CONFIG.MAX_PHOTOS_PER_MONTH} foto untuk bulan ini sudah penuh.`, "warning");
        return;
      }

      const selectedFiles = files.slice(0, remainingSlots);
      const tanggal = document.getElementById("dokTanggal")?.value || getWIBParts().isoDate;
      const keterangan = document.getElementById("dokKeterangan")?.value.trim() || "Kegiatan Pengajian Generus";

      showToast(`Mengompresi & mengunggah ${selectedFiles.length} foto...`, "info");

      let uploadedCount = 0;
      for (const file of selectedFiles) {
        try {
          const compressed = await compressImageInBrowser(file);
          const photoId = generateUUID();
          const filePath = `${uid}/${tahun}-${String(bulan).padStart(2, "0")}/${photoId}.jpg`;
          let publicUrl = compressed.dataUrl;

          if (isLiveSupabase && supabaseClient) {
            const { error: upErr } = await supabaseClient.storage
              .from(APP_CONFIG.STORAGE_BUCKET)
              .upload(filePath, compressed.blob, { contentType: "image/jpeg", upsert: true });

            if (!upErr) {
              const { data: pubData } = supabaseClient.storage
                .from(APP_CONFIG.STORAGE_BUCKET)
                .getPublicUrl(filePath);
              if (pubData?.publicUrl) publicUrl = pubData.publicUrl;
            }
          }

          const record = {
            id: photoId,
            kelompok_id: uid,
            bulan,
            tahun,
            tanggal,
            keterangan,
            file_path: filePath,
            public_url: publicUrl,
            ukuran_kb: compressed.sizeKB
          };

          if (isLiveSupabase && supabaseClient) {
            await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", record);
          }

          dbStore.dokumentasi_kegiatan.unshift(record);
          uploadedCount++;
        } catch (err) {
          showToast("Gagal memproses salah satu foto: " + err.message, "error");
        }
      }

      event.target.value = "";
      if (uploadedCount > 0) {
        logActivity("Unggah Foto Dokumentasi", `Mengunggah ${uploadedCount} foto terkompresi (${NAMA_BULAN[bulan - 1]} ${tahun})`);
        showToast(`${uploadedCount} foto berhasil dikompresi & disimpan!`, "success");
        renderApp();
      }
    }

    async function saveKendalaForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        bulan: appState.selectedMonth,
        tahun: appState.selectedYear,
        kategori: document.getElementById("kKategori").value,
        prioritas: document.getElementById("kPrioritas").value,
        status: document.getElementById("kStatus").value,
        uraian: document.getElementById("kUraian").value.trim(),
        solusi: document.getElementById("kSolusi").value.trim(),
        evaluasi_bulan_ini: document.getElementById("kEvaluasi").value.trim(),
        rencana_bulan_depan: document.getElementById("kRencana").value.trim()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("kendala_evaluasi", "upsert", payload);
        if (res.error) {
          showToast("Gagal menyimpan kendala: " + res.error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.kendala_evaluasi.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.kendala_evaluasi[idx] = payload;
      } else {
        dbStore.kendala_evaluasi.unshift(payload);
      }

      closeModal();
      showToast("Laporan kendala & evaluasi disimpan!", "success");
      renderApp();
    }

    function deleteKendalaItem(id) {
      confirmDialog("Hapus Catatan Kendala?", "Item kendala & evaluasi ini akan dihapus.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await supabaseClient.from("kendala_evaluasi").delete().eq("id", id);
        }
        dbStore.kendala_evaluasi = dbStore.kendala_evaluasi.filter(x => x.id !== id);
        showToast("Catatan kendala dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    function downloadFullJSONBackup() {
      const dataStr = JSON.stringify({
        exported_at_wib: formatDateTimeWIB(new Date().toISOString()),
        database: dbStore
      }, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Backup_DIGENARA_Jepara_${getWIBParts().isoDate}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("File backup JSON lengkap berhasil diunduh!", "success");
    }

    async function saveAdminEditUser(e, userId) {
      e.preventDefault();
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      const namaDesa = document.getElementById("admEditDesa").value;
      const namaKelompok = document.getElementById("admEditKelompok").value.trim();
      const guruArr = document.getElementById("admEditGurus").value.split(",").map(s => s.trim()).filter(Boolean);

      u.nama_desa = namaDesa;
      u.nama_kelompok = namaKelompok;
      u.daftar_guru = guruArr;
      u.jumlah_guru = guruArr.length;

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation(
          "profiles",
          "update",
          {
            nama_desa: namaDesa,
            nama_kelompok: namaKelompok,
            daftar_guru: guruArr,
            jumlah_guru: guruArr.length
          },
          { id: userId }
        );
      }

      closeModal();
      showToast("Data kelompok & desa berhasil diperbarui!", "success");
      renderApp();
    }

    function openAdminResetPasswordModal(userId) {
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      openModal(
        `Reset Password — ${u.nama_kelompok}`,
        `
          <form id="formAdmResetPass" onsubmit="saveAdminResetPassword(event, '${userId}')" class="space-y-3.5">
            <p class="text-xs sm:text-sm text-slate-600">Masukkan password baru untuk username <strong>${escapeHTML(u.username)}</strong> (minimal 8 karakter).</p>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Password Baru *</label>
              <input id="admNewPass" type="text" required minlength="8" placeholder="Contoh: Jepara2026!" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" />
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formAdmResetPass" class="px-5 py-2 rounded-xl bg-sky-700 text-white text-sm font-bold">Simpan Password Baru</button>
        `
      );
    }

    async function saveAdminResetPassword(e, userId) {
      e.preventDefault();
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      const newPass = document.getElementById("admNewPass").value;
      if (newPass.length < 8) {
        showToast("Password minimal 8 karakter.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        const { error } = await supabaseClient.rpc("admin_reset_user_password", {
          target_user_id: userId,
          new_password: newPass
        });
        if (error) {
          showToast("Gagal mereset password: " + error.message, "error");
          return;
        }
      } else {
        u.password_hash = newPass;
      }

      u.reset_requested = false;
      u.reset_note = "";
      logActivity("Reset Password Akun", `Mereset password akun ${u.username}`);
      closeModal();
      showToast(`Password akun ${u.username} berhasil diatur ulang!`, "success");
      renderApp();
    }

    function renderAdminDataGenerus() {
      const kelompoks = dbStore.profiles.filter(p => p.role === "user");

      const totalL = allGenerus.filter(p => p.jenis_kelamin === "L").length;
      const totalP = allGenerus.filter(p => p.jenis_kelamin === "P").length;
      const mudaMudiIds = new Set(dbStore.rombel.filter(r => isMudaMudiRombel(r.nama_rombel)).map(r => r.id));
      const totalMudaMudi = allGenerus.filter(p => mudaMudiIds.has(p.rombel_id)).length;

      // Susun plot / cluster per Desa (Desa Timur 1, Desa Timur 2, Desa Barat, Desa Utara) & Kelompok
      const unassignedKelompoks = kelompoks.filter(k => !DESA_OPTIONS.includes(k.nama_desa));
      const desaClusterNames = [...DESA_OPTIONS];
      if (unassignedKelompoks.length > 0) {
        desaClusterNames.push("Belum Ditentukan Desa");
      }

      const desaClusters = desaClusterNames.map(desaName => {
        const desaKelompoks = desaName === "Belum Ditentukan Desa"
          ? unassignedKelompoks
          : kelompoks.filter(k => k.nama_desa === desaName);
        const desaKelompokIds = new Set(desaKelompoks.map(k => k.id));
        const desaGenerus = allGenerus.filter(p => desaKelompokIds.has(p.kelompok_id));
        const dL = desaGenerus.filter(p => p.jenis_kelamin === "L").length;
        const dP = desaGenerus.filter(p => p.jenis_kelamin === "P").length;
        const dMM = desaGenerus.filter(p => mudaMudiIds.has(p.rombel_id)).length;

        return {
          desaName,
          kelompoks: desaKelompoks,
          totalGenerus: desaGenerus.length,
          totalL: dL,
          totalP: dP,
          totalMM: dMM

      let filtered = [...allGenerus];
      if (appState.adminGenerusFilterDesa !== "ALL") {
        if (appState.adminGenerusFilterDesa === "UNASSIGNED") {

    async function saveAdminAddGenerus(e) {
      e.preventDefault();
      const kelId = document.getElementById("admGenKelompok").value;
      const rombelId = document.getElementById("admGenRombel").value;
      if (!rombelId) {
        showToast("Kelompok tersebut belum memiliki rombel.", "warning");
        return;
      }
      const payload = {
        id: generateUUID(),
        kelompok_id: kelId,
        rombel_id: rombelId,
        nama_peserta: document.getElementById("admGenNama").value.trim(),
        jenis_kelamin: document.getElementById("admGenJk").value,
        tempat_lahir: document.getElementById("admGenTempat").value.trim(),
        tanggal_lahir: document.getElementById("admGenTgl").value,
        nama_ortu_wali: document.getElementById("admGenOrtu").value.trim(),
        aktif: true
      };
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("peserta", "insert", payload);
        if (res.error) {
          showToast("Gagal menyimpan data generus: " + res.error.message, "error");
          return;
        }
      }
      dbStore.peserta.push(payload);
      closeModal();
      showToast("Data generus baru berhasil ditambahkan!", "success");
      renderApp();
    }

    async function saveAdminEditGenerus(e, id) {
      e.preventDefault();
      const p = dbStore.peserta.find(x => x.id === id);
      if (!p) return;
      p.rombel_id = document.getElementById("admEditGenRombel").value;
      p.nama_peserta = document.getElementById("admEditGenNama").value.trim();
      p.jenis_kelamin = document.getElementById("admEditGenJk").value;
      p.tempat_lahir = document.getElementById("admEditGenTempat").value.trim();
      p.tanggal_lahir = document.getElementById("admEditGenTgl").value;
      p.nama_ortu_wali = document.getElementById("admEditGenOrtu").value.trim();
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation(
          "peserta",
          "update",
          {
            rombel_id: p.rombel_id,
            nama_peserta: p.nama_peserta,
            jenis_kelamin: p.jenis_kelamin,
            tempat_lahir: p.tempat_lahir,
            tanggal_lahir: p.tanggal_lahir,
            nama_ortu_wali: p.nama_ortu_wali
          },
          { id }
        );
      }
      closeModal();
      showToast("Biodata generus diperbarui.", "success");
      renderApp();
    }

                <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 space-y-3">
                  <div class="font-extrabold text-sm text-emerald-950">Verifikasi & Catatan Evaluasi Admin Daerah</div>
                  <textarea id="admReviewNote" rows="2" placeholder="Tulis apresiasi atau catatan revisi untuk pengurus kelompok..."
                    class="w-full px-3.5 py-2.5 rounded-xl border border-emerald-300 bg-white text-sm">${escapeHTML(lap.komentar_admin || "")}</textarea>
                  <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="submitAdminReview('${lap.id}', 'Disetujui')" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs sm:text-sm">
                      ✅ Setujui Laporan
                    </button>
                    <button type="button" onclick="submitAdminReview('${lap.id}', 'Perlu Revisi')" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs sm:text-sm">
                      ⚠️ Kembalikan untuk Revisi
                    </button>
                  </div>
                </div>
              `}
            </div>
          `}
        </div>
      `;
    }

    async function submitAdminReview(laporanId, newStatus) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;
      const komentar = document.getElementById("admReviewNote").value.trim();
      lap.status = newStatus;
      lap.komentar_admin = komentar;
      lap.reviewed_at = new Date().toISOString();

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation(
          "laporan_bulanan",
          "update",
          {
            status: newStatus,
            komentar_admin: komentar,
            reviewed_at: lap.reviewed_at
          },
          { id: laporanId }
        );
      }

      logActivity("Verifikasi Laporan Kelompok", `Laporan ${getKelompokName(lap.kelompok_id)} -> ${newStatus}`);
      showToast(`Laporan berhasil ditandai sebagai "${newStatus}".`, "success");
      renderApp();
    }

    function exportAdminConsolidatedExcel() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const activeUsers = dbStore.profiles.filter(p => p.role === "user" && isAccountActiveStatus(p.status_akun));
      const lapsThisMonth = dbStore.laporan_bulanan.filter(l => Number(l.bulan) === bulan && Number(l.tahun) === tahun);

      const rows = activeUsers.map((u, idx) => {
        const lap = lapsThisMonth.find(l => l.kelompok_id === u.id);
        const sum = calculatePresensiSummary(u.id, bulan, tahun);
        return {
          No: idx + 1,
          "Nama Kelompok": u.nama_kelompok,
          Desa: u.nama_desa || "-",
          "Jumlah Guru": (u.daftar_guru || []).length || u.jumlah_guru,
          "Jumlah Rombel": getGroupRombels(u.id).length || u.jumlah_rombel,
          "Jumlah Pertemuan": lap ? lap.jumlah_pertemuan : sum.uniqueDates.length,
          "Kehadiran (%)": sum.pctH,
          "Izin (%)": sum.pctI,
          "Sakit (%)": sum.pctS,
          "Alpha (%)": sum.pctA,
          "Status Laporan": lap ? lap.status : "Belum Mengirim",
          "Capaian Bulanan": lap?.capaian_bulanan || "-"
        };
      });

      exportToExcelFile(rows, "Rekap_Daerah", `Rekap_Gabungan_Generus_Jepara_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
    }

    function exportAdminWeeklyExcel() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const kelFilter = appState.adminRekapKelompokFilter || "SUBMITTED";
      const lapsThisMonth = dbStore.laporan_bulanan.filter(l => Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      let targetLaps = lapsThisMonth;
      if (kelFilter === "SUBMITTED") {
        targetLaps = lapsThisMonth.filter(l => ["Dikirim", "Disetujui", "Perlu Revisi"].includes(l.status));
      } else if (kelFilter !== "ALL") {
        targetLaps = lapsThisMonth.filter(l => l.kelompok_id === kelFilter);
      }
      const lapIds = new Set(targetLaps.map(l => l.id));
      const rows = dbStore.laporan_mingguan
        .filter(w =>
          lapIds.has(w.laporan_id) &&
          !w.tidak_ada_kegiatan &&
          (
            MATERI_OPTIONS_LIST.some(opt => w[opt.key] && String(w[opt.key]).trim() !== "") ||
            (w.keterangan && String(w.keterangan).trim() !== "")
          )
        )
        .map(w => {
          const parentLap = lapsThisMonth.find(l => l.id === w.laporan_id);
          const chosenSummary = MATERI_OPTIONS_LIST
            .filter(opt => w[opt.key] && String(w[opt.key]).trim() !== "")
            .map(opt => `${opt.label}: ${String(w[opt.key]).trim()}`)
            .join(" | ");
          const rowOut = {
            Kelompok: getKelompokName(parentLap?.kelompok_id),
            Rombel: getRombelName(w.rombel_id),
            "Minggu Ke": w.minggu_ke,
            "Pertemuan Ke": w.pertemuan_ke || 1,
            Tanggal: w.tanggal || "-"
          };
          if (chosenSummary) rowOut["Materi Dipilih"] = chosenSummary;
          if (w.keterangan && String(w.keterangan).trim()) rowOut["Keterangan"] = String(w.keterangan).trim();
          return rowOut;
        });
      exportToExcelFile(rows, "Rekap_Mingguan", `Rekap_Materi_Mingguan_Jepara_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
    }

        <table>

            <tr style="background:#f1f5f9;">
              <th>No</th><th>Kelompok</th><th>Desa</th><th>Guru</th><th>Rombel</th><th>Pertemuan</th><th>Kehadiran</th><th>Status</th><th>Capaian</th>

    // ============================================================================
    // ADMIN VIEW 5: PENGUMUMAN & LOG AKTIVITAS
    // ============================================================================
    function renderAdminPengumuman() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-7 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-xl font-extrabold text-slate-900">Pengumuman Daerah Jepara</h2>
            </div>

            <form onsubmit="createNewAnnouncement(event)" class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
              <div class="font-bold text-sm text-emerald-800">+ Buat Pengumuman Baru untuk Semua Kelompok</div>

              <textarea id="annIsi" rows="3" required placeholder="Isi pengumuman resmi dari pengurus daerah..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>

            <div class="space-y-3">

                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">

                  <div class="text-[11px] text-slate-400 mt-0.5">${formatDateTimeWIB(a.created_at)}</div>

              `).join("")}

          <div class="lg:col-span-5 space-y-4">
            <h2 class="text-xl font-extrabold text-slate-900">Log Aktivitas Sistem</h2>
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm max-h-[560px] overflow-y-auto space-y-3">
              ${dbStore.log_aktivitas.length === 0 ? `
                <div class="text-center text-xs text-slate-400 py-8">Belum ada log aktivitas tercatat.</div>
              ` : dbStore.log_aktivitas.map(lg => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                  <div class="flex items-center justify-between font-bold text-slate-800">
                    <span>${escapeHTML(lg.aksi)}</span>
                    <span class="text-[10px] text-slate-400 font-normal">${formatDateTimeWIB(lg.created_at)}</span>
                  </div>
                  <div class="text-emerald-700 font-semibold mt-0.5">${escapeHTML(lg.nama_pelaku)}</div>
                  <div class="text-slate-600 mt-0.5">${escapeHTML(lg.detail)}</div>

    async function createNewAnnouncement(e) {
      e.preventDefault();
      const payload = {
        id: generateUUID(),
        judul: document.getElementById("annJudul").value.trim(),
        isi: document.getElementById("annIsi").value.trim(),
        penting: true,
        created_by: appState.currentUser.id,
        created_at: new Date().toISOString()
      };
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengumuman", "insert", payload);
        if (res.error) {
          showToast("Gagal menerbitkan pengumuman: " + res.error.message, "error");
          return;
        }
      }
      dbStore.pengumuman.unshift(payload);
      logActivity("Terbitkan Pengumuman", payload.judul);
      showToast("Pengumuman berhasil diterbitkan ke seluruh kelompok!", "success");
      renderApp();
    }

    async function deleteAnnouncement(id) {
      if (isLiveSupabase && supabaseClient) {
        await supabaseClient.from("pengumuman").delete().eq("id", id);
      }
      dbStore.pengumuman = dbStore.pengumuman.filter(x => x.id !== id);
      showToast("Pengumuman dihapus.", "info");
      renderApp();
    }

    // ============================================================================
    // RENDERER UTAMA & BOOTSTRAP APLIKASI
    // ============================================================================
    function renderApp() {
      const root = document.getElementById("appRoot");
      if (!root) return;

      if (!appState.currentUser) {
        root.innerHTML = renderAuthPage();
        return;
      }

      let innerView = "";
      if (appState.currentUser.role === "admin") {
        switch (appState.activeTab) {
          case "pendaftaran":
            innerView = renderAdminPendaftaran();
            break;
          case "data_generus":
            innerView = renderAdminDataGenerus();
            break;
          case "laporan_masuk":
            innerView = renderAdminLaporanMasuk();
            break;
          case "rekap_gabungan":
            innerView = renderAdminRekapGabungan();
            break;
          case "pengumuman":
            innerView = renderAdminPengumuman();
            break;
          default:
            innerView = renderAdminDashboard();
        }
      } else {
        switch (appState.activeTab) {
          case "jurnal":
            innerView = renderMenuJurnal();
            break;
          case "presensi":
            innerView = renderMenuPresensi();
            break;
          case "laporan":
            innerView = renderMenuLaporan();
            break;
          case "dokumentasi":
            innerView = renderMenuDokumentasi();
            break;
          case "kendala":
            innerView = renderMenuKendala();
            break;
          default:
            innerView = renderUserDashboard();
        }
      }

      root.innerHTML = renderAppShell(innerView);
    }

    // Daftarkan PWA Service Worker inline
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      try {
        const swCode = `
          const CACHE_NAME = 'digenara-jepara-v3';
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
          self.addEventListener('fetch', (e) => {
            if (e.request.method !== 'GET') return;
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: "application/javascript" });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      } catch (e) {}
    }

    window.addEventListener("DOMContentLoaded", async () => {
      renderApp();
      await restoreSupabaseSession();
    });
  </script>
