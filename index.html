                <button type="button" onclick="appState.presensiActiveDate=getWIBParts().isoDate; renderApp();" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 font-bold text-xs">Hari Ini</button>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button type="button" onclick="markAllPresentOnActiveDate()" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-sm">

          <!-- Ringkasan Kehadiran Rombel -->
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">

            </div>
            <div class="bg-emerald-50 p-3.5 rounded-2xl border border-emerald-200 text-center">
              <div class="text-[11px] font-bold text-emerald-700 uppercase">Hadir (H)</div>
              <div class="text-xl font-extrabold text-emerald-900 mt-0.5">${rombelSummary.H}</div>
            </div>
            <div class="bg-sky-50 p-3.5 rounded-2xl border border-sky-200 text-center">
              <div class="text-[11px] font-bold text-sky-700 uppercase">Izin (I)</div>
              <div class="text-xl font-extrabold text-sky-900 mt-0.5">${rombelSummary.I}</div>

            <div class="bg-amber-50 p-3.5 rounded-2xl border border-amber-200 text-center">
              <div class="text-[11px] font-bold text-amber-700 uppercase">Sakit (S)</div>
              <div class="text-xl font-extrabold text-amber-900 mt-0.5">${rombelSummary.S}</div>

            <div class="bg-rose-50 p-3.5 rounded-2xl border border-rose-200 text-center col-span-2 sm:col-span-1">

          ${lowAttendanceStudents.length > 0 ? `
            <div class="bg-rose-50/80 border border-rose-200 rounded-2xl p-4 space-y-2.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="font-extrabold text-xs sm:text-sm text-rose-950">

                </div>
                <span class="text-[11px] text-rose-700 font-semibold">Disarankan komunikasi / silaturahim ke wali santri</span>
              </div>
              <div class="flex flex-wrap gap-2">
                ${lowAttendanceStudents.map(st => `
                  <div class="px-3 py-2 rounded-xl bg-white border border-rose-200 flex items-center gap-2 text-xs">
                    <div>
                      <span class="font-extrabold text-slate-900">${escapeHTML(st.nama_peserta)}</span>
                      <span class="text-rose-700 font-bold ml-1">(${st.pct}% • Alpha ${st.A}x)</span>
                      <div class="text-[11px] text-slate-500">Wali: ${escapeHTML(st.nama_ortu_wali || "-")}</div>
                    </div>
                    <button type="button" onclick="sendParentFollowUpWA('${escapeHTML(st.nama_peserta)}', '${escapeHTML(st.nama_ortu_wali || "Bapak/Ibu Wali")}', ${st.pct}, ${st.A}, '${escapeHTML(st.no_wa_wali || "")}')"
                      class="px-2.5 py-1.5 rounded-lg bg-[#25D366] hover:bg-[#1ebe5d] text-slate-950 font-extrabold text-[11px] shrink-0">
                      📲 Sapa WA
                    </button>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                  <tr class="bg-slate-100 text-slate-700 border-b border-slate-200">
                    <th class="p-3 sticky left-0 bg-slate-100 z-10 min-w-[180px]">Nama Santri / Generus</th>
                    <th class="p-3 text-center bg-emerald-50 text-emerald-900 border-x border-emerald-200 min-w-[100px]">
                      Input Aktif<br/><span class="text-[10px] font-bold">${activeDate.slice(5)}</span>
                    </th>
                    ${meetingDates.filter(d => d !== activeDate).map(d => `
                      <th class="p-2.5 text-center whitespace-nowrap text-[11px]">
                        ${d.slice(8, 10)}/${d.slice(5, 7)}
                      </th>
                    `).join("")}
                    <th class="p-3 text-center">Rekap (H/I/S/A)</th>
                    <th class="p-3 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${pesertaList.length === 0 ? `
                    <tr>
                      <td colspan="${meetingDates.length + 4}" class="p-8 text-center text-slate-400">
                        Belum ada santri terdaftar di kelas ini. Klik <strong>+ Tambah Santri</strong> atau <strong>📥 Impor Excel</strong>.
                      </td>
                    </tr>
                  ` : pesertaList.map((p, idx) => {
                    const activeRec = presRecords.find(r => r.peserta_id === p.id && r.tanggal === activeDate);
                    const pRecs = presRecords.filter(r => r.peserta_id === p.id);
                    const cH = pRecs.filter(r => r.status === "H").length;
                    const cI = pRecs.filter(r => r.status === "I").length;
                    const cS = pRecs.filter(r => r.status === "S").length;
                    const cA = pRecs.filter(r => r.status === "A").length;
                    const otherDates = meetingDates.filter(d => d !== activeDate);

                    return `
                      <tr class="hover:bg-slate-50">
                        <td class="p-3 sticky left-0 bg-white z-10 border-r border-slate-100">
                          <div class="font-bold text-slate-900">${idx + 1}. ${escapeHTML(p.nama_peserta)}</div>
                          <div class="text-[11px] text-slate-500">${p.jenis_kelamin === "P" ? "Perempuan" : "Laki-laki"} • Wali: ${escapeHTML(p.nama_ortu_wali || "-")}</div>
                        </td>
                        <td class="p-2.5 text-center bg-emerald-50/40 border-x border-emerald-100">
                          <button type="button" onclick="cyclePresensiCell('${p.id}', '${activeDate}')"
                            class="w-11 h-9 rounded-xl border font-extrabold text-xs transition ${activeRec ? statusBadgeColor[activeRec.status] : 'bg-white border-slate-300 text-slate-400 hover:border-emerald-500'}">
                            ${activeRec ? activeRec.status : "-"}
                          </button>
                        </td>
                        ${otherDates.map(d => {
                          const rec = presRecords.find(r => r.peserta_id === p.id && r.tanggal === d);
                          return `
                            <td class="p-2 text-center">
                              <button type="button" onclick="cyclePresensiCell('${p.id}', '${d}')"
                                class="w-9 h-8 rounded-lg border font-bold text-xs ${rec ? statusBadgeColor[rec.status] : 'bg-slate-50 border-slate-200 text-slate-400'}">
                                ${rec ? rec.status : "-"}
                              </button>
                            </td>
                          `;
                        }).join("")}
                        <td class="p-3 text-center whitespace-nowrap text-xs font-bold">
                          <span class="text-emerald-700">${cH}</span> /
                          <span class="text-sky-700">${cI}</span> /
                          <span class="text-amber-700">${cS}</span> /
                          <span class="text-rose-700">${cA}</span>
                        </td>
                        <td class="p-3 text-center whitespace-nowrap">
                          <button type="button" onclick="openShareParticipantWhatsAppDirect('${p.id}')" title="Kirim laporan kegiatan & kehadiran santri ini ke WhatsApp Wali"
                            class="px-2.5 py-1 rounded-lg bg-[#25D366]/20 hover:bg-[#25D366]/40 text-emerald-950 font-extrabold text-xs mr-1">
                            📲 Wali
                          </button>
                          <button type="button" onclick="openPesertaFormModal('${p.id}')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">Edit</button>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function openAddRombelModal() {
      openModal(

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nama Kelas / Rombel *</label>
              <input id="newRombelName" type="text" required placeholder="Contoh: Caberawit A / Pra-Remaja" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Frekuensi Pertemuan per Minggu</label>
              <select id="newRombelFreq" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                <option value="5" selected>5x per Minggu (Rutin Harian)</option>
                <option value="2">2x per Minggu (Muda-Mudi / Khusus)</option>
                <option value="3">3x per Minggu</option>
                <option value="1">1x per Minggu</option>
                <option value="4">4x per Minggu</option>

              </select>

          <button type="submit" form="formAddRombel" class="px-5 py-2 rounded-xl bg-emerald-700 text-white text-sm font-bold">Simpan Rombel</button>
        `,

      );
    }

    async function saveNewRombel(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const nama = document.getElementById("newRombelName").value.trim();
      const freq = parseInt(document.getElementById("newRombelFreq").value, 10) || 5;
      if (!nama) return;

      const existing = getGroupRombels(uid);
      const row = {
        id: generateUUID(),
        kelompok_id: uid,
        nama_rombel: nama,
        pertemuan_per_minggu: freq,
        urutan: existing.length + 1
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("rombel", "insert", row);
        if (res.error) {
          showToast("Gagal menambah rombel: " + res.error.message, "error");
          return;
        }
      }
      dbStore.rombel.push(row);
      appState.presensiSelectedRombel = row.id;
      closeModal();
      showToast(`Rombel "${nama}" (${freq}x pertemuan/minggu) ditambahkan!`, "success");
      renderApp();
    }

    function openRenameRombelModal(rombelId) {
      const r = dbStore.rombel.find(x => x.id === rombelId);
      if (!r) return;
      openModal(
        "Ubah Nama Kelas / Rombel",
        `
          <form id="formRenameRombel" onsubmit="saveRenameRombel(event, '${rombelId}')" class="space-y-3.5">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nama Kelas / Rombel *</label>
              <input id="renameRombelInput" type="text" required value="${escapeHTML(r.nama_rombel)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold" />
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formRenameRombel" class="px-5 py-2 rounded-xl bg-emerald-700 text-white text-sm font-bold">Simpan Nama</button>
        `,
        "max-w-md"
      );
    }

    async function saveRenameRombel(e, rombelId) {
      e.preventDefault();
      const r = dbStore.rombel.find(x => x.id === rombelId);
      if (!r) return;
      const newName = document.getElementById("renameRombelInput").value.trim();
      if (!newName) return;
      r.nama_rombel = newName;
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("rombel", "update", { nama_rombel: newName }, { id: rombelId });
      }
      closeModal();
      showToast("Nama kelas/rombel berhasil diperbarui!", "success");
      renderApp();
    }

    function formatWhatsAppPhoneNumber(rawPhone) {
      const digits = String(rawPhone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.startsWith("0")) return "62" + digits.slice(1);
      if (digits.startsWith("8")) return "62" + digits;
      return digits;
    }

    function buildWhatsAppSendUrl(text, rawPhone = "") {
      const phone = formatWhatsAppPhoneNumber(rawPhone);
      if (phone) {
        return `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;
      }
      return `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
    }

    function sendParentFollowUpWA(namaSantri, namaWali, pctHadir, alphaCount, noWaWali = "") {
      const kelompokName = appState.currentUser?.nama_kelompok || "Pengurus Pengajian";
      const bulanName = NAMA_BULAN[appState.selectedMonth - 1];
      const msg = [
        `Assalamu'alaikum Wr. Wb.`,
        `Yth. *${namaWali}*, orang tua/wali dari ananda *${namaSantri}*.`,
        ``,
        `Kami dari pengurus & guru mengaji *${kelompokName}* menyapa dan menginformasikan bahwa pada bulan *${bulanName} ${appState.selectedYear}*, kehadiran mengaji ananda tercatat *${pctHadir}%* (tidak hadir tanpa keterangan ${alphaCount}x).`,
        ``,
        `Semoga ananda beserta keluarga senantiasa diberikan kesehatan dan kelancaran. Mohon dukungan Bapak/Ibu agar ananda dapat kembali semangat mengikuti pengajian bersama teman-temannya.`,
        `_Jazakumullahu khairan katsiran._`,
        `Wassalamu'alaikum Wr. Wb.`
      ].join("\n");
      window.open(buildWhatsAppSendUrl(msg, noWaWali), "_blank", "noopener,noreferrer");
    }

    async function cyclePresensiCell(pesertaId, tanggal) {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const [yStr, mStr] = tanggal.split("-");
      const bulan = parseInt(mStr, 10);
      const tahun = parseInt(yStr, 10);

      const order = ["H", "I", "S", "A", null];
      const existingIdx = dbStore.presensi.findIndex(r => r.peserta_id === pesertaId && r.tanggal === tanggal);
      const currentStatus = existingIdx >= 0 ? dbStore.presensi[existingIdx].status : null;
      const nextStatus = order[(order.indexOf(currentStatus) + 1) % order.length];

      if (nextStatus === null) {
        const removed = existingIdx >= 0 ? dbStore.presensi[existingIdx] : null;
        if (existingIdx >= 0) dbStore.presensi.splice(existingIdx, 1);
        if (removed && isLiveSupabase && supabaseClient && !appState.isOfflineMode) {
          await supabaseClient.from("presensi").delete().eq("peserta_id", pesertaId).eq("tanggal", tanggal);
        }
        renderApp();
        return;
      }

      const row = {
        id: existingIdx >= 0 ? dbStore.presensi[existingIdx].id : generateUUID(),
        kelompok_id: uid,
        rombel_id: rombelId,
        peserta_id: pesertaId,
        bulan,
        tahun,
        tanggal,
        status: nextStatus
      };

      if (existingIdx >= 0) dbStore.presensi[existingIdx] = row;
      else dbStore.presensi.push(row);

      if (appState.isOfflineMode) {
        const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === pesertaId && q.tanggal === tanggal);
        if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = row;
        else appState.offlinePresensiQueue.push(row);
      } else if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("presensi", "upsert", row, null, { onConflict: "peserta_id,tanggal" });
      }
      renderApp();
    }

    async function markAllPresentOnActiveDate() {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const tanggal = appState.presensiActiveDate;
      const [yStr, mStr] = tanggal.split("-");
      const bulan = parseInt(mStr, 10);
      const tahun = parseInt(yStr, 10);

      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);
      if (pesertaList.length === 0) {
        showToast("Belum ada santri di kelas ini.", "warning");
        return;
      }

      const upsertRows = [];
      pesertaList.forEach(p => {
        const existingIdx = dbStore.presensi.findIndex(r => r.peserta_id === p.id && r.tanggal === tanggal);
        const row = {
          id: existingIdx >= 0 ? dbStore.presensi[existingIdx].id : generateUUID(),
          kelompok_id: uid,
          rombel_id: rombelId,
          peserta_id: p.id,
          bulan,
          tahun,
          tanggal,

    function normalizeImportedDate(rawVal) {
      if (rawVal === null || rawVal === undefined || rawVal === "") return null;
      if (typeof rawVal === "number" && rawVal > 20000 && rawVal < 80000) {
        const utcDays = Math.floor(rawVal - 25569);
        const dt = new Date(utcDays * 86400 * 1000);
        if (!isNaN(dt.getTime())) {
          return dt.toISOString().slice(0, 10);
        }
      }
      const str = String(rawVal).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
      const dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (dmy) {
        return `${dmy[3]}-${dmy[2].padStart(2, "0")}-${dmy[1].padStart(2, "0")}`;
      }
      return null;
    }

    async function handleImportPesertaExcel() {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const fileInput = document.getElementById("importPesertaFile");
      const file = fileInput?.files?.[0];
      if (!file) {
        showToast("Pilih file Excel terlebih dahulu.", "warning");
        return;
      }
      if (!window.XLSX) {
        showToast("Library pembaca Excel belum siap. Muat ulang halaman.", "error");
        return;
      }
      try {
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: "array" });
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const jsonRows = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

        const newRows = [];
        jsonRows.forEach(row => {
          const nama = String(row["Nama Santri"] || row["Nama"] || row["nama_peserta"] || "").trim();
          if (!nama) return;
          const jkRaw = String(row["JK"] || row["Jenis Kelamin"] || "L").trim().toUpperCase();
          const jk = jkRaw.startsWith("P") ? "P" : "L";
          newRows.push({
            id: generateUUID(),
            kelompok_id: uid,
            rombel_id: rombelId,
            nama_peserta: nama,
            jenis_kelamin: jk,
            tempat_lahir: String(row["Tempat Lahir"] || "").trim(),
            tanggal_lahir: normalizeImportedDate(row["Tanggal Lahir"]),
            nama_ortu_wali: String(row["Nama Orang Tua / Wali"] || row["Orang Tua / Wali"] || row["Wali"] || "").trim(),
            no_wa_wali: String(row["No WA Wali"] || row["No. WA Wali"] || row["WhatsApp"] || "").trim(),
            aktif: true
          });
        });

        if (newRows.length === 0) {
          showToast("Tidak ada baris nama santri yang terbaca di file Excel.", "warning");
          return;
        }

        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("peserta", "insert", newRows);
          if (res.error) {
            showToast("Gagal mengimpor ke database: " + res.error.message, "error");
            return;
          }
        }
        dbStore.peserta.push(...newRows);
        closeModal();
        showToast(`${newRows.length} data santri berhasil diimpor!`, "success");
        renderApp();
      } catch (err) {
        showToast("Gagal membaca file Excel: " + err.message, "error");
      }
    }

    function exportPresensiExcel() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.presensiSelectedRombel;
      if (!rombelId) {
        showToast("Pilih kelas / rombel terlebih dahulu.", "warning");
        return;
      }

      const matrix = buildDailyAttendanceRecapMatrix(uid, rombelId, bulan, tahun);
      const kelompokName = getKelompokName(uid);
      const desaName = getKelompokDesa(uid);
      const rombelName = getRombelName(rombelId);
      const bulanLabel = `${NAMA_BULAN[bulan - 1]} ${tahun}`;

      if (!window.XLSX) {
        const rows = matrix.studentRows.map(st => {
          const rowObj = { No: st.no, "Nama Santri": st.nama };
          matrix.daysArray.forEach(d => { rowObj[String(d)] = st.dayMap[d] || ""; });
          rowObj.H = st.H;
          rowObj.S = st.S;
          rowObj.I = st.I;
          rowObj.A = st.A;
          rowObj["%"] = st.pct;
          return rowObj;
        });
        exportToExcelFile(rows, "Rekap_Presensi", `Rekap_Presensi_${rombelName}_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
        return;
      }

      const aoa = [
        ["PENGGERAK PEMBINA GENERUS (PPG) SAK JAGAT RAT DAERAH JEPARA"],
        [`REKAP PRESENSI ${bulanLabel.toUpperCase()}`],
        [],
        ["Kelompok / Satuan", `: ${kelompokName} (${desaName})`],
        ["Kelas / Rombel", `: ${rombelName}`],
        ["Bulan", `: ${bulanLabel}`],
        ["Hari terabsen", `: ${matrix.hariTerabsen} hari`],
        [],
        ["No", "Nama Santri / Generus", ...matrix.daysArray.map(d => String(d)), "H", "S", "I", "A", "%"]
      ];

      matrix.studentRows.forEach(st => {
        aoa.push([
          st.no,
          st.nama,
          ...matrix.daysArray.map(d => st.dayMap[d] || ""),
          st.H,
          st.S,
          st.I,
          st.A,
          st.pct
        ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"] = [
        { wch: 5 },
        { wch: 28 },
        ...matrix.daysArray.map(() => ({ wch: 4 })),
        { wch: 5 },
        { wch: 5 },
        { wch: 5 },
        { wch: 5 },
        { wch: 6 }
      ];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `Presensi_${NAMA_BULAN[bulan - 1]}`.slice(0, 31));
      const fileName = `Rekap_Presensi_${rombelName.replace(/[^a-zA-Z0-9]/g, "_")}_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`;
      XLSX.writeFile(wb, fileName);
      showToast(`Rekap Presensi Excel "${fileName}" berhasil diunduh!`, "success");
    }

    function ensureMonthlyReportAndRows(uid, bulan, tahun) {
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan,
          tahun,
          status: "Draft",
          terlambat: false,
          submitted_at: null,
          komentar_admin: ""
        };
        dbStore.laporan_bulanan.push(lap);
      }

      const rombels = getGroupRombels(uid);
      rombels.forEach(r => {
        const freq = Math.min(7, Math.max(1, Number(r.pertemuan_per_minggu) || (isMudaMudiRombel(r.nama_rombel) ? 2 : 5)));
        for (let w = 1; w <= 5; w++) {
          for (let pt = 1; pt <= freq; pt++) {
            const exists = dbStore.laporan_mingguan.find(x =>
              x.laporan_id === lap.id &&
              x.rombel_id === r.id &&
              Number(x.minggu_ke) === w &&
              Number(x.pertemuan_ke || 1) === pt
            );
            if (!exists) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: pt,
                tanggal: "",
                pegon: "",
                bacaan: "",
                tajwid: "",
                hafalan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan: "",
                keterangan: ""
              });
            }
          }
        }
      });

      return lap;
    }

    async function updateRombelFrequency(rombelId, newFreqVal) {
      const freq = Math.min(7, Math.max(1, parseInt(newFreqVal, 10) || 5));
      const rombel = dbStore.rombel.find(r => r.id === rombelId);
      if (!rombel) return;
      rombel.pertemuan_per_minggu = freq;

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("rombel", "update", { pertemuan_per_minggu: freq }, { id: rombelId });
      }
      ensureMonthlyReportAndRows(appState.currentUser.id, appState.selectedMonth, appState.selectedYear);
      showToast(`Frekuensi pertemuan ${rombel.nama_rombel} diubah menjadi ${freq}x per minggu.`, "success");
      renderApp();
    }

    function updateWeeklyField(rowId, field, value) {
      const row = dbStore.laporan_mingguan.find(x => x.id === rowId);
      if (!row) return;
      row[field] = value;
      if (field === "tidak_ada_kegiatan") {
        renderApp();
      }
    }

    // ============================================================================
    // FITUR BAGIKAN KEGIATAN KE WHATSAPP (EDIT & SIMPAN + PER PESERTA KE WALI MURID)
    // ============================================================================
    function persistCustomWhatsAppTemplates() {
      try {
        localStorage.setItem("digenara_wa_templates_v1", JSON.stringify(appState.waCustomTemplates));
      } catch (e) {}
    }

    function getWhatsAppTemplateKey() {
      const uid = appState.currentUser?.id || "";
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.laporanSelectedRombel || appState.presensiSelectedRombel || "";
      const week = Number(appState.laporanSelectedWeek) || 1;
      if (appState.waShareMode === "participant") {
        return `part_${uid}_${tahun}_${bulan}_${rombelId}_${week}_${appState.waShareSelectedPesertaId || "none"}`;
      }
      return `group_${uid}_${tahun}_${bulan}_${rombelId}_${week}`;
    }

    function generateDefaultWeeklyWhatsAppMessage() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.laporanSelectedRombel || appState.presensiSelectedRombel || "";
      const rombelName = getRombelName(rombelId);
      const activeWeek = Math.min(appState.showWeek5 ? 5 : 4, Math.max(1, Number(appState.laporanSelectedWeek) || 1));
      const kelompokName = appState.currentUser.nama_kelompok;

      const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      const curFreq = Math.min(7, Math.max(1, Number(rombelObj?.pertemuan_per_minggu) || 5));

      const weekRows = dbStore.laporan_mingguan
        .filter(x =>
          x.laporan_id === lap.id &&
          x.rombel_id === rombelId &&
          Number(x.minggu_ke) === activeWeek &&
          Number(x.pertemuan_ke || 1) <= curFreq
        )
        .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));

      const lines = [
        `*LAPORAN KEGIATAN PENGAJIAN GENERUS*`,
        `Kelompok: *${kelompokName}*`,
        `Kelas / Rombel: *${rombelName}*`,
        `Periode: *${NAMA_BULAN[bulan - 1]} ${tahun} (Minggu ke-${activeWeek})*`,
        `----------------------------------------`
      ];

      let adaIsi = false;
      weekRows.forEach(w => {
        const ptLabel = `Pertemuan ke-${w.pertemuan_ke || 1}${w.tanggal ? ` (${formatTanggalID(w.tanggal)})` : ""}`;
        if (w.tidak_ada_kegiatan) {
          adaIsi = true;
          lines.push(`• *${ptLabel}*: Tidak ada kegiatan (${w.alasan || "Libur"})`);
        } else {
          const materiParts = [];
          MATERI_OPTIONS_LIST.forEach(m => {
            if (String(w[m.key] || "").trim()) materiParts.push(`${m.label}: ${w[m.key].trim()}`);
          });
          if (materiParts.length > 0 || w.tanggal || w.keterangan) {
            adaIsi = true;
            lines.push(`• *${ptLabel}*`);
            if (materiParts.length > 0) lines.push(`  Materi: ${materiParts.join("; ")}`);
            if (w.keterangan) lines.push(`  Catatan: ${w.keterangan}`);
          }
        }
      });

      if (!adaIsi) {
        lines.push(`Kegiatan pengajian berjalan lancar sesuai jadwal kelas.`);
      }

      const presSummary = calculatePresensiSummary(uid, bulan, tahun, rombelId);
      lines.push(`----------------------------------------`);
      lines.push(`Rekap Kehadiran Bulan ${NAMA_BULAN[bulan - 1]}: Hadir ${presSummary.H} | Izin ${presSummary.I} | Sakit ${presSummary.S} | Alpha ${presSummary.A} (${presSummary.pctH}%)`);
      lines.push(`_Jazakumullahu khairan katsiran._`);

      return lines.join("\n");
    }

    function generateDefaultParticipantWhatsAppMessage(pesertaId) {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const peserta = dbStore.peserta.find(p => p.id === pesertaId);
      const rombelId = peserta?.rombel_id || appState.laporanSelectedRombel || appState.presensiSelectedRombel || "";
      const rombelName = getRombelName(rombelId);
      const activeWeek = Math.min(appState.showWeek5 ? 5 : 4, Math.max(1, Number(appState.laporanSelectedWeek) || 1));
      const kelompokName = appState.currentUser.nama_kelompok;

      const namaSantri = peserta?.nama_peserta || "Ananda";
      const namaWali = peserta?.nama_ortu_wali ? `Bapak/Ibu ${peserta.nama_ortu_wali}` : "Bapak/Ibu Orang Tua / Wali";

      const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      const curFreq = Math.min(7, Math.max(1, Number(rombelObj?.pertemuan_per_minggu) || 5));

      const weekRows = dbStore.laporan_mingguan
        .filter(x =>
          x.laporan_id === lap.id &&
          x.rombel_id === rombelId &&
          Number(x.minggu_ke) === activeWeek &&
          Number(x.pertemuan_ke || 1) <= curFreq
        )
        .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));

      const pPres = dbStore.presensi.filter(r =>
        r.kelompok_id === uid &&
        r.peserta_id === pesertaId &&
        Number(r.bulan) === bulan &&
        Number(r.tahun) === tahun
      );
      const cH = pPres.filter(r => r.status === "H").length;
      const cI = pPres.filter(r => r.status === "I").length;
      const cS = pPres.filter(r => r.status === "S").length;
      const cA = pPres.filter(r => r.status === "A").length;
      const pct = pPres.length > 0 ? Math.round((cH / pPres.length) * 100) : 100;

      const lines = [
        `Assalamu'alaikum Wr. Wb.`,
        `Yth. *${namaWali}*, orang tua/wali dari ananda *${namaSantri}*.`,
        ``,
        `Berikut kami sampaikan laporan kegiatan mengaji ananda di *${kelompokName}* (Kelas *${rombelName}*) pada *${NAMA_BULAN[bulan - 1]} ${tahun} — Minggu ke-${activeWeek}*:`,
        `----------------------------------------`
      ];

      let adaMateri = false;
      weekRows.forEach(w => {
        if (w.tidak_ada_kegiatan) return;
        const materiParts = [];
        MATERI_OPTIONS_LIST.forEach(m => {
          if (String(w[m.key] || "").trim()) materiParts.push(`${m.label}: ${w[m.key].trim()}`);
        });
        if (materiParts.length > 0 || w.tanggal) {
          adaMateri = true;
          const ptLabel = `Pertemuan ke-${w.pertemuan_ke || 1}${w.tanggal ? ` (${formatTanggalID(w.tanggal)})` : ""}`;
          const statusHari = w.tanggal ? pPres.find(r => r.tanggal === w.tanggal)?.status : null;
          const statusLabel = statusHari ? ` [Status Ananda: ${statusHari}]` : "";
          lines.push(`• *${ptLabel}*${statusLabel}`);
          if (materiParts.length > 0) lines.push(`  Materi: ${materiParts.join("; ")}`);
          if (w.keterangan) lines.push(`  Catatan: ${w.keterangan}`);
        }
      });

      if (!adaMateri) {
        lines.push(`• Ananda mengikuti pembelajaran rutin sesuai jadwal kelas ${rombelName}.`);
      }

      lines.push(`----------------------------------------`);
      lines.push(`*Rekap Kehadiran Ananda (${NAMA_BULAN[bulan - 1]} ${tahun}):*`);
      lines.push(`Hadir: *${cH}x* | Izin: *${cI}x* | Sakit: *${cS}x* | Alpha: *${cA}x* (Persentase: *${pct}%*)`);
      lines.push(``);
      lines.push(`Mohon doa dan dukungan Bapak/Ibu agar ananda senantiasa semangat dalam mengaji dan mengamalkan ilmunya.`);
      lines.push(`_Jazakumullahu khairan katsiran._`);
      lines.push(`Wassalamu'alaikum Wr. Wb.`);

      return lines.join("\n");
    }

    function openShareParticipantWhatsAppDirect(pesertaId) {
      const peserta = dbStore.peserta.find(p => p.id === pesertaId);
      if (!peserta) return;
      appState.waShareMode = "participant";
      appState.waShareSelectedPesertaId = pesertaId;
      if (peserta.rombel_id) {
        appState.laporanSelectedRombel = peserta.rombel_id;
      }
      openShareWhatsAppModal();
    }

    function switchWhatsAppShareMode(newMode) {
      appState.waShareMode = newMode === "participant" ? "participant" : "group";
      const uid = appState.currentUser.id;
      const rombelId = appState.laporanSelectedRombel || appState.presensiSelectedRombel || "";
      if (appState.waShareMode === "participant") {
        const list = dbStore.peserta
          .filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif)
          .sort((a, b) => a.nama_peserta.localeCompare(b.nama_peserta));
        if (!list.some(p => p.id === appState.waShareSelectedPesertaId)) {
          appState.waShareSelectedPesertaId = list[0]?.id || "";
        }
      }
      openShareWhatsAppModal();
    }

    function changeWhatsAppSelectedPeserta(pesertaId) {
      appState.waShareSelectedPesertaId = pesertaId;
      openShareWhatsAppModal();
    }

    function saveEditedWhatsAppTemplate() {
      const ta = document.getElementById("waSharePreviewText");
      if (!ta) return;
      const key = getWhatsAppTemplateKey();
      appState.waCustomTemplates[key] = ta.value;
      persistCustomWhatsAppTemplates();
      const badge = document.getElementById("waSavedStatusBadge");
      if (badge) {
        badge.textContent = "✅ Tersimpan di perangkat";
        badge.className = "text-[11px] font-bold text-emerald-700";
      }
      showToast("Teks pesan WhatsApp berhasil disimpan!", "success");
    }

    function resetEditedWhatsAppTemplate() {
      const key = getWhatsAppTemplateKey();
      delete appState.waCustomTemplates[key];
      persistCustomWhatsAppTemplates();
      const ta = document.getElementById("waSharePreviewText");
      if (ta) {
        ta.value = appState.waShareMode === "participant"
          ? generateDefaultParticipantWhatsAppMessage(appState.waShareSelectedPesertaId)
          : generateDefaultWeeklyWhatsAppMessage();
      }
      const badge = document.getElementById("waSavedStatusBadge");
      if (badge) {
        badge.textContent = "↺ Kembali ke format otomatis";
        badge.className = "text-[11px] font-semibold text-slate-500";
      }
      showToast("Teks pesan dikembalikan ke format otomatis.", "info");
    }

    function sendEditedWhatsAppNow() {
      const ta = document.getElementById("waSharePreviewText");
      const text = ta ? ta.value : "";
      if (!text.trim()) {
        showToast("Teks pesan WhatsApp tidak boleh kosong.", "warning");
        return;
      }
      let targetPhone = "";
      if (appState.waShareMode === "participant" && appState.waShareSelectedPesertaId) {
        const phoneInput = document.getElementById("waParticipantPhoneInput");
        targetPhone = phoneInput ? phoneInput.value.trim() : "";
        const peserta = dbStore.peserta.find(p => p.id === appState.waShareSelectedPesertaId);
        if (peserta && targetPhone && peserta.no_wa_wali !== targetPhone) {
          peserta.no_wa_wali = targetPhone;
          if (isLiveSupabase && supabaseClient) {
            resilientSupabaseMutation("peserta", "update", { no_wa_wali: targetPhone }, { id: peserta.id }).then(() => {});
          }
        }
      }
      window.open(buildWhatsAppSendUrl(text, targetPhone), "_blank", "noopener,noreferrer");
    }

    function openShareWhatsAppModal() {
      const uid = appState.currentUser.id;
      const rombelId = appState.laporanSelectedRombel || appState.presensiSelectedRombel || "";
      const pesertaList = dbStore.peserta
        .filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif)
        .sort((a, b) => a.nama_peserta.localeCompare(b.nama_peserta));

      if (appState.waShareMode === "participant" && (!appState.waShareSelectedPesertaId || !pesertaList.some(p => p.id === appState.waShareSelectedPesertaId))) {
        appState.waShareSelectedPesertaId = pesertaList[0]?.id || "";
      }

      const selectedPeserta = appState.waShareMode === "participant"
        ? pesertaList.find(p => p.id === appState.waShareSelectedPesertaId)
        : null;

      const tplKey = getWhatsAppTemplateKey();
      const hasSavedCustom = Object.prototype.hasOwnProperty.call(appState.waCustomTemplates, tplKey);
      const currentMsg = hasSavedCustom
        ? appState.waCustomTemplates[tplKey]
        : (appState.waShareMode === "participant"
            ? generateDefaultParticipantWhatsAppMessage(appState.waShareSelectedPesertaId)

    async function saveLaporanDraftToCloud() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
      const rows = dbStore.laporan_mingguan.filter(x => x.laporan_id === lap.id);

      if (isLiveSupabase && supabaseClient) {
        const resLap = await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        if (resLap.error) {
          showToast("Gagal menyimpan laporan: " + resLap.error.message, "error");
          return;
        }
        const cleanRows = rows.map(r => ({
          ...r,
          tanggal: r.tanggal || null
        }));
        const resRows = await resilientSupabaseMutation("laporan_mingguan", "upsert", cleanRows, null, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });
        if (resRows.error) {
          showToast("Gagal menyimpan rincian mingguan: " + resRows.error.message, "error");
          return;
        }
      }
      showToast("Draft laporan bulanan berhasil disimpan!", "success");
    }

    function submitFinalMonthlyReport() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const deadlineInfo = getReportDeadlineInfo(bulan, tahun);

      if (deadlineInfo.isPassed && !deadlineInfo.allowLate) {
        showToast(`Pengiriman ditolak: Batas waktu pelaporan (${deadlineInfo.formattedDate}) telah ditutup oleh Admin Daerah.`, "error");
        return;
      }

      const lateNote = deadlineInfo.isPassed
        ? " Perhatian: Pengiriman ini melewati batas waktu sehingga otomatis tercatat sebagai Terlambat."
        : "";

      confirmDialog(
        "Kirim Laporan Bulanan ke Admin Daerah?",
        `Pastikan seluruh data Jurnal Guru, Presensi, dan Laporan Kegiatan periode ${NAMA_BULAN[bulan - 1]} ${tahun} sudah sesuai.${lateNote}`,
        async () => {
          const uid = appState.currentUser.id;
          const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
          lap.status = "Dikirim";
          lap.terlambat = deadlineInfo.isPassed;
          lap.submitted_at = new Date().toISOString();

          await saveLaporanDraftToCloud();
          showToast("Laporan bulanan berhasil dikirim ke Admin Daerah Jepara!", "success");
          logActivity("Kirim Laporan Bulanan", `${NAMA_BULAN[bulan - 1]} ${tahun} (${lap.terlambat ? "Terlambat" : "Tepat Waktu"})`);
          renderApp();
        },
        "Kirim Laporan Sekarang"
      );
    }

    async function saveUploadDokumentasi(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const file = document.getElementById("dokFile")?.files?.[0];
      if (!file) return;

      const compressed = await compressImageFile(file);
      let finalUrl = compressed.dataUrl;
      let storagePath = "";

      if (isLiveSupabase && supabaseClient && compressed.blob) {
        storagePath = `${uid}/${tahun}_${bulan}_${Date.now()}.jpg`;
        const up = await supabaseClient.storage
          .from(APP_CONFIG.STORAGE_BUCKET)
          .upload(storagePath, compressed.blob, { contentType: "image/jpeg", upsert: true });
        if (!up.error) {
          const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(storagePath);
          if (pub?.data?.publicUrl) finalUrl = pub.data.publicUrl;
        }
      }

      const row = {
        id: generateUUID(),
        kelompok_id: uid,
        bulan,
        tahun,
        tanggal: document.getElementById("dokTanggal").value,
        keterangan: document.getElementById("dokKet").value.trim(),
        foto_url: finalUrl,
        file_path: storagePath,
        ukuran_kb: compressed.sizeKB
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", row);
        if (res.error) {
          showToast("Gagal menyimpan dokumentasi: " + res.error.message, "error");
          return;
        }
      }

      dbStore.dokumentasi_kegiatan.unshift(row);
      closeModal();
      showToast(`Foto berhasil diunggah (${compressed.sizeKB} KB)!`, "success");
      renderApp();
    }

    function deleteDokumentasiItem(id, filePath) {
      confirmDialog("Hapus Foto Dokumentasi?", "Foto ini akan dihapus permanen.", async () => {
        if (isLiveSupabase && supabaseClient) {
          if (filePath) {
            await supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).remove([filePath]);

          const { error } = await supabaseClient.from("dokumentasi_kegiatan").delete().eq("id", id);
          if (error) {
            showToast("Gagal menghapus dokumentasi di server: " + error.message, "error");
            return;
          }
        }
        dbStore.dokumentasi_kegiatan = dbStore.dokumentasi_kegiatan.filter(d => d.id !== id);
        showToast("Foto dokumentasi dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    function openAdminResetPasswordModal(userId) {
      const prof = dbStore.profiles.find(p => p.id === userId);

        `,
        "max-w-md"
      );
    }

    async function executeAdminResetPassword(e, userId) {
      e.preventDefault();
      const newPw = document.getElementById("adminNewPwVal").value;
      const prof = dbStore.profiles.find(p => p.id === userId);
      if (!prof) return;

      if (isLiveSupabase && supabaseClient) {
        const { error } = await supabaseClient.rpc("admin_reset_user_password", {
          target_user_id: userId,
          new_password: newPw
        });
        if (error) {
          showToast("Gagal reset password di server: " + error.message, "error");
          return;
        }
      } else {
        prof.password_hash = newPw;
      }
      prof.reset_requested = false;
      prof.reset_note = "";
      closeModal();
      showToast(`Password untuk @${prof.username} berhasil direset menjadi "${newPw}"!`, "success");
      renderApp();
    }

    function getFilteredAdminGenerusList() {
      const kelompoks = dbStore.profiles.filter(p => p.role === "user");
      return dbStore.peserta
        .filter(st => {
          if (!st.aktif) return false;
          const kel = kelompoks.find(k => k.id === st.kelompok_id);
          const desa = kel?.nama_desa || "";
          const rombelName = getRombelName(st.rombel_id);

          if (appState.adminGenerusFilterDesa !== "ALL" && desa !== appState.adminGenerusFilterDesa) return false;
          if (appState.adminGenerusFilterKelompok !== "ALL" && st.kelompok_id !== appState.adminGenerusFilterKelompok) return false;
          if (appState.adminGenerusFilterRombel !== "ALL" && rombelName.toLowerCase() !== appState.adminGenerusFilterRombel.toLowerCase()) return false;
          if (appState.adminGenerusFilterGender !== "ALL" && st.jenis_kelamin !== appState.adminGenerusFilterGender) return false;

          const q = appState.adminGenerusSearch.trim().toLowerCase();
          if (q) {
            const hay = `${st.nama_peserta} ${st.nama_ortu_wali || ""} ${st.tempat_lahir || ""} ${kel?.nama_kelompok || ""}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => getKelompokName(a.kelompok_id).localeCompare(getKelompokName(b.kelompok_id)) || a.nama_peserta.localeCompare(b.nama_peserta));
    }

      );

    async function submitAdminReview(e, laporanId, targetStatus) {
      e.preventDefault();
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;
      lap.status = targetStatus;
      lap.komentar_admin = document.getElementById("adminReviewComment").value.trim();

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("laporan_bulanan", "update", {
          status: lap.status,
          komentar_admin: lap.komentar_admin
        }, { id: laporanId });
      }
      closeModal();
      showToast(`Status laporan diubah menjadi "${targetStatus}".`, "success");
      renderApp();
    }

                  <td style="text-align:center;">${idx + 1}</td>
                  <td>${escapeHTML(k.nama_kelompok)}</td>
                  <td>${escapeHTML(k.nama_desa || "-")}</td>
                  <td style="text-align:center;">${jml}</td>
                  <td style="text-align:center;">${pres.H}</td>
                  <td style="text-align:center;">${pres.I}</td>
                  <td style="text-align:center;">${pres.S}</td>
                  <td style="text-align:center;">${pres.A}</td>
                  <td style="text-align:center;">${pres.pctH}%</td>
                  <td style="text-align:center;">${escapeHTML(lap?.status || "Belum Kirim")}</td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      `;
      triggerOfficialPrint("REKAPITULASI LAPORAN PENGAJIAN GENERUS DAERAH JEPARA", `Periode ${NAMA_BULAN[bulan - 1]} ${tahun}`, html);
    }

    // ============================================================================
    // PENGUMUMAN & PENGATURAN SISTEM (ADMIN)
    // ============================================================================
    function renderAdminPengumumanTab() {
      return `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">Pengumuman Daerah & Pengaturan Pelaporan</h2>
            <p class="text-xs sm:text-sm text-slate-500">Kirim informasi ke seluruh kelompok & atur tenggat pelaporan bulanan</p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Form Buat Pengumuman -->
            <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
              <h3 class="font-extrabold text-base text-slate-900">📢 Terbitkan Pengumuman Baru</h3>
              <form onsubmit="createAnnouncementSubmit(event)" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Judul Pengumuman *</label>
                  <input id="annJudul" type="text" required placeholder="Contoh: Jadwal Musyawarah Guru Daerah Jepara" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Isi Pengumuman *</label>
                  <textarea id="annIsi" rows="4" required placeholder="Tulis pesan atau instruksi untuk seluruh kelompok..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
                </div>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm shadow-sm">
                  🚀 Publikasikan Pengumuman
                </button>
              </form>
            </div>

            <!-- Pengaturan Batas Waktu Pelaporan -->
            <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
              <h3 class="font-extrabold text-base text-slate-900">⏰ Pengaturan Batas Waktu Pelaporan</h3>
              <form onsubmit="handleInlineDeadlineSubmit(event)" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Tanggal Batas (Bulan Berikutnya)</label>
                  <select id="inlineDeadlineDay" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold bg-white">
                    ${Array.from({ length: 28 }, (_, i) => i + 1).map(d =>
                      `<option value="${d}" ${APP_CONFIG.REPORT_DEADLINE_DAY === d ? "selected" : ""}>Tanggal ${d}</option>`
                    ).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Jam Batas (WIB)</label>
                  <select id="inlineDeadlineHour" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold bg-white">
                    ${Array.from({ length: 24 }, (_, h) => h).map(h => {
                      const hh = String(h).padStart(2, "0");
                      return `<option value="${h}" ${APP_CONFIG.REPORT_DEADLINE_HOUR_WIB === h ? "selected" : ""}>Pukul ${hh}.00 WIB</option>`;
                    }).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Kebijakan Keterlambatan</label>
                  <select id="inlineAllowLate" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold bg-white">
                    <option value="true" ${APP_CONFIG.ALLOW_LATE_REPORT ? "selected" : ""}>Tetap Terima (Tandai Terlambat)</option>
                    <option value="false" ${!APP_CONFIG.ALLOW_LATE_REPORT ? "selected" : ""}>Kunci Otomatis Setelah Tenggat</option>
                  </select>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-sm">
                  Simpan Pengaturan Batas Waktu
                </button>
              </form>
            </div>
          </div>

          <!-- Daftar Pengumuman Aktif -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
            <h3 class="font-extrabold text-base text-slate-900">Daftar Pengumuman Aktif (${dbStore.pengumuman.length})</h3>
            <div class="divide-y divide-slate-100">
              ${dbStore.pengumuman.length === 0 ? `
                <div class="py-6 text-center text-slate-400 text-sm">Belum ada pengumuman.</div>
              ` : dbStore.pengumuman.map(a => `
                <div class="py-3.5 flex items-start justify-between gap-3">
                  <div>
                    <div class="font-extrabold text-sm text-slate-900">${escapeHTML(a.judul)}</div>
                    <div class="text-xs text-slate-500 mt-0.5">${formatDateTimeWIB(a.created_at)}</div>
                    <p class="text-xs sm:text-sm text-slate-700 mt-1.5 leading-relaxed">${escapeHTML(a.isi)}</p>
                  </div>
                  <button type="button" onclick="deleteAnnouncementItem('${a.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs shrink-0">
                    Hapus
                  </button>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    async function createAnnouncementSubmit(e) {
      e.preventDefault();
      const row = {
        id: generateUUID(),
        judul: document.getElementById("annJudul").value.trim(),
        isi: document.getElementById("annIsi").value.trim(),
        penting: true,
        created_at: new Date().toISOString()
      };
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengumuman", "insert", row);
        if (res.error) {
          showToast("Gagal menerbitkan pengumuman: " + res.error.message, "error");
          return;
        }
      }
      dbStore.pengumuman.unshift(row);
      deviceNotifState.seenAnnouncementIds.push(row.id);
      persistDeviceNotifState();
      await broadcastRealtimeEvent("new_announcement", row);
      if (getDeviceNotificationStatusInfo().isConnected) {
        await triggerNativeDeviceNotification(
          `📢 Pengumuman Diterbitkan: ${row.judul}`,
          row.isi,
          `digenara-ann-${row.id}`,
          "pengumuman"
        );
      }
      showToast("Pengumuman berhasil dipublikasikan & dikirim langsung ke seluruh perangkat!", "success");
      renderApp();
    }

    function deleteAnnouncementItem(id) {
      confirmDialog("Hapus Pengumuman?", "Pengumuman ini akan dihapus dari beranda kelompok.", async () => {
        if (isLiveSupabase && supabaseClient) {
          const { error } = await supabaseClient.from("pengumuman").delete().eq("id", id);
          if (error) {
            showToast("Gagal menghapus pengumuman: " + error.message, "error");
            return;
          }
        }
        dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
        showToast("Pengumuman dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    // ============================================================================
    // BOOT APLIKASI
    // ============================================================================
    initBrandingIconsAndManifest();
    attachGlobalWakeupSyncListeners();
    if (deviceNotifState.enabled) {
      registerLightweightNotificationSW();
    }
    if (isLiveSupabase) {
      setupSupabaseNotificationRealtime();
    }
    renderApp();
    if (isLiveSupabase) {
      restoreSupabaseSession();
    }
  </script>
</body>
</html>
