    async function importSantriMassalExcel(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const uid = appState.currentUser.id;

      try {
        if (!window.XLSX) {
          showToast("Library Excel belum siap. Gunakan form pendaftaran manual.", "error");
          return;
        }
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const jsonRows = XLSX.utils.sheet_to_json(sheet);

        if (!jsonRows || jsonRows.length === 0) {
          showToast("File Excel kosong atau format tidak terbaca.", "warning");
          return;
        }

        const existingRombels = getGroupRombels(uid);
        let defaultRombel = existingRombels[0];
        if (!defaultRombel) {
          defaultRombel = {
            id: generateUUID(),
            kelompok_id: uid,
            nama_rombel: STANDARD_KELAS_OPTIONS[0],
            pertemuan_per_minggu: 5,
            urutan: 1
          };
          if (isLiveSupabase && supabaseClient) {
            await resilientSupabaseMutation("rombel", "insert", defaultRombel);
          }
          dbStore.rombel.push(defaultRombel);
        }

        const newCoreRows = [];
        const newFullRows = [];

        for (const row of jsonRows) {
          const nama = String(row["Nama Lengkap Santri"] || row["Nama Lengkap"] || row.nama || row.Nama || "").trim();
          if (!nama) continue;

          const jkRaw = String(row["Jenis Kelamin (L/P)"] || row["L/P"] || row.JK || row.jenis_kelamin || "L").trim().toUpperCase();
          const jk = jkRaw.startsWith("P") ? "P" : "L";

          const kelasRaw = String(row["Kelas Pengajian"] || row.Kelas || row.Rombel || "").trim();
          let targetRombel = kelasRaw
            ? getGroupRombels(uid).find(r => r.nama_rombel.toLowerCase() === kelasRaw.toLowerCase())
            : null;

          if (!targetRombel && kelasRaw) {
            targetRombel = {
              id: generateUUID(),
              kelompok_id: uid,
              nama_rombel: kelasRaw,
              pertemuan_per_minggu: isMudaMudiRombel(kelasRaw) ? 2 : 5,
              urutan: getGroupRombels(uid).length + 1
            };
            if (isLiveSupabase && supabaseClient) {
              await resilientSupabaseMutation("rombel", "insert", targetRombel);
            }
            dbStore.rombel.push(targetRombel);
          }
          if (!targetRombel) targetRombel = defaultRombel;

          const tempatLahir = String(row["Tempat Lahir"] || row.tempat_lahir || "").trim();
          const tglLahirRaw = String(row["Tanggal Lahir (YYYY-MM-DD)"] || row["Tanggal Lahir"] || row.tanggal_lahir || "").trim();
          const tanggalLahir = /^\d{4}-\d{2}-\d{2}$/.test(tglLahirRaw) ? tglLahirRaw : "";
          const pendidikan = String(row["Pendidikan / Sekolah"] || row.Pendidikan || "").trim();
          const namaWali = String(row["Nama Orang Tua / Wali"] || row["Nama Wali"] || "").trim();
          const noWaWali = String(row["No. HP / WhatsApp"] || row["No WA"] || "").trim();
          const alamat = String(row["Alamat"] || row.alamat || "").trim();

          const id = generateUUID();
          const core = {
            id,
            kelompok_id: uid,
            rombel_id: targetRombel.id,
            nama_peserta: nama,
            jenis_kelamin: jk,
            aktif: true
          };
          const full = {
            ...core,
            tempat_lahir: tempatLahir,
            tanggal_lahir: tanggalLahir || null,
            pendidikan_sekolah: pendidikan,
            nama_wali: namaWali,
            no_wa_wali: noWaWali,
            alamat,
            jenjang_usia: targetRombel.nama_rombel
          };

          newCoreRows.push(core);
          newFullRows.push(full);
          savePesertaExtraCache(id, {
            tempat_lahir: tempatLahir,
            tanggal_lahir: tanggalLahir,
            pendidikan_sekolah: pendidikan,
            nama_wali: namaWali,
            no_wa_wali: noWaWali,
            alamat,
            jenjang_usia: targetRombel.nama_rombel
          });
        }

        if (newFullRows.length === 0) {
          showToast("Tidak ada baris dengan nama santri yang valid.", "warning");
          return;
        }

        if (isLiveSupabase && supabaseClient) {
          let res = await resilientSupabaseMutation("peserta", "insert", newFullRows);
          if (res.error) {
            res = await resilientSupabaseMutation("peserta", "insert", newCoreRows);
            if (res.error) {
              showToast("Gagal impor santri: " + res.error.message, "error");
              return;
            }
          }
        }

        dbStore.peserta.push(...newFullRows);
        showToast(`${newFullRows.length} santri berhasil diimpor dari Excel!`, "success");
        logActivity("Impor Excel Santri", `Menambahkan ${newFullRows.length} santri`);
        renderApp();
      } catch (err) {
        showToast("Gagal membaca file Excel: " + err.message, "error");
      }
    }

    function detectWeekAndSlotForJurnal(uid, rombelId, isoDate) {
      const cleanDate = String(isoDate || getWIBParts().isoDate).slice(0, 10);
      const parts = cleanDate.split("-").map(Number);
      const jy = parts[0] || appState.selectedYear;
      const jm = parts[1] || appState.selectedMonth;
      const jd = parts[2] || 1;
      const autoWeek = Math.min(5, Math.max(1, Math.ceil(jd / 7)));

      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      const maxPt = Math.min(7, Math.max(1, Number(rombelObj?.pertemuan_per_minggu) || (isMudaMudiRombel(rombelObj?.nama_rombel) ? 2 : 5)));

      const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === jm && Number(l.tahun) === jy);
      if (lap) {
        const sameDateRow = dbStore.laporan_mingguan.find(w => w.laporan_id === lap.id && w.rombel_id === rombelId && w.tanggal === cleanDate);
        if (sameDateRow) {
          return { week: Number(sameDateRow.minggu_ke) || autoWeek, pertemuan: Number(sameDateRow.pertemuan_ke || 1), maxPt };
        }
        const weekRows = dbStore.laporan_mingguan
          .filter(w => w.laporan_id === lap.id && w.rombel_id === rombelId && Number(w.minggu_ke) === autoWeek)
          .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));
        const firstEmpty = weekRows.find(w => !w.tanggal && !w.tidak_ada_kegiatan && !MATERI_OPTIONS_LIST.some(m => String(w[m.key] || "").trim() !== ""));
        if (firstEmpty) {
          return { week: autoWeek, pertemuan: Number(firstEmpty.pertemuan_ke || 1), maxPt };
        }
      }
      return { week: autoWeek, pertemuan: 1, maxPt };
    }

    function handleJurnalDateOrRombelChange() {
      const uid = appState.currentUser?.id;
      const tgl = document.getElementById("jTanggal")?.value;
      const rombelVal = document.getElementById("jRombel")?.value || "";
      const newBox = document.getElementById("jNewRombelBox");
      const newNameInput = document.getElementById("jNewRombelName");
      const newFreqInput = document.getElementById("jNewRombelFreq");

      if (newBox) {
        if (rombelVal === "__ADD_NEW_CLASS__") {
          newBox.classList.remove("hidden");
          if (newNameInput) {
            newNameInput.required = true;
            newNameInput.focus();
          }
        } else {
          newBox.classList.add("hidden");
          if (newNameInput) newNameInput.required = false;
          if (newFreqInput && rombelVal.startsWith("PRESET::")) {
            const presetName = rombelVal.slice("PRESET::".length);
            newFreqInput.value = isMudaMudiRombel(presetName) ? 2 : 5;

      if (!uid || !tgl || !rombelVal || rombelVal === "__ADD_NEW_CLASS__" || rombelVal.startsWith("PRESET::")) {

      const ptEl = document.getElementById("jSyncPertemuan");
      if (weekEl) weekEl.value = String(slotInfo.week);

        ptEl.innerHTML = Array.from({ length: Math.max(slotInfo.maxPt, slotInfo.pertemuan, 5) }, (_, i) => i + 1)
          .map(p => `<option value="${p}" ${slotInfo.pertemuan === p ? "selected" : ""}>Pertemuan ke-${p}</option>`)
          .join("");
      }
    }

    async function syncJurnalToLaporanKegiatan(jurnalRow, targetWeek, targetPertemuan) {
      const uid = jurnalRow.kelompok_id;
      const rombelId = jurnalRow.rombel_id;
      if (!uid || !rombelId || !jurnalRow.tanggal) return false;

      const [jy, jm] = String(jurnalRow.tanggal).split("-").map(Number);
      if (!jy || !jm) return false;

      const lap = ensureMonthlyReportAndRows(uid, jm, jy);

      let targetRow = dbStore.laporan_mingguan.find(w =>
        w.laporan_id === lap.id &&
        w.rombel_id === rombelId &&
        w.tanggal === jurnalRow.tanggal
      );

      if (!targetRow) {
        targetRow = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === lap.id &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === Number(targetWeek) &&
          Number(w.pertemuan_ke || 1) === Number(targetPertemuan)
        );
      }

      if (!targetRow) {
        const weekRows = dbStore.laporan_mingguan.filter(w =>
          w.laporan_id === lap.id &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === Number(targetWeek)
        );
        const nextPt = weekRows.length > 0 ? Math.max(...weekRows.map(r => Number(r.pertemuan_ke || 1))) + 1 : Number(targetPertemuan || 1);
        targetRow = {
          id: generateUUID(),
          laporan_id: lap.id,
          rombel_id: rombelId,
          minggu_ke: Number(targetWeek),
          pertemuan_ke: nextPt,
          tanggal: null,
          pegon: "",
          tajwid: "",
          hafalan: "",
          bacaan: "",
          makna: "",
          lain_lain: "",
          tidak_ada_kegiatan: false,
          alasan_kosong: ""
        };
        dbStore.laporan_mingguan.push(targetRow);
      }

      targetRow.tanggal = jurnalRow.tanggal;
      targetRow.pegon = jurnalRow.pegon || "";
      targetRow.tajwid = jurnalRow.tajwid || "";
      targetRow.hafalan = jurnalRow.hafalan || "";
      targetRow.bacaan = jurnalRow.bacaan || "";
      targetRow.makna = jurnalRow.makna || "";
      targetRow.lain_lain = jurnalRow.lain_lain || "";
      targetRow.tidak_ada_kegiatan = false;
      targetRow.alasan_kosong = "";

      if (isLiveSupabase && supabaseClient) {
        await upsertLaporanBulananSafe(lap);
        const wRes = await upsertLaporanMingguanSafe([targetRow]);
        if (wRes.error) {
          console.warn("Integrasi laporan mingguan ke cloud tertunda:", wRes.error.message);
        }
      }
      return true;
    }

    function syncJurnalHadirFromPresensi(notify = false) {
      const uid = appState.currentUser.id;
      const tgl = document.getElementById("jTanggal")?.value;
      const rombelId = document.getElementById("jRombel")?.value;
      const hadirEl = document.getElementById("jHadir");
      if (!tgl || !rombelId || !hadirEl) return;
      const count = dbStore.presensi.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.tanggal === tgl && p.status === "H").length;
      hadirEl.value = count;
      if (notify) {
        showToast(count > 0 ? `Jumlah hadir diambil dari presensi: ${count} peserta.` : "Belum ada presensi 'Hadir' pada tanggal & kelas ini.", count > 0 ? "success" : "info");
      }
    }

    async function saveJurnalForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const tanggal = document.getElementById("jTanggal").value;
      const rawRombelVal = document.getElementById("jRombel").value;
      const namaGuru = document.getElementById("jGuru").value.trim();
      const jumlahHadir = Number(document.getElementById("jHadir").value || 0);
      const metode = document.getElementById("jMetode").value.trim();
      const catatan = document.getElementById("jCatatan").value.trim();
      const autoSync = Boolean(document.getElementById("jAutoSyncLaporan")?.checked);
      const syncWeek = Number(document.getElementById("jSyncWeek")?.value || 1);
      const syncPertemuan = Number(document.getElementById("jSyncPertemuan")?.value || 1);

      let rombelId = rawRombelVal;
      if (rawRombelVal === "__ADD_NEW_CLASS__" || rawRombelVal.startsWith("PRESET::")) {
        const newClassName = rawRombelVal === "__ADD_NEW_CLASS__"
          ? (document.getElementById("jNewRombelName")?.value || "").trim()
          : rawRombelVal.slice("PRESET::".length).trim();

        if (!newClassName) {
          showToast("Masukkan nama kelas / rombel baru terlebih dahulu.", "warning");
          return;
        }

        const existingSame = getGroupRombels(uid).find(
          r => String(r.nama_rombel || "").trim().toLowerCase() === newClassName.toLowerCase()
        );
        if (existingSame) {
          rombelId = existingSame.id;
        } else {
          const customFreq = rawRombelVal === "__ADD_NEW_CLASS__"
            ? Math.min(7, Math.max(1, parseInt(document.getElementById("jNewRombelFreq")?.value, 10) || 5))
            : (isMudaMudiRombel(newClassName) ? 2 : 5);
          const createdRombel = {
            id: generateUUID(),
            kelompok_id: uid,
            nama_rombel: newClassName,
            pertemuan_per_minggu: customFreq,
            urutan: getGroupRombels(uid).length + 1
          };
          if (isLiveSupabase && supabaseClient) {
            const rRes = await resilientSupabaseMutation("rombel", "insert", createdRombel);
            if (rRes.error) {
              showToast("Gagal membuat kelas baru: " + rRes.error.message, "error");
              return;
            }
          }
          dbStore.rombel.push(createdRombel);
          rombelId = createdRombel.id;
          if (!appState.presensiSelectedRombel) appState.presensiSelectedRombel = rombelId;
          if (!appState.laporanSelectedRombel) appState.laporanSelectedRombel = rombelId;
        }
      }

      if (!rombelId) {
        showToast("Pilih kelas / rombel terlebih dahulu.", "warning");
        return;
      }

      const selectedKeys = appState.jurnalModalSelectedMateri || [];
      if (selectedKeys.length === 0) {
        showToast("Pilih minimal 1 opsi materi pembelajaran (Pegon, Tajwid, Hafalan, Bacaan, Makna, atau Lain-lain).", "warning");
        return;
      }

      const materiFields = {};
      const summaryParts = [];
      for (const m of MATERI_OPTIONS_LIST) {
        if (selectedKeys.includes(m.key)) {
          const val = (document.getElementById(`jMat_${m.key}`)?.value ?? appState.jurnalModalDraftValues[m.key] ?? "").trim();
          if (!val) {
            showToast(`Isi materi ${m.label} tidak boleh kosong.`, "warning");
            return;
          }
          materiFields[m.key] = val;
          summaryParts.push(`${m.label}: ${val}`);
        } else {
          materiFields[m.key] = "";
        }
      }

      const combinedMateri = summaryParts.join(" | ");
      const coreRow = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        rombel_id: rombelId,
        tanggal,
        nama_guru: namaGuru,
        materi: combinedMateri,
        metode,
        jumlah_hadir: jumlahHadir,
        catatan
      };

      const fullRow = {
        ...coreRow,
        ...materiFields
      };

      if (isLiveSupabase && supabaseClient) {
        let res = editId
          ? await resilientSupabaseMutation("jurnal_guru", "update", fullRow, { id: editId })
          : await resilientSupabaseMutation("jurnal_guru", "insert", fullRow);
        if (res.error) {
          res = editId
            ? await resilientSupabaseMutation("jurnal_guru", "update", coreRow, { id: editId })
            : await resilientSupabaseMutation("jurnal_guru", "insert", coreRow);
          if (res.error) {
            showToast("Gagal menyimpan jurnal: " + res.error.message, "error");
            return;
          }
        }
      }

      if (editId) {
        const idx = dbStore.jurnal_guru.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.jurnal_guru[idx] = { ...dbStore.jurnal_guru[idx], ...fullRow };
      } else {
        dbStore.jurnal_guru.push(fullRow);
      }

      let syncedOK = false;
      if (autoSync) {
        syncedOK = await syncJurnalToLaporanKegiatan(fullRow, syncWeek, syncPertemuan);
      }

      const [jy, jm] = String(tanggal).split("-").map(Number);
      if (jy && jm) {
        appState.selectedYear = jy;
        appState.selectedMonth = jm;
      }
      if (appState.jurnalFilterRombel !== "ALL" && appState.jurnalFilterRombel !== rombelId) {
        appState.jurnalFilterRombel = rombelId;
      }

      closeModal();
      const className = getRombelName(rombelId);
      showToast(
        syncedOK
          ? `Jurnal kelas "${className}" tersimpan & otomatis terintegrasi ke Laporan Kegiatan!`
          : `Jurnal guru kelas "${className}" berhasil disimpan!`,
        "success"
      );
      logActivity(
        editId ? "Edit Jurnal Guru" : "Tambah Jurnal Guru",
        `${tanggal} • ${className} • ${namaGuru}`
      );
      renderApp();
    }

    async function setSinglePresensiStatus(pesertaId, status) {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const tanggal = appState.presensiActiveDate;
      const [y, m] = tanggal.split("-").map(Number);

      const record = {
        id: generateUUID(),
        kelompok_id: uid,
        rombel_id: rombelId,
        peserta_id: pesertaId,
        tanggal,
        bulan: m,
        tahun: y,
        status
      };

      const existingIdx = dbStore.presensi.findIndex(p => p.peserta_id === pesertaId && p.tanggal === tanggal);
      if (existingIdx >= 0) {
        record.id = dbStore.presensi[existingIdx].id;
        dbStore.presensi[existingIdx] = record;
      } else {
        dbStore.presensi.push(record);
      }

      if (appState.isOfflineMode) {
        const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === pesertaId && q.tanggal === tanggal);
        if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = record;
        else appState.offlinePresensiQueue.push(record);
      } else if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("presensi", "upsert", record, null, { onConflict: "peserta_id,tanggal" });
        if (res.error) {
          showToast("Gagal sinkron presensi ke server: " + res.error.message, "error");
        }
      }

      renderApp();
    }

    async function markAllPresensiHadir() {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const tanggal = appState.presensiActiveDate;
      const [y, m] = tanggal.split("-").map(Number);
      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);

      if (pesertaList.length === 0) return;

      const batch = [];
      for (const p of pesertaList) {
        const existingIdx = dbStore.presensi.findIndex(r => r.peserta_id === p.id && r.tanggal === tanggal);
        const rec = {
          id: existingIdx >= 0 ? dbStore.presensi[existingIdx].id : generateUUID(),
          kelompok_id: uid,
          rombel_id: rombelId,
          peserta_id: p.id,
          tanggal,
          bulan: m,
          tahun: y,
          status: "H"
        };
        if (existingIdx >= 0) dbStore.presensi[existingIdx] = rec;
        else dbStore.presensi.push(rec);
        batch.push(rec);
      }

      if (appState.isOfflineMode) {
        batch.forEach(rec => {
          const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === rec.peserta_id && q.tanggal === tanggal);
          if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = rec;
          else appState.offlinePresensiQueue.push(rec);
        });
        showToast(`${batch.length} peserta ditandai Hadir (tersimpan offline).`, "warning");
      } else if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("presensi", "upsert", batch, null, { onConflict: "peserta_id,tanggal" });
        if (res.error) {
          showToast("Gagal menyimpan presensi massal: " + res.error.message, "error");
        } else {
          showToast(`Semua (${batch.length}) peserta ditandai Hadir!`, "success");
        }
      } else {
        showToast(`Semua (${batch.length}) peserta ditandai Hadir!`, "success");
      }

      renderApp();
    }

    function exportPresensiBulananExcel() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.presensiSelectedRombel;
      const rombelName = getRombelName(rombelId);

      const pesertaList = dbStore.peserta
        .filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif)
        .sort((a, b) => a.nama_peserta.localeCompare(b.nama_peserta));

      const recs = dbStore.presensi.filter(p =>
        p.kelompok_id === uid &&
        p.rombel_id === rombelId &&
        Number(p.bulan) === Number(bulan) &&
        Number(p.tahun) === Number(tahun)
      );

      const rows = pesertaList.map((p, idx) => {
        const pRecs = recs.filter(r => r.peserta_id === p.id);
        const H = pRecs.filter(r => r.status === "H").length;
        const I = pRecs.filter(r => r.status === "I").length;
        const S = pRecs.filter(r => r.status === "S").length;
        const A = pRecs.filter(r => r.status === "A").length;
        const total = pRecs.length;
        return {
          No: idx + 1,
          "Nama Santri": p.nama_peserta,
          "L/P": p.jenis_kelamin,
          Kelas: rombelName,
          "Hadir (H)": H,

    function ensureMonthlyReportAndRows(uid, bulan, tahun) {
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === Number(bulan) && Number(l.tahun) === Number(tahun));
      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan: Number(bulan),
          tahun: Number(tahun),
          status: "Draft",
          terlambat: false,
          tanggal_kirim: null,
          komentar_admin: "",
          created_at: new Date().toISOString()
        };
        dbStore.laporan_bulanan.push(lap);
      }

      const rombels = getGroupRombels(uid);
      for (const r of rombels) {
        const defaultPertemuan = Math.min(7, Math.max(1, Number(r.pertemuan_per_minggu) || (isMudaMudiRombel(r.nama_rombel) ? 2 : 5)));
        for (let w = 1; w <= 5; w++) {
          const existingWeekRows = dbStore.laporan_mingguan.filter(
            x => x.laporan_id === lap.id && x.rombel_id === r.id && Number(x.minggu_ke) === w
          );
          if (existingWeekRows.length === 0) {
            for (let pt = 1; pt <= defaultPertemuan; pt++) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: pt,
                tanggal: null,
                pegon: "",
                tajwid: "",
                hafalan: "",
                bacaan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan_kosong: ""
              });
            }
          }
        }
      }
      return lap;
    }

    function getWeeklyRowSlotKey(rowId) {
      return `slot_${rowId}`;
    }

    function getActiveMateriKeysForWeeklyRow(row) {
      const slotKey = getWeeklyRowSlotKey(row.id);
      if (Array.isArray(appState.weeklySelectedMateriMap[slotKey])) {
        return appState.weeklySelectedMateriMap[slotKey];
      }
      const detected = MATERI_OPTIONS_LIST
        .filter(m => String(row[m.key] || "").trim() !== "")
        .map(m => m.key);
      appState.weeklySelectedMateriMap[slotKey] = detected;
      return detected;
    }

    function toggleWeeklyRowMateri(rowId, key) {
      const row = dbStore.laporan_mingguan.find(x => x.id === rowId);
      if (!row) return;
      const slotKey = getWeeklyRowSlotKey(rowId);
      const cur = new Set(getActiveMateriKeysForWeeklyRow(row));
      if (cur.has(key)) {
        cur.delete(key);
        row[key] = "";
      } else {
        cur.add(key);
      }
      appState.weeklySelectedMateriMap[slotKey] = Array.from(cur);
      scheduleAutoSaveLaporanDraft();
      renderApp();
    }

    const LAPORAN_DRAFT_CACHE_KEY = "digenara_laporan_draft_cache_v1";
    let laporanAutoSaveTimer = null;

    function persistLaporanDraftToLocalCache() {
      try {
        localStorage.setItem(
          LAPORAN_DRAFT_CACHE_KEY,
          JSON.stringify({
            laporan_bulanan: dbStore.laporan_bulanan,
            laporan_mingguan: dbStore.laporan_mingguan
          })
        );
      } catch (e) {}
    }

    function restoreLaporanDraftFromLocalCache() {
      try {
        const raw = localStorage.getItem(LAPORAN_DRAFT_CACHE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed?.laporan_bulanan)) {
          parsed.laporan_bulanan.forEach(cachedLap => {
            const idx = dbStore.laporan_bulanan.findIndex(
              l => l.kelompok_id === cachedLap.kelompok_id && Number(l.bulan) === Number(cachedLap.bulan) && Number(l.tahun) === Number(cachedLap.tahun)
            );
            if (idx < 0) {
              dbStore.laporan_bulanan.push(cachedLap);
            } else if (dbStore.laporan_bulanan[idx].status === "Draft" && cachedLap.status === "Draft") {
              dbStore.laporan_bulanan[idx] = { ...dbStore.laporan_bulanan[idx], ...cachedLap };
            }
          });
        }
        if (Array.isArray(parsed?.laporan_mingguan)) {
          parsed.laporan_mingguan.forEach(cachedRow => {
            const idx = dbStore.laporan_mingguan.findIndex(
              w =>
                w.id === cachedRow.id ||
                (w.laporan_id === cachedRow.laporan_id &&
                  w.rombel_id === cachedRow.rombel_id &&
                  Number(w.minggu_ke) === Number(cachedRow.minggu_ke) &&
                  Number(w.pertemuan_ke || 1) === Number(cachedRow.pertemuan_ke || 1))
            );
            if (idx < 0) {
              dbStore.laporan_mingguan.push(cachedRow);
            } else {
              const cur = dbStore.laporan_mingguan[idx];
              const curHasContent = cur.tanggal || cur.tidak_ada_kegiatan || MATERI_OPTIONS_LIST.some(m => String(cur[m.key] || "").trim() !== "");
              const cacheHasContent = cachedRow.tanggal || cachedRow.tidak_ada_kegiatan || MATERI_OPTIONS_LIST.some(m => String(cachedRow[m.key] || "").trim() !== "");
              if (!curHasContent && cacheHasContent) {
                dbStore.laporan_mingguan[idx] = { ...cur, ...cachedRow };
              }
            }
          });
        }
      } catch (e) {}
    }

    function scheduleAutoSaveLaporanDraft() {
      persistLaporanDraftToLocalCache();
      const badge = document.getElementById("laporanAutoSaveBadge");
      if (badge) {
        badge.textContent = "⏳ Menyimpan otomatis...";
      }
      if (laporanAutoSaveTimer) clearTimeout(laporanAutoSaveTimer);
      laporanAutoSaveTimer = setTimeout(async () => {
        if (!appState.currentUser || appState.currentUser.role !== "user") return;
        const uid = appState.currentUser.id;
        const lap = ensureMonthlyReportAndRows(uid, appState.selectedMonth, appState.selectedYear);
        const rows = dbStore.laporan_mingguan.filter(w => w.laporan_id === lap.id);
        if (isLiveSupabase && supabaseClient) {
          await upsertLaporanBulananSafe(lap);
          if (rows.length > 0) {
            await upsertLaporanMingguanSafe(rows);
          }
        }
        persistLaporanDraftToLocalCache();
        const doneBadge = document.getElementById("laporanAutoSaveBadge");
        if (doneBadge) {
          doneBadge.textContent = "✓ Tersimpan otomatis";
        }
      }, 1200);
    }

    async function syncAllJurnalToMonthlyLaporan() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const jurnals = dbStore.jurnal_guru
        .filter(j => {
          const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
          return j.kelompok_id === uid && jm === bulan && jy === tahun && j.rombel_id;
        })
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      if (jurnals.length === 0) {
        showToast(`Belum ada catatan Jurnal Guru pada bulan ${NAMA_BULAN[bulan - 1]} ${tahun} untuk ditarik.`, "warning");
        return;
      }

      let syncedCount = 0;
      for (const j of jurnals) {
        const slot = detectWeekAndSlotForJurnal(uid, j.rombel_id, j.tanggal);
        const ok = await syncJurnalToLaporanKegiatan(j, slot.week, slot.pertemuan);
        if (ok) syncedCount++;
      }

      persistLaporanDraftToLocalCache();
      showToast(`${syncedCount} pertemuan dari Jurnal Guru berhasil disinkronkan ke Laporan Bulanan!`, "success");
      renderApp();
    }

    function applyWholeWeekNoActivity(e) {
      e.preventDefault();
      const reason = document.getElementById("weekHolidayReason")?.value.trim();
      if (!reason) return;
      const uid = appState.currentUser.id;
      const lap = ensureMonthlyReportAndRows(uid, appState.selectedMonth, appState.selectedYear);
      const rows = dbStore.laporan_mingguan.filter(
        w => w.laporan_id === lap.id && w.rombel_id === appState.laporanSelectedRombel && Number(w.minggu_ke) === appState.laporanSelectedWeek
      );
      rows.forEach(r => {
        r.tidak_ada_kegiatan = true;
        r.alasan_kosong = reason;
      });
      closeModal();
      scheduleAutoSaveLaporanDraft();
      showToast(`Minggu ke-${appState.laporanSelectedWeek} ditandai tidak ada kegiatan.`, "info");
      renderApp();
    }

    async function addPertemuanToCurrentWeek() {
      const uid = appState.currentUser.id;
      const lap = ensureMonthlyReportAndRows(uid, appState.selectedMonth, appState.selectedYear);
      const rombelId = appState.laporanSelectedRombel;
      const week = appState.laporanSelectedWeek;

      const existing = dbStore.laporan_mingguan
        .filter(w => w.laporan_id === lap.id && w.rombel_id === rombelId && Number(w.minggu_ke) === week)
        .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));

      if (existing.length >= 7) {
        showToast("Maksimal 7 pertemuan dalam satu minggu.", "warning");
        return;
      }

      const nextPt = existing.length > 0 ? Math.max(...existing.map(r => Number(r.pertemuan_ke || 1))) + 1 : 1;
      const newRow = {
        id: generateUUID(),
        laporan_id: lap.id,
        rombel_id: rombelId,
        minggu_ke: week,
        pertemuan_ke: nextPt,
        tanggal: null,
        pegon: "",
        tajwid: "",
        hafalan: "",
        bacaan: "",
        makna: "",
        lain_lain: "",
        tidak_ada_kegiatan: false,
        alasan_kosong: ""
      };
      dbStore.laporan_mingguan.push(newRow);

      if (isLiveSupabase && supabaseClient) {
        await upsertLaporanBulananSafe(lap);
        await upsertLaporanMingguanSafe([newRow]);
      }
      showToast(`Pertemuan ke-${nextPt} ditambahkan ke Minggu ke-${week}.`, "success");
      renderApp();
    }

    async function removePertemuanRow(rowId) {
      const target = dbStore.laporan_mingguan.find(w => w.id === rowId);
      if (!target) return;
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("laporan_mingguan", "delete", null, { id: rowId });
      }
      dbStore.laporan_mingguan = dbStore.laporan_mingguan.filter(w => w.id !== rowId);
      delete appState.weeklySelectedMateriMap[getWeeklyRowSlotKey(rowId)];
      showToast("Slot pertemuan dihapus.", "info");
      renderApp();
    }

    function updateWeeklyField(rowId, field, value) {
      const row = dbStore.laporan_mingguan.find(x => x.id === rowId);
      if (row) {
        row[field] = value;
        scheduleAutoSaveLaporanDraft();
      }
    }

    function toggleWeeklyNoActivity(rowId, checked) {
      const row = dbStore.laporan_mingguan.find(x => x.id === rowId);
      if (row) {
        row.tidak_ada_kegiatan = checked;
        scheduleAutoSaveLaporanDraft();
        renderApp();
      }
    }

    async function saveLaporanDraft() {
      const uid = appState.currentUser.id;
      const lap = ensureMonthlyReportAndRows(uid, appState.selectedMonth, appState.selectedYear);
      const rows = dbStore.laporan_mingguan.filter(w => w.laporan_id === lap.id);

      persistLaporanDraftToLocalCache();
      if (isLiveSupabase && supabaseClient) {
        const resLap = await upsertLaporanBulananSafe(lap);
        if (resLap.error) {
          showToast("Gagal menyimpan laporan: " + resLap.error.message, "error");
          return;
        }
        if (rows.length > 0) {
          const resRows = await upsertLaporanMingguanSafe(rows);
          if (resRows.error) {
            showToast("Gagal menyimpan rincian mingguan: " + resRows.error.message, "error");
            return;
          }
        }
      }
      showToast("Draft laporan bulanan berhasil disimpan!", "success");
    }

    function submitLaporanBulanan() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const deadlineInfo = getReportDeadlineInfo(bulan, tahun);

      if (deadlineInfo.isPassed && !deadlineInfo.allowLate) {
        showToast(`Batas waktu pelaporan periode ${NAMA_BULAN[bulan - 1]} ${tahun} (${deadlineInfo.formattedDate}) telah berakhir.`, "error");
        return;
      }

      const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
      const rows = dbStore.laporan_mingguan.filter(w => w.laporan_id === lap.id);

      for (const r of rows) {
        if (r.tidak_ada_kegiatan && !String(r.alasan_kosong || "").trim()) {
          showToast(`Alasan kosong wajib diisi untuk ${getRombelName(r.rombel_id)} Minggu ke-${r.minggu_ke} Pertemuan ke-${r.pertemuan_ke || 1}.`, "warning");
          return;
        }
      }

      const confirmMsg = deadlineInfo.isPassed
        ? `Batas pelaporan (${deadlineInfo.formattedDate}) sudah lewat sehingga laporan akan tercatat dengan status TERLAMBAT. Lanjutkan mengirim?`
        : "Laporan bulanan (beserta data presensi & jurnal bulan ini) akan dikirim ke Pengurus Daerah Jepara. Lanjutkan?";

      confirmDialog("Kirim Laporan Bulanan ke Daerah?", confirmMsg, async () => {
        lap.status = "Dikirim";
        lap.terlambat = deadlineInfo.isPassed;
        lap.tanggal_kirim = new Date().toISOString();

        if (isLiveSupabase && supabaseClient) {
          const resLap = await upsertLaporanBulananSafe(lap);
          if (resLap.error) {
            showToast("Gagal mengirim laporan ke server: " + resLap.error.message, "error");
            return;
          }
          if (rows.length > 0) {
            const resRows = await upsertLaporanMingguanSafe(rows);
            if (resRows.error) {
              showToast("Gagal mengirim rincian mingguan ke server: " + resRows.error.message, "error");
              return;
            }
          }
        }

        showToast(
          lap.terlambat
            ? "Laporan bulanan berhasil dikirim (Status: Terlambat)."
            : "Laporan bulanan berhasil dikirim ke Pengurus Daerah Jepara!",
          "success"
        );
        logActivity("Kirim Laporan Bulanan", `Periode ${NAMA_BULAN[bulan - 1]} ${tahun}${lap.terlambat ? " (Terlambat)" : ""}`);
        renderApp();
      }, "Kirim Sekarang");
    }

    async function handleUploadDokumentasi(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const tanggal = document.getElementById("dokTanggal").value;
      const keterangan = document.getElementById("dokKeterangan").value.trim();
      const file = document.getElementById("dokFile").files?.[0];

      if (!file || !keterangan || !tanggal) return;

      const currentCount = dbStore.dokumentasi_kegiatan.filter(d => d.kelompok_id === uid && Number(d.bulan) === bulan && Number(d.tahun) === tahun).length;
      if (currentCount >= APP_CONFIG.MAX_PHOTOS_PER_MONTH) {
        showToast(`Maksimal ${APP_CONFIG.MAX_PHOTOS_PER_MONTH} foto per bulan.`, "warning");
        return;
      }

      try {
        showToast("Mengompres & mengunggah foto...", "info");
        const { blob, dataUrl, sizeKB } = await compressImageFile(file);
        let fotoUrl = dataUrl;
        let filePath = "";

        if (isLiveSupabase && supabaseClient && blob) {
          filePath = `${uid}/${tahun}_${bulan}_${Date.now()}.jpg`;
          const up = await supabaseClient.storage
            .from(APP_CONFIG.STORAGE_BUCKET)
            .upload(filePath, blob, { contentType: "image/jpeg", upsert: true });
          if (up.error) {
            showToast("Gagal upload ke Storage: " + up.error.message, "error");
            return;
          }
          const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(filePath);
          if (pub?.data?.publicUrl) fotoUrl = pub.data.publicUrl;
        }

        const newDoc = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan,
          tahun,
          tanggal,
          keterangan,
          foto_url: fotoUrl,
          file_path: filePath,
          ukuran_kb: sizeKB,
          resolved_url: dataUrl
        };

        if (isLiveSupabase && supabaseClient) {
          const { resolved_url, ...dbPayload } = newDoc;
          const res = await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", dbPayload);
          if (res.error) {
            showToast("Gagal menyimpan metadata foto: " + res.error.message, "error");
            return;
          }
        }

        dbStore.dokumentasi_kegiatan.unshift(newDoc);
        showToast(`Foto berhasil diunggah (${sizeKB} KB)!`, "success");
        logActivity("Unggah Dokumentasi", `${keterangan} (${sizeKB} KB)`);
        renderApp();
      } catch (err) {
        showToast("Gagal memproses foto: " + err.message, "error");
      }
    }

    function deleteDokumentasiItem(id) {
      confirmDialog("Hapus Foto Dokumentasi?", "Foto kegiatan ini akan dihapus permanen.", async () => {
        const target = dbStore.dokumentasi_kegiatan.find(d => d.id === id);
        if (isLiveSupabase && supabaseClient) {
          if (target?.file_path) {
            await supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).remove([target.file_path]);
          }
          const res = await resilientSupabaseMutation("dokumentasi_kegiatan", "delete", null, { id });
          if (res.error) {
            showToast("Gagal menghapus foto: " + res.error.message, "error");
            return;
          }
        }
        dbStore.dokumentasi_kegiatan = dbStore.dokumentasi_kegiatan.filter(d => d.id !== id);
        showToast("Foto dokumentasi dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    function getKendalaCategoryMeta(kategoriVal) {
      return KENDALA_CATEGORY_OPTIONS.find(c => c.value === kategoriVal) || KENDALA_CATEGORY_OPTIONS[5];
    }

    function updateKendalaCategoryHelper(selectedVal) {
      const meta = getKendalaCategoryMeta(selectedVal);
      const textarea = document.getElementById("kenUraian");
      const presetBox = document.getElementById("kenPresetChips");
      if (textarea) {
        textarea.placeholder = meta.placeholder;
      }
      if (presetBox) {
        presetBox.innerHTML = meta.presets.map(txt => `
          <button type="button" onclick="applyKendalaPresetText('${escapeHTML(txt)}')"
            class="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-emerald-50 hover:text-emerald-900 hover:border-emerald-300 border border-slate-200 text-[11px] font-semibold text-slate-700 text-left transition">
            + ${escapeHTML(txt)}
          </button>
        `).join("");
      }
    }

    function applyKendalaPresetText(text) {
      const textarea = document.getElementById("kenUraian");
      if (!textarea) return;
      const cur = textarea.value.trim();
      if (!cur) {
        textarea.value = text;
      } else if (!cur.includes(text)) {
        textarea.value = `${cur}; ${text}`;
      }
      textarea.focus();
    }

    async function handleAddKendala(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const kategoriKendala = document.getElementById("kenKategori")?.value || "Lainnya / Umum";
      const rombelId = document.getElementById("kenRombel").value || null;
      const solusi = document.getElementById("kenSolusi").value.trim();
      const kendala = document.getElementById("kenUraian").value.trim();

      if (!kendala) return;

      const coreRow = {
        id: generateUUID(),
        kelompok_id: uid,
        rombel_id: rombelId,
        bulan,
        tahun,
        kendala,
        solusi,
        created_at: new Date().toISOString()
      };

      const fullRow = {
        ...coreRow,
        kategori_kendala: kategoriKendala
      };

      if (isLiveSupabase && supabaseClient) {
        let res = await resilientSupabaseMutation("kendala_evaluasi", "insert", fullRow);
        if (res.error) {
          res = await resilientSupabaseMutation("kendala_evaluasi", "insert", coreRow);
          if (res.error) {
            showToast("Gagal menyimpan kendala: " + res.error.message, "error");
            return;
          }
        }
      }

      dbStore.kendala_evaluasi.unshift(fullRow);
      saveKendalaExtraCache(fullRow.id, { rombel_id: rombelId, kategori_kendala: kategoriKendala });
      showToast("Catatan kendala & evaluasi disimpan!", "success");
      renderApp();
    }

    function deleteKendalaItem(id) {
      confirmDialog("Hapus Catatan Kendala?", "Catatan evaluasi ini akan dihapus.", async () => {
        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("kendala_evaluasi", "delete", null, { id });
          if (res.error) {
            showToast("Gagal menghapus: " + res.error.message, "error");
            return;
          }
        }
        dbStore.kendala_evaluasi = dbStore.kendala_evaluasi.filter(k => k.id !== id);
        showToast("Catatan dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    async function adminSetAccountStatus(userId, newStatus) {
      const target = dbStore.profiles.find(p => p.id === userId);
      if (!target) return;
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", { status_akun: newStatus }, { id: userId });
        if (res.error) {
          showToast("Gagal mengubah status akun: " + res.error.message, "error");
          return;
        }
      }
      target.status_akun = newStatus;
      showToast(`Status akun ${target.nama_kelompok} diperbarui menjadi ${newStatus}.`, "success");
      logActivity("Ubah Status Akun", `${target.nama_kelompok} → ${newStatus}`);
      renderApp();
    }

    async function adminChangeUserDesa(userId, newDesa) {
      const target = dbStore.profiles.find(p => p.id === userId);
      if (!target) return;
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", { nama_desa: newDesa }, { id: userId });
        if (res.error) {
          showToast("Gagal memperbarui desa: " + res.error.message, "error");
          return;
        }
      }
      target.nama_desa = newDesa;
      showToast(`Desa ${target.nama_kelompok} diatur ke ${newDesa || "Belum Diatur"}.`, "success");
      renderApp();
    }

    function openAdminResetPasswordModal(userId) {
      const target = dbStore.profiles.find(p => p.id === userId);
      if (!target) return;
      openModal(
        `Reset Password — ${target.nama_kelompok}`,
        `
          <form id="formAdminResetPw" onsubmit="executeAdminResetPassword(event, '${userId}')" class="space-y-4">
            <p class="text-xs sm:text-sm text-slate-600">Masukkan password baru minimal 8 karakter untuk akun <strong>@${escapeHTML(target.username)}</strong>.</p>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Password Baru *</label>
              <input id="adminNewUserPw" type="text" required minlength="8" value="GenerusJepara2026" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" />
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formAdminResetPw" class="px-5 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-bold">Simpan Password Baru</button>
        `,
        "max-w-md"
      );
    }

    async function executeAdminResetPassword(e, userId) {
      e.preventDefault();
      const target = dbStore.profiles.find(p => p.id === userId);
      const newPw = document.getElementById("adminNewUserPw").value.trim();
      if (!target || newPw.length < 8) return;

      if (isLiveSupabase && supabaseClient) {
        const res = await supabaseClient.rpc("admin_reset_user_password", { target_user_id: userId, new_password: newPw });
        if (res.error) {
          showToast("Gagal mereset password di server: " + res.error.message, "error");
          return;
        }
      } else {
        target.password_hash = newPw;
      }

      target.reset_requested = false;
      target.reset_note = "";
      closeModal();
      showToast(`Password @${target.username} berhasil direset menjadi: ${newPw}`, "success");
      logActivity("Reset Password Kelompok", `@${target.username}`);
      renderApp();
    }

    function adminDeleteAccount(userId) {
      const target = dbStore.profiles.find(p => p.id === userId);
      if (!target) return;
      confirmDialog(
        "Hapus Akun Kelompok Permanen?",
        `Akun "${target.nama_kelompok}" (@${target.username}) beserta data terkait akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.`,
        async () => {
          if (isLiveSupabase && supabaseClient) {
            const res = await supabaseClient.rpc("admin_delete_user_account", { target_user_id: userId });
            if (res.error) {
              await resilientSupabaseMutation("profiles", "delete", null, { id: userId });
            }
          }
          dbStore.profiles = dbStore.profiles.filter(p => p.id !== userId);
          dbStore.rombel = dbStore.rombel.filter(r => r.kelompok_id !== userId);
          dbStore.peserta = dbStore.peserta.filter(p => p.kelompok_id !== userId);
          dbStore.jurnal_guru = dbStore.jurnal_guru.filter(j => j.kelompok_id !== userId);
          dbStore.presensi = dbStore.presensi.filter(p => p.kelompok_id !== userId);
          dbStore.laporan_bulanan = dbStore.laporan_bulanan.filter(l => l.kelompok_id !== userId);
          showToast(`Akun "${target.nama_kelompok}" telah dihapus permanen.`, "info");
          logActivity("Hapus Akun Kelompok", target.nama_kelompok);
          renderApp();
        },
        "Ya, Hapus Permanen",
        true
      );
    }

    function getFilteredAdminGenerusList() {
      const activeGroupIds = new Set(
        dbStore.profiles.filter(p => p.role === "user" && isAccountActiveStatus(p.status_akun)).map(p => p.id)
      );
      const q = appState.adminGenerusSearch.trim().toLowerCase();

      return dbStore.peserta
        .filter(p => p.aktif && activeGroupIds.has(p.kelompok_id))
        .filter(p => {
          const desa = getKelompokDesa(p.kelompok_id);
          const rombelName = getRombelName(p.rombel_id);
          const matchDesa = appState.adminGenerusFilterDesa === "ALL" || desa === appState.adminGenerusFilterDesa;
          const matchKel = appState.adminGenerusFilterKelompok === "ALL" || p.kelompok_id === appState.adminGenerusFilterKelompok;
          const matchRombel = appState.adminGenerusFilterRombel === "ALL" || rombelName === appState.adminGenerusFilterRombel;
          const matchGender = appState.adminGenerusFilterGender === "ALL" || p.jenis_kelamin === appState.adminGenerusFilterGender;
          const matchQ =
            !q ||
            String(p.nama_peserta || "").toLowerCase().includes(q) ||
            String(p.nama_wali || "").toLowerCase().includes(q) ||
            String(p.pendidikan_sekolah || "").toLowerCase().includes(q) ||
            String(p.alamat || "").toLowerCase().includes(q) ||
            getKelompokName(p.kelompok_id).toLowerCase().includes(q) ||
            rombelName.toLowerCase().includes(q);
          return matchDesa && matchKel && matchRombel && matchGender && matchQ;
        })
        .sort((a, b) => getKelompokDesa(a.kelompok_id).localeCompare(getKelompokDesa(b.kelompok_id)) || getKelompokName(a.kelompok_id).localeCompare(getKelompokName(b.kelompok_id)) || a.nama_peserta.localeCompare(b.nama_peserta));
    }

    function getFilteredAdminGuruList() {
      const activeGroups = dbStore.profiles.filter(p => p.role === "user" && isAccountActiveStatus(p.status_akun));
      activeGroups.forEach(g => getGroupGuruProfiles(g.id));
      const activeGroupIds = new Set(activeGroups.map(g => g.id));
      const q = appState.adminGuruSearch.trim().toLowerCase();

      return dbStore.guru_pengajar
        .filter(g => activeGroupIds.has(g.kelompok_id))
        .filter(g => {
          const desa = getKelompokDesa(g.kelompok_id);
          const matchDesa = appState.adminGuruFilterDesa === "ALL" || desa === appState.adminGuruFilterDesa;
          const matchKel = appState.adminGuruFilterKelompok === "ALL" || g.kelompok_id === appState.adminGuruFilterKelompok;
          const matchKat =
            appState.adminGuruFilterKategori === "ALL" ||
            (appState.adminGuruFilterKategori === "MT" && String(g.kategori || "").includes("MT")) ||
            (appState.adminGuruFilterKategori === "GURU" && String(g.kategori || "").includes("Guru"));
          const matchQ =
            !q ||
            String(g.nama_guru || "").toLowerCase().includes(q) ||
            String(g.kelas_ampu || "").toLowerCase().includes(q) ||
            getKelompokName(g.kelompok_id).toLowerCase().includes(q) ||
            desa.toLowerCase().includes(q);
          return matchDesa && matchKel && matchKat && matchQ;
        })
        .sort((a, b) =>
          getKelompokDesa(a.kelompok_id).localeCompare(getKelompokDesa(b.kelompok_id)) ||
          getKelompokName(a.kelompok_id).localeCompare(getKelompokName(b.kelompok_id)) ||
          String(a.nama_guru || "").localeCompare(String(b.nama_guru || ""))
        );
    }

    function renderAdminAttendanceChartsCard(selKelId, bulan, tahun, pres) {
      const rombels = getGroupRombels(selKelId);
      const total = pres.total || 0;
      const pctH = total > 0 ? Math.round((pres.H / total) * 100) : 0;
      const pctI = total > 0 ? Math.round((pres.I / total) * 100) : 0;
      const pctS = total > 0 ? Math.round((pres.S / total) * 100) : 0;
      const pctA = total > 0 ? Math.max(0, 100 - pctH - pctI - pctS) : 0;

      // Kalkulasi keliling lingkaran SVG Donut (r = 46 -> C = 2 * PI * 46 = 289.03)
      const radius = 46;
      const circumference = 2 * Math.PI * radius;
      const segments = total > 0
        ? [
            { label: "Hadir", count: pres.H, pct: (pres.H / total) * 100, color: "#059669" },
            { label: "Izin", count: pres.I, pct: (pres.I / total) * 100, color: "#0284c7" },
            { label: "Sakit", count: pres.S, pct: (pres.S / total) * 100, color: "#d97706" },
            { label: "Alpha", count: pres.A, pct: (pres.A / total) * 100, color: "#e11d48" }
          ]
        : [];

      let cumulativeDash = 0;
      const donutCircles = segments
        .filter(s => s.count > 0)
        .map(s => {
          const dashLen = (s.pct / 100) * circumference;
          const dashOffset = -cumulativeDash;
          cumulativeDash += dashLen;
          return `
            <circle cx="60" cy="60" r="${radius}" fill="transparent"
              stroke="${s.color}" stroke-width="14"
              stroke-dasharray="${dashLen.toFixed(2)} ${circumference.toFixed(2)}"
              stroke-dashoffset="${dashOffset.toFixed(2)}"
              stroke-linecap="butt" />
          `;
        })
        .join("");

      const classStats = rombels.map(r => {
        const s = calculatePresensiSummary(selKelId, bulan, tahun, r.id);
        const santriCnt = dbStore.peserta.filter(p => p.kelompok_id === selKelId && p.rombel_id === r.id && p.aktif).length;
        return {
          id: r.id,
          name: r.nama_rombel,
          santriCnt,
          ...s
        };
      });

      // Tren kehadiran harian per tanggal pertemuan pada bulan aktif
      const dailyTrend = (pres.uniqueDates || []).map(tgl => {
        const dRecs = dbStore.presensi.filter(p => p.kelompok_id === selKelId && p.tanggal === tgl);
        const hCnt = dRecs.filter(r => r.status === "H").length;
        const totCnt = dRecs.length;
        const pct = totCnt > 0 ? Math.round((hCnt / totCnt) * 100) : 0;
        const dayNum = String(tgl).split("-")[2] || tgl;
        return { tgl, dayNum, hCnt, totCnt, pct };
      });

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
            <div>
              <h3 class="font-extrabold text-slate-900 text-sm sm:text-base">📊 Grafik Kehadiran Santri (${NAMA_BULAN[bulan - 1]} ${tahun})</h3>
              <p class="text-xs text-slate-500">Visualisasi komposisi kehadiran dan perbandingan persentase hadir tiap kelas</p>
            </div>
            <span class="px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs font-extrabold">
              Total ${pres.total} Catatan • ${pres.uniqueDates.length} Hari Pertemuan
            </span>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
            <!-- Kiri: Donut Chart Komposisi Kehadiran -->
            <div class="lg:col-span-5 flex flex-col sm:flex-row lg:flex-col xl:flex-row items-center gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-200/80">
              <div class="relative w-32 h-32 shrink-0 flex items-center justify-center">
                <svg viewBox="0 0 120 120" class="w-32 h-32 -rotate-90">
                  <circle cx="60" cy="60" r="${radius}" fill="transparent" stroke="#e2e8f0" stroke-width="14" />
                  ${donutCircles}
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                  <span class="text-2xl font-extrabold text-slate-900 leading-none">${pctH}%</span>
                  <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-700 mt-1">Hadir</span>
                </div>
              </div>

              <div class="flex-1 w-full grid grid-cols-2 gap-2">
                <div class="p-2.5 rounded-xl bg-white border border-emerald-200">
                  <div class="flex items-center gap-1.5 text-[11px] font-bold text-emerald-800">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span><span>Hadir (H)</span>
                  </div>
                  <div class="text-base font-extrabold text-slate-900 mt-0.5">${pres.H} <span class="text-xs font-semibold text-emerald-700">(${pctH}%)</span></div>
                </div>
                <div class="p-2.5 rounded-xl bg-white border border-sky-200">
                  <div class="flex items-center gap-1.5 text-[11px] font-bold text-sky-800">
                    <span class="w-2.5 h-2.5 rounded-full bg-sky-600"></span><span>Izin (I)</span>
                  </div>
                  <div class="text-base font-extrabold text-slate-900 mt-0.5">${pres.I} <span class="text-xs font-semibold text-sky-700">(${pctI}%)</span></div>
                </div>
                <div class="p-2.5 rounded-xl bg-white border border-amber-200">
                  <div class="flex items-center gap-1.5 text-[11px] font-bold text-amber-800">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span><span>Sakit (S)</span>
                  </div>
                  <div class="text-base font-extrabold text-slate-900 mt-0.5">${pres.S} <span class="text-xs font-semibold text-amber-700">(${pctS}%)</span></div>
                </div>
                <div class="p-2.5 rounded-xl bg-white border border-rose-200">
                  <div class="flex items-center gap-1.5 text-[11px] font-bold text-rose-800">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-600"></span><span>Alpha (A)</span>
                  </div>
                  <div class="text-base font-extrabold text-slate-900 mt-0.5">${pres.A} <span class="text-xs font-semibold text-rose-700">(${pctA}%)</span></div>
                </div>
              </div>
            </div>

            <!-- Kanan: Grafik Batang Horizontal Perbandingan Kelas / Rombel -->
            <div class="lg:col-span-7 space-y-3">
              <div class="text-xs font-extrabold text-slate-700 uppercase tracking-wider">Persentase Kehadiran Per Kelas / Rombel</div>
              ${classStats.length === 0 ? `
                <div class="p-6 rounded-2xl bg-slate-50 border border-slate-200 text-center text-xs text-slate-400">
                  Belum ada kelas pengajian terdaftar pada kelompok ini.
                </div>
              ` : `
                <div class="space-y-2.5">
                  ${classStats.map(cs => {
                    const barColor = cs.total === 0
                      ? "bg-slate-300"
                      : cs.pctH >= 80
                      ? "bg-emerald-600"
                      : cs.pctH >= 60
                      ? "bg-amber-500"
                      : "bg-rose-500";
                    const textColor = cs.total === 0
                      ? "text-slate-400"
                      : cs.pctH >= 80
                      ? "text-emerald-700"
                      : cs.pctH >= 60
                      ? "text-amber-700"
                      : "text-rose-700";
                    return `
                      <div class="p-2.5 rounded-xl bg-slate-50/80 border border-slate-200/80 space-y-1.5">
                        <div class="flex items-center justify-between gap-2 text-xs">
                          <div class="font-bold text-slate-900 truncate">
                            ${escapeHTML(cs.name)} <span class="font-normal text-slate-500">(${cs.santriCnt} santri)</span>
                          </div>
                          <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[11px] text-slate-500">H:${cs.H} I:${cs.I} S:${cs.S} A:${cs.A}</span>
                            <span class="font-extrabold ${textColor} w-10 text-right">${cs.total > 0 ? cs.pctH + "%" : "-"}</span>
                          </div>
                        </div>
                        <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                          <div class="h-full ${barColor} rounded-full transition-all duration-500" style="width: ${cs.total > 0 ? Math.max(4, cs.pctH) : 0}%"></div>
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
              `}
            </div>
          </div>

          ${dailyTrend.length > 0 ? `
            <div class="pt-3 border-t border-slate-100 space-y-2">
              <div class="flex items-center justify-between text-xs">
                <span class="font-extrabold text-slate-700">📈 Grafik Kehadiran Per Tanggal Pertemuan</span>
                <span class="text-slate-400">Hover / ketuk batang untuk detail tanggal</span>
              </div>
              <div class="flex items-end gap-1.5 sm:gap-2 h-28 pt-5 px-3 pb-2 bg-slate-50 rounded-2xl border border-slate-200/70 overflow-x-auto">
                ${dailyTrend.map(dt => `
                  <div title="${formatTanggalID(dt.tgl)}: ${dt.hCnt}/${dt.totCnt} Hadir (${dt.pct}%)"
                    class="flex-1 min-w-[28px] max-w-[46px] h-full flex flex-col items-center justify-end gap-1">
                    <span class="text-[10px] font-extrabold text-slate-700">${dt.pct}%</span>
                    <div class="w-full rounded-t-lg transition-all ${dt.pct >= 80 ? 'bg-emerald-600' : dt.pct >= 60 ? 'bg-amber-500' : 'bg-rose-500'}"
                      style="height: ${Math.max(10, dt.pct)}%"></div>
                    <span class="text-[10px] font-bold text-slate-500">Tgl ${escapeHTML(dt.dayNum)}</span>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function openAdminReviewModal(kelompokId) {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const lap = ensureMonthlyReportAndRows(kelompokId, bulan, tahun);
      openModal(
        `Verifikasi Laporan — ${getKelompokName(kelompokId)}`,
        `
          <form id="formAdminReview" onsubmit="saveAdminReview(event, '${kelompokId}')" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Keputusan Status Laporan *</label>
              <select id="revStatus" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold bg-white">
                <option value="Disetujui" ${lap.status === "Disetujui" ? "selected" : ""}>✅ Disetujui (Diterima Daerah)</option>
                <option value="Perlu Revisi" ${lap.status === "Perlu Revisi" ? "selected" : ""}>⚠️ Perlu Revisi (Kembalikan ke Kelompok)</option>
                <option value="Dikirim" ${lap.status === "Dikirim" ? "selected" : ""}>📨 Dikirim (Menunggu Review)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Catatan / Evaluasi Pengurus Daerah</label>
              <textarea id="revKomentar" rows="3" placeholder="Tuliskan apresiasi atau bagian laporan yang perlu dilengkapi..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm">${escapeHTML(lap.komentar_admin || "")}</textarea>
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formAdminReview" class="px-5 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-bold">Simpan Hasil Verifikasi</button>
        `,
        "max-w-lg"
      );
    }

    async function saveAdminReview(e, kelompokId) {
      e.preventDefault();
      const lap = ensureMonthlyReportAndRows(kelompokId, appState.selectedMonth, appState.selectedYear);
      lap.status = document.getElementById("revStatus").value;
      lap.komentar_admin = document.getElementById("revKomentar").value.trim();

      if (isLiveSupabase && supabaseClient) {
        const res = await upsertLaporanBulananSafe(lap);
        if (res.error) {
          showToast("Gagal menyimpan verifikasi: " + res.error.message, "error");
          return;
        }
      }

      closeModal();
      showToast(`Status laporan ${getKelompokName(kelompokId)} diperbarui menjadi "${lap.status}".`, "success");
      logActivity("Verifikasi Laporan", `${getKelompokName(kelompokId)} → ${lap.status}`);
      renderApp();
    }

    function exportAdminRekapExcel() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const activeGroups = dbStore.profiles.filter(p => p.role === "user" && isAccountActiveStatus(p.status_akun));
      const rows = activeGroups.map((g, i) => {
        const genCnt = dbStore.peserta.filter(p => p.kelompok_id === g.id && p.aktif).length;
        const jurCnt = dbStore.jurnal_guru.filter(j => {
          const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
          return j.kelompok_id === g.id && jm === bulan && jy === tahun;
        }).length;
        const pres = calculatePresensiSummary(g.id, bulan, tahun);
        const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === g.id && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
        return {
          No: i + 1,
          Desa: g.nama_desa || "-",
          Kelompok: g.nama_kelompok,
          "Jumlah Generus": genCnt,
          "Jurnal Pertemuan": jurCnt,

          Sakit: pres.S,
          Alpha: pres.A,
          "Persentase Hadir": `${pres.pctH}%`,
          "Status Laporan": lap?.status || "Belum Kirim"
        };
      });
      exportToExcelFile(rows, "Rekap_Daerah", `Rekap_Daerah_Jepara_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
    }

                  <select id="inlineAllowLate" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm font-semibold bg-white">
                    <option value="true" ${APP_CONFIG.ALLOW_LATE_REPORT ? "selected" : ""}>Tetap Terima (Tandai 'Terlambat')</option>
                    <option value="false" ${!APP_CONFIG.ALLOW_LATE_REPORT ? "selected" : ""}>Kunci Pengiriman Otomatis</option>
                  </select>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs sm:text-sm">
                  Simpan Pengaturan Batas Waktu
                </button>
              </form>
            </div>

            <!-- Form Pengumuman Baru -->
            <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
              <div>
                <h3 class="font-extrabold text-slate-900 text-base">📢 Terbitkan Pengumuman Daerah Baru</h3>
                <p class="text-xs text-slate-500 mt-0.5">Pengumuman langsung muncul di Beranda seluruh akun kelompok</p>
              </div>
              <form onsubmit="handleCreatePengumuman(event)" class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Judul Pengumuman *</label>
                  <input id="annJudul" type="text" required placeholder="Contoh: Jadwal Musyawarah Guru PPG Daerah Jepara" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Isi Pengumuman *</label>
                  <textarea id="annIsi" rows="3" required placeholder="Tuliskan informasi lengkap untuk pengurus & guru kelompok..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
                </div>
                <div class="flex justify-end">
                  <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs sm:text-sm shadow-sm">
                    📢 Publikasikan Pengumuman
                  </button>
                </div>
              </form>
            </div>
          </div>

          <div class="space-y-3">
            <h3 class="font-extrabold text-slate-900 text-base">Daftar Pengumuman Aktif (${dbStore.pengumuman.length})</h3>
            ${dbStore.pengumuman.map(ann => `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex items-start justify-between gap-3">
                <div>
                  <div class="font-extrabold text-slate-900 text-sm sm:text-base">${escapeHTML(ann.judul)}</div>
                  <div class="text-xs text-slate-400 mt-0.5">${formatDateTimeWIB(ann.created_at)}</div>
                  <p class="text-xs sm:text-sm text-slate-700 mt-1.5 leading-relaxed">${escapeHTML(ann.isi)}</p>
                </div>
                <button type="button" onclick="deletePengumumanItem('${ann.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold shrink-0">
                  Hapus
                </button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    async function handleCreatePengumuman(e) {
      e.preventDefault();
      const judul = document.getElementById("annJudul").value.trim();
      const isi = document.getElementById("annIsi").value.trim();
      if (!judul || !isi) return;

      const newAnn = {
        id: generateUUID(),
        judul,
        isi,
        penting: true,
        created_at: new Date().toISOString()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengumuman", "insert", newAnn);
        if (res.error) {
          showToast("Gagal menerbitkan pengumuman: " + res.error.message, "error");
          return;
        }
      }

      dbStore.pengumuman.unshift(newAnn);
      deviceNotifState.seenAnnouncementIds.push(newAnn.id);
      persistDeviceNotifState();
      await broadcastRealtimeEvent("new_announcement", newAnn);
      showToast("Pengumuman berhasil dipublikasikan ke seluruh perangkat!", "success");
      logActivity("Terbitkan Pengumuman", judul);
      renderApp();
    }

    function deletePengumumanItem(id) {
      confirmDialog("Hapus Pengumuman?", "Pengumuman ini akan dihapus dari beranda semua akun.", async () => {
        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("pengumuman", "delete", null, { id });
          if (res.error) {
            showToast("Gagal menghapus pengumuman: " + res.error.message, "error");
            return;
          }
        }
        dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
        showToast("Pengumuman dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    // ============================================================================
    // CACHE LOKAL FIELD TAMBAHAN (FALLBACK JIKA KOLOM OPTIONAL BELUM ADA DI DB)
    // ============================================================================
    const PESERTA_EXTRA_STORAGE_KEY = "digenara_peserta_extra_v1";
    const KENDALA_EXTRA_STORAGE_KEY = "digenara_kendala_extra_v1";

    function loadPesertaExtraCache() {
      try {
        return JSON.parse(localStorage.getItem(PESERTA_EXTRA_STORAGE_KEY) || "{}") || {};
      } catch (e) {
        return {};
      }
    }

    function savePesertaExtraCache(pesertaId, extraObj) {
      if (!pesertaId) return;
      try {
        const cache = loadPesertaExtraCache();
        cache[pesertaId] = { ...(cache[pesertaId] || {}), ...extraObj };
        localStorage.setItem(PESERTA_EXTRA_STORAGE_KEY, JSON.stringify(cache));
      } catch (e) {}
    }

    function mergePesertaExtraFields() {
      const cache = loadPesertaExtraCache();
      dbStore.peserta.forEach(p => {
        const ext = cache[p.id];
        if (ext) {
          if (!p.tempat_lahir && ext.tempat_lahir) p.tempat_lahir = ext.tempat_lahir;
          if (!p.tanggal_lahir && ext.tanggal_lahir) p.tanggal_lahir = ext.tanggal_lahir;
          if (!p.pendidikan_sekolah && ext.pendidikan_sekolah) p.pendidikan_sekolah = ext.pendidikan_sekolah;
          if (!p.nama_wali && ext.nama_wali) p.nama_wali = ext.nama_wali;
          if (!p.no_wa_wali && ext.no_wa_wali) p.no_wa_wali = ext.no_wa_wali;
          if (!p.alamat && ext.alamat) p.alamat = ext.alamat;
          if (!p.jenjang_usia && ext.jenjang_usia) p.jenjang_usia = ext.jenjang_usia;
        }
      });
    }

    function loadKendalaExtraCache() {
      try {
        return JSON.parse(localStorage.getItem(KENDALA_EXTRA_STORAGE_KEY) || "{}") || {};
      } catch (e) {
        return {};
      }
    }

    function saveKendalaExtraCache(kendalaId, extraObj) {
      if (!kendalaId) return;
      try {
        const cache = loadKendalaExtraCache();
        cache[kendalaId] = { ...(cache[kendalaId] || {}), ...extraObj };
        localStorage.setItem(KENDALA_EXTRA_STORAGE_KEY, JSON.stringify(cache));
      } catch (e) {}
    }

    function mergeKendalaExtraFields() {
      const cache = loadKendalaExtraCache();
      dbStore.kendala_evaluasi.forEach(k => {
        const ext = cache[k.id];
        if (ext) {
          if (!k.rombel_id && ext.rombel_id) k.rombel_id = ext.rombel_id;
          if (!k.kategori_kendala && ext.kategori_kendala) k.kategori_kendala = ext.kategori_kendala;
        }
      });
    }

    // ============================================================================
    // INISIALISASI AWAL APLIKASI
    // ============================================================================
    mergePesertaExtraFields();
    mergeKendalaExtraFields();
    mergeGuruPengajarCache();
    restoreLaporanDraftFromLocalCache();
    initBrandingIconsAndManifest();
    renderApp();
    restoreSupabaseSession();
  </script>
</body>
</html>
