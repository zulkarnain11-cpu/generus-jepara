    function deleteRombelItem(rombelId) {
      const uid = appState.currentUser.id;
      const rombel = dbStore.rombel.find(r => r.id === rombelId);
      if (!rombel) return;
      const santriCount = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif).length;
      const warnMsg = santriCount > 0
        ? `Kelas "${rombel.nama_rombel}" memiliki ${santriCount} santri terdaftar. Menghapus kelas ini juga akan menghapus data santri dan presensi di kelas tersebut. Lanjutkan?`
        : `Kelas "${rombel.nama_rombel}" akan dihapus dari daftar rombel kelompok Anda. Lanjutkan?`;

      confirmDialog("Hapus Kelas / Rombel?", warnMsg, async () => {
        if (isLiveSupabase && supabaseClient) {
          await resilientSupabaseMutation("presensi", "delete", null, { rombel_id: rombelId });
          await resilientSupabaseMutation("peserta", "delete", null, { rombel_id: rombelId });
          await resilientSupabaseMutation("laporan_mingguan", "delete", null, { rombel_id: rombelId });
          const res = await resilientSupabaseMutation("rombel", "delete", null, { id: rombelId });
          if (res.error) {
            showToast("Gagal menghapus kelas/rombel: " + res.error.message, "error");
            return;
          }
        }
        dbStore.presensi = dbStore.presensi.filter(p => p.rombel_id !== rombelId);
        dbStore.peserta = dbStore.peserta.filter(p => p.rombel_id !== rombelId);
        dbStore.laporan_mingguan = dbStore.laporan_mingguan.filter(w => w.rombel_id !== rombelId);
        dbStore.rombel = dbStore.rombel.filter(r => r.id !== rombelId);

        const remaining = getGroupRombels(uid);
        appState.presensiSelectedRombel = remaining[0]?.id || "";
        if (appState.laporanSelectedRombel === rombelId) {
          appState.laporanSelectedRombel = remaining[0]?.id || "";
        }
        showToast(`Kelas "${rombel.nama_rombel}" berhasil dihapus.`, "info");
        renderApp();
      }, "Hapus Kelas", true);
    }

    const PESERTA_EXTRA_STORAGE_KEY = "digenara_peserta_extra_v1";

    function getPesertaExtraCache() {
      try {
        const raw = localStorage.getItem(PESERTA_EXTRA_STORAGE_KEY);
        return raw ? JSON.parse(raw) || {} : {};
      } catch (e) {
        return {};
      }
    }

    function savePesertaExtraCacheItem(id, extraObj) {
      if (!id) return;
      try {
        const map = getPesertaExtraCache();
        map[id] = {
          ...(map[id] || {}),
          nama_desa: extraObj.nama_desa || "",
          kelompok_asal: extraObj.kelompok_asal || "",
          tempat_lahir: extraObj.tempat_lahir || "",
          tanggal_lahir: extraObj.tanggal_lahir || "",
          nama_wali: extraObj.nama_wali || ""
        };
        localStorage.setItem(PESERTA_EXTRA_STORAGE_KEY, JSON.stringify(map));
      } catch (e) {}
    }

    function mergePesertaExtraFields() {
      const cache = getPesertaExtraCache();
      dbStore.peserta.forEach(p => {
        const saved = cache[p.id];
        if (saved) {
          if (!p.nama_desa && saved.nama_desa) p.nama_desa = saved.nama_desa;
          if (!p.kelompok_asal && saved.kelompok_asal) p.kelompok_asal = saved.kelompok_asal;
          if (!p.tempat_lahir && saved.tempat_lahir) p.tempat_lahir = saved.tempat_lahir;
          if (!p.tanggal_lahir && saved.tanggal_lahir) p.tanggal_lahir = saved.tanggal_lahir;
          if (!p.nama_wali && saved.nama_wali) p.nama_wali = saved.nama_wali;
        }
      });
    }

    function formatSantriTTL(p) {
      if (!p) return "-";
      const tempat = String(p.tempat_lahir || "").trim();
      const tglRaw = String(p.tanggal_lahir || "").trim();
      const tglFormatted = tglRaw ? formatTanggalID(tglRaw) : "";
      if (tempat && tglFormatted && tglFormatted !== "-") {
        return `${tempat}, ${tglFormatted}`;
      }
      if (tempat) return tempat;
      if (tglFormatted && tglFormatted !== "-") return tglFormatted;
      if (p.ttl && String(p.ttl).trim()) return String(p.ttl).trim();
      return "-";
    }

        if (!newClassName) {
          showToast("Masukkan nama kelas / rombel baru terlebih dahulu.", "warning");
          return;
        }

        const existingRombels = getGroupRombels(uid);
        const existingMatch = existingRombels.find(r => String(r.nama_rombel || "").trim().toLowerCase() === newClassName.toLowerCase());
        if (existingMatch) {
          resolvedRombelId = existingMatch.id;
        } else {
          const customFreq = resolvedRombelId === "__ADD_NEW_CLASS__"
            ? Math.min(7, Math.max(1, parseInt(document.getElementById("pNewRombelFreq")?.value, 10) || (isMudaMudiRombel(newClassName) ? 2 : 5)))
            : (isMudaMudiRombel(newClassName) ? 2 : 5);

          const newRombelRow = {
            id: generateUUID(),
            kelompok_id: uid,
            nama_rombel: newClassName,
            pertemuan_per_minggu: customFreq,
            urutan: existingRombels.length + 1
          };
          if (isLiveSupabase && supabaseClient) {
            const rRes = await resilientSupabaseMutation("rombel", "insert", newRombelRow);
            if (rRes.error) {
              showToast("Gagal membuat kelas/rombel baru: " + rRes.error.message, "error");
              return;
            }
          }
          dbStore.rombel.push(newRombelRow);
          resolvedRombelId = newRombelRow.id;
          showToast(`Kelas "${newClassName}" otomatis ditambahkan!`, "info");
        }
      }

      const tempatLahir = document.getElementById("pTempatLahir")?.value.trim() || "";
      const tanggalLahir = document.getElementById("pTanggalLahir")?.value.trim() || "";
      const namaWali = document.getElementById("pNamaWali")?.value.trim() || "";
      const autoDesa = String(appState.currentUser?.nama_desa || document.getElementById("pDesa")?.value || "").trim();
      const autoKelompok = String(appState.currentUser?.nama_kelompok || document.getElementById("pKelompokAsal")?.value || "").trim();

      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        rombel_id: resolvedRombelId,
        nama_peserta: nama,
        nama_desa: autoDesa,
        kelompok_asal: autoKelompok,
        jenis_kelamin: document.getElementById("pGender").value,
        tempat_lahir: tempatLahir,
        tanggal_lahir: tanggalLahir || null,
        nama_wali: namaWali,
        no_wa_wali: document.getElementById("pWa").value.trim(),
        aktif: true
      };

      savePesertaExtraCacheItem(payload.id, payload);

      if (isLiveSupabase && supabaseClient) {
        let res = editId
          ? await resilientSupabaseMutation("peserta", "update", payload, { id: editId })
          : await resilientSupabaseMutation("peserta", "insert", payload);
        if (res.error) {
          const corePayload = {
            id: payload.id,
            kelompok_id: payload.kelompok_id,
            rombel_id: payload.rombel_id,
            nama_peserta: payload.nama_peserta,
            jenis_kelamin: payload.jenis_kelamin,
            no_wa_wali: payload.no_wa_wali,
            aktif: payload.aktif
          };
          res = editId
            ? await resilientSupabaseMutation("peserta", "update", corePayload, { id: editId })
            : await resilientSupabaseMutation("peserta", "insert", corePayload);
          if (res.error) {
            showToast("Gagal menyimpan data santri: " + res.error.message, "error");
            return;
          }
        }
      }

      if (editId) {
        const idx = dbStore.peserta.findIndex(p => p.id === editId);
        if (idx >= 0) dbStore.peserta[idx] = { ...dbStore.peserta[idx], ...payload };
      } else {
        dbStore.peserta.push(payload);
      }

      closeModal();
      showToast("Data santri berhasil disimpan!", "success");
      renderApp();
    }

    async function processExcelSantriImport() {
      const fileInput = document.getElementById("excelSantriFile");
      const file = fileInput?.files?.[0];
      if (!file) {
        showToast("Pilih file Excel terlebih dahulu.", "warning");
        return;
      }
      if (!window.XLSX) {
        showToast("Library pembaca Excel belum termuat. Periksa koneksi internet.", "error");
        return;
      }

      try {
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const jsonRows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

        if (!jsonRows || jsonRows.length === 0) {
          showToast("File Excel kosong.", "warning");
          return;
        }

        const uid = appState.currentUser.id;
        const rombels = getGroupRombels(uid);
        const defaultRombelId = appState.presensiSelectedRombel || rombels[0]?.id || "";
        const newRecords = [];

        jsonRows.forEach(row => {
          const nama = String(row["Nama Santri"] || row["Nama"] || row["nama_peserta"] || "").trim();
          if (!nama) return;
          const jkRaw = String(row["Jenis Kelamin (L/P)"] || row["Jenis Kelamin"] || row["JK"] || "L").trim().toUpperCase();
          const jk = jkRaw.startsWith("P") ? "P" : "L";
          const kelasRaw = String(row["Kelas / Rombel"] || row["Kelas"] || "").trim();
          let targetRombelId = defaultRombelId;
          if (kelasRaw) {
            const foundR = rombels.find(r => r.nama_rombel.toLowerCase() === kelasRaw.toLowerCase());
            if (foundR) targetRombelId = foundR.id;
          }
          const tempatLahir = String(row["Tempat Lahir"] || row["tempat_lahir"] || "").trim();
          const tglLahirRaw = String(row["Tanggal Lahir (YYYY-MM-DD)"] || row["Tanggal Lahir"] || row["tanggal_lahir"] || "").trim();
          const namaWali = String(row["Nama Wali"] || row["Wali"] || row["nama_wali"] || "").trim();
          const wa = String(row["No WA Wali"] || row["No WA"] || row["WA"] || "").trim();

          const rec = {
            id: generateUUID(),
            kelompok_id: uid,
            rombel_id: targetRombelId,
            nama_peserta: nama,
            nama_desa: appState.currentUser?.nama_desa || "",
            kelompok_asal: appState.currentUser?.nama_kelompok || "",
            jenis_kelamin: jk,
            tempat_lahir: tempatLahir,
            tanggal_lahir: tglLahirRaw || null,
            nama_wali: namaWali,
            no_wa_wali: wa,
            aktif: true
          };
          savePesertaExtraCacheItem(rec.id, rec);
          newRecords.push(rec);
        });

        if (newRecords.length === 0) {
          showToast("Tidak ada baris santri valid ditemukan di Excel.", "warning");
          return;
        }

        if (isLiveSupabase && supabaseClient) {
          let res = await resilientSupabaseMutation("peserta", "insert", newRecords);
          if (res.error) {
            const coreRecords = newRecords.map(r => ({
              id: r.id,
              kelompok_id: r.kelompok_id,
              rombel_id: r.rombel_id,
              nama_peserta: r.nama_peserta,
              jenis_kelamin: r.jenis_kelamin,
              no_wa_wali: r.no_wa_wali,
              aktif: r.aktif
            }));
            res = await resilientSupabaseMutation("peserta", "insert", coreRecords);
            if (res.error) {
              showToast("Gagal mengimpor santri ke database: " + res.error.message, "error");
              return;
            }
          }
        }

        dbStore.peserta.push(...newRecords);
        closeModal();
        showToast(`${newRecords.length} data santri berhasil diimpor!`, "success");
        logActivity("Impor Excel Santri", `Mengimpor ${newRecords.length} santri`);
        renderApp();
      } catch (err) {
        showToast("Gagal membaca file Excel: " + err.message, "error");
      }
    }

    function exportPresensiExcel() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.presensiSelectedRombel;
      const rombelName = getRombelName(rombelId);
      const kelompokName = appState.currentUser.nama_kelompok;
      const desaName = appState.currentUser.nama_desa || "-";
      const bulanLabel = `${NAMA_BULAN[bulan - 1]} ${tahun}`;

      const matrix = buildDailyAttendanceRecapMatrix(uid, rombelId, bulan, tahun);
      if (matrix.studentRows.length === 0) {
        showToast("Tidak ada data santri pada kelas ini untuk diekspor.", "warning");
        return;
      }

      try {
        if (window.XLSX) {
          const aoa = [
            ["PENGGERAK PEMBINA GENERUS (PPG) SAK JAGAT RAT DAERAH JEPARA"],
            [`${kelompokName.toUpperCase()} (${desaName})`],
            [`Rekap Presensi ${bulanLabel}`],
            [],
            ["Kelompok / Satuan", `: ${kelompokName}`],
            ["Kelas / Rombel", `: ${rombelName}`],
            ["Bulan", `: ${bulanLabel}`],
            ["Hari terabsen", `: ${matrix.hariTerabsen} hari`],
            [],
            [
              "No",
              "Nama Santri / Generus",
              ...matrix.daysArray.map(d => String(d)),
              "H",
              "S",
              "I",
              "A",
              "%"
            ]
          ];

          matrix.studentRows.forEach(st => {
            aoa.push([
              st.no,
              st.nama,
              ...matrix.daysArray.map(d => st.dayMap[d] || ""),
              st.H,
              st.S,
              st.I,
              st.A,
              st.pct
            ]);
          });

          const ws = XLSX.utils.aoa_to_sheet(aoa);
          const totalCols = matrix.daysInMonth + 7;
          ws["!merges"] = [
            { s: { r: 0, c: 0 }, e: { r: 0, c: totalCols - 1 } },
            { s: { r: 1, c: 0 }, e: { r: 1, c: totalCols - 1 } },
            { s: { r: 2, c: 0 }, e: { r: 2, c: totalCols - 1 } }
          ];
          ws["!cols"] = [
            { wch: 5 },
            { wch: 28 },
            ...matrix.daysArray.map(() => ({ wch: 4 })),
            { wch: 5 },
            { wch: 5 },
            { wch: 5 },
            { wch: 5 },
            { wch: 6 }
          ];

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, `Rekap_${rombelName}`.slice(0, 31));
          const safeFileName = `Rekap_Presensi_${rombelName.replace(/[^a-zA-Z0-9_-]/g, "_")}_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`;
          XLSX.writeFile(wb, safeFileName);
          showToast(`File Excel "${safeFileName}" berhasil diunduh!`, "success");
        } else {
          const rows = matrix.studentRows.map(st => {
            const obj = { No: st.no, "Nama Santri": st.nama };
            matrix.daysArray.forEach(d => { obj[String(d)] = st.dayMap[d] || ""; });
            obj.H = st.H;
            obj.S = st.S;
            obj.I = st.I;
            obj.A = st.A;
            obj["%"] = st.pct;
            return obj;
          });
          exportToExcelFile(rows, "Rekap_Presensi", `Rekap_Presensi_${rombelName}_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
        }
      } catch (err) {
        showToast("Gagal mengekspor Excel presensi: " + err.message, "error");
      }
    }

    function ensureMonthlyReportAndRows(uid, bulan, tahun) {
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan,
          tahun,
          status: "Draft",
          terlambat: false,
          tanggal_kirim: null,
          komentar_admin: ""
        };
        dbStore.laporan_bulanan.push(lap);
      }

      const rombels = getGroupRombels(uid);
      rombels.forEach(r => {
        const ptCount = Math.min(7, Math.max(1, Number(r.pertemuan_per_minggu) || (isMudaMudiRombel(r.nama_rombel) ? 2 : 5)));
        [1, 2, 3, 4, 5].forEach(w => {
          for (let p = 1; p <= ptCount; p++) {
            const exists = dbStore.laporan_mingguan.find(
              row => row.laporan_id === lap.id && row.rombel_id === r.id && Number(row.minggu_ke) === w && Number(row.pertemuan_ke || 1) === p
            );
            if (!exists) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: p,
                tanggal: "",
                pegon: "",
                bacaan: "",
                tajwid: "",
                hafalan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan: "",
                keterangan: ""
              });
            }
          }
        });
      });
      return lap;
    }

    function getActiveMateriKeysForRow(row) {
      if (!row) return [];
      const filledKeys = MATERI_OPTIONS_LIST.filter(m => String(row[m.key] || "").trim() !== "").map(m => m.key);
      if (Array.isArray(appState.weeklySelectedMateriMap[row.id])) {
        const combined = new Set([...filledKeys, ...appState.weeklySelectedMateriMap[row.id]]);
        return MATERI_OPTIONS_LIST.map(m => m.key).filter(k => combined.has(k));
      }
      appState.weeklySelectedMateriMap[row.id] = filledKeys;
      return filledKeys;
    }

    function toggleWeeklyMateriOption(rowId, key) {
      const row = dbStore.laporan_mingguan.find(r => r.id === rowId);
      if (!row) return;
      const current = new Set(getActiveMateriKeysForRow(row));
      if (current.has(key)) {
        current.delete(key);
        row[key] = "";
      } else {
        current.add(key);
      }
      appState.weeklySelectedMateriMap[rowId] = MATERI_OPTIONS_LIST.map(m => m.key).filter(k => current.has(k));
      renderApp();
    }

    function updateWeeklyRowField(rowId, field, value) {
      const row = dbStore.laporan_mingguan.find(r => r.id === rowId);
      if (row) {
        row[field] = value;
      }
    }

    function toggleWeeklyNoActivity(rowId, checked) {
      const row = dbStore.laporan_mingguan.find(r => r.id === rowId);
      if (row) {
        row.tidak_ada_kegiatan = checked;
        if (checked) {
          row.pegon = "";
          row.bacaan = "";
          row.tajwid = "";
          row.hafalan = "";
          row.makna = "";
          row.lain_lain = "";
          appState.weeklySelectedMateriMap[rowId] = [];
        }
        renderApp();
      }
    }

    async function saveMonthlyReport(silent = false) {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
      const rows = dbStore.laporan_mingguan.filter(r => r.laporan_id === lap.id);

      if (isLiveSupabase && supabaseClient) {
        const resLap = await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        if (resLap.error) {
          showToast("Gagal menyimpan laporan: " + resLap.error.message, "error");
          return false;
        }
        const cleanedRows = rows.map(r => ({
          ...r,
          tanggal: r.tanggal || null
        }));
        const resRows = await resilientSupabaseMutation("laporan_mingguan", "upsert", cleanedRows, null, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });
        if (resRows.error) {
          showToast("Gagal menyimpan rincian mingguan: " + resRows.error.message, "error");
          return false;
        }
      }

      if (!silent) {
        showToast("Draft laporan bulanan berhasil disimpan!", "success");
      }
      return true;
    }

    function submitMonthlyReportToAdmin() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const deadlineInfo = getReportDeadlineInfo(bulan, tahun);

      if (deadlineInfo.isPassed && !deadlineInfo.allowLate) {
        showToast(`Batas waktu pelaporan (${deadlineInfo.formattedDate}) telah ditutup oleh Admin Daerah.`, "error");
        return;
      }

      const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
      const rows = dbStore.laporan_mingguan.filter(r => r.laporan_id === lap.id);

      const invalidNoAct = rows.find(r => r.tidak_ada_kegiatan && !String(r.alasan || "").trim());
      if (invalidNoAct) {
        showToast(`Harap isi alasan pada ${getRombelName(invalidNoAct.rombel_id)} Minggu ke-${invalidNoAct.minggu_ke}.`, "warning");
        return;
      }

      const warnLateText = deadlineInfo.isPassed
        ? ` PERHATIAN: Saat ini sudah melewati batas waktu (${deadlineInfo.formattedDate}), sehingga laporan Anda akan tercatat dengan status TERLAMBAT.`
        : "";

      confirmDialog(
        "Kirim Laporan Bulanan ke Admin Daerah?",
        `Laporan periode ${NAMA_BULAN[bulan - 1]} ${tahun} beserta rekap presensi dan jurnal akan dikirim untuk diverifikasi Admin Daerah Jepara.${warnLateText}`,
        async () => {
          lap.status = "Dikirim";
          lap.terlambat = deadlineInfo.isPassed;
          lap.tanggal_kirim = new Date().toISOString();
          const ok = await saveMonthlyReport(true);
          if (ok) {
            showToast(
              deadlineInfo.isPassed
                ? "Laporan bulanan berhasil dikirim (Status: Terlambat)."
                : "Laporan bulanan berhasil dikirim tepat waktu ke Admin Daerah!",
              deadlineInfo.isPassed ? "warning" : "success"
            );
            logActivity("Kirim Laporan Bulanan", `${NAMA_BULAN[bulan - 1]} ${tahun}${deadlineInfo.isPassed ? " (Terlambat)" : ""}`);
            renderApp();
          }
        },
        "Kirim Sekarang"
      );
    }

${rombelLines || "- Belum ada kelas terdaftar"}

Alhamdulillahi jazakumullahu khoiro.
Wassalamu'alaikum Wr. Wb.`;

    function buildDefaultWhatsAppParentText(uid, pesertaId, bulan, tahun) {
      const peserta = dbStore.peserta.find(p => p.id === pesertaId);
      const kelompokName = appState.currentUser.nama_kelompok;
      const periodeStr = `${NAMA_BULAN[bulan - 1]} ${tahun}`;
      if (!peserta) return "";

      const recs = dbStore.presensi.filter(r =>
        r.peserta_id === peserta.id &&
        Number(r.bulan) === bulan &&
        Number(r.tahun) === tahun
      );
      const cntH = recs.filter(r => r.status === "H").length;
      const cntI = recs.filter(r => r.status === "I").length;
      const cntS = recs.filter(r => r.status === "S").length;
      const cntA = recs.filter(r => r.status === "A").length;
      const pct = recs.length > 0 ? Math.round((cntH / recs.length) * 100) : 0;
      const waliCall = peserta.nama_wali ? `Bapak/Ibu ${peserta.nama_wali}` : "Bapak/Ibu Wali Santri";

      return `Assalamu'alaikum Wr. Wb.
Yth. *${waliCall}*,
Berikut kami sampaikan laporan kehadiran mengaji ananda *${peserta.nama_peserta}* (${getRombelName(peserta.rombel_id)}) di *${kelompokName}* periode *${periodeStr}*:

✅ Hadir: *${cntH}x* (${pct}%)
📩 Izin: ${cntI}x
🤒 Sakit: ${cntS}x
⚠️ Alpha: ${cntA}x

Terima kasih atas dukungan dan perhatian orang tua dalam mendampingi putra-putrinya mengaji.
Alhamdulillahi jazakumullahu khoiro.
Wassalamu'alaikum Wr. Wb.`;

        return appState.waCustomTemplates[key];

      const uid = appState.currentUser.id;

    function handleWaMessageTextareaInput(val) {
      const key = getWhatsAppTemplateKey();
      appState.waCustomTemplates[key] = val;
      try {
        localStorage.setItem("digenara_wa_templates_v1", JSON.stringify(appState.waCustomTemplates));
      } catch (e) {}

    function resetActiveWhatsAppMessageText() {
      const key = getWhatsAppTemplateKey();
      delete appState.waCustomTemplates[key];
      try {
        localStorage.setItem("digenara_wa_templates_v1", JSON.stringify(appState.waCustomTemplates));
      } catch (e) {}
      const ta = document.getElementById("waReportMessageText");
      if (ta) {
        ta.value = getActiveWhatsAppMessageText();
      }
      showToast("Teks laporan WA dikembalikan ke format otomatis.", "info");
    }

    function normalizePhoneForWhatsApp(rawPhone) {
      let digits = String(rawPhone || "").replace(/[^0-9]/g, "");
      if (!digits) return "";
      if (digits.startsWith("0")) {
        digits = "62" + digits.slice(1);
      } else if (digits.startsWith("8")) {
        digits = "62" + digits;
      }
      return digits;
    }

    function copyWhatsAppReportText() {
      const ta = document.getElementById("waReportMessageText");
      if (!ta) return;
      ta.select();
      ta.setSelectionRange(0, 99999);
      try {
        document.execCommand("copy");
        showToast("Teks laporan WhatsApp berhasil disalin!", "success");
      } catch (e) {
        showToast("Gagal menyalin teks.", "error");
      }
    }

    function launchWhatsAppShareUrl() {
      const ta = document.getElementById("waReportMessageText");
      const text = ta ? ta.value : getActiveWhatsAppMessageText();
      if (!text.trim()) {
        showToast("Isi pesan WhatsApp tidak boleh kosong.", "warning");
        return;
      }
      let targetPhone = "";
      if (appState.waShareMode === "parent" && appState.waShareSelectedPesertaId) {
        const peserta = dbStore.peserta.find(p => p.id === appState.waShareSelectedPesertaId);
        targetPhone = normalizePhoneForWhatsApp(peserta?.no_wa_wali || "");
      }
      const encoded = encodeURIComponent(text);
      const waUrl = targetPhone
        ? `https://wa.me/${targetPhone}?text=${encoded}`
        : `https://wa.me/?text=${encoded}`;
      window.open(waUrl, "_blank", "noopener,noreferrer");
    }

    async function handleUploadDokumentasi(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const tanggal = document.getElementById("dokTanggal").value;
      const keterangan = document.getElementById("dokKet").value.trim();
      const file = document.getElementById("dokFile").files?.[0];

      if (!file) return;

      showToast("Mengompres foto agar ringan & hemat kuota...", "info");
      try {
        const compressed = await compressImageFile(file);
        let fotoUrl = compressed.dataUrl;
        let filePath = "";

        if (isLiveSupabase && supabaseClient && compressed.blob) {
          filePath = `${uid}/${tahun}_${bulan}_${Date.now()}.jpg`;
          const up = await supabaseClient.storage
            .from(APP_CONFIG.STORAGE_BUCKET)
            .upload(filePath, compressed.blob, { contentType: "image/jpeg", upsert: true });
          if (up.error) {
            showToast("Gagal mengunggah foto ke penyimpanan cloud: " + up.error.message, "error");
            return;
          }
          const { data: signedData } = await supabaseClient.storage
            .from(APP_CONFIG.STORAGE_BUCKET)
            .createSignedUrl(filePath, 60 * 60 * 24 * 7);
          const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(filePath);
          fotoUrl = pub?.data?.publicUrl || signedData?.signedUrl || compressed.dataUrl;
        }

        const docId = generateUUID();
        const dbRecord = {
          id: docId,
          kelompok_id: uid,
          bulan,
          tahun,
          tanggal,
          keterangan,
          foto_url: fotoUrl,
          file_path: filePath,
          ukuran_kb: compressed.sizeKB
        };

        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", dbRecord);
          if (res.error) {
            showToast("Gagal menyimpan metadata foto: " + res.error.message, "error");
            return;
          }
        }

        const localRecord = {
          ...dbRecord,
          resolved_url: compressed.dataUrl || fotoUrl,
          created_at: new Date().toISOString()
        };

        dbStore.dokumentasi_kegiatan.unshift(localRecord);
        showToast(`Foto berhasil diunggah (${compressed.sizeKB} KB)!`, "success");
        logActivity("Unggah Dokumentasi", `${keterangan} (${compressed.sizeKB} KB)`);
        renderApp();
      } catch (err) {
        showToast("Gagal memproses foto: " + err.message, "error");
      }
    }

    function deleteDokumentasiItem(id) {
      confirmDialog("Hapus Foto Dokumentasi?", "Foto ini akan dihapus dari laporan bulan ini.", async () => {
        const target = dbStore.dokumentasi_kegiatan.find(d => d.id === id);
        if (isLiveSupabase && supabaseClient) {
          const storagePath = extractStoragePathFromDok(target);
          if (storagePath) {
            await supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).remove([storagePath]);
          }
          const res = await resilientSupabaseMutation("dokumentasi_kegiatan", "delete", null, { id });
          if (res.error) {
            showToast("Gagal menghapus foto: " + res.error.message, "error");
            return;
          }
        }
        dbStore.dokumentasi_kegiatan = dbStore.dokumentasi_kegiatan.filter(d => d.id !== id);
        showToast("Foto dokumentasi dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    const KENDALA_EXTRA_STORAGE_KEY = "digenara_kendala_extra_v1";

    function loadKendalaExtraCache() {
      try {
        return JSON.parse(localStorage.getItem(KENDALA_EXTRA_STORAGE_KEY) || "{}") || {};
      } catch (e) {
        return {};
      }
    }

    function saveKendalaExtraCache(kendalaId, extraObj) {
      if (!kendalaId) return;
      try {
        const cache = loadKendalaExtraCache();
        cache[kendalaId] = {
          ...(cache[kendalaId] || {}),
          ...extraObj
        };
        localStorage.setItem(KENDALA_EXTRA_STORAGE_KEY, JSON.stringify(cache));
      } catch (e) {}
    }

    function mergeKendalaExtraFields() {
      const cache = loadKendalaExtraCache();
      dbStore.kendala_evaluasi.forEach(k => {
        const saved = cache[k.id];
        if (saved) {
          if (!k.status_musyawarah && saved.status_musyawarah) k.status_musyawarah = saved.status_musyawarah;
          if (!k.status_evaluasi && saved.status_evaluasi) k.status_evaluasi = saved.status_evaluasi;
        }
      });
    }

    }

    async function toggleKendalaStatusField(id, field) {
      const item = dbStore.kendala_evaluasi.find(k => k.id === id);
      if (!item) return;

      if (field === "status_musyawarah") {
        const isSudah = String(item.status_musyawarah || "").toLowerCase().startsWith("sudah");
        item.status_musyawarah = isSudah
          ? "Belum dimusyawarahkan di 5 unsur kelompok"
          : "Sudah dimusyawarahkan di 5 unsur kelompok";
      } else if (field === "status_evaluasi") {
        const isSudah = String(item.status_evaluasi || "").toLowerCase().startsWith("sudah");
        item.status_evaluasi = isSudah ? "Belum dievaluasi" : "Sudah dievaluasi";
      }

      saveKendalaExtraCache(item.id, {
        status_musyawarah: item.status_musyawarah,
        status_evaluasi: item.status_evaluasi
      });

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation(
          "kendala_evaluasi",
          "update",
          {
            status_musyawarah: item.status_musyawarah,
            status_evaluasi: item.status_evaluasi
          },
          { id: item.id }
        );
      }

      showToast("Status musyawarah / evaluasi diperbarui!", "success");
      renderApp();
    }

    async function saveKendalaForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const rawKategori = document.getElementById("kKategori").value;
      const customKategori = document.getElementById("kKategoriCustom")?.value.trim() || "";
      const finalKategori = rawKategori === "Lain-lain (Opsional)" && customKategori
        ? `Lain-lain (${customKategori})`
        : rawKategori;

      const statusMusyawarah = document.getElementById("kStatusMusyawarah")?.value || "Belum dimusyawarahkan di 5 unsur kelompok";
      const statusEvaluasi = document.getElementById("kStatusEvaluasi")?.value || "Belum dievaluasi";

      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        bulan: appState.selectedMonth,
        tahun: appState.selectedYear,
        kategori: finalKategori,
        deskripsi: document.getElementById("kDeskripsi").value.trim(),
        solusi_kelompok: document.getElementById("kSolusi").value.trim(),
        status_musyawarah: statusMusyawarah,
        status_evaluasi: statusEvaluasi
      };

      saveKendalaExtraCache(payload.id, {
        status_musyawarah: statusMusyawarah,
        status_evaluasi: statusEvaluasi
      });

      if (isLiveSupabase && supabaseClient) {
        let res = editId
          ? await resilientSupabaseMutation("kendala_evaluasi", "update", payload, { id: editId })
          : await resilientSupabaseMutation("kendala_evaluasi", "insert", payload);
        if (res.error) {
          const corePayload = {
            id: payload.id,
            kelompok_id: payload.kelompok_id,
            bulan: payload.bulan,
            tahun: payload.tahun,
            kategori: payload.kategori,
            deskripsi: payload.deskripsi,
            solusi_kelompok: payload.solusi_kelompok
          };
          res = editId
            ? await resilientSupabaseMutation("kendala_evaluasi", "update", corePayload, { id: editId })
            : await resilientSupabaseMutation("kendala_evaluasi", "insert", corePayload);
        }
        if (res.error) {
          showToast("Gagal menyimpan kendala: " + res.error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.kendala_evaluasi.findIndex(k => k.id === editId);
        if (idx >= 0) dbStore.kendala_evaluasi[idx] = { ...dbStore.kendala_evaluasi[idx], ...payload };
      } else {
        dbStore.kendala_evaluasi.unshift({ ...payload, tanggapan_admin: "", created_at: new Date().toISOString() });
      }

      closeModal();
      showToast("Catatan kendala & evaluasi tersimpan!", "success");
      renderApp();
    }

    function deleteKendalaItem(id) {
      confirmDialog("Hapus Catatan Kendala?", "Catatan kendala ini akan dihapus.", async () => {
        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("kendala_evaluasi", "delete", null, { id });
          if (res.error) {
            showToast("Gagal menghapus kendala: " + res.error.message, "error");
            return;
          }
        }
        dbStore.kendala_evaluasi = dbStore.kendala_evaluasi.filter(k => k.id !== id);
        showToast("Catatan kendala dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    function getFilteredAdminGuruList() {
      const activeKelompoks = dbStore.profiles.filter(p => p.role === "user");
      let allGurus = [];
      activeKelompoks.forEach(k => {
        const gList = getGroupGuruProfiles(k.id);
        gList.forEach(g => {
          allGurus.push({
            ...g,
            nama_kelompok: k.nama_kelompok,
            nama_desa: k.nama_desa || "Belum Diatur"
          });
        });
      });

      const q = appState.adminGuruSearch.trim().toLowerCase();
      return allGurus.filter(g => {
        const matchDesa = appState.adminGuruFilterDesa === "ALL" || g.nama_desa === appState.adminGuruFilterDesa;
        const matchKel = appState.adminGuruFilterKelompok === "ALL" || g.kelompok_id === appState.adminGuruFilterKelompok;
        const matchKat = appState.adminGuruFilterKategori === "ALL"
          || (appState.adminGuruFilterKategori === "MT" && String(g.kategori || "").includes("MT"))
          || (appState.adminGuruFilterKategori === "GURU" && !String(g.kategori || "").includes("MT"));
        const matchQ = !q
          || String(g.nama_guru || "").toLowerCase().includes(q)
          || String(g.nama_kelompok || "").toLowerCase().includes(q)
          || String(g.kelas_ampu || "").toLowerCase().includes(q)
          || String(g.no_wa || "").toLowerCase().includes(q);
        return matchDesa && matchKel && matchKat && matchQ;
      });
    }

    async function adminChangeAccountStatus(userId, newStatus) {
      const user = dbStore.profiles.find(p => p.id === userId);
      if (!user) return;
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", { status_akun: newStatus }, { id: userId });
        if (res.error) {
          showToast("Gagal memperbarui status akun: " + res.error.message, "error");
          return;
        }
      }
      user.status_akun = newStatus;
      showToast(`Status akun ${user.nama_kelompok} diubah menjadi ${newStatus}.`, "success");
      logActivity("Ubah Status Akun", `${user.nama_kelompok} -> ${newStatus}`);
      renderApp();
    }

            </div>

        `,

      );
    }

    async function saveAdminResetPassword(e, userId) {
      e.preventDefault();
      const user = dbStore.profiles.find(p => p.id === userId);
      if (!user) return;
      const newPw = document.getElementById("adminNewPwInput").value.trim();
      if (newPw.length < 8) {
        showToast("Password minimal 8 karakter.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        const { error } = await supabaseClient.rpc("admin_reset_user_password", {
          target_user_id: userId,
          new_password: newPw
        });
        if (error) {
          showToast("Gagal reset password di server: " + error.message, "error");
          return;
        }
      } else {
        user.password_hash = newPw;
      }

      user.reset_requested = false;
      user.reset_note = "";
      closeModal();
      showToast(`Password akun @${user.username} berhasil direset!`, "success");
      logActivity("Reset Password Akun", `Reset password untuk @${user.username}`);
      renderApp();
    }

    function getFilteredAdminGenerusList() {
      mergePesertaExtraFields();
      const allSantri = dbStore.peserta.filter(p => p.aktif);
      const q = appState.adminGenerusSearch.trim().toLowerCase();

      return allSantri.filter(s => {
        const desa = s.nama_desa || getKelompokDesa(s.kelompok_id);
        const rombelName = getRombelName(s.rombel_id);
        const matchDesa = appState.adminGenerusFilterDesa === "ALL" || desa === appState.adminGenerusFilterDesa;
        const matchKel = appState.adminGenerusFilterKelompok === "ALL" || s.kelompok_id === appState.adminGenerusFilterKelompok;
        const matchRombel = appState.adminGenerusFilterRombel === "ALL" || rombelName === appState.adminGenerusFilterRombel;
        const matchGender = appState.adminGenerusFilterGender === "ALL" || s.jenis_kelamin === appState.adminGenerusFilterGender;
        const matchQ = !q
          || s.nama_peserta.toLowerCase().includes(q)
          || String(s.kelompok_asal || "").toLowerCase().includes(q)
          || String(s.nama_wali || "").toLowerCase().includes(q)
          || String(s.tempat_lahir || "").toLowerCase().includes(q)
          || String(s.no_wa_wali || "").toLowerCase().includes(q)
          || getKelompokName(s.kelompok_id).toLowerCase().includes(q);
        return matchDesa && matchKel && matchRombel && matchGender && matchQ;
      }).sort((a, b) => a.nama_peserta.localeCompare(b.nama_peserta));
    }

    function openAdminReviewModal(kelompokId, targetStatus) {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const lap = ensureMonthlyReportAndRows(kelompokId, bulan, tahun);
      openModal(
        targetStatus === "Disetujui" ? "Setujui Laporan Kelompok" : "Minta Revisi Laporan",
        `
          <form id="formAdminReview" onsubmit="saveAdminReview(event, '${kelompokId}', '${targetStatus}')" class="space-y-3">
            <p class="text-xs text-slate-600">
              ${targetStatus === "Disetujui"
                ? "Laporan akan dikunci permanen sebagai laporan resmi yang disetujui Daerah Jepara."
                : "Laporan akan dikembalikan ke kelompok agar diperbaiki sesuai catatan Anda."}
            </p>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Catatan / Komentar Admin Daerah</label>
              <textarea id="adminReviewComment" rows="3" placeholder="Tulis masukan atau apresiasi untuk pengurus kelompok..."
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm">${escapeHTML(lap.komentar_admin || "")}</textarea>
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formAdminReview" class="px-5 py-2 rounded-xl ${targetStatus === 'Disetujui' ? 'bg-emerald-700' : 'bg-rose-600'} text-white text-sm font-bold">
            Simpan Keputusan
          </button>
        `,
        "max-w-md"
      );
    }

    async function saveAdminReview(e, kelompokId, targetStatus) {
      e.preventDefault();
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const lap = ensureMonthlyReportAndRows(kelompokId, bulan, tahun);
      const comment = document.getElementById("adminReviewComment").value.trim();

      lap.status = targetStatus;
      lap.komentar_admin = comment;

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        if (res.error) {
          showToast("Gagal menyimpan verifikasi laporan: " + res.error.message, "error");
          return;
        }
      }

      closeModal();
      showToast(`Status laporan diubah menjadi "${targetStatus}"!`, "success");
      logActivity("Verifikasi Laporan", `${getKelompokName(kelompokId)} -> ${targetStatus}`);
      renderApp();
    }

    async function saveAdminTanggapanKendala(kendalaId) {
      const k = dbStore.kendala_evaluasi.find(item => item.id === kendalaId);
      const input = document.getElementById(`tanggapanInput_${kendalaId}`);
      if (!k || !input) return;
      const reply = input.value.trim();

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("kendala_evaluasi", "update", { tanggapan_admin: reply }, { id: kendalaId });
        if (res.error) {
          showToast("Gagal menyimpan tanggapan: " + res.error.message, "error");
          return;
        }
      }
      k.tanggapan_admin = reply;
      showToast("Tanggapan Admin tersimpan!", "success");
      renderApp();
    }

                  <div class="font-extrabold text-slate-900 text-sm">${escapeHTML(ann.judul)}</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">${formatDateTimeWIB(ann.created_at)}</div>
                  <p class="text-xs sm:text-sm text-slate-700 mt-1.5 leading-relaxed">${escapeHTML(ann.isi)}</p>
                </div>
                <button type="button" onclick="deleteAnnouncementItem('${ann.id}')" class="px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold shrink-0">
                  Hapus
                </button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    async function publishNewAnnouncement(e) {
      e.preventDefault();
      const judul = document.getElementById("annJudul").value.trim();
      const isi = document.getElementById("annIsi").value.trim();
      if (!judul || !isi) return;

      const row = {
        id: generateUUID(),
        judul,
        isi,
        penting: true,
        created_at: new Date().toISOString()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengumuman", "insert", row);
        if (res.error) {
          showToast("Gagal menerbitkan pengumuman: " + res.error.message, "error");
          return;
        }
      }

      dbStore.pengumuman.unshift(row);
      deviceNotifState.seenAnnouncementIds.push(row.id);
      persistDeviceNotifState();
      await broadcastRealtimeEvent("new_announcement", row);
      showToast("Pengumuman berhasil dipublikasikan ke seluruh kelompok!", "success");
      logActivity("Terbitkan Pengumuman", judul);
      renderApp();
    }

    function deleteAnnouncementItem(id) {
      confirmDialog("Hapus Pengumuman?", "Pengumuman ini akan dihapus dari beranda semua kelompok.", async () => {
        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("pengumuman", "delete", null, { id });
          if (res.error) {
            showToast("Gagal menghapus pengumuman: " + res.error.message, "error");
            return;
          }
        }
        dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
        showToast("Pengumuman dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    // ============================================================================
    // INISIALISASI SAAT HALAMAN DIMUAT
    // ============================================================================
    window.addEventListener("DOMContentLoaded", async () => {
      initBrandingIconsAndManifest();
      renderApp();
      await restoreSupabaseSession();
    });
  </script>
</body>
</html>
