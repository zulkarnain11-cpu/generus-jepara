  <script>
    /**
     * ============================================================================
     * KONFIGURASI UTAMA APLIKASI DIGENARA (DIGITALISASI GENERUS JEPARA)
     * ============================================================================
     */
    const APP_CONFIG = {
      SUPABASE_URL: "https://egfyloqtzxzihnxjmrhh.supabase.co",
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnZnlsb3F0enh6aWhueGptcmhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNzk5MDEsImV4cCI6MjExMDY1NTkwMX0.LbJy9vwvpxZ0GOEIQx6jLASWGzRJLGSNxGQgLXk-qCk",
      INTERNAL_EMAIL_DOMAIN: "@generus-jepara.com",
      STORAGE_BUCKET: "dokumentasi-kegiatan",
      MAX_PHOTO_WIDTH: 1280,
      TARGET_PHOTO_KB: 300,
      MAX_PHOTOS_PER_MONTH: 6,
      REPORT_DEADLINE_DAY: 5,
      REPORT_DEADLINE_HOUR_WIB: 21,
      ALLOW_LATE_REPORT: true
    };

    try {
      const savedUrl = localStorage.getItem("digenara_supa_url");
      const savedKey = localStorage.getItem("digenara_supa_key");
      if (savedUrl && savedKey) {
        APP_CONFIG.SUPABASE_URL = savedUrl;
        APP_CONFIG.SUPABASE_ANON_KEY = savedKey;
      }
      const savedDeadlineRaw = localStorage.getItem("digenara_deadline_cfg");
      if (savedDeadlineRaw) {
        const parsed = JSON.parse(savedDeadlineRaw);
        if (parsed.batas_tanggal) APP_CONFIG.REPORT_DEADLINE_DAY = Math.min(28, Math.max(1, Number(parsed.batas_tanggal) || 5));
        if (parsed.batas_jam_wib !== undefined) APP_CONFIG.REPORT_DEADLINE_HOUR_WIB = Math.min(23, Math.max(0, Number(parsed.batas_jam_wib)));
        if (parsed.izinkan_terlambat !== undefined) APP_CONFIG.ALLOW_LATE_REPORT = Boolean(parsed.izinkan_terlambat);
      }
    } catch (e) {}

    // ============================================================================
    // KONSTANTA WILAYAH DESA, KELAS STANDAR, MATERI & HELPER UMUM
    // ============================================================================
    const NAMA_BULAN = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    const DESA_OPTIONS = [
      "Desa Timur 1",
      "Desa Timur 2",
      "Desa Barat",
      "Desa Utara"
    ];

    const STANDARD_KELAS_OPTIONS = [
      "Caberawit (PAUD/TK)",
      "Caberawit (SD Kls 1-3)",
      "Caberawit (SD Kls 4-6)",
      "Pra Remaja",
      "Remaja",
      "Muda-Mudi / Usia Nikah"
    ];

    const MATERI_OPTIONS_LIST = [
      { key: "pegon", label: "Pegon", placeholder: "Contoh: Menyambung huruf / menulis kata Pegon" },
      { key: "tajwid", label: "Tajwid", placeholder: "Contoh: Hukum Nun Mati & Tanwin / Makhraj huruf" },
      { key: "hafalan", label: "Hafalan", placeholder: "Contoh: QS. Al-Ma'un & Doa sebelum belajar" },
      { key: "bacaan", label: "Bacaan", placeholder: "Contoh: Tilawati Jilid 2 hal. 14 / Tadarus Juz 1" },
      { key: "makna", label: "Makna", placeholder: "Contoh: Makna & penjelasan Kitab As-Sholah" },
      { key: "lain_lain", label: "Lain-lain", placeholder: "Contoh: Praktik wudhu, adab & akhlakul karimah" }
    ];

    function isAccountActiveStatus(status) {
      return status === "approved" || status === "active";
    }

    function applySystemSettingsObject(cfg) {
      if (!cfg) return;
      if (cfg.batas_tanggal !== undefined && cfg.batas_tanggal !== null) {
        APP_CONFIG.REPORT_DEADLINE_DAY = Math.min(28, Math.max(1, parseInt(cfg.batas_tanggal, 10) || 5));
      }
      if (cfg.batas_jam_wib !== undefined && cfg.batas_jam_wib !== null) {
        APP_CONFIG.REPORT_DEADLINE_HOUR_WIB = Math.min(23, Math.max(0, parseInt(cfg.batas_jam_wib, 10)));
      }
      if (cfg.izinkan_terlambat !== undefined && cfg.izinkan_terlambat !== null) {
        APP_CONFIG.ALLOW_LATE_REPORT = Boolean(cfg.izinkan_terlambat);
      }
      try {
        localStorage.setItem("digenara_deadline_cfg", JSON.stringify({
          batas_tanggal: APP_CONFIG.REPORT_DEADLINE_DAY,
          batas_jam_wib: APP_CONFIG.REPORT_DEADLINE_HOUR_WIB,
          izinkan_terlambat: APP_CONFIG.ALLOW_LATE_REPORT
        }));
      } catch (e) {}
    }

    function getReportDeadlineInfo(bulan, tahun) {
      const m = Number(bulan);
      const y = Number(tahun);
      const dueMonth = m === 12 ? 1 : m + 1;
      const dueYear = m === 12 ? y + 1 : y;
      const dueDay = Math.min(28, Math.max(1, Number(APP_CONFIG.REPORT_DEADLINE_DAY) || 5));
      const dueHour = Math.min(23, Math.max(0, Number(APP_CONFIG.REPORT_DEADLINE_HOUR_WIB) ?? 21));
      const hhStr = String(dueHour).padStart(2, "0");

      const deadlineUtcMs = Date.UTC(dueYear, dueMonth - 1, dueDay, dueHour - 7, 0, 0);
      const nowMs = Date.now();
      const isPassed = nowMs > deadlineUtcMs;
      const diffMs = deadlineUtcMs - nowMs;
      const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      const hoursLeft = Math.ceil(diffMs / (1000 * 60 * 60));
      const formattedDate = `${dueDay} ${NAMA_BULAN[dueMonth - 1]} ${dueYear}, ${hhStr}.00 WIB`;

      return {
        dueDay,
        dueMonth,
        dueYear,
        dueHour,
        hhStr,
        deadlineUtcMs,
        formattedDate,
        isPassed,
        daysLeft,
        hoursLeft,
        allowLate: Boolean(APP_CONFIG.ALLOW_LATE_REPORT)
      };
    }

    function getWIBParts(dateObj = new Date()) {
      try {
        const formatter = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Jakarta",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
        const parts = formatter.formatToParts(dateObj);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const year = parseInt(map.year, 10);
        const month = parseInt(map.month, 10);
        const day = parseInt(map.day, 10);
        const hour = parseInt(map.hour, 10) % 24;
        const minute = parseInt(map.minute, 10);
        const hh = String(hour).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${map.year}-${map.month}-${map.day}`,
          timeStr: `${hh}:${map.minute} WIB`
        };
      } catch (e) {
        const utc = dateObj.getTime() + dateObj.getTimezoneOffset() * 60000;
        const wib = new Date(utc + 7 * 3600000);
        const year = wib.getFullYear();
        const month = wib.getMonth() + 1;
        const day = wib.getDate();
        const hour = wib.getHours();
        const minute = wib.getMinutes();
        const pad = (n) => String(n).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${year}-${pad(month)}-${pad(day)}`,
          timeStr: `${pad(hour)}:${pad(minute)} WIB`
        };
      }
    }

    function buildClampedISODate(year, month, desiredDay) {
      const y = Number(year) || getWIBParts().year;
      const m = Math.min(12, Math.max(1, Number(month) || 1));
      const maxDays = new Date(y, m, 0).getDate();
      const d = Math.min(maxDays, Math.max(1, Number(desiredDay) || 1));
      return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    }

    function formatTanggalID(isoDateStr) {
      if (!isoDateStr) return "-";
      const clean = String(isoDateStr).slice(0, 10);
      const parts = clean.split("-");
      if (parts.length !== 3) return escapeHTML(String(isoDateStr));
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      if (!m || !d || m < 1 || m > 12) return escapeHTML(clean);
      return `${d} ${NAMA_BULAN[m - 1]} ${y}`;
    }

    function formatDateTimeWIB(isoTimestamp) {
      if (!isoTimestamp) return "-";
      const d = new Date(isoTimestamp);
      if (isNaN(d.getTime())) return "-";
      const p = getWIBParts(d);
      return `${p.day} ${NAMA_BULAN[p.month - 1].slice(0, 3)} ${p.year}, ${p.timeStr}`;
    }

    function shiftISODate(isoDateStr, deltaDays) {
      const clean = String(isoDateStr || getWIBParts().isoDate).slice(0, 10);
      const [y, m, d] = clean.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + deltaDays));
      const yy = dt.getUTCFullYear();
      const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(dt.getUTCDate()).padStart(2, "0");
      return `${yy}-${mm}-${dd}`;
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function getUserInitials(name) {
      const words = String(name || "GJ").trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "GJ";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const styles = {
        success: "bg-emerald-900 text-white border-emerald-700",
        error: "bg-rose-900 text-white border-rose-700",
        warning: "bg-amber-500 text-slate-950 border-amber-600",
        info: "bg-slate-900 text-white border-slate-700"
      };
      const icons = {
        success: "✅",
        error: "❌",
        warning: "⚠️",
        info: "ℹ️"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base leading-none mt-0.5">${icons[type] || icons.info}</span>
        <div class="flex-1 leading-snug">${escapeHTML(message)}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => toast.remove(), 300);
      }, 4200);
    }

    let pendingConfirmCallback = null;

    function openModal(title, bodyHTML, footerHTML = "", maxWidthClass = "max-w-xl") {
      const container = document.getElementById("modalContainer");
      if (!container) return;
      container.innerHTML = `
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} overflow-hidden my-auto">
          <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-3">
            <h3 class="font-extrabold text-base sm:text-lg text-slate-900">${escapeHTML(title)}</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-xl bg-slate-200/70 hover:bg-slate-300 text-slate-700 font-bold flex items-center justify-center">✕</button>
          </div>
          <div class="p-5 max-h-[75vh] overflow-y-auto">
            ${bodyHTML}
          </div>
          ${footerHTML ? `
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-end gap-2">
              ${footerHTML}
            </div>
          ` : ""}
        </div>
      `;
      container.classList.remove("hidden");
      container.classList.add("flex");
    }

    function triggerModalFormSubmit(formId) {
      const form = document.getElementById(formId);
      if (!form) return;
      if (typeof form.checkValidity === "function" && !form.checkValidity()) {
        if (typeof form.reportValidity === "function") {
          form.reportValidity();
        } else {
          showToast("Mohon lengkapi semua kolom wajib (*) terlebih dahulu.", "warning");
        }
        return;
      }
      if (typeof form.requestSubmit === "function") {
        form.requestSubmit();
      } else {
        form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        const container = document.getElementById("modalContainer");
        if (container && !container.classList.contains("hidden")) {
          closeModal();
        }
      }
    });

    function closeModal() {
      const container = document.getElementById("modalContainer");
      if (!container) return;
      container.classList.add("hidden");
      container.classList.remove("flex");
      container.innerHTML = "";
      pendingConfirmCallback = null;
    }

    function confirmDialog(title, message, onConfirm, confirmLabel = "Ya, Lanjutkan", isDanger = false) {
      pendingConfirmCallback = onConfirm;
      openModal(
        title,
        `<p class="text-sm text-slate-700 leading-relaxed">${escapeHTML(message)}</p>`,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-semibold text-sm">Batal</button>
          <button type="button" onclick="executePendingConfirm()" class="px-5 py-2 rounded-xl ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-700 hover:bg-emerald-800'} text-white font-bold text-sm">
            ${escapeHTML(confirmLabel)}
          </button>
        `,
        "max-w-md"
      );
    }

    async function executePendingConfirm() {
      const cb = pendingConfirmCallback;
      closeModal();
      if (typeof cb === "function") {
        await cb();
      }
    }

    // ============================================================================
    // LOGO RESMI PPG SAK JAGAT RAT DAERAH JEPARA + FAVICON & PINTASAN LAYAR UTAMA
    // ============================================================================
    function buildPPGLogoInnerMarkup(uid, includeBgCircle = false) {
      const buildFacetedStar = (cx, cy, outerR, innerR, rotDeg = 0) => {
        const pts = [];
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const angle = ((i * 36 - 90) * Math.PI) / 180;
          pts.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
        }
        const polyStr = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
        const facets = [];
        for (let i = 0; i < 10; i++) {
          const p1 = pts[i];
          const p2 = pts[(i + 1) % 10];
          const fillShade = i % 2 === 0 ? "#f0d377" : "#8d630c";
          facets.push(`<polygon points="${cx},${cy} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${fillShade}" />`);
        }
        return `
          <g transform="rotate(${rotDeg} ${cx} ${cy})">
            ${facets.join("")}
            <polygon points="${polyStr}" fill="none" stroke="#3b2804" stroke-width="0.9" stroke-linejoin="round" />
          </g>
        `;
      };

      return `
        <defs>
          <radialGradient id="${uid}_bg" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="65%" stop-color="#065f46" />
            <stop offset="100%" stop-color="#022c22" />
          </radialGradient>
          <radialGradient id="${uid}_ocean" cx="42%" cy="38%" r="58%">
            <stop offset="0%" stop-color="#1b5694" />
            <stop offset="60%" stop-color="#0d315c" />
            <stop offset="100%" stop-color="#05162e" />
          </radialGradient>
          <linearGradient id="${uid}_goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e5c45c" />
            <stop offset="45%" stop-color="#c39321" />
            <stop offset="100%" stop-color="#966a0e" />
          </linearGradient>
          <linearGradient id="${uid}_land" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9ca3af" />
            <stop offset="100%" stop-color="#6b7280" />
          </linearGradient>
          <clipPath id="${uid}_globeClip">
            <circle cx="130" cy="112" r="50.5" />
          </clipPath>
          <path id="${uid}_topArc" d="M 73,112 A 57,57 0 1,1 187,112" />
          <path id="${uid}_botArc" d="M 66.5,112 A 63.5,63.5 0 0,0 193.5,112" />
          <path id="${uid}_mottoArc" d="M 46,112 A 84,84 0 0,0 214,112" />
        </defs>

        ${includeBgCircle ? `<rect x="0" y="0" width="260" height="258" rx="54" fill="url(#${uid}_bg)" />` : ""}

        <!-- Tiga Bintang Emas 3D di Atas -->
        ${buildFacetedStar(82, 41, 16, 6.8, -16)}
        ${buildFacetedStar(130, 26, 19.5, 8.2, 0)}
        ${buildFacetedStar(178, 41, 16, 6.8, 16)}

        <!-- Garis Lengkung Emas Luar Kiri & Kanan -->
        <path d="M 49,63 A 88,88 0 0,0 44,138" fill="none" stroke="#c39321" stroke-width="2.3" stroke-linecap="round" />
        <path d="M 211,63 A 88,88 0 0,1 216,138" fill="none" stroke="#c39321" stroke-width="2.3" stroke-linecap="round" />

        <!-- Cincin Emas Utama -->
        <circle cx="130" cy="112" r="70" fill="url(#${uid}_goldRing)" stroke="#1f1605" stroke-width="1.5" />

    function renderSVGStringToPNGDataURL(svgString, sizePx, isOpaqueAppleIcon = false) {
      return new Promise((resolve) => {
        try {
          const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
          const url = URL.createObjectURL(svgBlob);
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = sizePx;
            canvas.height = sizePx;
            const ctx = canvas.getContext("2d");
            if (isOpaqueAppleIcon) {
              const grad = ctx.createRadialGradient(sizePx * 0.4, sizePx * 0.3, sizePx * 0.05, sizePx * 0.5, sizePx * 0.5, sizePx * 0.72);
              grad.addColorStop(0, "#047857");
              grad.addColorStop(0.65, "#065f46");
              grad.addColorStop(1, "#022c22");
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, sizePx, sizePx);
            }
            const pad = Math.round(sizePx * 0.06);
            ctx.drawImage(img, pad, pad, sizePx - pad * 2, sizePx - pad * 2);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL("image/png"));
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            resolve("");
          };
          img.src = url;
        } catch (e) {
          resolve("");
        }
      });
    }

    const deviceNotifState = {

        if (parsed.notifyAnnouncements !== undefined) deviceNotifState.notifyAnnouncements = Boolean(parsed.notifyAnnouncements);
        if (parsed.notifyDeadlineReminders !== undefined) deviceNotifState.notifyDeadlineReminders = Boolean(parsed.notifyDeadlineReminders);
        if (Array.isArray(parsed.seenAnnouncementIds)) deviceNotifState.seenAnnouncementIds = parsed.seenAnnouncementIds;
        if (parsed.sentReminderKeys && typeof parsed.sentReminderKeys === "object") deviceNotifState.sentReminderKeys = parsed.sentReminderKeys;
        if (parsed.lastDeadlineSignature) deviceNotifState.lastDeadlineSignature = String(parsed.lastDeadlineSignature);

    } catch (e) {}

    function persistDeviceNotifState() {

          notifyDeadlineReminders: deviceNotifState.notifyDeadlineReminders,

      return { hasNotificationAPI, permission, isConnected };

    function playNotificationChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const notes = [587.33, 880];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.14);
          gain.gain.setValueAtTime(0.001, now + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.14 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.32);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.14);
          osc.stop(now + idx * 0.14 + 0.34);
        });
      } catch (e) {}
    }

    async function registerLightweightNotificationSW() {
      if (!("serviceWorker" in navigator)) return null;
      if (deviceNotifState.swRegistration) return deviceNotifState.swRegistration;
      try {
        const existingReg = await navigator.serviceWorker.getRegistration();
        if (existingReg) {
          deviceNotifState.swRegistration = existingReg;
          return existingReg;
        }
        const swCode = `
          self.addEventListener('install', (event) => {
            self.skipWaiting();
          });
          self.addEventListener('activate', (event) => {
            event.waitUntil(self.clients.claim());
          });
          self.addEventListener('notificationclick', (event) => {
            event.notification.close();
            event.waitUntil(
              self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then((clientList) => {
                for (const client of clientList) {
                  if ('focus' in client) return client.focus();
                }
                if (self.clients.openWindow) return self.clients.openWindow('./');
              })
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: "application/javascript" });
        const swUrl = URL.createObjectURL(swBlob);
        const reg = await navigator.serviceWorker.register(swUrl);
        deviceNotifState.swRegistration = reg;
        return reg;
      } catch (e) {
        return null;
      }
    }

    async function triggerNativeDeviceNotification(title, body, tag = "digenara-alert", targetTab = "dashboard") {
      const status = getDeviceNotificationStatusInfo();
      playNotificationChime();
      showLiveNotificationBanner(title, body, targetTab);

      if (!status.isConnected) return false;

      const iconUrl = APP_BRAND_ICON_192 || document.getElementById("faviconPng192")?.href || "";
      const options = {
        body,
        icon: iconUrl,
        badge: iconUrl,
        tag,
        renotify: true,
        vibrate: [180, 90, 180]
      };

      try {
        const swReg = deviceNotifState.swRegistration || (await registerLightweightNotificationSW());
        if (swReg && typeof swReg.showNotification === "function") {
          await swReg.showNotification(title, options);
          return true;
        }
        if (typeof Notification === "function") {
          const n = new Notification(title, options);
          n.onclick = () => {
            try {
              window.focus();
              if (appState.currentUser && targetTab) {
                appState.activeTab = targetTab;
                renderApp();
              }
              n.close();
            } catch (e) {}
          };
          return true;
        }
        return false;
      } catch (err) {
        return false;
      }
    }

    function getActiveDueReportPeriods() {
      const nowWIB = getWIBParts();
      const prevMonth = nowWIB.month === 1 ? 12 : nowWIB.month - 1;

        { bulan: nowWIB.month, tahun: nowWIB.year }

    async function checkAndDispatchAutoNotifications(isInitialSync = false) {
      if (!appState.currentUser) return;

      const announcements = Array.isArray(dbStore.pengumuman) ? dbStore.pengumuman : [];
      if (isInitialSync && deviceNotifState.seenAnnouncementIds.length === 0 && announcements.length > 0) {
        deviceNotifState.seenAnnouncementIds = announcements.map(a => a.id);
        persistDeviceNotifState();
      } else if (deviceNotifState.notifyAnnouncements) {
        const unseen = announcements.filter(a => a && a.id && !deviceNotifState.seenAnnouncementIds.includes(a.id));
        if (unseen.length > 0) {
          unseen.forEach(a => deviceNotifState.seenAnnouncementIds.push(a.id));
          persistDeviceNotifState();

          const latest = unseen[0];
          const extraText = unseen.length > 1 ? ` (+${unseen.length - 1} pengumuman lainnya)` : "";
          await triggerNativeDeviceNotification(
            `📢 Pengumuman PPG Daerah Jepara${extraText}`,
            `${latest.judul}: ${latest.isi}`,
            `digenara-ann-${latest.id}`,
            appState.currentUser.role === "admin" ? "pengumuman" : "dashboard"
          );
        }
      }

      const currentDeadlineSig = `${APP_CONFIG.REPORT_DEADLINE_DAY}_${APP_CONFIG.REPORT_DEADLINE_HOUR_WIB}_${APP_CONFIG.ALLOW_LATE_REPORT}`;
      if (!deviceNotifState.lastDeadlineSignature) {
        deviceNotifState.lastDeadlineSignature = currentDeadlineSig;
        persistDeviceNotifState();
      } else if (deviceNotifState.lastDeadlineSignature !== currentDeadlineSig) {
        deviceNotifState.lastDeadlineSignature = currentDeadlineSig;
        persistDeviceNotifState();
        if (appState.currentUser.role === "user" && deviceNotifState.notifyDeadlineReminders) {
          const hhStr = String(APP_CONFIG.REPORT_DEADLINE_HOUR_WIB).padStart(2, "0");
          await triggerNativeDeviceNotification(
            "⏰ Perubahan Batas Waktu Pelaporan",
            `Admin Daerah memperbarui tenggat pelaporan menjadi setiap tanggal ${APP_CONFIG.REPORT_DEADLINE_DAY} pukul ${hhStr}.00 WIB.`,
            `digenara-deadline-cfg-${currentDeadlineSig}`,
            "laporan"
          );
        }
      }

      if (appState.currentUser.role === "user" && deviceNotifState.notifyDeadlineReminders) {
        const uid = appState.currentUser.id;
        const periodsToCheck = getActiveDueReportPeriods();

        for (const p of periodsToCheck) {
          const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === p.bulan && Number(l.tahun) === p.tahun);
          const isSubmitted = lap && ["Dikirim", "Disetujui"].includes(lap.status);
          if (isSubmitted) continue;

          const info = getReportDeadlineInfo(p.bulan, p.tahun);
          const periodeName = `${NAMA_BULAN[p.bulan - 1]} ${p.tahun}`;
          let stageKey = "";
          let notifTitle = "";
          let notifBody = "";

          if (info.isPassed) {
            stageKey = `${p.tahun}-${p.bulan}-PASSED`;
            notifTitle = `⚠️ Batas Laporan ${periodeName} Terlewati`;
            notifBody = info.allowLate
              ? `Tenggat (${info.formattedDate}) telah lewat. Segera kirim laporan kelompok Anda (akan tercatat dengan status Terlambat).`
              : `Waktu pelaporan periode ${periodeName} (${info.formattedDate}) telah ditutup oleh Admin Daerah.`;
          } else if (info.hoursLeft <= 6) {
            stageKey = `${p.tahun}-${p.bulan}-H6`;
            notifTitle = `🚨 ${info.hoursLeft} Jam Lagi Batas Laporan ${periodeName}!`;
            notifBody = `Segera kirim laporan bulanan kelompok Anda sebelum ${info.formattedDate}.`;
          } else if (info.daysLeft <= 1) {
            stageKey = `${p.tahun}-${p.bulan}-D1`;
            notifTitle = `⏰ Besok Batas Akhir Laporan ${periodeName}`;
            notifBody = `Pastikan Jurnal Guru, Presensi & Laporan Kegiatan dikirim sebelum ${info.formattedDate}.`;
          } else if (info.daysLeft <= 3) {
            stageKey = `${p.tahun}-${p.bulan}-D3`;
            notifTitle = `📅 Pengingat: ${info.daysLeft} Hari Lagi Batas Laporan ${periodeName}`;
            notifBody = `Jangan lupa lengkapi laporan pengajian kelompok sebelum ${info.formattedDate}.`;
          }

          if (stageKey && !deviceNotifState.sentReminderKeys[stageKey]) {
            deviceNotifState.sentReminderKeys[stageKey] = new Date().toISOString();
            persistDeviceNotifState();
            await triggerNativeDeviceNotification(notifTitle, notifBody, `digenara-rem-${stageKey}`, "laporan");
            break;
          }
        }
      }
    }

    async function fetchLatestAnnouncementsAndSettingsNow() {
      if (!isLiveSupabase || !supabaseClient || appState.isOfflineMode) return;
      try {
        const [resAnn, resCfg] = await Promise.all([
          supabaseClient.from("pengumuman").select("*").order("created_at", { ascending: false }),
          supabaseClient.from("pengaturan_sistem").select("*").eq("id", "default").maybeSingle()

        if (resAnn.data) {
          const prevIds = dbStore.pengumuman.map(a => a.id).join(",");

          if (prevIds !== nextIds) {
            hasChanges = true;

          dbStore.pengumuman = resAnn.data;

    let supabaseClient = null;
    let isLiveSupabase = false;
    let isWebSocketAllowed = true;

    function detectWebSocketSupport() {
      try {
        if (typeof window === "undefined" || typeof window.WebSocket === "undefined") {
          return false;
        }
        if (window.self !== window.top && String(window.location.protocol) === "blob:") {
          return false;
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function initSupabase(url, key) {
      const cleanUrl = String(url || "").trim().replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
      if (cleanUrl && key && window.supabase) {
        try {
          isWebSocketAllowed = detectWebSocketSupport();
          supabaseClient = window.supabase.createClient(cleanUrl, key);
          isLiveSupabase = true;
          return true;
        } catch (err) {
          console.error("Gagal menginisialisasi Supabase:", err);
        }
      }
      supabaseClient = null;
      isLiveSupabase = false;
      return false;
    }

    initSupabase(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

    // ============================================================================
    // HELPER MUTASI SUPABASE TAHAN BANTING & PENGATURAN KONEKSI DATABASE
    // ============================================================================
    async function resilientSupabaseMutation(table, operation, payload, matchObj = null, options = {}) {
      if (!isLiveSupabase || !supabaseClient) {
        return { data: null, error: null };
      }
      try {
        let query = supabaseClient.from(table);
        if (operation === "insert") {
          return await query.insert(payload);
        } else if (operation === "upsert") {
          return await query.upsert(payload, options);
        } else if (operation === "update") {
          let uq = query.update(payload);
          if (matchObj && typeof matchObj === "object") {
            Object.entries(matchObj).forEach(([k, v]) => {
              uq = uq.eq(k, v);
            });
          }
          return await uq;
        } else if (operation === "delete") {
          let dq = query.delete();
          if (matchObj && typeof matchObj === "object") {
            Object.entries(matchObj).forEach(([k, v]) => {
              dq = dq.eq(k, v);
            });
          }
          return await dq;
        }
        return { data: null, error: null };
      } catch (err) {
        console.error(`Supabase ${operation} error on ${table}:`, err);
        return { data: null, error: { message: err?.message || "Gagal terhubung ke database." } };
      }
    }

    async function upsertLaporanBulananSafe(lap) {
      if (!isLiveSupabase || !supabaseClient) {
        return { data: null, error: null };
      }
      const nowIso = new Date().toISOString();
      if (!lap.created_at) lap.created_at = nowIso;
      let payload = { ...lap, created_at: lap.created_at || nowIso };
      for (let attempt = 0; attempt < 6; attempt++) {
        const res = await resilientSupabaseMutation("laporan_bulanan", "upsert", payload, null, { onConflict: "kelompok_id,bulan,tahun" });
        if (!res.error) return res;
        const msg = String(res.error.message || "");
        const colMatch = msg.match(/Could not find the '([^']+)' column/i);
        if (colMatch && colMatch[1] && Object.prototype.hasOwnProperty.call(payload, colMatch[1])) {
          delete payload[colMatch[1]];
          continue;
        }
        return res;
      }
      return await resilientSupabaseMutation("laporan_bulanan", "upsert", payload, null, { onConflict: "kelompok_id,bulan,tahun" });
    }

    async function upsertLaporanMingguanSafe(rowsList) {
      if (!isLiveSupabase || !supabaseClient) {
        return { data: null, error: null };
      }
      const nowIso = new Date().toISOString();
      const arr = Array.isArray(rowsList) ? rowsList : [rowsList];
      let payloadList = arr.map(r => {
        if (!r.created_at) r.created_at = nowIso;
        return {
          ...r,
          tanggal: r.tanggal || null,
          created_at: r.created_at || nowIso
        };
      });
      for (let attempt = 0; attempt < 8; attempt++) {
        const res = await resilientSupabaseMutation("laporan_mingguan", "upsert", payloadList, null, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });
        if (!res.error) return res;
        const msg = String(res.error.message || "");
        const colMatch = msg.match(/Could not find the '([^']+)' column/i);
        if (colMatch && colMatch[1]) {
          const missingCol = colMatch[1];
          payloadList = payloadList.map(item => {
            const copy = { ...item };
            delete copy[missingCol];
            return copy;
          });
          continue;
        }
        if (/on conflict|unique or exclusion constraint/i.test(msg)) {
          const fallbackRes = await resilientSupabaseMutation("laporan_mingguan", "upsert", payloadList, null, { onConflict: "id" });
          if (!fallbackRes.error) return fallbackRes;
        }
        return res;
      }
      return await resilientSupabaseMutation("laporan_mingguan", "upsert", payloadList, null, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });
    }

    async function broadcastRealtimeEvent(eventName, payload) {
      if (!isLiveSupabase || !supabaseClient || !isWebSocketAllowed) return;
      try {
        if (deviceNotifState.realtimeChannel && deviceNotifState.realtimeSubscribed) {
          await deviceNotifState.realtimeChannel.send({
            type: "broadcast",
            event: eventName,
            payload
          });
          return;
        }
        const tempChannel = supabaseClient.channel("digenara-live-broadcast", {
          config: { broadcast: { ack: false, self: false } }
        });
        await new Promise((resolve) => {
          const timeout = setTimeout(() => {
            try { supabaseClient.removeChannel(tempChannel); } catch (e) {}
            resolve();
          }, 2500);
          tempChannel.subscribe(async (status) => {
            if (status === "SUBSCRIBED") {
              clearTimeout(timeout);
              await tempChannel.send({ type: "broadcast", event: eventName, payload });
              setTimeout(() => {
                try { supabaseClient.removeChannel(tempChannel); } catch (e) {}
                resolve();
              }, 250);
            }
          });
        });
      } catch (e) {
        isWebSocketAllowed = false;
      }
    }

    function attachGlobalWakeupSyncListeners() {
      if (deviceNotifState.listenersAttached) return;
      deviceNotifState.listenersAttached = true;

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          fetchLatestAnnouncementsAndSettingsNow();
          if (isWebSocketAllowed && !deviceNotifState.realtimeSubscribed) {
            setupSupabaseNotificationRealtime();
          }
        }
      });

      window.addEventListener("focus", () => {
        fetchLatestAnnouncementsAndSettingsNow();
      });

      window.addEventListener("online", () => {
        fetchLatestAnnouncementsAndSettingsNow();
        if (isWebSocketAllowed) {
          setupSupabaseNotificationRealtime();
        }
      });
    }

    function setupSupabaseNotificationRealtime() {
      attachGlobalWakeupSyncListeners();
      if (!isLiveSupabase || !supabaseClient) return;

      if (!deviceNotifState.pollTimer) {
        deviceNotifState.pollTimer = setInterval(() => {
          fetchLatestAnnouncementsAndSettingsNow();
        }, 4000);
      }

      if (!isWebSocketAllowed) return;

      try {
        if (deviceNotifState.reconnectTimer) {
          clearTimeout(deviceNotifState.reconnectTimer);
          deviceNotifState.reconnectTimer = null;
        }
        if (deviceNotifState.realtimeChannel) {
          supabaseClient.removeChannel(deviceNotifState.realtimeChannel);
          deviceNotifState.realtimeChannel = null;
          deviceNotifState.realtimeSubscribed = false;
        }

        const channel = supabaseClient
          .channel("digenara-live-broadcast", {
            config: { broadcast: { ack: false, self: false } }
          })
          .on("broadcast", { event: "new_announcement" }, async ({ payload }) => {
            if (payload && payload.id) {
              if (!dbStore.pengumuman.some(a => a.id === payload.id)) {
                dbStore.pengumuman.unshift(payload);
              }
              await checkAndDispatchAutoNotifications(false);
              if (appState.currentUser) renderApp();
            }
          })
          .on("broadcast", { event: "deadline_updated" }, async ({ payload }) => {
            if (payload) {
              applySystemSettingsObject(payload);
              await checkAndDispatchAutoNotifications(false);
              if (appState.currentUser) renderApp();
            }
          })
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "pengumuman" },
            async (payload) => {
              const newAnn = payload?.new;
              if (newAnn && newAnn.id) {
                if (!dbStore.pengumuman.some(a => a.id === newAnn.id)) {
                  dbStore.pengumuman.unshift(newAnn);
                }
                await checkAndDispatchAutoNotifications(false);
                if (appState.currentUser) renderApp();
              } else if (payload?.eventType === "DELETE") {
                await fetchLatestAnnouncementsAndSettingsNow();
              }
            }
          )
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "pengaturan_sistem" },
            async (payload) => {
              if (payload?.new) {
                applySystemSettingsObject(payload.new);
                await checkAndDispatchAutoNotifications(false);
                if (appState.currentUser) renderApp();
              }
            }
          )
          .subscribe((status, err) => {
            if (err && (err.name === "SecurityError" || String(err.message || "").includes("not allowed"))) {
              isWebSocketAllowed = false;
              deviceNotifState.realtimeSubscribed = false;
              try { supabaseClient.removeChannel(channel); } catch (e) {}
              deviceNotifState.realtimeChannel = null;
              return;
            }
            if (status === "SUBSCRIBED") {
              deviceNotifState.realtimeSubscribed = true;
            } else if (status === "CLOSED" || status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
              deviceNotifState.realtimeSubscribed = false;
              if (isWebSocketAllowed && !deviceNotifState.reconnectTimer) {
                deviceNotifState.reconnectTimer = setTimeout(() => {
                  deviceNotifState.reconnectTimer = null;
                  setupSupabaseNotificationRealtime();
                }, 4000);
              }
            }
          });

        deviceNotifState.realtimeChannel = channel;
      } catch (err) {
        isWebSocketAllowed = false;
        deviceNotifState.realtimeSubscribed = false;
        deviceNotifState.realtimeChannel = null;
      }
    }

    async function saveReportDeadlineSettings(dayVal, hourVal, allowLateVal, shouldCloseModal = false) {
      if (!appState.currentUser || appState.currentUser.role !== "admin") return;
      const cleanDay = Math.min(28, Math.max(1, dayVal || 5));
      const cleanHour = Math.min(23, Math.max(0, isNaN(hourVal) ? 21 : hourVal));
      const cleanAllowLate = Boolean(allowLateVal);

      const payload = {
        id: "default",
        batas_tanggal: cleanDay,
        batas_jam_wib: cleanHour,
        izinkan_terlambat: cleanAllowLate,
        updated_by: appState.currentUser.id,
        updated_at: new Date().toISOString()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengaturan_sistem", "upsert", payload, null, { onConflict: "id" });
        if (res.error) {
          showToast("Gagal menyimpan batas pelaporan ke database: " + res.error.message, "error");
          return;
        }
      }

      applySystemSettingsObject(payload);
      await broadcastRealtimeEvent("deadline_updated", payload);
      if (shouldCloseModal) closeModal();
      const hhStr = String(cleanHour).padStart(2, "0");
      showToast(`Batas pelaporan diperbarui: Tanggal ${cleanDay} pukul ${hhStr}.00 WIB!`, "success");
      logActivity("Atur Batas Pelaporan", `Tgl ${cleanDay} pukul ${hhStr}.00 WIB (${cleanAllowLate ? "Izinkan Terlambat" : "Kunci Otomatis"})`);
      await checkAndDispatchAutoNotifications(false);
      renderApp();
    }

    async function fetchOrRepairProfile(userId, usernameHint = "") {
      if (!isLiveSupabase || !supabaseClient) return null;
      let { data: profile } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();

      if (!profile && usernameHint === "admin_jepara") {
        const repaired = await resilientSupabaseMutation(
          "profiles",
          "upsert",
          {
            id: userId,
            username: "admin_jepara",
            role: "admin",
            nama_kelompok: "Pengurus Daerah Generus Jepara",
            nama_desa: "",
            avatar_url: "",
            daftar_guru: ["Admin Daerah Jepara"],
            jumlah_guru: 1,
            jumlah_rombel: 0,
            status_akun: "approved"
          },
          null,
          { onConflict: "id" }
        );
        if (!repaired.error) {
          const retry = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
          profile = retry.data;
        }
      }
      return profile;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = sanitizeUsername(document.getElementById("loginUsername")?.value.trim() || "");
      const password = document.getElementById("loginPassword")?.value || "";

      if (!username || !password) {
        showToast("Masukkan username dan password Anda.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          const internalEmail = username + APP_CONFIG.INTERNAL_EMAIL_DOMAIN;
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: internalEmail,
            password
          });
          if (error) throw error;

          const profile = await fetchOrRepairProfile(data.user.id, username);
          if (!profile) {
            await supabaseClient.auth.signOut();
            showToast("Profil akun tidak ditemukan di database.", "error");
            return;
          }

          if (profile.status_akun === "pending") {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
            return;
          }
          if (profile.status_akun === "rejected") {
            await supabaseClient.auth.signOut();
            showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
            return;
          }
          if (!isAccountActiveStatus(profile.status_akun)) {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
            return;
          }

          await syncAllFromSupabase();
          await completeUserSession(profile);
          return;
        } catch (err) {
          showToast("Login gagal: " + (err.message || "Username atau password salah."), "error");
          return;
        }
      }

      const user = dbStore.profiles.find(p => p.username === username);
      if (!user || user.password_hash !== password) {
        showToast("Username atau password tidak sesuai.", "error");
        return;
      }
      if (user.status_akun === "pending") {
        showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
        return;
      }
      if (user.status_akun === "rejected") {
        showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
        return;
      }
      if (!isAccountActiveStatus(user.status_akun)) {
        showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
        return;
      }

      await completeUserSession(user);
    }

    // RESOLUSI URL FOTO DOKUMENTASI AGAR SELALU TERBACA (PUBLIC / PRIVATE / BLOB)
    // ============================================================================
    function extractStoragePathFromDok(doc) {
      if (!doc) return "";
      if (doc.file_path && String(doc.file_path).trim() !== "") {
        return String(doc.file_path).trim().replace(/^\/+/, "");
      }
      const rawUrl = String(doc.foto_url || "");
      const match = rawUrl.match(/\/storage\/v1\/object\/(?:public|sign|authenticated)\/([^?]+)/i);
      if (match && match[1]) {
        const fullPath = decodeURIComponent(match[1]);
        const bucketPrefix = `${APP_CONFIG.STORAGE_BUCKET}/`;
        if (fullPath.startsWith(bucketPrefix)) {
          return fullPath.slice(bucketPrefix.length);
        }
        const slashIdx = fullPath.indexOf("/");
        if (slashIdx > 0) {
          return fullPath.slice(slashIdx + 1);
        }
      }
      return "";
    }

    function getDokumentasiDisplayUrl(doc) {
      if (!doc) return "";
      return doc.resolved_url || doc.foto_url || "";
    }

    async function resolveSingleDokumentasiUrl(doc) {
      if (!doc) return "";
      const rawUrl = String(doc.foto_url || "").trim();
      if (rawUrl.startsWith("data:image/") || rawUrl.startsWith("blob:")) {
        doc.resolved_url = rawUrl;
        return rawUrl;
      }
      if (!isLiveSupabase || !supabaseClient) {
        return rawUrl;
      }
      const storagePath = extractStoragePathFromDok(doc);
      if (!storagePath) {
        return rawUrl;
      }
      try {
        const { data, error } = await supabaseClient.storage
          .from(APP_CONFIG.STORAGE_BUCKET)
          .createSignedUrl(storagePath, 60 * 60 * 24 * 7);
        if (!error && data?.signedUrl) {
          doc.resolved_url = data.signedUrl;
          return data.signedUrl;
        }
      } catch (e) {}

      try {
        const { data: blobData, error: dlErr } = await supabaseClient.storage
          .from(APP_CONFIG.STORAGE_BUCKET)
          .download(storagePath);
        if (!dlErr && blobData) {
          const objUrl = URL.createObjectURL(blobData);
          doc.resolved_url = objUrl;
          return objUrl;
        }
      } catch (e) {}

      return rawUrl;
    }

    async function resolveDokumentasiImageUrls() {
      const list = Array.isArray(dbStore.dokumentasi_kegiatan) ? dbStore.dokumentasi_kegiatan : [];
      await Promise.all(list.map(doc => resolveSingleDokumentasiUrl(doc)));
    }

    async function handleDokumentasiImgError(imgEl, docId) {
      if (!imgEl) return;
      const doc = dbStore.dokumentasi_kegiatan.find(d => d.id === docId);
      if (doc && !imgEl.dataset.retried) {
        imgEl.dataset.retried = "1";
        doc.resolved_url = "";
        const freshUrl = await resolveSingleDokumentasiUrl(doc);
        if (freshUrl && freshUrl !== imgEl.src) {
          imgEl.src = freshUrl;
          return;
        }
      }
      imgEl.onerror = null;
      imgEl.src = "https://placehold.co/640x360/e2e8f0/475569?text=Foto+Dokumentasi";
    }

    async function syncAllFromSupabase() {
      if (!isLiveSupabase || !supabaseClient) return;
      try {
        const [
          resProfiles, resRombel, resPeserta, resJurnal,
          resPresensi, resLapBul, resLapMing, resDok, resKendala, resAnn, resLog, resSysCfg
        ] = await Promise.all([
          supabaseClient.from("profiles").select("*").order("created_at", { ascending: true }),
          supabaseClient.from("rombel").select("*").order("urutan", { ascending: true }),
          supabaseClient.from("peserta").select("*").order("nama_peserta", { ascending: true }),
          supabaseClient.from("jurnal_guru").select("*").order("tanggal", { ascending: false }),
          supabaseClient.from("presensi").select("*"),
          supabaseClient.from("laporan_bulanan").select("*"),
          supabaseClient.from("laporan_mingguan").select("*").order("minggu_ke", { ascending: true }),
          supabaseClient.from("dokumentasi_kegiatan").select("*").order("tanggal", { ascending: false }),
          supabaseClient.from("kendala_evaluasi").select("*").order("created_at", { ascending: false }),
          supabaseClient.from("pengumuman").select("*").order("created_at", { ascending: false }),
          supabaseClient.from("log_aktivitas").select("*").order("created_at", { ascending: false }).limit(50),
          supabaseClient.from("pengaturan_sistem").select("*").eq("id", "default").maybeSingle()
        ]);

        if (resProfiles.data) dbStore.profiles = resProfiles.data;
        if (resRombel.data) dbStore.rombel = resRombel.data;
        if (resPeserta.data) {
          dbStore.peserta = resPeserta.data;
          mergePesertaExtraFields();
        }
        if (resJurnal.data) dbStore.jurnal_guru = resJurnal.data;
        if (resPresensi.data) dbStore.presensi = resPresensi.data;
        if (resLapBul.data) dbStore.laporan_bulanan = resLapBul.data;
        if (resLapMing.data) dbStore.laporan_mingguan = resLapMing.data;
        if (resDok.data) {
          dbStore.dokumentasi_kegiatan = resDok.data;
          await resolveDokumentasiImageUrls();
        }
        if (resKendala.data) {
          dbStore.kendala_evaluasi = resKendala.data;
          mergeKendalaExtraFields();
        }
        try {
          const resGuru = await supabaseClient.from("guru_pengajar").select("*").order("created_at", { ascending: true });
          if (!resGuru.error && Array.isArray(resGuru.data)) {
            dbStore.guru_pengajar = resGuru.data;
          }
        } catch (e) {}
        mergeGuruPengajarCache();
        if (resAnn.data) dbStore.pengumuman = resAnn.data;
        if (resLog.data) dbStore.log_aktivitas = resLog.data;
        if (resSysCfg && resSysCfg.data) applySystemSettingsObject(resSysCfg.data);
      } catch (err) {
        console.error("Sinkronisasi Supabase error:", err);
      }
    }

    const GURU_DETAIL_STORAGE_KEY = "digenara_guru_detail_v1";

    function loadGuruDetailCache() {
      try {
        return JSON.parse(localStorage.getItem(GURU_DETAIL_STORAGE_KEY) || "{}") || {};
      } catch (e) {
        return {};
      }
    }

    function saveGuruDetailCache(kelompokId, list) {
      if (!kelompokId) return;
      try {
        const cache = loadGuruDetailCache();
        cache[kelompokId] = Array.isArray(list) ? list : [];
        localStorage.setItem(GURU_DETAIL_STORAGE_KEY, JSON.stringify(cache));
      } catch (e) {}
    }

    function mergeGuruPengajarCache() {
      const cache = loadGuruDetailCache();
      Object.entries(cache).forEach(([kelId, cachedList]) => {
        if (!Array.isArray(cachedList)) return;
        cachedList.forEach(item => {
          const idx = dbStore.guru_pengajar.findIndex(
            g => g.id === item.id || (g.kelompok_id === kelId && String(g.nama_guru || "").trim().toLowerCase() === String(item.nama_guru || "").trim().toLowerCase())
          );
          if (idx >= 0) {
            dbStore.guru_pengajar[idx] = {
              ...item,
              ...dbStore.guru_pengajar[idx],
              foto_url: dbStore.guru_pengajar[idx].foto_url || item.foto_url || "",
              kategori: dbStore.guru_pengajar[idx].kategori || item.kategori || "Guru Pengajar",
              no_wa: dbStore.guru_pengajar[idx].no_wa || item.no_wa || "",
              kelas_ampu: dbStore.guru_pengajar[idx].kelas_ampu || item.kelas_ampu || ""
            };
          } else {
            dbStore.guru_pengajar.push({ ...item, kelompok_id: kelId });
          }
        });
      });
    }

    function getGroupGuruProfiles(kelompokId) {
      if (!kelompokId) return [];
      mergeGuruPengajarCache();
      const prof = dbStore.profiles.find(p => p.id === kelompokId);
      const existing = dbStore.guru_pengajar.filter(g => g.kelompok_id === kelompokId);
      const nameList = Array.isArray(prof?.daftar_guru) ? prof.daftar_guru.filter(Boolean) : [];

      const result = [...existing];
      nameList.forEach(rawName => {
        const cleanName = String(rawName || "").trim();
        if (!cleanName) return;
        const alreadyExists = result.some(
          g => String(g.nama_guru || "").trim().toLowerCase() === cleanName.toLowerCase()
        );
        if (!alreadyExists) {
          const autoRow = {
            id: generateUUID(),
            kelompok_id: kelompokId,
            nama_guru: cleanName,
            kategori: "Guru Pengajar",
            foto_url: "",
            no_wa: "",
            kelas_ampu: "",
            created_at: prof?.created_at || new Date().toISOString()
          };
          dbStore.guru_pengajar.push(autoRow);
          result.push(autoRow);
        }
      });

      return result;
    }

    async function saveGuruPengajarForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const namaGuru = document.getElementById("gpNama").value.trim();
      const kategori = document.getElementById("gpKategori").value;
      const kelasAmpu = document.getElementById("gpKelasAmpu").value.trim();
      const noWa = document.getElementById("gpNoWa").value.trim();

      if (!namaGuru) {
        showToast("Nama Guru Pengajar / MT wajib diisi.", "warning");
        return;
      }

      const existingItem = editId ? dbStore.guru_pengajar.find(g => g.id === editId) : null;
      let finalFotoUrl = existingItem?.foto_url || "";

      if (appState.pendingGuruPhotoRemove) {
        finalFotoUrl = "";
      } else if (appState.pendingGuruPhotoDataUrl) {
        finalFotoUrl = appState.pendingGuruPhotoDataUrl;
        if (isLiveSupabase && supabaseClient && appState.pendingGuruPhotoBlob) {
          try {
            const path = `${uid}/guru_${Date.now()}.jpg`;
            const up = await supabaseClient.storage
              .from(APP_CONFIG.STORAGE_BUCKET)
              .upload(path, appState.pendingGuruPhotoBlob, { contentType: "image/jpeg", upsert: true });
            if (!up.error) {
              const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(path);
              if (pub?.data?.publicUrl) {
                finalFotoUrl = pub.data.publicUrl;
              }
            }
          } catch (err) {}
        }
      }

      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        nama_guru: namaGuru,
        kategori,
        foto_url: finalFotoUrl,
        kelas_ampu: kelasAmpu,
        no_wa: noWa,
        created_at: existingItem?.created_at || new Date().toISOString()
      };

      if (editId) {
        const idx = dbStore.guru_pengajar.findIndex(g => g.id === editId);
        if (idx >= 0) dbStore.guru_pengajar[idx] = { ...dbStore.guru_pengajar[idx], ...payload };
      } else {
        dbStore.guru_pengajar.push(payload);
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          await resilientSupabaseMutation("guru_pengajar", "upsert", payload, null, { onConflict: "id" });
        } catch (err) {}
      }

      await syncGroupGuruNamesToProfile(uid);

    async function saveAccountSettingsForm(e) {
      e.preventDefault();
      const user = appState.currentUser;
      if (!user) return;

      const newNamaKelompok = document.getElementById("accNamaKelompok").value.trim();
      const newUsername = sanitizeUsername(document.getElementById("accUsername").value.trim());
      const newPassword = document.getElementById("accNewPassword").value;

      if (!newNamaKelompok) {
        showToast("Nama kelompok/tampilan wajib diisi.", "warning");
        return;
      }
      if (newUsername.length < 4) {
        showToast("Username minimal 4 karakter.", "warning");
        return;
      }
      if (newPassword && newPassword.length < 8) {
        showToast("Password baru minimal 8 karakter.", "warning");
        return;
      }

      let newDesa = user.nama_desa || "";
      let newGurus = user.daftar_guru || [];
      if (user.role === "user") {
        newDesa = document.getElementById("accNamaDesa")?.value || newDesa;
        const rawGurus = document.getElementById("accDaftarGuru")?.value || "";
        const parsedGurus = rawGurus.split("\n").map(s => s.trim()).filter(Boolean);
        if (parsedGurus.length > 0) {
          newGurus = parsedGurus;
        }
      }

      let finalAvatarUrl = user.avatar_url || "";
      if (appState.pendingAvatarRemove) {
        finalAvatarUrl = "";
      } else if (appState.pendingAvatarDataUrl) {
        finalAvatarUrl = appState.pendingAvatarDataUrl;
        if (isLiveSupabase && supabaseClient && appState.pendingAvatarBlob) {
          try {
            const path = `${user.id}/avatar_${Date.now()}.jpg`;
            const up = await supabaseClient.storage
              .from(APP_CONFIG.STORAGE_BUCKET)
              .upload(path, appState.pendingAvatarBlob, { contentType: "image/jpeg", upsert: true });
            if (!up.error) {
              const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(path);
              if (pub?.data?.publicUrl) {
                finalAvatarUrl = pub.data.publicUrl;
              }
            }
          } catch (err) {}
        }
      }

      if (isLiveSupabase && supabaseClient) {
        if (newUsername !== user.username) {
          const rpcRes = await supabaseClient.rpc("update_own_username", { new_username: newUsername });
          if (rpcRes.error) {
            showToast("Gagal mengubah username: " + rpcRes.error.message, "error");
            return;
          }
        }
        if (newPassword) {
          const pwRes = await supabaseClient.auth.updateUser({ password: newPassword });
          if (pwRes.error) {
            showToast("Gagal mengganti password: " + pwRes.error.message, "error");
            return;
          }
        }
        const updatePayload = {
          nama_kelompok: newNamaKelompok,
          nama_desa: newDesa,
          avatar_url: finalAvatarUrl,
          daftar_guru: newGurus,
          jumlah_guru: newGurus.length
        };
        const profRes = await resilientSupabaseMutation("profiles", "update", updatePayload, { id: user.id });
        if (profRes.error) {
          showToast("Gagal menyimpan profil: " + profRes.error.message, "error");
          return;
        }
      } else {
        if (newUsername !== user.username && dbStore.profiles.some(p => p.username === newUsername && p.id !== user.id)) {
          showToast("Username sudah digunakan akun lain.", "error");
          return;
        }
        if (newPassword) user.password_hash = newPassword;
      }

      user.username = newUsername;
      user.nama_kelompok = newNamaKelompok;
      user.nama_desa = newDesa;
      user.avatar_url = finalAvatarUrl;
      user.daftar_guru = newGurus;
      user.jumlah_guru = newGurus.length;

      const inStore = dbStore.profiles.find(p => p.id === user.id);
      if (inStore) Object.assign(inStore, user);
      getGroupGuruProfiles(user.id);
      saveGuruDetailCache(user.id, dbStore.guru_pengajar.filter(g => g.kelompok_id === user.id));

      closeModal();
      showToast("Pengaturan akun & profil berhasil diperbarui!", "success");
      logActivity("Update Profil Akun", `Memperbarui profil ${newNamaKelompok}`);
      renderApp();
    }

    function calculatePresensiSummary(kelompokId, bulan, tahun, rombelId = null) {
      const recs = dbStore.presensi.filter(p =>
        p.kelompok_id === kelompokId &&
        Number(p.bulan) === Number(bulan) &&
        Number(p.tahun) === Number(tahun) &&
        (!rombelId || p.rombel_id === rombelId)
      );
      const total = recs.length;
      const H = recs.filter(r => r.status === "H").length;
      const I = recs.filter(r => r.status === "I").length;
      const S = recs.filter(r => r.status === "S").length;
      const A = recs.filter(r => r.status === "A").length;
      const pctH = total > 0 ? Math.round((H / total) * 100) : 0;
      const uniqueDates = Array.from(new Set(recs.map(r => r.tanggal))).sort();
      return { total, H, I, S, A, pctH, uniqueDates };
    }

    function compressImageFile(file, maxWidth = APP_CONFIG.MAX_PHOTO_WIDTH, targetKB = APP_CONFIG.TARGET_PHOTO_KB) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);

            let quality = 0.82;
            let dataUrl = canvas.toDataURL("image/jpeg", quality);
            while (Math.round((dataUrl.length * 3) / 4 / 1024) > targetKB && quality > 0.35) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL("image/jpeg", quality);
            }

            canvas.toBlob(
              (blob) => {
                const sizeKB = blob ? Math.max(1, Math.round(blob.size / 1024)) : Math.round((dataUrl.length * 3) / 4 / 1024);
                resolve({ blob, dataUrl, sizeKB });
              },
              "image/jpeg",
              quality
            );
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function exportToExcelFile(rows, sheetName, fileName) {
      if (!rows || rows.length === 0) {
        showToast("Tidak ada data untuk diekspor.", "warning");
        return;
      }
      try {
        if (window.XLSX) {
          const ws = XLSX.utils.json_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, String(sheetName || "Data").slice(0, 31));
          XLSX.writeFile(wb, fileName);
          showToast(`File Excel "${fileName}" berhasil diunduh!`, "success");
        } else {
          const headers = Object.keys(rows[0]);
          const csv = [
            headers.join(","),
            ...rows.map(r => headers.map(h => `"${String(r[h] ?? "").replace(/"/g, '""')}"`).join(","))
          ].join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = fileName.replace(/\.xlsx$/i, ".csv");
          link.click();
          showToast("File CSV berhasil diunduh!", "success");
        }
      } catch (err) {
        showToast("Gagal mengekspor file Excel: " + err.message, "error");
      }
    }

      const deadlineInfo = getReportDeadlineInfo(bulan, tahun);
      const notifStatus = getDeviceNotificationStatusInfo();

      const myRombels = getGroupRombels(uid);
      const myPeserta = dbStore.peserta.filter(p => p.kelompok_id === uid && p.aktif);
      const myGurus = getGroupGuruProfiles(uid);
      const myJurnal = dbStore.jurnal_guru.filter(j => {
        const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
        return j.kelompok_id === uid && jm === bulan && jy === tahun;
      });
      const presSummary = calculatePresensiSummary(uid, bulan, tahun);
      const myLaporan = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      const myPhotos = dbStore.dokumentasi_kegiatan.filter(d => d.kelompok_id === uid && Number(d.bulan) === bulan && Number(d.tahun) === tahun);
      const myKendala = dbStore.kendala_evaluasi.filter(k => k.kelompok_id === uid && Number(k.bulan) === bulan && Number(k.tahun) === tahun);

      const checklistItems = [
        {
          done: myJurnal.length > 0,
          label: "1. Jurnal Guru Mengajar",
          desc: myJurnal.length > 0 ? `${myJurnal.length} pertemuan tercatat` : "Belum ada jurnal bulan ini",
          tab: "jurnal"
        },
        {
          done: presSummary.total > 0,
          label: "2. Presensi Peserta",
          desc: presSummary.total > 0 ? `${presSummary.uniqueDates.length} hari (${presSummary.pctH}% hadir)` : "Belum ada presensi bulan ini",
          tab: "presensi"
        },
        {
          done: Boolean(myLaporan && ["Dikirim", "Disetujui"].includes(myLaporan.status)),
          label: "3. Laporan Kegiatan Bulanan",
          desc: myLaporan ? `Status: ${myLaporan.status}${myLaporan.terlambat ? " (Terlambat)" : ""}` : "Belum dibuat / dikirim",
          tab: "laporan"
        },
        {
          done: myPhotos.length > 0,
          label: "4. Dokumentasi Kegiatan",
          desc: `${myPhotos.length} dari ${APP_CONFIG.MAX_PHOTOS_PER_MONTH} foto terunggah`,
          tab: "dokumentasi"
        },
        {
          done: myKendala.length > 0,
          label: "5. Kendala & Evaluasi",
          desc: myKendala.length > 0 ? `${myKendala.length} catatan evaluasi` : "Opsional jika ada hambatan",
          tab: "kendala"
        }
      ];

      const chartMonths = [];
      for (let i = 5; i >= 0; i--) {
        let m = bulan - i;
        let y = tahun;
        while (m <= 0) { m += 12; y -= 1; }
        const s = calculatePresensiSummary(uid, m, y);
        chartMonths.push({ label: NAMA_BULAN[m - 1].slice(0, 3), pct: s.pctH });
      }

      return `
        <div class="space-y-6">

      const q = appState.pesertaSearch.trim().toLowerCase();

        const matchRombel = appState.pesertaFilterRombel === "ALL" || p.rombel_id === appState.pesertaFilterRombel;

          !q ||
          String(p.nama_peserta || "").toLowerCase().includes(q) ||
          String(p.nama_wali || "").toLowerCase().includes(q) ||
          String(p.pendidikan_sekolah || "").toLowerCase().includes(q) ||
          String(p.alamat || "").toLowerCase().includes(q) ||
          getRombelName(p.rombel_id).toLowerCase().includes(q);
        return matchRombel && matchGender && matchQ;

    async function generateAllStandardKelasPengajian() {
      const uid = appState.currentUser.id;
      const existing = getGroupRombels(uid);
      const existingNamesLower = new Set(existing.map(r => String(r.nama_rombel || "").trim().toLowerCase()));
      const toCreate = STANDARD_KELAS_OPTIONS.filter(name => !existingNamesLower.has(name.toLowerCase()));

      if (toCreate.length === 0) {
        showToast("Semua 6 kelas pengajian standar sudah tersedia.", "info");
        return;
      }

      const newRows = toCreate.map((nama, i) => ({
        id: generateUUID(),
        kelompok_id: uid,
        nama_rombel: nama,
        pertemuan_per_minggu: isMudaMudiRombel(nama) ? 2 : 5,
        urutan: existing.length + i + 1
      }));

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("rombel", "insert", newRows);
        if (res.error) {
          showToast("Gagal membuat kelas standar: " + res.error.message, "error");
          return;
        }
      }

      dbStore.rombel.push(...newRows);
      if (!appState.presensiSelectedRombel) appState.presensiSelectedRombel = newRows[0].id;
      if (!appState.laporanSelectedRombel) appState.laporanSelectedRombel = newRows[0].id;

      showToast(`${newRows.length} kelas pengajian standar berhasil dibuat!`, "success");
      logActivity("Buat Kelas Standar", `Menambahkan ${newRows.length} kelas pengajian standar`);
      renderApp();
    }

    async function saveKelasPengajianForm(e, editRombelId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const nama = document.getElementById("kelasNamaInput").value.trim();
      const freq = Math.min(7, Math.max(1, parseInt(document.getElementById("kelasFreqInput").value, 10) || 5));

      if (!nama) {
        showToast("Nama kelas pengajian wajib diisi.", "warning");
        return;
      }

      if (editRombelId) {
        const target = dbStore.rombel.find(r => r.id === editRombelId);
        if (!target) return;
        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation(
            "rombel",
            "update",
            { nama_rombel: nama, pertemuan_per_minggu: freq },
            { id: editRombelId }
          );
          if (res.error) {
            showToast("Gagal memperbarui kelas: " + res.error.message, "error");
            return;
          }
        }
        target.nama_rombel = nama;
        target.pertemuan_per_minggu = freq;
        closeModal();
        showToast(`Kelas "${nama}" berhasil diperbarui!`, "success");
      } else {
        const currentRombels = getGroupRombels(uid);
        const newRow = {
          id: generateUUID(),
          kelompok_id: uid,
          nama_rombel: nama,
          pertemuan_per_minggu: freq,
          urutan: currentRombels.length + 1
        };
        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("rombel", "insert", newRow);
          if (res.error) {
            showToast("Gagal menambah kelas: " + res.error.message, "error");
            return;
          }
        }
        dbStore.rombel.push(newRow);
        if (!appState.presensiSelectedRombel) appState.presensiSelectedRombel = newRow.id;
        if (!appState.laporanSelectedRombel) appState.laporanSelectedRombel = newRow.id;
        closeModal();
        showToast(`Kelas pengajian "${nama}" berhasil ditambahkan!`, "success");
      }
      renderApp();
    }

    function deleteKelasPengajianItem(rombelId) {
      const target = dbStore.rombel.find(r => r.id === rombelId);
      if (!target) return;
      const santriCount = dbStore.peserta.filter(p => p.rombel_id === rombelId && p.aktif).length;
      if (santriCount > 0) {
        showToast(`Masih ada ${santriCount} santri aktif di kelas "${target.nama_rombel}". Pindahkan atau hapus santri terlebih dahulu sebelum menghapus kelas.`, "warning");
        return;
      }
      confirmDialog(
        "Hapus Kelas Pengajian?",
        `Kelas "${target.nama_rombel}" akan dihapus dari daftar kelas pengajian kelompok Anda.`,
        async () => {
          if (isLiveSupabase && supabaseClient) {
            const res = await resilientSupabaseMutation("rombel", "delete", null, { id: rombelId });
            if (res.error) {
              showToast("Gagal menghapus kelas: " + res.error.message, "error");
              return;
            }
          }
          dbStore.rombel = dbStore.rombel.filter(r => r.id !== rombelId);
          if (appState.pesertaFilterRombel === rombelId) appState.pesertaFilterRombel = "ALL";
          if (appState.presensiSelectedRombel === rombelId) {
            appState.presensiSelectedRombel = getGroupRombels(appState.currentUser.id)[0]?.id || "";
          }
          showToast("Kelas pengajian berhasil dihapus.", "info");
          renderApp();
        },
        "Hapus Kelas",
        true
      );
    }

    async function saveSantriLengkapForm(e, editPesertaId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const nama = document.getElementById("sNamaInput").value.trim();
      const jk = document.getElementById("sGenderInput").value || "L";
      const rawRombelVal = document.getElementById("sRombelSelectInput").value;
      const tempatLahir = document.getElementById("sTempatLahirInput").value.trim();
      const tanggalLahir = document.getElementById("sTanggalLahirInput").value || "";
      const pendidikan = document.getElementById("sPendidikanInput").value.trim();
      const noWaWali = document.getElementById("sNoWaWaliInput").value.trim();
      const namaWali = document.getElementById("sNamaWaliInput").value.trim();
      const alamat = document.getElementById("sAlamatInput").value.trim();

      if (!nama) {
        showToast("Nama lengkap santri wajib diisi.", "warning");
        return;
      }

      let rombelId = rawRombelVal;
      if (rawRombelVal.startsWith("PRESET::")) {
        const presetClassName = rawRombelVal.slice("PRESET::".length);
        const existingRombel = getGroupRombels(uid).find(
          r => String(r.nama_rombel || "").trim().toLowerCase() === presetClassName.toLowerCase()
        );
        if (existingRombel) {
          rombelId = existingRombel.id;
        } else {
          const newRombelRow = {
            id: generateUUID(),
            kelompok_id: uid,
            nama_rombel: presetClassName,
            pertemuan_per_minggu: isMudaMudiRombel(presetClassName) ? 2 : 5,
            urutan: getGroupRombels(uid).length + 1
          };
          if (isLiveSupabase && supabaseClient) {
            await resilientSupabaseMutation("rombel", "insert", newRombelRow);
          }
          dbStore.rombel.push(newRombelRow);
          rombelId = newRombelRow.id;
        }
      }

      if (!rombelId) {
        showToast("Pilih kelas pengajian terlebih dahulu.", "warning");
        return;
      }

      const jenjangUsia = getRombelName(rombelId);
      const id = editPesertaId || generateUUID();

      const coreRow = {
        id,
        kelompok_id: uid,
        rombel_id: rombelId,
        nama_peserta: nama,
        jenis_kelamin: jk,
        aktif: true
      };

      const fullRow = {
        ...coreRow,
        tempat_lahir: tempatLahir,
        tanggal_lahir: tanggalLahir || null,
        pendidikan_sekolah: pendidikan,
        nama_wali: namaWali,
        no_wa_wali: noWaWali,
        alamat,
        jenjang_usia: jenjangUsia
      };

      if (isLiveSupabase && supabaseClient) {
        let res = editPesertaId
          ? await resilientSupabaseMutation("peserta", "update", fullRow, { id: editPesertaId })
          : await resilientSupabaseMutation("peserta", "insert", fullRow);
        if (res.error) {
          res = editPesertaId
            ? await resilientSupabaseMutation("peserta", "update", coreRow, { id: editPesertaId })
            : await resilientSupabaseMutation("peserta", "insert", coreRow);
          if (res.error) {
            showToast("Gagal menyimpan data santri: " + res.error.message, "error");
            return;
          }
        }
      }

      if (editPesertaId) {
        const idx = dbStore.peserta.findIndex(p => p.id === editPesertaId);
        if (idx >= 0) dbStore.peserta[idx] = { ...dbStore.peserta[idx], ...fullRow };
      } else {
        dbStore.peserta.push(fullRow);
      }

      savePesertaExtraCache(id, {
        tempat_lahir: tempatLahir,
        tanggal_lahir: tanggalLahir,
        pendidikan_sekolah: pendidikan,
        nama_wali: namaWali,
        no_wa_wali: noWaWali,
        alamat,
        jenjang_usia: jenjangUsia
      });

      if (!appState.presensiSelectedRombel) appState.presensiSelectedRombel = rombelId;
      closeModal();
      showToast(
        editPesertaId
          ? `Data santri "${nama}" berhasil diperbarui!`
          : `Santri "${nama}" berhasil didaftarkan ke kelas ${jenjangUsia}!`,
        "success"
      );
      logActivity(editPesertaId ? "Edit Data Santri" : "Daftarkan Santri Baru", `${nama} (${jenjangUsia})`);
      renderApp();
    }

    async function quickChangeSantriKelas(pesertaId, newRombelId) {
      const target = dbStore.peserta.find(p => p.id === pesertaId);
      if (!target || !newRombelId || target.rombel_id === newRombelId) return;
      const newClassName = getRombelName(newRombelId);

      if (isLiveSupabase && supabaseClient) {
