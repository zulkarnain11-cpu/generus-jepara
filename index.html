      const namaWali = document.getElementById("pNamaWaliInput")?.value.trim() || "";
      const rombelName = getRombelName(rombelId);
      if (!nama) return;

      const targetId = editId || generateUUID();
      const coreRow = {
        id: targetId,
        kelompok_id: uid,
        rombel_id: rombelId,
        nama_peserta: nama,
        jenis_kelamin: jk,
        aktif: true
      };

      const fullRow = {
        ...coreRow,
        jenjang_usia: rombelName,
        tempat_lahir: tempatLahir,
        tanggal_lahir: tanggalLahir,
        nama_wali: namaWali
      };

      savePesertaExtraCache(targetId, {
        jenjang_usia: rombelName,
        tempat_lahir: tempatLahir,
        tanggal_lahir: tanggalLahir,
        nama_wali: namaWali
      });

      if (isLiveSupabase && supabaseClient) {
        if (editId) {
          let res = await resilientSupabaseMutation("peserta", "update", fullRow, { id: editId });
          if (res.error) {
            res = await resilientSupabaseMutation("peserta", "update", coreRow, { id: editId });
          }
          if (res.error) {
            showToast("Gagal memperbarui peserta: " + res.error.message, "error");
            return;
          }
        } else {
          let res = await resilientSupabaseMutation("peserta", "insert", fullRow);
          if (res.error) {
            res = await resilientSupabaseMutation("peserta", "insert", coreRow);
          }
          if (res.error) {
            showToast("Gagal menambah peserta: " + res.error.message, "error");
            return;
          }
        }
      }

      if (editId) {
        const idx = dbStore.peserta.findIndex(p => p.id === editId);
        if (idx >= 0) dbStore.peserta[idx] = { ...dbStore.peserta[idx], ...fullRow };
        showToast("Biodata generus diperbarui & tersinkron ke Admin!", "success");
      } else {
        dbStore.peserta.push(fullRow);
        showToast("Peserta ditambahkan & tersinkron ke Data Generus Admin!", "success");
      }

      openManagePesertaModal();
      renderApp();
    }

    async function importPesertaFromExcel(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      if (!rombelId) {
        showToast("Pilih kelas terlebih dahulu sebelum impor.", "warning");
        return;
      }

      try {
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const jsonRows = XLSX.utils.sheet_to_json(sheet);
        const rombelName = getRombelName(rombelId);
        const coreBatch = [];
        const fullBatch = [];

        jsonRows.forEach(r => {
          const nama = String(r.Nama || r.nama || r.nama_peserta || r["Nama Lengkap"] || "").trim();
          const jkRaw = String(r.JK || r.jk || r.jenis_kelamin || r["Jenis Kelamin"] || "L").trim().toUpperCase();
          const jk = jkRaw.startsWith("P") ? "P" : "L";
          const tempatLahir = String(r.Tempat_Lahir || r["Tempat Lahir"] || r.tempat_lahir || "").trim();
          const tanggalLahir = String(r.Tanggal_Lahir || r["Tanggal Lahir"] || r.tanggal_lahir || "").trim();
          const namaWali = String(r.Nama_Wali || r["Nama Wali"] || r.Orang_Tua || r["Orang Tua"] || r.nama_wali || "").trim();

          if (nama) {
            const pid = generateUUID();
            const cRow = {
              id: pid,
              kelompok_id: uid,
              rombel_id: rombelId,
              nama_peserta: nama,
              jenis_kelamin: jk,
              aktif: true
            };
            const fRow = {
              ...cRow,
              jenjang_usia: rombelName,
              tempat_lahir: tempatLahir,
              tanggal_lahir: tanggalLahir,
              nama_wali: namaWali
            };
            savePesertaExtraCache(pid, {
              jenjang_usia: rombelName,
              tempat_lahir: tempatLahir,
              tanggal_lahir: tanggalLahir,
              nama_wali: namaWali
            });
            coreBatch.push(cRow);
            fullBatch.push(fRow);
          }
        });

        if (fullBatch.length === 0) {
          showToast("Tidak ada baris valid ditemukan di file Excel.", "warning");
          return;
        }

        if (isLiveSupabase && supabaseClient) {
          let res = await resilientSupabaseMutation("peserta", "insert", fullBatch);
          if (res.error) {
            res = await resilientSupabaseMutation("peserta", "insert", coreBatch);
          }
          if (res.error) {
            showToast("Gagal impor peserta: " + res.error.message, "error");
            return;
          }
        }
        dbStore.peserta.push(...fullBatch);
        showToast(`${fullBatch.length} peserta berhasil diimpor & tersinkron ke Data Generus Admin!`, "success");
        openManagePesertaModal();
        renderApp();
      } catch (err) {
        showToast("Gagal membaca file Excel: " + err.message, "error");
      }
    }

    async function deactivatePeserta(pesertaId) {
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("peserta", "update", { aktif: false }, { id: pesertaId });
      }
      const p = dbStore.peserta.find(x => x.id === pesertaId);
      if (p) p.aktif = false;
      showToast("Peserta dihapus dari daftar aktif.", "info");
      openManagePesertaModal();
      renderApp();
    }

    function ensureMonthlyReportAndRows(uid, bulan, tahun) {
      const nowIso = new Date().toISOString();
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === Number(bulan) && Number(l.tahun) === Number(tahun));
      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan: Number(bulan),
          tahun: Number(tahun),
          status: "Draft",
          tanggal_kirim: null,
          terlambat: false,
          komentar_admin: "",
          created_at: nowIso
        };
        dbStore.laporan_bulanan.push(lap);
      }

      const rombels = getGroupRombels(uid);
      rombels.forEach(r => {
        const ptCount = Math.min(7, Math.max(1, Number(r.pertemuan_per_minggu) || (isMudaMudiRombel(r.nama_rombel) ? 2 : 5)));
        for (let w = 1; w <= 5; w++) {
          for (let p = 1; p <= ptCount; p++) {
            const exists = dbStore.laporan_mingguan.some(row =>
              row.laporan_id === lap.id &&
              row.rombel_id === r.id &&
              Number(row.minggu_ke) === w &&
              Number(row.pertemuan_ke || 1) === p
            );
            if (!exists) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: p,
                tanggal: "",
                pegon: "",
                bacaan: "",
                tajwid: "",
                hafalan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan: "",
                keterangan: "",
                created_at: nowIso
              });
            }
          }
        }
      });
      return lap;
    }

    async function pullAllJurnalToLaporanBulanIni() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const bulanJurnals = dbStore.jurnal_guru
        .filter(j => {
          const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
          return j.kelompok_id === uid && jm === bulan && jy === tahun && j.rombel_id;
        })
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      if (bulanJurnals.length === 0) {
        showToast(`Belum ada catatan Jurnal Guru pada ${NAMA_BULAN[bulan - 1]} ${tahun}.`, "warning");
        return;
      }

      let count = 0;
      for (const j of bulanJurnals) {
        const slot = detectWeekAndSlotForJurnal(uid, j.rombel_id, j.tanggal);
        const ok = await syncJurnalToLaporanKegiatan(j, slot.week, slot.pertemuan);
        if (ok) count++;
      }

      showToast(`${count} pertemuan dari Jurnal Guru berhasil disinkronkan ke kelas yang sesuai!`, "success");
      renderApp();
    }

    function toggleWeeklyRowMateri(rowId, key) {
      const row = dbStore.laporan_mingguan.find(r => r.id === rowId);
      if (!row) return;
      const existingKeys = Array.isArray(appState.weeklySelectedMateriMap[rowId])
        ? appState.weeklySelectedMateriMap[rowId]
        : MATERI_OPTIONS_LIST.filter(m => String(row[m.key] || "").trim() !== "").map(m => m.key);

      const set = new Set(existingKeys);
      if (set.has(key)) {
        set.delete(key);
        row[key] = "";
      } else {
        set.add(key);
      }
      appState.weeklySelectedMateriMap[rowId] = Array.from(set);
      renderApp();
    }

    function updateWeeklyReportField(rowId, field, value, shouldRender = true) {
      const row = dbStore.laporan_mingguan.find(r => r.id === rowId);
      if (!row) return;
      row[field] = value;
      if (field === "tanggal" && value) {
        const uid = appState.currentUser?.id;
        const matchedJurnal = dbStore.jurnal_guru.find(j => j.kelompok_id === uid && j.rombel_id === row.rombel_id && j.tanggal === value);
        if (matchedJurnal) {
          row.tidak_ada_kegiatan = false;
          row.alasan = "";
          row.pegon = matchedJurnal.pegon || "";
          row.tajwid = matchedJurnal.tajwid || "";
          row.hafalan = matchedJurnal.hafalan || "";
          row.bacaan = matchedJurnal.bacaan || "";
          row.makna = matchedJurnal.makna || "";
          row.lain_lain = matchedJurnal.lain_lain || "";
          const ketParts = [
            matchedJurnal.metode ? `Metode: ${matchedJurnal.metode}` : "",
            matchedJurnal.catatan || ""
          ].filter(Boolean);
          row.keterangan = ketParts.join(" • ");
          appState.weeklySelectedMateriMap[row.id] = MATERI_OPTIONS_LIST
            .filter(m => String(row[m.key] || "").trim() !== "")
            .map(m => m.key);
          showToast("Materi pembelajaran otomatis diisi dari Jurnal Guru pada tanggal tersebut!", "info");
        }
      }
      if (shouldRender) renderApp();
    }

    async function saveMonthlyReport(silent = false) {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
      const rows = dbStore.laporan_mingguan.filter(r => r.laporan_id === lap.id);

      if (isLiveSupabase && supabaseClient) {
        const resLap = await upsertLaporanBulananSafe(lap);
        if (resLap.error) {
          showToast("Gagal menyimpan laporan: " + resLap.error.message, "error");
          return false;
        }
        const resRows = await upsertLaporanMingguanSafe(rows);
        if (resRows.error) {
          showToast("Gagal menyimpan rincian mingguan: " + resRows.error.message, "error");
          return false;
        }
      }

      if (!silent) {
        showToast("Draft laporan bulanan berhasil disimpan!", "success");
      }
      return true;
    }

    function submitMonthlyReportToAdmin() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const deadlineInfo = getReportDeadlineInfo(bulan, tahun);

      if (deadlineInfo.isPassed && !deadlineInfo.allowLate) {
        showToast(`Batas waktu pelaporan (${deadlineInfo.formattedDate}) telah ditutup oleh Admin Daerah.`, "error");
        return;
      }

      const lateWarning = deadlineInfo.isPassed
        ? " Perhatian: Pengiriman ini melewati batas waktu (" + deadlineInfo.formattedDate + ") sehingga akan tercatat dengan status Terlambat."
        : "";

      confirmDialog(
        "Kirim Laporan Bulanan ke Admin Daerah?",
        `Laporan periode ${NAMA_BULAN[bulan - 1]} ${tahun} beserta ringkasan presensi akan dikirim untuk diperiksa Admin Daerah Jepara.${lateWarning}`,
        async () => {
          const uid = appState.currentUser.id;
          const lap = ensureMonthlyReportAndRows(uid, bulan, tahun);
          lap.status = "Dikirim";
          lap.tanggal_kirim = new Date().toISOString();
          lap.terlambat = Boolean(deadlineInfo.isPassed);

          const ok = await saveMonthlyReport(true);
          if (ok) {
            showToast(
              lap.terlambat
                ? "Laporan bulanan berhasil dikirim (tercatat dengan status Terlambat)."
                : "Laporan bulanan berhasil dikirim ke Admin Daerah!",
              "success"
            );
            logActivity("Kirim Laporan Bulanan", `Periode ${NAMA_BULAN[bulan - 1]} ${tahun}${lap.terlambat ? " (Terlambat)" : ""}`);
            renderApp();
          }
        },
        "Ya, Kirim Sekarang"
      );
    }

    async function uploadActivityPhoto(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const file = document.getElementById("dokFotoInput").files?.[0];
      const tanggal = document.getElementById("dokTanggalInput").value;
      const keterangan = document.getElementById("dokKetInput").value.trim();

      if (!file || !tanggal || !keterangan) return;

      showToast("Mengompres & mengunggah foto...", "info");
      try {
        const compressed = await compressImageFile(file);
        let fotoUrl = compressed.dataUrl;
        let filePath = "";

        if (isLiveSupabase && supabaseClient && compressed.blob) {
          filePath = `${uid}/${tahun}_${bulan}_${Date.now()}.jpg`;
          const upRes = await supabaseClient.storage
            .from(APP_CONFIG.STORAGE_BUCKET)
            .upload(filePath, compressed.blob, { contentType: "image/jpeg", upsert: true });
          if (!upRes.error) {
            const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(filePath);
            if (pub?.data?.publicUrl) fotoUrl = pub.data.publicUrl;
          } else {
            filePath = "";
          }
        }

        const row = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan,
          tahun,
          tanggal,
          keterangan,
          foto_url: fotoUrl,
          file_path: filePath,
          ukuran_kb: compressed.sizeKB
        };

        if (isLiveSupabase && supabaseClient) {
          const ins = await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", row);
          if (ins.error) {
            showToast("Gagal menyimpan metadata foto: " + ins.error.message, "error");
            return;
          }
        }

        row.resolved_url = compressed.dataUrl;
        dbStore.dokumentasi_kegiatan.unshift({ ...row, created_at: new Date().toISOString() });
        showToast(`Foto berhasil diunggah (${compressed.sizeKB} KB) & tersinkron ke Admin Daerah!`, "success");
        logActivity("Unggah Dokumentasi", keterangan);
        renderApp();
      } catch (err) {
        showToast("Gagal memproses foto: " + err.message, "error");
      }
    }

    const KENDALA_EXTRA_STORAGE_KEY = "digenara_kendala_extra_v1";

    function loadKendalaExtraCache() {
      try {

        return {};
      }
    }

    function saveKendalaExtraCache(kendalaId, extraObj) {
      if (!kendalaId) return;
      try {
        const cache = loadKendalaExtraCache();
        cache[kendalaId] = { ...(cache[kendalaId] || {}), ...extraObj };
        localStorage.setItem(KENDALA_EXTRA_STORAGE_KEY, JSON.stringify(cache));
      } catch (e) {}
    }

      const cache = loadKendalaExtraCache();

          if (!k.tanggapan_admin && extra.tanggapan_admin) k.tanggapan_admin = extra.tanggapan_admin;
          if (!k.status_tindak_lanjut && extra.status_tindak_lanjut) k.status_tindak_lanjut = extra.status_tindak_lanjut;
        }
      });
    }

    function deleteUserAccount(userId) {
      const u = dbStore.profiles.find(p => p.id === userId && p.role === "user");
      if (!u) return;
      confirmDialog(
        "Hapus Akun Kelompok Secara Permanen?",
        `Akun "${u.nama_kelompok}" (@${u.username}) beserta seluruh data kelas, peserta, presensi, jurnal, dokumentasi, dan laporannya akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.`,
        async () => {
          if (isLiveSupabase && supabaseClient) {
            const rpcRes = await supabaseClient.rpc("admin_delete_user_account", { target_user_id: userId });
            if (rpcRes.error) {
              const delRes = await resilientSupabaseMutation("profiles", "delete", null, { id: userId });
              if (delRes.error) {
                showToast("Gagal menghapus akun: " + delRes.error.message, "error");
                return;
              }
            }
          }

          const lapIds = new Set(dbStore.laporan_bulanan.filter(l => l.kelompok_id === userId).map(l => l.id));
          dbStore.profiles = dbStore.profiles.filter(p => p.id !== userId);
          dbStore.rombel = dbStore.rombel.filter(r => r.kelompok_id !== userId);
          dbStore.peserta = dbStore.peserta.filter(p => p.kelompok_id !== userId);
          dbStore.jurnal_guru = dbStore.jurnal_guru.filter(j => j.kelompok_id !== userId);
          dbStore.presensi = dbStore.presensi.filter(pr => pr.kelompok_id !== userId);
          dbStore.laporan_bulanan = dbStore.laporan_bulanan.filter(l => l.kelompok_id !== userId);
          dbStore.laporan_mingguan = dbStore.laporan_mingguan.filter(lm => !lapIds.has(lm.laporan_id));
          dbStore.dokumentasi_kegiatan = dbStore.dokumentasi_kegiatan.filter(d => d.kelompok_id !== userId);
          dbStore.kendala_evaluasi = dbStore.kendala_evaluasi.filter(k => k.kelompok_id !== userId);

          if (appState.adminSelectedKelompok === userId) {
            const nextKel = dbStore.profiles.find(p => p.role === "user");
            appState.adminSelectedKelompok = nextKel ? nextKel.id : "";
          }

          showToast(`Akun "${u.nama_kelompok}" berhasil dihapus permanen.`, "success");
          logActivity("Hapus Akun Kelompok", `Menghapus akun ${u.nama_kelompok} (@${u.username})`);
          renderApp();
        },
        "Ya, Hapus Permanen",
        true
      );
    }

    async function updateUserAccountStatus(userId, newStatus) {
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", { status_akun: newStatus }, { id: userId });

      const u = dbStore.profiles.find(p => p.id === userId);

      showToast(`Status akun diperbarui menjadi '${newStatus}'.`, "success");

      renderApp();

    async function executeAdminResetUserPassword(e, userId) {
      e.preventDefault();
      const newPw = document.getElementById("adminNewUserPw").value.trim();
      if (newPw.length < 8) return;

      if (isLiveSupabase && supabaseClient) {
        const res = await supabaseClient.rpc("admin_reset_user_password", { target_user_id: userId, new_password: newPw });
        if (res.error) {
          showToast("Gagal reset password: " + res.error.message, "error");
          return;
        }
        await resilientSupabaseMutation("profiles", "update", { reset_requested: false, reset_note: "" }, { id: userId });
      }

      const u = dbStore.profiles.find(p => p.id === userId);
      if (u) {
        u.password_hash = newPw;
        u.reset_requested = false;
        u.reset_note = "";
      }
      closeModal();
      showToast(`Password baru untuk @${u?.username} berhasil disimpan!`, "success");
      logActivity("Reset Password Akun", `Reset password untuk ${u?.nama_kelompok}`);
      renderApp();
    }

    async function saveAdminEditGenerus(e, pesertaId) {
      e.preventDefault();
      const p = dbStore.peserta.find(x => x.id === pesertaId);
      if (!p) return;

      const nama = document.getElementById("admGenNama").value.trim();
      const jk = document.getElementById("admGenGender").value;
      const rombelId = document.getElementById("admGenRombel").value;
      const tempatLahir = document.getElementById("admGenTempatLahir").value.trim();
      const tanggalLahir = document.getElementById("admGenTanggalLahir").value;
      const namaWali = document.getElementById("admGenWali").value.trim();
      const rombelName = getRombelName(rombelId);

      if (!nama) return;

      const coreUpdate = {
        nama_peserta: nama,
        jenis_kelamin: jk,
        rombel_id: rombelId
      };
      const fullUpdate = {
        ...coreUpdate,
        jenjang_usia: rombelName,
        tempat_lahir: tempatLahir,
        tanggal_lahir: tanggalLahir,
        nama_wali: namaWali
      };

      savePesertaExtraCache(pesertaId, {
        jenjang_usia: rombelName,
        tempat_lahir: tempatLahir,
        tanggal_lahir: tanggalLahir,
        nama_wali: namaWali
      });

      if (isLiveSupabase && supabaseClient) {
        let res = await resilientSupabaseMutation("peserta", "update", fullUpdate, { id: pesertaId });
        if (res.error) {
          res = await resilientSupabaseMutation("peserta", "update", coreUpdate, { id: pesertaId });
        }
        if (res.error) {
          showToast("Gagal memperbarui data generus: " + res.error.message, "error");
          return;
        }
      }

      Object.assign(p, fullUpdate);
      closeModal();
      showToast("Data generus berhasil diperbarui & tersinkron ke akun kelompok!", "success");
      logActivity("Edit Data Generus (Admin)", `${nama} (${getKelompokName(p.kelompok_id)})`);
      renderApp();
    }

    async function saveAdminKendalaReply(kendalaId) {
      const k = dbStore.kendala_evaluasi.find(x => x.id === kendalaId);
      if (!k) return;
      const replyVal = document.getElementById(`admTanggapan_${kendalaId}`)?.value.trim() || "";
      k.tanggapan_admin = replyVal;
      k.status_tindak_lanjut = replyVal ? "Ditanggapi Pengurus Daerah" : "";

      saveKendalaExtraCache(kendalaId, {
        saran_daerah: k.saran_daerah || "",
        tanggapan_admin: k.tanggapan_admin,
        status_tindak_lanjut: k.status_tindak_lanjut
      });

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation(
          "kendala_evaluasi",
          "update",
          { tanggapan_admin: k.tanggapan_admin, status_tindak_lanjut: k.status_tindak_lanjut },
          { id: kendalaId }
        );
      }

      showToast("Tanggapan Pengurus Daerah berhasil dikirim ke akun kelompok!", "success");
      logActivity("Tanggapi Evaluasi Kelompok", `${getKelompokName(k.kelompok_id)} - ${k.kategori}`);
      renderApp();
    }

    async function saveAdminReview(newStatus) {
      const selKelId = appState.adminSelectedKelompok;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const comment = document.getElementById("adminReviewComment")?.value.trim() || "";

      const lap = ensureMonthlyReportAndRows(selKelId, bulan, tahun);
      lap.status = newStatus;
      lap.komentar_admin = comment;

      if (isLiveSupabase && supabaseClient) {
        const res = await upsertLaporanBulananSafe(lap);
        if (res.error) {
          showToast("Gagal menyimpan verifikasi laporan: " + res.error.message, "error");
          return;
        }
      }

      showToast(`Status laporan diperbarui menjadi '${newStatus}'.`, "success");
      logActivity("Verifikasi Laporan", `${getKelompokName(selKelId)} -> ${newStatus}`);
      renderApp();
    }

    async function publishAnnouncementForm(e) {
      e.preventDefault();
      const row = {
        id: generateUUID(),
        judul: document.getElementById("annJudulInput").value.trim(),
        isi: document.getElementById("annIsiInput").value.trim(),
        penting: true,
        created_at: new Date().toISOString()
      };
      if (!row.judul || !row.isi) return;

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengumuman", "insert", row);
        if (res.error) {
          showToast("Gagal menerbitkan pengumuman: " + res.error.message, "error");
          return;
        }
      }
      dbStore.pengumuman.unshift(row);
      deviceNotifState.seenAnnouncementIds.push(row.id);
      persistDeviceNotifState();
      await broadcastRealtimeEvent("new_announcement", row);
      showToast("Pengumuman berhasil diterbitkan & langsung dikirim ke perangkat kelompok!", "success");
      logActivity("Terbitkan Pengumuman", row.judul);
      renderApp();
    }

    function deleteAnnouncementItem(id) {
      confirmDialog("Hapus Pengumuman?", "Pengumuman ini akan dihapus dari beranda seluruh kelompok.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await resilientSupabaseMutation("pengumuman", "delete", null, { id });
        }
        dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
        showToast("Pengumuman dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }
