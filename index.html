    function buildWhatsAppMessageText(mode, pesertaId = "") {
      const user = appState.currentUser;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.laporanSelectedRombel;
      const rombelName = getRombelName(rombelId);

      const templateKey = `${user.id}_${mode}`;
      if (appState.waCustomTemplates[templateKey]) {
        return appState.waCustomTemplates[templateKey];
      }

      if (mode === "parent" && pesertaId) {
        const p = dbStore.peserta.find(x => x.id === pesertaId);
        const recs = dbStore.presensi.filter(r => r.peserta_id === pesertaId && Number(r.bulan) === bulan && Number(r.tahun) === tahun);
        const H = recs.filter(r => r.status === "H").length;
        const I = recs.filter(r => r.status === "I").length;
        const S = recs.filter(r => r.status === "S").length;
        const A = recs.filter(r => r.status === "A").length;
        const pct = recs.length > 0 ? Math.round((H / recs.length) * 100) : 0;

        return [
          `Assalamu'alaikum Wr. Wb.`,
          `Yth. Bapak/Ibu Wali Santri dari *${p?.nama_peserta || "Santri"}*`,
          ``,
          `Berikut kami sampaikan rekap kehadiran pengajian di *${user.nama_kelompok}* (${user.nama_desa}) periode *${NAMA_BULAN[bulan - 1]} ${tahun}*:`,
          `• Kelas: ${getRombelName(p?.rombel_id)}`,
          `• Hadir: ${H}x (${pct}%)`,
          `• Izin: ${I}x | Sakit: ${S}x | Alpha: ${A}x`,
          ``,
          `Mohon dukungan dan doa Bapak/Ibu agar ananda senantiasa istiqomah dalam mencari ilmu agama.`,
          `Alhamdulillahi jazakumullahu khairan.`,
          `Wassalamu'alaikum Wr. Wb.`
        ].join("\n");
      }

      const presSum = calculatePresensiSummary(user.id, bulan, tahun, rombelId);
      const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === user.id && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      const rows = lap
        ? dbStore.laporan_mingguan.filter(x => x.laporan_id === lap.id && x.rombel_id === rombelId && Number(x.minggu_ke) === appState.laporanSelectedWeek)
        : [];

      const materiLines = rows.map(r => {
        if (r.tidak_ada_kegiatan) return `- Pertemuan ${r.pertemuan_ke}: Tidak ada kegiatan (${r.alasan || "-"})`;
        const parts = MATERI_OPTIONS_LIST.filter(m => r[m.key]).map(m => `${m.label}: ${r[m.key]}`);
        return `- Pertemuan ${r.pertemuan_ke} (${r.tanggal || "-"}): ${parts.length > 0 ? parts.join(", ") : "-"}`;
      });

      return [
        `Assalamu'alaikum Wr. Wb.`,
        `*LAPORAN KEGIATAN PENGAJIAN GENERUS*`,
        `Kelompok: *${user.nama_kelompok}* (${user.nama_desa})`,
        `Kelas: *${rombelName}*`,
        `Periode: *${NAMA_BULAN[bulan - 1]} ${tahun}* (Minggu ke-${appState.laporanSelectedWeek})`,
        ``,
        `*Ringkasan Materi:*`,
        ...(materiLines.length > 0 ? materiLines : ["- Belum ada rincian pertemuan"]),
        ``,
        `*Rekap Kehadiran Bulan Ini:*`,
        `Hadir: ${presSum.H} (${presSum.pctH}%) | Izin: ${presSum.I} | Sakit: ${presSum.S} | Alpha: ${presSum.A}`,
        ``,
        `Alhamdulillahi jazakumullahu khairan.`,
        `Wassalamu'alaikum Wr. Wb.`
      ].join("\n");
    }

    async function copyWaMessageToClipboard() {
      const box = document.getElementById("waMessagePreviewBox");
      if (!box) return;
      try {
        await navigator.clipboard.writeText(box.value);
        showToast("Teks laporan disalin ke clipboard!", "success");
      } catch (e) {
        box.select();
        document.execCommand("copy");
        showToast("Teks laporan disalin!", "success");
      }
    }

    function launchWhatsAppWeb() {
      const box = document.getElementById("waMessagePreviewBox");
      if (!box) return;
      let phone = "";
      if (appState.waShareMode === "parent" && appState.waShareSelectedPesertaId) {
        const p = dbStore.peserta.find(x => x.id === appState.waShareSelectedPesertaId);
        if (p?.no_wa_wali) {
          phone = String(p.no_wa_wali).replace(/[^0-9]/g, "");
          if (phone.startsWith("0")) phone = "62" + phone.slice(1);
        }
      }
      const url = phone
        ? `https://wa.me/${phone}?text=${encodeURIComponent(box.value)}`
        : `https://wa.me/?text=${encodeURIComponent(box.value)}`;
      const opened = window.open(url, "_blank", "noopener,noreferrer");
      if (!opened) {
        window.location.href = url;
      }
    }

    async function saveDokumentasiUpload(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const file = document.getElementById("dokFileInput")?.files?.[0];
      const tanggal = document.getElementById("dokTanggal")?.value;
      const keterangan = document.getElementById("dokKeterangan")?.value.trim();

      if (!file || !tanggal || !keterangan) {
        showToast("Lengkapi foto, tanggal, dan keterangan kegiatan.", "warning");
        return;
      }

      try {
        showToast("Mengompres & mengunggah foto...", "info");
        const compressed = await compressImageFile(file);
        const docId = generateUUID();
        const storagePath = `${uid}/${tahun}_${String(bulan).padStart(2, "0")}_${docId}.jpg`;
        let finalFotoUrl = compressed.dataUrl;
        let savedPath = "";

        if (isLiveSupabase && supabaseClient && compressed.blob) {
          const upRes = await supabaseClient.storage
            .from(APP_CONFIG.STORAGE_BUCKET)
            .upload(storagePath, compressed.blob, { contentType: "image/jpeg", upsert: true });
          if (upRes.error) {
            showToast("Gagal mengunggah foto ke storage: " + upRes.error.message, "error");
            return;
          }
          savedPath = storagePath;
          const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(storagePath);
          if (pub?.data?.publicUrl) {
            finalFotoUrl = pub.data.publicUrl;
          }
        }

        const row = {
          id: docId,
          kelompok_id: uid,
          bulan,
          tahun,
          tanggal,
          keterangan,
          foto_url: finalFotoUrl,
          file_path: savedPath,
          ukuran_kb: compressed.sizeKB
        };

        if (isLiveSupabase && supabaseClient) {
          const insRes = await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", row);
          if (insRes.error) {
            showToast("Gagal menyimpan metadata dokumentasi: " + insRes.error.message, "error");
            return;
          }
        }

        await resolveSingleDokumentasiUrl(row);
        dbStore.dokumentasi_kegiatan.unshift(row);
        closeModal();
        showToast(`Foto dokumentasi (${compressed.sizeKB} KB) berhasil diunggah!`, "success");
        logActivity("Unggah Dokumentasi", keterangan);
        renderApp();
      } catch (err) {
        showToast("Gagal memproses foto: " + err.message, "error");
      }
    }

    function renderAdminDashboard() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const deadlineInfo = getReportDeadlineInfo(bulan, tahun);

      const allKelompoks = dbStore.profiles.filter(p => p.role === "user");
      const activeKelompoks = allKelompoks.filter(p => isAccountActiveStatus(p.status_akun));
      const activeKelompokIds = new Set(activeKelompoks.map(k => k.id));
      const pendingCount = allKelompoks.filter(p => p.status_akun === "pending").length;
      const resetReqCount = allKelompoks.filter(p => p.reset_requested).length;

      const activeSantri = dbStore.peserta.filter(p => p.aktif && activeKelompokIds.has(p.kelompok_id));
      const santriL = activeSantri.filter(p => p.jenis_kelamin === "L").length;
      const santriP = activeSantri.filter(p => p.jenis_kelamin === "P").length;

      const submittedKelompoks = activeKelompoks.filter(k => {
        const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === k.id && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
        return lap && ["Dikirim", "Disetujui"].includes(lap.status);
      });
      const pctLaporanMasuk = activeKelompoks.length > 0
        ? Math.round((submittedKelompoks.length / activeKelompoks.length) * 100)
        : 0;

      const allPresMonth = dbStore.presensi.filter(r =>
        Number(r.bulan) === bulan &&
        Number(r.tahun) === tahun &&
        activeKelompokIds.has(r.kelompok_id)
      );
      const totalH = allPresMonth.filter(r => r.status === "H").length;
      const avgPctH = allPresMonth.length > 0 ? Math.round((totalH / allPresMonth.length) * 100) : 0;

      // Data Grafik Tren Persentase Kehadiran Daerah 6 Bulan Terakhir
      const chartMonths = [];
      for (let i = 5; i >= 0; i--) {
        let m = bulan - i;
        let y = tahun;
        while (m <= 0) { m += 12; y -= 1; }
        const recs = dbStore.presensi.filter(r =>
          Number(r.bulan) === m &&
          Number(r.tahun) === y &&
          activeKelompokIds.has(r.kelompok_id)
        );
        const hadirCount = recs.filter(r => r.status === "H").length;
        const pct = recs.length > 0 ? Math.round((hadirCount / recs.length) * 100) : 0;
        chartMonths.push({
          bulan: m,
          tahun: y,
          label: NAMA_BULAN[m - 1].slice(0, 3),
          fullLabel: `${NAMA_BULAN[m - 1]} ${y}`,
          pct,
          totalRecs: recs.length,
          isSelected: m === bulan && y === tahun
        });
      }

    function renderAdminAkunTab() {
      const users = dbStore.profiles.filter(p => p.role === "user");
      const q = appState.adminAkunSearch.trim().toLowerCase();

      const filtered = users.filter(u => {
        const st = u.status_akun || "pending";
        let matchStatus = true;
        if (appState.adminAkunStatusFilter === "pending") matchStatus = st === "pending";
        else if (appState.adminAkunStatusFilter === "approved") matchStatus = isAccountActiveStatus(st);
        else if (appState.adminAkunStatusFilter === "inactive") matchStatus = st === "inactive" || st === "rejected";
        else if (appState.adminAkunStatusFilter === "RESET") matchStatus = Boolean(u.reset_requested);

        const matchQ = !q ||
          String(u.nama_kelompok || "").toLowerCase().includes(q) ||
          String(u.username || "").toLowerCase().includes(q) ||
          String(u.nama_desa || "").toLowerCase().includes(q);

        return matchStatus && matchQ;
      });

      return `
        <div class="space-y-5">
          <div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900">Kelola Akun Kelompok</h2>
            <p class="text-xs sm:text-sm text-slate-500">Verifikasi pendaftaran akun baru, ubah wilayah desa, dan tangani permintaan reset password</p>
          </div>

                { id: "pending", label: `Menunggu (${users.filter(u => u.status_akun === "pending").length})` },
                { id: "approved", label: `Aktif (${users.filter(u => isAccountActiveStatus(u.status_akun)).length})` },
                { id: "RESET", label: `Minta Reset (${users.filter(u => u.reset_requested).length})` },
                { id: "inactive", label: `Nonaktif/Ditolak (${users.filter(u => ["inactive", "rejected"].includes(u.status_akun)).length})` }

                  class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${appState.adminAkunStatusFilter === tab.id ? 'bg-emerald-700 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                  ${tab.label}
                </button>
              `).join("")}

                    <th class="p-3">Wilayah Desa</th>
                    <th class="p-3">Guru & Rombel</th>

                    <th class="p-3 text-center">Aksi Pengelolaan</th>
                  </tr>

                  ${filtered.length === 0 ? `
                    <tr><td colspan="5" class="p-8 text-center text-slate-400">Tidak ada akun kelompok yang sesuai filter.</td></tr>
                  ` : filtered.map(u => {
                    const isActive = isAccountActiveStatus(u.status_akun);
                    const isPending = u.status_akun === "pending";
                    return `
                      <tr class="hover:bg-slate-50">
                        <td class="p-3">
                          <div class="font-extrabold text-slate-900">${escapeHTML(u.nama_kelompok)}</div>
                          <div class="text-xs font-mono text-slate-500">@${escapeHTML(u.username)}</div>

                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

    async function adminApproveAccount(userId) {
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", { status_akun: "approved" }, { id: userId });
        if (res.error) {
          showToast("Gagal menyetujui akun: " + res.error.message, "error");
          return;
        }
      }
      const u = dbStore.profiles.find(p => p.id === userId);
      if (u) u.status_akun = "approved";
      showToast(`Akun ${u?.nama_kelompok || ""} telah diaktifkan!`, "success");
      logActivity("Setujui Akun Kelompok", u?.nama_kelompok || userId);
      renderApp();
    }

    async function adminRejectAccount(userId) {
      confirmDialog("Tolak Pendaftaran Akun?", "Akun ini tidak akan dapat login ke sistem.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await resilientSupabaseMutation("profiles", "update", { status_akun: "rejected" }, { id: userId });
        }
        const u = dbStore.profiles.find(p => p.id === userId);
        if (u) u.status_akun = "rejected";
        showToast("Pendaftaran akun ditolak.", "info");
        renderApp();
      }, "Tolak Akun", true);
    }

    async function adminToggleAccountActive(userId) {
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      const nextStatus = isAccountActiveStatus(u.status_akun) ? "inactive" : "approved";
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", { status_akun: nextStatus }, { id: userId });
        if (res.error) {
          showToast("Gagal mengubah status akun: " + res.error.message, "error");
          return;
        }
      }
      u.status_akun = nextStatus;
      showToast(`Status akun diperbarui menjadi ${nextStatus === "approved" ? "Aktif" : "Nonaktif"}.`, "success");
      renderApp();
    }

    function openAdminEditKelompokModal(userId) {
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      openModal(

    async function saveAdminEditKelompok(e, userId) {
      e.preventDefault();
      const nama = document.getElementById("admEditKelNama").value.trim();
      const desa = document.getElementById("admEditKelDesa").value;
      const gurus = document.getElementById("admEditKelGurus").value.split("\n").map(s => s.trim()).filter(Boolean);
      if (!nama) return;

      const updatePayload = {
        nama_kelompok: nama,
        nama_desa: desa,
        daftar_guru: gurus,
        jumlah_guru: gurus.length
      };
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", updatePayload, { id: userId });
        if (res.error) {
          showToast("Gagal memperbarui data kelompok: " + res.error.message, "error");
          return;
        }
      }
      const u = dbStore.profiles.find(p => p.id === userId);
      if (u) Object.assign(u, updatePayload);
      closeModal();
      showToast("Data kelompok berhasil diperbarui!", "success");
      renderApp();
    }

    function openAdminResetPasswordModal(userId) {
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      openModal(
        `Reset Password — ${u.nama_kelompok}`,
        `
          <form id="formAdminResetPw" onsubmit="saveAdminResetPassword(event, '${userId}')" class="space-y-3.5">
            <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-700">
              Username: <strong class="font-mono">@${escapeHTML(u.username)}</strong>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Password Baru (Minimal 8 Karakter) *</label>
              <input id="admNewUserPw" type="text" required minlength="8" placeholder="Masukkan password baru untuk kelompok"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" />
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="button" onclick="triggerModalFormSubmit('formAdminResetPw')" class="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 text-sm font-extrabold">Terapkan Password Baru</button>
        `,

      );
    }

    async function saveAdminResetPassword(e, userId) {
      e.preventDefault();
      const newPw = document.getElementById("admNewUserPw").value.trim();
      if (newPw.length < 8) {
        showToast("Password baru minimal 8 karakter.", "warning");
        return;
      }
      if (isLiveSupabase && supabaseClient) {
        const rpcRes = await supabaseClient.rpc("admin_reset_user_password", { target_user_id: userId, new_password: newPw });
        if (rpcRes.error) {
          showToast("Gagal mereset password di server: " + rpcRes.error.message, "error");
          return;
        }
        await resilientSupabaseMutation("profiles", "update", { reset_requested: false, reset_note: "" }, { id: userId });
      }
      const u = dbStore.profiles.find(p => p.id === userId);
      if (u) {
        u.password_hash = newPw;
        u.reset_requested = false;
        u.reset_note = "";
      }
      closeModal();
      showToast("Password baru berhasil diterapkan!", "success");
      logActivity("Reset Password Akun", u?.nama_kelompok || userId);
      renderApp();
    }

    function getFilteredAdminGenerusData() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const activeKelompoks = dbStore.profiles.filter(p => p.role === "user" && isAccountActiveStatus(p.status_akun));
      const kelompokMap = new Map(activeKelompoks.map(k => [k.id, k]));

      const allStudents = dbStore.peserta
        .filter(p => p.aktif && kelompokMap.has(p.kelompok_id))
        .map(p => {
          const kel = kelompokMap.get(p.kelompok_id);
          const recs = dbStore.presensi.filter(r =>
            r.peserta_id === p.id &&
            Number(r.bulan) === bulan &&
            Number(r.tahun) === tahun
          );
          const H = recs.filter(r => r.status === "H").length;
          const I = recs.filter(r => r.status === "I").length;
          const S = recs.filter(r => r.status === "S").length;
          const A = recs.filter(r => r.status === "A").length;
          const total_pertemuan = recs.length;
          const pct = total_pertemuan > 0 ? Math.round((H / total_pertemuan) * 100) : 0;

          return {
            ...p,
            nama_kelompok: kel?.nama_kelompok || "-",
            nama_desa: kel?.nama_desa || "Belum Diatur",
            nama_rombel: getRombelName(p.rombel_id),
            ttl_display: formatSantriTTL(p),
            nama_wali_display: p.nama_wali && String(p.nama_wali).trim() ? String(p.nama_wali).trim() : "-",
            H,
            I,
            S,
            A,
            total_pertemuan,
            pct
          };
        })
        .sort((a, b) => a.nama_peserta.localeCompare(b.nama_peserta));

      const q = appState.adminGenerusSearch.trim().toLowerCase();
      const filtered = allStudents.filter(s => {
        const matchDesa = appState.adminGenerusFilterDesa === "ALL" || s.nama_desa === appState.adminGenerusFilterDesa;
        const matchKel = appState.adminGenerusFilterKelompok === "ALL" || s.kelompok_id === appState.adminGenerusFilterKelompok;
        const matchRombel = appState.adminGenerusFilterRombel === "ALL" || s.nama_rombel === appState.adminGenerusFilterRombel;
        const matchGender = appState.adminGenerusFilterGender === "ALL" || s.jenis_kelamin === appState.adminGenerusFilterGender;
        const matchSearch = !q ||
          s.nama_peserta.toLowerCase().includes(q) ||
          s.ttl_display.toLowerCase().includes(q) ||
          s.nama_wali_display.toLowerCase().includes(q) ||
          String(s.no_wa_wali || "").toLowerCase().includes(q) ||
          s.nama_kelompok.toLowerCase().includes(q) ||
          s.nama_rombel.toLowerCase().includes(q);
        return matchDesa && matchKel && matchRombel && matchGender && matchSearch;
      });

      return { bulan, tahun, activeKelompoks, allStudents, filtered };
    }

    async function adminVerifyMonthlyReport(kelompokId, newStatus) {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const comment = document.getElementById("adminReviewCommentInput")?.value.trim() || "";
      const lap = ensureMonthlyReportAndRows(kelompokId, bulan, tahun);
      lap.status = newStatus;
      lap.komentar_admin = comment;

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        if (res.error) {
          showToast("Gagal memperbarui status laporan: " + res.error.message, "error");
          return;
        }
      }
      showToast(`Status laporan diperbarui menjadi "${newStatus}".`, "success");
      logActivity("Verifikasi Laporan", `${getKelompokName(kelompokId)} -> ${newStatus}`);
      renderApp();
    }

    async function saveAdminTanggapanKendala(kendalaId) {
      const val = document.getElementById(`tanggapanInput_${kendalaId}`)?.value.trim() || "";
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("kendala_evaluasi", "update", { tanggapan_admin: val }, { id: kendalaId });
        if (res.error) {
          showToast("Gagal menyimpan tanggapan: " + res.error.message, "error");
          return;
        }
      }
      const k = dbStore.kendala_evaluasi.find(x => x.id === kendalaId);
      if (k) k.tanggapan_admin = val;
      showToast("Tanggapan Admin Daerah tersimpan!", "success");
      renderApp();
    }

                    ${Array.from({ length: 24 }, (_, h) => h).map(h => {
                      const hh = String(h).padStart(2, "0");
                      return `<option value="${h}" ${APP_CONFIG.REPORT_DEADLINE_HOUR_WIB === h ? "selected" : ""}>Pukul ${hh}.00 WIB</option>`;
                    }).join("")}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Kebijakan Keterlambatan</label>
                  <select id="inlineAllowLate" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold bg-white">
                    <option value="true" ${APP_CONFIG.ALLOW_LATE_REPORT ? "selected" : ""}>Izinkan Kirim (Tandai 'Terlambat')</option>
                    <option value="false" ${!APP_CONFIG.ALLOW_LATE_REPORT ? "selected" : ""}>Kunci Pengiriman Otomatis</option>
                  </select>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-sm shadow-sm">
                  💾 Simpan Pengaturan Tenggat
                </button>
              </form>
            </div>

            <!-- Form Tambah Pengumuman -->
            <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
              <div class="flex items-center gap-2">
                <span class="text-xl">📢</span>
                <h3 class="font-extrabold text-slate-900 text-base">Terbitkan Pengumuman Baru</h3>
              </div>
              <form onsubmit="saveAnnouncementForm(event)" class="space-y-3.5">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Judul Pengumuman *</label>
                  <input id="annJudul" type="text" required placeholder="Contoh: Jadwal Musyawarah Guru Pengajian Daerah" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Isi Pengumuman *</label>
                  <textarea id="annIsi" rows="4" required placeholder="Tuliskan isi informasi yang akan tampil di beranda & notifikasi perangkat..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
                </div>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm shadow-sm">
                  🚀 Terbitkan & Kirim Notifikasi
                </button>
              </form>
            </div>
          </div>

          <!-- Daftar Pengumuman Aktif -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
            <h3 class="font-extrabold text-slate-900 text-base">Daftar Pengumuman Terbit (${dbStore.pengumuman.length})</h3>
            <div class="divide-y divide-slate-100">
              ${dbStore.pengumuman.map(ann => `
                <div class="py-3.5 flex items-start justify-between gap-3">
                  <div>
                    <div class="font-extrabold text-slate-900 text-sm">${escapeHTML(ann.judul)}</div>
                    <p class="text-xs sm:text-sm text-slate-600 mt-1 leading-relaxed">${escapeHTML(ann.isi)}</p>
                    <div class="text-[11px] text-slate-400 mt-1">${formatDateTimeWIB(ann.created_at)}</div>
                  </div>
                  <button type="button" onclick="deleteAnnouncementItem('${ann.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold shrink-0">
                    Hapus
                  </button>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    async function saveAnnouncementForm(e) {
      e.preventDefault();
      const row = {
        id: generateUUID(),
        judul: document.getElementById("annJudul").value.trim(),
        isi: document.getElementById("annIsi").value.trim(),
        penting: true,
        created_at: new Date().toISOString()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengumuman", "insert", row);
        if (res.error) {
          showToast("Gagal menerbitkan pengumuman: " + res.error.message, "error");
          return;
        }
      }

      dbStore.pengumuman.unshift(row);
      deviceNotifState.seenAnnouncementIds.push(row.id);
      persistDeviceNotifState();

      await broadcastRealtimeEvent("new_announcement", row);
      showToast("Pengumuman berhasil diterbitkan & disiarkan ke perangkat kelompok!", "success");
      logActivity("Terbitkan Pengumuman", row.judul);
      renderApp();
    }

    function deleteAnnouncementItem(id) {
      confirmDialog("Hapus Pengumuman?", "Pengumuman ini akan dihapus dari beranda semua kelompok.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await resilientSupabaseMutation("pengumuman", "delete", null, { id });
        }
        dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
        showToast("Pengumuman dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    // ============================================================================
    // BOOTSTRAP AWAL APLIKASI
    // ============================================================================
    initBrandingIconsAndManifest();
    renderApp();
    if (isLiveSupabase && supabaseClient) {
      restoreSupabaseSession();
    }
  </script>
</body>
</html>
