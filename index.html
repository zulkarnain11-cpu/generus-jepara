  <script>

    const APP_CONFIG = {
      SUPABASE_URL: "https://egfyloqtzxzihnxjmrhh.supabase.co",
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnZnlsb3F0enh6aWhueGptcmhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNzk5MDEsImV4cCI6MjExMDY1NTkwMX0.LbJy9vwvpxZ0GOEIQx6jLASWGzRJLGSNxGQgLXk-qCk",

      STORAGE_BUCKET: "dokumentasi-kegiatan",
      MAX_PHOTO_WIDTH: 1280,

      REPORT_DEADLINE_HOUR_WIB: 21,
      ALLOW_LATE_REPORT: true

    try {
      const savedUrl = localStorage.getItem("digenara_supa_url");
      const savedKey = localStorage.getItem("digenara_supa_key");
      if (savedUrl && savedKey) {
        APP_CONFIG.SUPABASE_URL = savedUrl;
        APP_CONFIG.SUPABASE_ANON_KEY = savedKey;
      }
      const savedDeadlineRaw = localStorage.getItem("digenara_deadline_cfg");
      if (savedDeadlineRaw) {
        const parsed = JSON.parse(savedDeadlineRaw);
        if (parsed.batas_tanggal) APP_CONFIG.REPORT_DEADLINE_DAY = Math.min(28, Math.max(1, Number(parsed.batas_tanggal) || 5));
        if (parsed.batas_jam_wib !== undefined) APP_CONFIG.REPORT_DEADLINE_HOUR_WIB = Math.min(23, Math.max(0, Number(parsed.batas_jam_wib)));
        if (parsed.izinkan_terlambat !== undefined) APP_CONFIG.ALLOW_LATE_REPORT = Boolean(parsed.izinkan_terlambat);
      }
    } catch (e) {}

    // ============================================================================
    // KONSTANTA WILAYAH DESA, MATERI, BATAS PELAPORAN & KOMPONEN UI
    // ============================================================================
    const NAMA_BULAN = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    const DESA_OPTIONS = [
      "Desa Timur 1",
      "Desa Timur 2",
      "Desa Barat",
      "Desa Utara"
    ];

    const MATERI_OPTIONS_LIST = [
      { key: "pegon", label: "Pegon", placeholder: "Contoh: Menyambung huruf / menulis kata Pegon" },
      { key: "tajwid", label: "Tajwid", placeholder: "Contoh: Hukum Nun Mati & Tanwin / Makhraj huruf" },
      { key: "hafalan", label: "Hafalan", placeholder: "Contoh: QS. Al-Ma'un & Doa sebelum belajar" },
      { key: "bacaan", label: "Bacaan", placeholder: "Contoh: Tilawati Jilid 2 hal. 14 / Tadarus Juz 1" },
      { key: "makna", label: "Makna", placeholder: "Contoh: Makna & penjelasan Kitab As-Sholah" },
      { key: "lain_lain", label: "Lain-lain", placeholder: "Contoh: Praktik wudhu, adab & akhlakul karimah" }
    ];

    function isAccountActiveStatus(status) {
      return status === "approved" || status === "active";
    }

    function applySystemSettingsObject(cfg) {
      if (!cfg) return;
      if (cfg.batas_tanggal !== undefined && cfg.batas_tanggal !== null) {
        APP_CONFIG.REPORT_DEADLINE_DAY = Math.min(28, Math.max(1, parseInt(cfg.batas_tanggal, 10) || 5));
      }
      if (cfg.batas_jam_wib !== undefined && cfg.batas_jam_wib !== null) {
        APP_CONFIG.REPORT_DEADLINE_HOUR_WIB = Math.min(23, Math.max(0, parseInt(cfg.batas_jam_wib, 10)));
      }
      if (cfg.izinkan_terlambat !== undefined && cfg.izinkan_terlambat !== null) {
        APP_CONFIG.ALLOW_LATE_REPORT = Boolean(cfg.izinkan_terlambat);
      }
      try {
        localStorage.setItem("digenara_deadline_cfg", JSON.stringify({
          batas_tanggal: APP_CONFIG.REPORT_DEADLINE_DAY,
          batas_jam_wib: APP_CONFIG.REPORT_DEADLINE_HOUR_WIB,
          izinkan_terlambat: APP_CONFIG.ALLOW_LATE_REPORT
        }));
      } catch (e) {}
    }

    function getReportDeadlineInfo(bulan, tahun) {
      const m = Number(bulan);
      const y = Number(tahun);
      const dueMonth = m === 12 ? 1 : m + 1;
      const dueYear = m === 12 ? y + 1 : y;
      const dueDay = Math.min(28, Math.max(1, Number(APP_CONFIG.REPORT_DEADLINE_DAY) || 5));
      const dueHour = Math.min(23, Math.max(0, Number(APP_CONFIG.REPORT_DEADLINE_HOUR_WIB) ?? 21));
      const hhStr = String(dueHour).padStart(2, "0");

      // WIB adalah UTC+7 tetap tanpa DST
      const deadlineUtcMs = Date.UTC(dueYear, dueMonth - 1, dueDay, dueHour - 7, 0, 0);
      const nowMs = Date.now();
      const isPassed = nowMs > deadlineUtcMs;
      const diffMs = deadlineUtcMs - nowMs;
      const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      const hoursLeft = Math.ceil(diffMs / (1000 * 60 * 60));
      const formattedDate = `${dueDay} ${NAMA_BULAN[dueMonth - 1]} ${dueYear}, ${hhStr}.00 WIB`;

      return {
        dueDay,
        dueMonth,
        dueYear,
        dueHour,
        hhStr,
        deadlineUtcMs,
        formattedDate,
        isPassed,
        diffMs,
        daysLeft,
        hoursLeft,
        allowLate: Boolean(APP_CONFIG.ALLOW_LATE_REPORT)
      };
    }

    function getWIBParts(dateObj = new Date()) {
      try {
        const formatter = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Jakarta",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
        const parts = formatter.formatToParts(dateObj);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const year = parseInt(map.year, 10);
        const month = parseInt(map.month, 10);
        const day = parseInt(map.day, 10);
        const hour = parseInt(map.hour, 10) % 24;
        const minute = parseInt(map.minute, 10);
        const hh = String(hour).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${map.year}-${map.month}-${map.day}`,
          timeStr: `${hh}:${map.minute} WIB`
        };
      } catch (e) {
        const utc = dateObj.getTime() + dateObj.getTimezoneOffset() * 60000;
        const wib = new Date(utc + 7 * 3600000);
        const year = wib.getFullYear();
        const month = wib.getMonth() + 1;
        const day = wib.getDate();
        const hour = wib.getHours();
        const minute = wib.getMinutes();
        const pad = (n) => String(n).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${year}-${pad(month)}-${pad(day)}`,
          timeStr: `${pad(hour)}:${pad(minute)} WIB`
        };
      }
    }

    function formatTanggalID(isoDateStr) {
      if (!isoDateStr) return "-";
      const clean = String(isoDateStr).slice(0, 10);
      const parts = clean.split("-");
      if (parts.length !== 3) return escapeHTML(String(isoDateStr));
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      if (!m || !d || m < 1 || m > 12) return escapeHTML(clean);
      return `${d} ${NAMA_BULAN[m - 1]} ${y}`;
    }

    function formatDateTimeWIB(isoTimestamp) {
      if (!isoTimestamp) return "-";
      const d = new Date(isoTimestamp);
      if (isNaN(d.getTime())) return "-";
      const p = getWIBParts(d);
      return `${p.day} ${NAMA_BULAN[p.month - 1].slice(0, 3)} ${p.year}, ${p.timeStr}`;
    }

    function shiftISODate(isoDateStr, deltaDays) {
      const clean = String(isoDateStr || getWIBParts().isoDate).slice(0, 10);
      const [y, m, d] = clean.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + deltaDays));
      const yy = dt.getUTCFullYear();
      const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(dt.getUTCDate()).padStart(2, "0");
      return `${yy}-${mm}-${dd}`;
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function getUserInitials(name) {
      const words = String(name || "GJ").trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "GJ";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const styles = {
        success: "bg-emerald-900 text-white border-emerald-700",
        error: "bg-rose-900 text-white border-rose-700",
        warning: "bg-amber-500 text-slate-950 border-amber-600",
        info: "bg-slate-900 text-white border-slate-700"
      };
      const icons = {
        success: "✅",
        error: "❌",
        warning: "⚠️",
        info: "ℹ️"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base leading-none mt-0.5">${icons[type] || icons.info}</span>
        <div class="flex-1 leading-snug">${escapeHTML(message)}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => toast.remove(), 300);
      }, 4200);
    }

    let pendingConfirmCallback = null;

    function openModal(title, bodyHTML, footerHTML = "", maxWidthClass = "max-w-xl") {
      const container = document.getElementById("modalContainer");
      if (!container) return;
      container.innerHTML = `
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} overflow-hidden my-auto">
          <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-3">
            <h3 class="font-extrabold text-base sm:text-lg text-slate-900">${escapeHTML(title)}</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-xl bg-slate-200/70 hover:bg-slate-300 text-slate-700 font-bold flex items-center justify-center">✕</button>
          </div>
          <div class="p-5 max-h-[75vh] overflow-y-auto">
            ${bodyHTML}
          </div>
          ${footerHTML ? `
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-end gap-2">
              ${footerHTML}
            </div>
          ` : ""}
        </div>
      `;
      container.classList.remove("hidden");
      container.classList.add("flex");
    }

    function closeModal() {
      const container = document.getElementById("modalContainer");
      if (!container) return;
      container.classList.add("hidden");
      container.classList.remove("flex");
      container.innerHTML = "";
      pendingConfirmCallback = null;
    }

    function confirmDialog(title, message, onConfirm, confirmLabel = "Ya, Lanjutkan", isDanger = false) {
      pendingConfirmCallback = onConfirm;
      openModal(
        title,
        `<p class="text-sm text-slate-700 leading-relaxed">${escapeHTML(message)}</p>`,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-semibold text-sm">Batal</button>
          <button type="button" onclick="executePendingConfirm()" class="px-5 py-2 rounded-xl ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-700 hover:bg-emerald-800'} text-white font-bold text-sm">
            ${escapeHTML(confirmLabel)}
          </button>
        `,
        "max-w-md"
      );
    }

    async function executePendingConfirm() {
      const cb = pendingConfirmCallback;
      closeModal();
      if (typeof cb === "function") {
        await cb();
      }
    }

    // ============================================================================

          const r = i % 2 === 0 ? outerR : innerR;
          const angle = ((i * 36 - 90) * Math.PI) / 180;
          pts.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
        }
        const polyStr = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
        const facets = [];
        for (let i = 0; i < 10; i++) {
          const p1 = pts[i];
          const p2 = pts[(i + 1) % 10];
          const fillShade = i % 2 === 0 ? "#f0d377" : "#8d630c";
          facets.push(`<polygon points="${cx},${cy} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${fillShade}" />`);
        }
        return `
          <g transform="rotate(${rotDeg} ${cx} ${cy})">
            ${facets.join("")}
            <polygon points="${polyStr}" fill="none" stroke="#3b2804" stroke-width="0.9" stroke-linejoin="round" />

    function renderSvgToPngDataUrl(svgString, sizePx) {
      return new Promise((resolve) => {
        try {
          const img = new Image();
          const svgEncoded = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgString);
          img.onload = () => {
            try {
              const canvas = document.createElement("canvas");
              canvas.width = sizePx;
              canvas.height = sizePx;
              const ctx = canvas.getContext("2d");
              ctx.clearRect(0, 0, sizePx, sizePx);
              ctx.drawImage(img, 0, 0, sizePx, sizePx);
              resolve(canvas.toDataURL("image/png"));
            } catch (err) {
              resolve(svgEncoded);
            }
          };
          img.onerror = () => resolve(svgEncoded);
          img.src = svgEncoded;
        } catch (err) {
          resolve("");
        }
      });
    }

    // FITUR SAMBUNGKAN NOTIFIKASI PERANGKAT (PENGUMUMAN ADMIN & PENGINGAT BATAS LAPORAN)

    const NOTIF_STORAGE_KEY = "digenara_device_notif_v1";

    const deviceNotifState = {
      enabled: false,
      notifyAnnouncements: true,
      notifyDeadlineReminders: true,
      seenAnnouncementIds: [],
      sentReminderKeys: {},
      lastDeadlineSignature: "",
      swRegistration: null,
      realtimeChannel: null,
      pollTimer: null
    };

    try {
      const savedNotifRaw = localStorage.getItem(NOTIF_STORAGE_KEY);
      if (savedNotifRaw) {
        const parsed = JSON.parse(savedNotifRaw);
        deviceNotifState.enabled = Boolean(parsed.enabled);
        if (parsed.notifyAnnouncements !== undefined) deviceNotifState.notifyAnnouncements = Boolean(parsed.notifyAnnouncements);
        if (parsed.notifyDeadlineReminders !== undefined) deviceNotifState.notifyDeadlineReminders = Boolean(parsed.notifyDeadlineReminders);
        if (Array.isArray(parsed.seenAnnouncementIds)) deviceNotifState.seenAnnouncementIds = parsed.seenAnnouncementIds;
        if (parsed.sentReminderKeys && typeof parsed.sentReminderKeys === "object") deviceNotifState.sentReminderKeys = parsed.sentReminderKeys;
        if (parsed.lastDeadlineSignature) deviceNotifState.lastDeadlineSignature = String(parsed.lastDeadlineSignature);
      }
    } catch (e) {}

    function persistDeviceNotifState() {
      try {
        localStorage.setItem(NOTIF_STORAGE_KEY, JSON.stringify({
          enabled: deviceNotifState.enabled,
          notifyAnnouncements: deviceNotifState.notifyAnnouncements,
          notifyDeadlineReminders: deviceNotifState.notifyDeadlineReminders,
          seenAnnouncementIds: deviceNotifState.seenAnnouncementIds.slice(-100),
          sentReminderKeys: deviceNotifState.sentReminderKeys,
          lastDeadlineSignature: deviceNotifState.lastDeadlineSignature
        }));
      } catch (e) {}
    }

    function getDeviceNotificationStatusInfo() {
      const hasNotificationAPI = typeof window !== "undefined" && "Notification" in window;
      const permission = hasNotificationAPI ? Notification.permission : "unsupported";
      const isConnected = hasNotificationAPI && permission === "granted" && deviceNotifState.enabled;
      return { hasNotificationAPI, permission, isConnected };
    }

    async function registerLightweightNotificationSW() {
      if (!("serviceWorker" in navigator) || !window.Blob || !window.URL) return null;
      if (deviceNotifState.swRegistration) return deviceNotifState.swRegistration;
      try {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
          self.addEventListener('notificationclick', (event) => {
            event.notification.close();
            event.waitUntil(
              self.clients.matchAll({ type: 'window', includeUncontrolled: true }).then((clientsArr) => {
                if (clientsArr.length > 0) {
                  return clientsArr[0].focus();
                }
                return self.clients.openWindow('./');
              })
            );
          });
        `;
        const swBlob = new Blob([swCode], { type: "application/javascript" });
        const swUrl = URL.createObjectURL(swBlob);
        const reg = await navigator.serviceWorker.register(swUrl);
        deviceNotifState.swRegistration = reg;
        return reg;
      } catch (e) {
        return null;
      }
    }

    async function triggerNativeDeviceNotification(title, body, tag = "digenara-alert", targetTab = "dashboard") {
      const status = getDeviceNotificationStatusInfo();
      if (!status.isConnected) return false;

      const iconUrl = APP_BRAND_ICON_192 || document.getElementById("faviconPng192")?.href || "";
      const options = {
        body,
        icon: iconUrl,
        badge: iconUrl,
        tag,
        renotify: true,
        vibrate: [180, 90, 180]
      };

      try {
        if (deviceNotifState.swRegistration && typeof deviceNotifState.swRegistration.showNotification === "function") {
          await deviceNotifState.swRegistration.showNotification(title, options);
          return true;
        }
        const n = new Notification(title, options);
        n.onclick = () => {
          try {
            window.focus();
            if (appState.currentUser && targetTab) {
              appState.activeTab = targetTab;
              renderApp();
            }
            n.close();
          } catch (e) {}
        };
        return true;
      } catch (err) {
        try {
          const n = new Notification(title, { body, icon: iconUrl, tag });
          n.onclick = () => { window.focus(); n.close(); };
          return true;
        } catch (e2) {
          return false;
        }
      }
    }

    function getActiveDueReportPeriods() {
      const nowWIB = getWIBParts();
      const periods = [];

      // Cek apakah laporan bulan lalu sedang masa tenggat (tanggal 1 s.d. batas_tanggal + 3 hari)
      const prevMonth = nowWIB.month === 1 ? 12 : nowWIB.month - 1;
      const prevYear = nowWIB.month === 1 ? nowWIB.year - 1 : nowWIB.year;
      if (nowWIB.day <= APP_CONFIG.REPORT_DEADLINE_DAY + 3) {
        periods.push({ bulan: prevMonth, tahun: prevYear });
      }

      // Tambahkan juga periode bulan berjalan / bulan yang sedang dipilih
      if (!periods.some(p => p.bulan === nowWIB.month && p.tahun === nowWIB.year)) {
        periods.push({ bulan: nowWIB.month, tahun: nowWIB.year });
      }
      if (!periods.some(p => p.bulan === appState.selectedMonth && p.tahun === appState.selectedYear)) {
        periods.push({ bulan: appState.selectedMonth, tahun: appState.selectedYear });
      }
      return periods;
    }

    async function checkAndDispatchAutoNotifications(isInitialConnect = false) {
      const status = getDeviceNotificationStatusInfo();
      if (!status.isConnected || !appState.currentUser) return;

      // 1. Cek Pengumuman Baru dari Admin Daerah
      if (deviceNotifState.notifyAnnouncements && Array.isArray(dbStore.pengumuman)) {
        if (isInitialConnect && deviceNotifState.seenAnnouncementIds.length === 0) {
          // Tandai pengumuman lama sebagai sudah dilihat kecuali 1 pengumuman terbaru jika baru saja terbit hari ini
          const todayIso = getWIBParts().isoDate;
          dbStore.pengumuman.forEach((ann, idx) => {
            const annDate = String(ann.created_at || "").slice(0, 10);
            if (!(idx === 0 && annDate === todayIso)) {
              deviceNotifState.seenAnnouncementIds.push(ann.id);
            }
          });
        }

        const unseenAnnouncements = dbStore.pengumuman
          .filter(ann => ann && ann.id && !deviceNotifState.seenAnnouncementIds.includes(ann.id))
          .reverse();

        for (const ann of unseenAnnouncements) {
          deviceNotifState.seenAnnouncementIds.push(ann.id);
          await triggerNativeDeviceNotification(
            `📢 Pengumuman PPG Jepara: ${ann.judul}`,
            ann.isi,
            `digenara-ann-${ann.id}`,
            "dashboard"
          );
          showToast(`📢 Pengumuman Baru: ${ann.judul}`, "info");
        }
        persistDeviceNotifState();
      }

      // 2. Cek Perubahan Jadwal Batas Waktu Pelaporan oleh Admin
      const deadlineSig = `${APP_CONFIG.REPORT_DEADLINE_DAY}_${APP_CONFIG.REPORT_DEADLINE_HOUR_WIB}_${APP_CONFIG.ALLOW_LATE_REPORT}`;
      if (!deviceNotifState.lastDeadlineSignature) {
        deviceNotifState.lastDeadlineSignature = deadlineSig;
        persistDeviceNotifState();
      } else if (deviceNotifState.lastDeadlineSignature !== deadlineSig) {
        deviceNotifState.lastDeadlineSignature = deadlineSig;
        persistDeviceNotifState();
        const hhStr = String(APP_CONFIG.REPORT_DEADLINE_HOUR_WIB).padStart(2, "0");
        await triggerNativeDeviceNotification(
          "⏰ Pembaruan Batas Waktu Pelaporan DIGENARA",
          `Admin Daerah menetapkan batas waktu pelaporan bulanan menjadi Tanggal ${APP_CONFIG.REPORT_DEADLINE_DAY} pukul ${hhStr}.00 WIB.`,
          `digenara-deadline-cfg-${deadlineSig}`,
          appState.currentUser.role === "user" ? "laporan" : "dashboard"
        );
      }

      // 3. Pengingat Otomatis Batas Waktu Pelaporan (Khusus Akun Kelompok / User)
      if (deviceNotifState.notifyDeadlineReminders && appState.currentUser.role === "user") {
        const uid = appState.currentUser.id;
        const duePeriods = getActiveDueReportPeriods();

        for (const per of duePeriods) {
          const lap = dbStore.laporan_bulanan.find(
            l => l.kelompok_id === uid && Number(l.bulan) === per.bulan && Number(l.tahun) === per.tahun
          );
          const alreadySent = lap && (lap.status === "Dikirim" || lap.status === "Disetujui");
          if (alreadySent) continue;

          const info = getReportDeadlineInfo(per.bulan, per.tahun);
          const periodKey = `${per.tahun}-${String(per.bulan).padStart(2, "0")}`;
          const bulanLabel = `${NAMA_BULAN[per.bulan - 1]} ${per.tahun}`;

          if (info.isPassed) {
            const lateKey = `${periodKey}_LATE_${getWIBParts().isoDate}`;
            if (!deviceNotifState.sentReminderKeys[lateKey]) {
              deviceNotifState.sentReminderKeys[lateKey] = true;
              persistDeviceNotifState();
              await triggerNativeDeviceNotification(
                `⚠️ Batas Laporan ${bulanLabel} Telah Lewat!`,
                info.allowLate
                  ? `Laporan ${bulanLabel} belum dikirim (batas: ${info.formattedDate}). Segera kirimkan sekarang agar tercatat di Daerah Jepara.`
                  : `Batas pengiriman laporan ${bulanLabel} (${info.formattedDate}) telah berakhir.`,
                `digenara-rem-${lateKey}`,
                "laporan"
              );
            }
          } else if (info.hoursLeft <= 6) {
            const h0Key = `${periodKey}_H0_6H`;
            if (!deviceNotifState.sentReminderKeys[h0Key]) {
              deviceNotifState.sentReminderKeys[h0Key] = true;
              persistDeviceNotifState();
              await triggerNativeDeviceNotification(
                `🚨 Hari Terakhir! Batas Laporan ${bulanLabel}`,
                `Tinggal ±${Math.max(1, info.hoursLeft)} jam lagi menuju batas akhir (${info.formattedDate}). Segera kirim laporan kelompok Anda!`,
                `digenara-rem-${h0Key}`,
                "laporan"
              );
            }
          } else if (info.daysLeft <= 1) {
            const h1Key = `${periodKey}_H1`;
            if (!deviceNotifState.sentReminderKeys[h1Key]) {
              deviceNotifState.sentReminderKeys[h1Key] = true;
              persistDeviceNotifState();
              await triggerNativeDeviceNotification(
                `⏰ Pengingat H-1 Pelaporan ${bulanLabel}`,
                `Besok adalah batas akhir pengiriman laporan (${info.formattedDate}). Pastikan Jurnal, Presensi & Laporan sudah lengkap.`,
                `digenara-rem-${h1Key}`,
                "laporan"
              );
            }
          } else if (info.daysLeft <= 3) {
            const h3Key = `${periodKey}_H3`;
            if (!deviceNotifState.sentReminderKeys[h3Key]) {
              deviceNotifState.sentReminderKeys[h3Key] = true;
              persistDeviceNotifState();
              await triggerNativeDeviceNotification(
                `📅 Pengingat H-${info.daysLeft} Laporan ${bulanLabel}`,
                `Batas pengiriman laporan bulanan jatuh pada ${info.formattedDate}. Yuk lengkapi laporan kelompok sejak dini!`,
                `digenara-rem-${h3Key}`,
                "laporan"
              );
            }
          }
        }
      }
    }

    function setupSupabaseNotificationRealtime() {
      if (!isLiveSupabase || !supabaseClient) return;
      try {
        if (deviceNotifState.realtimeChannel) {
          supabaseClient.removeChannel(deviceNotifState.realtimeChannel);
          deviceNotifState.realtimeChannel = null;
        }
        deviceNotifState.realtimeChannel = supabaseClient
          .channel("digenara-realtime-notif")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "pengumuman" },
            async (payload) => {
              const newAnn = payload?.new;
              if (newAnn && newAnn.id) {
                if (!dbStore.pengumuman.some(a => a.id === newAnn.id)) {
                  dbStore.pengumuman.unshift(newAnn);
                }
                await checkAndDispatchAutoNotifications(false);
                renderApp();
              }
            }
          )
          .on(
            "postgres_changes",
            { event: "UPDATE", schema: "public", table: "pengaturan_sistem" },
            async (payload) => {
              if (payload?.new) {
                applySystemSettingsObject(payload.new);
                await checkAndDispatchAutoNotifications(false);
                renderApp();
              }
            }
          )
          .subscribe();
      } catch (err) {
        console.warn("Realtime listener dilewati:", err);
      }

      if (!deviceNotifState.pollTimer) {
        deviceNotifState.pollTimer = setInterval(async () => {
          if (!appState.currentUser) return;
          if (isLiveSupabase && supabaseClient && !appState.isOfflineMode) {
            try {
              const [resAnn, resCfg] = await Promise.all([
                supabaseClient.from("pengumuman").select("*").order("created_at", { ascending: false }).limit(10),
                supabaseClient.from("pengaturan_sistem").select("*").eq("id", "default").maybeSingle()
              ]);
              if (resAnn.data) dbStore.pengumuman = resAnn.data;
              if (resCfg.data) applySystemSettingsObject(resCfg.data);
            } catch (e) {}
          }
          await checkAndDispatchAutoNotifications(false);
        }, 60000);
      }
    }

    async function connectDeviceNotifications() {
      const status = getDeviceNotificationStatusInfo();
      if (!status.hasNotificationAPI) {
        openDeviceNotificationModal();
        return;
      }

      try {
        let perm = Notification.permission;
        if (perm === "default") {
          perm = await Notification.requestPermission();
        }
        if (perm !== "granted") {
          deviceNotifState.enabled = false;
          persistDeviceNotifState();
          showToast(
            perm === "denied"
              ? "Izin notifikasi diblokir browser. Aktifkan izin notifikasi di pengaturan situs browser Anda."
              : "Izin notifikasi belum disetujui.",
            "warning"
          );
          openDeviceNotificationModal();
          renderApp();
          return;
        }

        await registerLightweightNotificationSW();
        deviceNotifState.enabled = true;
        persistDeviceNotifState();

        await triggerNativeDeviceNotification(
          "✅ Notifikasi DIGENARA Jepara Tersambung!",
          "Perangkat ini akan menerima pengumuman Admin Daerah dan pengingat otomatis batas waktu pelaporan.",
          "digenara-connected",
          "dashboard"
        );

        await checkAndDispatchAutoNotifications(true);
        setupSupabaseNotificationRealtime();
        showToast("Perangkat berhasil disambungkan untuk menerima notifikasi!", "success");
        renderApp();
      } catch (err) {
        showToast("Gagal menyambungkan notifikasi: " + err.message, "error");
      }
    }

    function disconnectDeviceNotifications() {

    function initSupabase(url, key) {
      const cleanUrl = String(url || "").trim().replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
      if (cleanUrl && key && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(cleanUrl, key);
          isLiveSupabase = true;
          return true;
        } catch (err) {
          console.error("Gagal menginisialisasi Supabase:", err);
        }
      }
      supabaseClient = null;
      isLiveSupabase = false;
      return false;
    }

    async function resilientSupabaseMutation(table, method, payload, matchObj = null, options = {}) {
      if (!isLiveSupabase || !supabaseClient) return { error: null };
      let currentPayload = Array.isArray(payload)
        ? payload.map(item => ({ ...item }))
        : (payload ? { ...payload } : null);

      for (let attempt = 0; attempt < 5; attempt++) {
        let query;
        if (method === "insert") {
          query = supabaseClient.from(table).insert(currentPayload);
        } else if (method === "upsert") {
          query = supabaseClient.from(table).upsert(currentPayload, options);
        } else if (method === "update") {
          query = supabaseClient.from(table).update(currentPayload);
          if (matchObj) {
            Object.entries(matchObj).forEach(([k, v]) => { query = query.eq(k, v); });
          }
        }
        const res = await query;
        if (!res.error) return res;

        const msg = String(res.error.message || "");
        const colMatch = msg.match(/Could not find the '([^']+)' column/i) || msg.match(/column "([^"]+)" of relation/i);
        if (colMatch && colMatch[1] && currentPayload) {
          const missingCol = colMatch[1];
          if (Array.isArray(currentPayload)) {
            currentPayload.forEach(item => { delete item[missingCol]; });
          } else {
            delete currentPayload[missingCol];
          }
          continue;
        }
        return res;
      }
      return { error: null };
    }

      const cleanAllowLate = Boolean(allowLateVal);

      const payload = {
        id: "default",
        batas_tanggal: cleanDay,
        batas_jam_wib: cleanHour,
        izinkan_terlambat: cleanAllowLate,
        updated_by: appState.currentUser.id,
        updated_at: new Date().toISOString()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengaturan_sistem", "upsert", payload, null, { onConflict: "id" });
        if (res.error) {
          showToast("Gagal menyimpan batas pelaporan ke database: " + res.error.message, "error");
          return;
        }

      applySystemSettingsObject(payload);
      if (shouldCloseModal) closeModal();

      showToast(`Batas pelaporan diperbarui: Tanggal ${cleanDay} pukul ${hhStr}.00 WIB!`, "success");

    async function fetchOrRepairProfile(userId, usernameHint = "") {
      if (!isLiveSupabase || !supabaseClient) return null;
      let { data: profile } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();

      if (!profile && usernameHint === "admin_jepara") {
        const repaired = await resilientSupabaseMutation(
          "profiles",
          "upsert",
          {
            id: userId,
            username: "admin_jepara",
            role: "admin",
            nama_kelompok: "Pengurus Daerah Generus Jepara",
            nama_desa: "",
            avatar_url: "",
            daftar_guru: ["Admin Daerah Jepara"],
            jumlah_guru: 1,
            jumlah_rombel: 0,
            status_akun: "approved"
          },
          null,
          { onConflict: "id" }
        );
        if (!repaired.error) {
          const retry = await supabaseClient.from("profiles").select("*").eq("id", userId).maybeSingle();
          profile = retry.data;
        }
      }
      return profile;
    }

      if (!isLiveSupabase || !supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from("pengaturan_sistem")
          .select("*")
          .eq("id", "default")
          .maybeSingle();
        if (!error && data) {
          applySystemSettingsObject(data);
        }
      } catch (e) {}
    }

    async function restoreSupabaseSession() {
      if (!isLiveSupabase || !supabaseClient) return;
      try {
        await loadSystemSettingsFromSupabase();
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          const unameHint = session.user.email ? session.user.email.split("@")[0] : "";
          const profile = await fetchOrRepairProfile(session.user.id, unameHint);
          if (profile && isAccountActiveStatus(profile.status_akun)) {
            await syncAllFromSupabase();
            completeUserSession(profile, true);
            return;
          } else {
            await supabaseClient.auth.signOut();
          }
        }
        renderApp();
      } catch (err) {
        console.error("Gagal memulihkan sesi:", err);
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      captureRegistrationDraftFromDOM();
      const username = sanitizeUsername(document.getElementById("regUsername")?.value || "");
      const namaKelompok = document.getElementById("regKelompok")?.value.trim() || "";
      const namaDesa = document.getElementById("regDesa")?.value || "";
      const password = document.getElementById("regPassword")?.value || "";
      const confirmPassword = document.getElementById("regConfirmPassword")?.value || "";

      if (username.length < 4) {
        showToast("Username minimal 4 karakter (huruf kecil, angka, atau garis bawah).", "warning");
        return;
      }
      if (username === "admin" || username === "admin_jepara") {
        showToast("Username tersebut dicadangkan untuk Admin Daerah.", "error");
        return;
      }
      if (!namaDesa || !DESA_OPTIONS.includes(namaDesa)) {
        showToast("Silakan pilih Desa asal kelompok Anda.", "warning");
        return;
      }
      if (!namaKelompok) {
        showToast("Nama kelompok wajib diisi.", "warning");
        return;
      }
      if (password.length < 8) {
        showToast("Password minimal 8 karakter.", "warning");
        return;
      }
      if (password !== confirmPassword) {
        showToast("Konfirmasi password tidak cocok.", "error");
        return;
      }

      const daftarGuru = [];
      for (let i = 0; i < appState.regJumlahGuru; i++) {
        const val = document.getElementById(`regGuru_${i}`)?.value.trim();
        if (!val) {
          showToast(`Nama Guru ke-${i + 1} belum diisi.`, "warning");
          return;
        }
        daftarGuru.push(val);
      }

      const daftarRombel = [];
      for (let i = 0; i < appState.regJumlahRombel; i++) {
        const val = document.getElementById(`regRombel_${i}`)?.value.trim();
        if (!val) {
          showToast(`Nama Kelas/Rombel ke-${i + 1} belum diisi.`, "warning");
          return;
        }
        daftarRombel.push(val);
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          const email = `${username}${APP_CONFIG.INTERNAL_EMAIL_DOMAIN}`;
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: {
                username,
                nama_kelompok: namaKelompok,
                nama_desa: namaDesa,
                daftar_guru: daftarGuru,
                jumlah_guru: daftarGuru.length,
                jumlah_rombel: daftarRombel.length
              }
            }
          });
          if (error) {
            showToast("Pendaftaran gagal: " + error.message, "error");
            return;
          }

          const newUserId = data.user?.id;
          if (newUserId) {
            await resilientSupabaseMutation(
              "profiles",
              "upsert",
              {
                id: newUserId,
                username,
                role: "user",
                nama_kelompok: namaKelompok,
                nama_desa: namaDesa,
                avatar_url: "",
                daftar_guru: daftarGuru,
                jumlah_guru: daftarGuru.length,
                jumlah_rombel: daftarRombel.length,
                status_akun: "pending"
              },
              null,
              { onConflict: "id" }
            );

            if (daftarRombel.length > 0) {
              const rombelRows = daftarRombel.map((rName, idx) => ({
                id: generateUUID(),
                kelompok_id: newUserId,
                nama_rombel: rName,
                pertemuan_per_minggu: isMudaMudiRombel(rName) ? 2 : 5,
                urutan: idx + 1
              }));
              await resilientSupabaseMutation("rombel", "insert", rombelRows);
            }
          }
          await supabaseClient.auth.signOut();
        } catch (err) {
          showToast("Gagal mendaftar: " + (err.message || "Terjadi kesalahan."), "error");
          return;
        }
      } else {
        if (dbStore.profiles.some(p => p.username === username)) {
          showToast("Username sudah digunakan akun lain.", "error");
          return;
        }
        const newId = generateUUID();
        dbStore.profiles.push({
          id: newId,
          username,
          password_hash: password,
          role: "user",
          nama_kelompok: namaKelompok,
          nama_desa: namaDesa,
          avatar_url: "",
          daftar_guru: daftarGuru,
          jumlah_guru: daftarGuru.length,
          jumlah_rombel: daftarRombel.length,
          status_akun: "pending",
          reset_requested: false,
          reset_note: "",
          created_at: new Date().toISOString()
        });
        daftarRombel.forEach((rName, idx) => {
          dbStore.rombel.push({
            id: generateUUID(),
            kelompok_id: newId,
            nama_rombel: rName,
            pertemuan_per_minggu: isMudaMudiRombel(rName) ? 2 : 5,
            urutan: idx + 1
          });
        });
      }

      appState.regDraft = {
        username: "",
        nama_kelompok: "",
        nama_desa: "",
        gurus: ["", ""],
        rombels: ["Caberawit (PAUD - SD)", "Pra-Remaja (SMP)", "Remaja (SMA/SMK)", "Muda-Mudi"]
      };
      appState.authTab = "login";
      showToast("Pendaftaran akun berhasil dikirim! Tunggu persetujuan Admin Daerah Jepara.", "success");
      renderApp();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = sanitizeUsername(document.getElementById("loginUsername")?.value.trim() || "");
      const password = document.getElementById("loginPassword")?.value || "";

      if (!username || !password) {
        showToast("Masukkan username dan password Anda.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          const internalEmail = username + APP_CONFIG.INTERNAL_EMAIL_DOMAIN;
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: internalEmail,
            password
          });
          if (error) throw error;

          const profile = await fetchOrRepairProfile(data.user.id, username);
          if (!profile) {
            await supabaseClient.auth.signOut();
            showToast("Profil akun tidak ditemukan di database.", "error");
            return;
          }

          if (profile.status_akun === "pending") {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
            return;
          }
          if (profile.status_akun === "rejected") {
            await supabaseClient.auth.signOut();
            showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
            return;
          }
          if (!isAccountActiveStatus(profile.status_akun)) {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
            return;
          }

          await syncAllFromSupabase();
          completeUserSession(profile);
          return;
        } catch (err) {
          showToast("Login gagal: " + (err.message || "Username atau password salah."), "error");
          return;
        }
      }

      const user = dbStore.profiles.find(p => p.username === username);
      if (!user || user.password_hash !== password) {
        showToast("Username atau password tidak sesuai.", "error");
        return;
      }
      if (user.status_akun === "pending") {
        showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
        return;
      }
      if (user.status_akun === "rejected") {
        showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
        return;
      }
      if (!isAccountActiveStatus(user.status_akun)) {
        showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
        return;
      }

      completeUserSession(user);
    }

        registerLightweightNotificationSW().then(() => {

      setupSupabaseNotificationRealtime();

    async function syncAllFromSupabase() {
      if (!isLiveSupabase || !supabaseClient) return;
      try {
        const [
          resProfiles, resRombel, resPeserta, resJurnal,
          resPresensi, resLapBul, resLapMing, resDok, resKendala, resAnn, resLog, resSysCfg
        ] = await Promise.all([
          supabaseClient.from("profiles").select("*").order("created_at", { ascending: true }),
          supabaseClient.from("rombel").select("*").order("urutan", { ascending: true }),
          supabaseClient.from("peserta").select("*").order("nama_peserta", { ascending: true }),
          supabaseClient.from("jurnal_guru").select("*").order("tanggal", { ascending: false }),
          supabaseClient.from("presensi").select("*"),
          supabaseClient.from("laporan_bulanan").select("*"),
          supabaseClient.from("laporan_mingguan").select("*").order("minggu_ke", { ascending: true }),
          supabaseClient.from("dokumentasi_kegiatan").select("*").order("tanggal", { ascending: false }),
          supabaseClient.from("kendala_evaluasi").select("*").order("created_at", { ascending: false }),
          supabaseClient.from("pengumuman").select("*").order("created_at", { ascending: false }),
          supabaseClient.from("log_aktivitas").select("*").order("created_at", { ascending: false }).limit(50),
          supabaseClient.from("pengaturan_sistem").select("*").eq("id", "default").maybeSingle()
        ]);

        if (resProfiles.data) dbStore.profiles = resProfiles.data;
        if (resRombel.data) dbStore.rombel = resRombel.data;
        if (resPeserta.data) dbStore.peserta = resPeserta.data;
        if (resJurnal.data) dbStore.jurnal_guru = resJurnal.data;
        if (resPresensi.data) dbStore.presensi = resPresensi.data;
        if (resLapBul.data) dbStore.laporan_bulanan = resLapBul.data;
        if (resLapMing.data) dbStore.laporan_mingguan = resLapMing.data;
        if (resDok.data) dbStore.dokumentasi_kegiatan = resDok.data;
        if (resKendala.data) dbStore.kendala_evaluasi = resKendala.data;
        if (resAnn.data) dbStore.pengumuman = resAnn.data;
        if (resLog.data) dbStore.log_aktivitas = resLog.data;
        if (resSysCfg && resSysCfg.data) applySystemSettingsObject(resSysCfg.data);

        await checkAndDispatchAutoNotifications(false);
      } catch (err) {
        console.error("Sinkronisasi Supabase error:", err);
      }
    }

    async function saveAccountSettingsForm(e) {
      e.preventDefault();
      const user = appState.currentUser;
      if (!user) return;

      const newNamaKelompok = document.getElementById("accNamaKelompok").value.trim();
      const newUsername = sanitizeUsername(document.getElementById("accUsername").value.trim());
      const newPassword = document.getElementById("accNewPassword").value;

      if (!newNamaKelompok) {
        showToast("Nama kelompok/tampilan wajib diisi.", "warning");
        return;
      }
      if (newUsername.length < 4) {
        showToast("Username minimal 4 karakter.", "warning");
        return;
      }
      if (newPassword && newPassword.length < 8) {
        showToast("Password baru minimal 8 karakter.", "warning");
        return;
      }

      let newDesa = user.nama_desa || "";
      let newGurus = user.daftar_guru || [];
      if (user.role === "user") {
        newDesa = document.getElementById("accNamaDesa")?.value || newDesa;
        const rawGurus = document.getElementById("accDaftarGuru")?.value || "";
        const parsedGurus = rawGurus.split("\n").map(s => s.trim()).filter(Boolean);
        if (parsedGurus.length > 0) {
          newGurus = parsedGurus;
        }
      }

      let finalAvatarUrl = user.avatar_url || "";
      if (appState.pendingAvatarRemove) {
        finalAvatarUrl = "";
      } else if (appState.pendingAvatarDataUrl) {
        finalAvatarUrl = appState.pendingAvatarDataUrl;
        if (isLiveSupabase && supabaseClient && appState.pendingAvatarBlob) {
          try {
            const path = `${user.id}/avatar_${Date.now()}.jpg`;
            const up = await supabaseClient.storage
              .from(APP_CONFIG.STORAGE_BUCKET)
              .upload(path, appState.pendingAvatarBlob, { contentType: "image/jpeg", upsert: true });
            if (!up.error) {
              const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(path);
              if (pub?.data?.publicUrl) {
                finalAvatarUrl = pub.data.publicUrl;
              }
            }
          } catch (err) {}
        }
      }

      if (isLiveSupabase && supabaseClient) {
        if (newUsername !== user.username) {
          const rpcRes = await supabaseClient.rpc("update_own_username", { new_username: newUsername });
          if (rpcRes.error) {
            showToast("Gagal mengubah username: " + rpcRes.error.message, "error");
            return;
          }
        }
        if (newPassword) {
          const pwRes = await supabaseClient.auth.updateUser({ password: newPassword });
          if (pwRes.error) {
            showToast("Gagal mengganti password: " + pwRes.error.message, "error");
            return;
          }
        }
        const updatePayload = {
          nama_kelompok: newNamaKelompok,
          nama_desa: newDesa,
          avatar_url: finalAvatarUrl,
          daftar_guru: newGurus,
          jumlah_guru: newGurus.length
        };
        const profRes = await resilientSupabaseMutation("profiles", "update", updatePayload, { id: user.id });
        if (profRes.error) {
          showToast("Gagal menyimpan profil: " + profRes.error.message, "error");
          return;
        }
      } else {
        if (newUsername !== user.username && dbStore.profiles.some(p => p.username === newUsername && p.id !== user.id)) {
          showToast("Username sudah digunakan akun lain.", "error");
          return;
        }
        if (newPassword) user.password_hash = newPassword;
      }

      user.username = newUsername;
      user.nama_kelompok = newNamaKelompok;
      user.nama_desa = newDesa;
      user.avatar_url = finalAvatarUrl;
      user.daftar_guru = newGurus;
      user.jumlah_guru = newGurus.length;

      const inStore = dbStore.profiles.find(p => p.id === user.id);
      if (inStore) Object.assign(inStore, user);

      closeModal();
      showToast("Pengaturan akun & profil berhasil diperbarui!", "success");
      logActivity("Update Profil Akun", `Memperbarui profil ${newNamaKelompok}`);
      renderApp();
    }

    function calculatePresensiSummary(kelompokId, bulan, tahun, rombelId = null) {
      const recs = dbStore.presensi.filter(p =>
        p.kelompok_id === kelompokId &&
        Number(p.bulan) === Number(bulan) &&
        Number(p.tahun) === Number(tahun) &&
        (!rombelId || p.rombel_id === rombelId)
      );
      const total = recs.length;
      const H = recs.filter(r => r.status === "H").length;
      const I = recs.filter(r => r.status === "I").length;
      const S = recs.filter(r => r.status === "S").length;
      const A = recs.filter(r => r.status === "A").length;
      const pctH = total > 0 ? Math.round((H / total) * 100) : 0;
      const uniqueDates = Array.from(new Set(recs.map(r => r.tanggal))).sort();
      return { total, H, I, S, A, pctH, uniqueDates };
    }

    function compressImageFile(file, maxWidth = APP_CONFIG.MAX_PHOTO_WIDTH, targetKB = APP_CONFIG.TARGET_PHOTO_KB) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);

            let quality = 0.82;
            let dataUrl = canvas.toDataURL("image/jpeg", quality);
            while (Math.round((dataUrl.length * 3) / 4 / 1024) > targetKB && quality > 0.35) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL("image/jpeg", quality);
            }

            canvas.toBlob(
              (blob) => {
                const sizeKB = blob ? Math.max(1, Math.round(blob.size / 1024)) : Math.round((dataUrl.length * 3) / 4 / 1024);
                resolve({ blob, dataUrl, sizeKB });
              },
              "image/jpeg",
              quality
            );
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function exportToExcelFile(rows, sheetName, fileName) {
      if (!rows || rows.length === 0) {
        showToast("Tidak ada data untuk diekspor.", "warning");
        return;
      }
      try {
        if (window.XLSX) {
          const ws = XLSX.utils.json_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, String(sheetName || "Data").slice(0, 31));
          XLSX.writeFile(wb, fileName);
          showToast(`File Excel "${fileName}" berhasil diunduh!`, "success");
        } else {
          const headers = Object.keys(rows[0]);
          const csv = [
            headers.join(","),
            ...rows.map(r => headers.map(h => `"${String(r[h] ?? "").replace(/"/g, '""')}"`).join(","))
          ].join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName.replace(/\.xlsx$/i, ".csv");
          a.click();
          URL.revokeObjectURL(url);
          showToast("File CSV berhasil diunduh!", "success");
        }
      } catch (err) {
        showToast("Gagal mengekspor Excel: " + err.message, "error");
      }
    }

            { id: "dokumentasi", icon: "📸", shortLabel: "Foto", label: "📸 4. Dokumentasi" },
            { id: "kendala", icon: "💡", shortLabel: "Kendala", label: "💡 5. Kendala & Evaluasi" }
          ];

      let tabContent = "";
      if (isAdmin) {
        if (appState.activeTab === "dashboard") tabContent = renderAdminDashboard();
        else if (appState.activeTab === "akun") tabContent = renderAdminAkunTab();
        else if (appState.activeTab === "generus") tabContent = renderAdminGenerusTab();
        else if (appState.activeTab === "periksa") tabContent = renderAdminPeriksaTab();
        else if (appState.activeTab === "rekap") tabContent = renderAdminRekapTab();
        else if (appState.activeTab === "pengumuman") tabContent = renderAdminPengumumanTab();
      } else {
        if (appState.activeTab === "dashboard") tabContent = renderUserDashboard();
        else if (appState.activeTab === "jurnal") tabContent = renderUserJurnalTab();
        else if (appState.activeTab === "presensi") tabContent = renderUserPresensiTab();
        else if (appState.activeTab === "laporan") tabContent = renderUserLaporanTab();
        else if (appState.activeTab === "dokumentasi") tabContent = renderUserDokumentasiTab();
        else if (appState.activeTab === "kendala") tabContent = renderUserKendalaTab();
      }

      const yearsList = [wibNow.year - 1, wibNow.year, wibNow.year + 1];

      return `
        <div class="min-h-screen flex flex-col bg-slate-50">

            <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">

                    <span class="font-extrabold text-sm sm:text-base tracking-tight truncate">DIGENARA</span>

                  <div class="text-xs text-emerald-200 truncate font-medium">${escapeHTML(user.nama_kelompok)}</div>

                <select onchange="appState.selectedMonth=Number(this.value); renderApp();" class="bg-emerald-900 text-white text-xs font-bold px-2.5 py-1 rounded-lg border border-emerald-700 outline-none">

                </select>
                <select onchange="appState.selectedYear=Number(this.value); renderApp();" class="bg-emerald-900 text-white text-xs font-bold px-2.5 py-1 rounded-lg border border-emerald-700 outline-none">
                  ${yearsList.map(y => `<option value="${y}" ${appState.selectedYear === y ? "selected" : ""}>${y}</option>`).join("")}
                </select>
              </div>

              <!-- Bagian Kanan Atas: Notifikasi Perangkat, Segarkan & Menu Akun -->
              <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
                <button type="button" onclick="openDeviceNotificationModal()"

                  class="relative px-2.5 sm:px-3 py-2 rounded-xl border text-xs font-bold flex items-center gap-1.5 transition ${
                    notifStatus.isConnected
                      ? 'bg-emerald-800/90 hover:bg-emerald-700 text-emerald-100 border-emerald-600'
                      : 'bg-amber-400 hover:bg-amber-300 text-slate-950 border-amber-300 shadow-sm'
                  }">
                  <span>🔔</span>
                  <span class="hidden md:inline">${notifStatus.isConnected ? "Notifikasi Aktif" : "Sambungkan Notifikasi"}</span>
                  ${!notifStatus.isConnected ? `<span class="w-2 h-2 rounded-full bg-rose-600 animate-ping md:hidden"></span>` : ""}
                </button>
                <button type="button" onclick="manualSyncFromCloud()" title="Segarkan data terbaru dari Cloud"
                  class="px-2.5 sm:px-3 py-2 rounded-xl bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 border border-emerald-700 text-xs font-bold flex items-center gap-1.5 transition">
                  <span>🔄</span>
                  <span class="hidden md:inline">Segarkan</span>
                </button>
                <div id="accountHeaderControl" class="relative flex items-center gap-1.5">
                  <button type="button" onclick="toggleAccountMenuDropdown(event)" title="Foto Profil & Pengaturan Akun"
                    class="flex items-center gap-2 pl-1.5 pr-2.5 py-1 rounded-2xl bg-emerald-950/70 hover:bg-emerald-800 border border-emerald-700 transition">
                    <div class="w-8 h-8 rounded-xl overflow-hidden bg-amber-400 text-slate-950 font-extrabold text-xs flex items-center justify-center shrink-0">
                      ${user.avatar_url
                        ? `<img src="${escapeHTML(user.avatar_url)}" alt="Avatar" class="w-full h-full object-cover" />`
                        : escapeHTML(getUserInitials(user.nama_kelompok))}
                    </div>
                    <span class="text-xs font-bold hidden sm:inline">Akun ▾</span>
                  </button>

                  ${appState.accountMenuOpen ? `
                    <div class="absolute right-0 top-12 w-72 bg-white text-slate-900 rounded-2xl shadow-2xl border border-slate-200 py-2 z-50">
                      <div class="px-4 py-2.5 border-b border-slate-100">
                        <div class="font-extrabold text-xs text-slate-900 truncate">${escapeHTML(user.nama_kelompok)}</div>
                        <div class="text-[11px] text-slate-500 font-mono">@${escapeHTML(user.username)}</div>
                      </div>
                      <button type="button" onclick="openDeviceNotificationModal()" class="w-full px-4 py-2.5 text-left text-xs font-bold text-slate-700 hover:bg-slate-50 flex items-center justify-between gap-2">
                        <span class="flex items-center gap-2"><span>🔔</span><span>Sambungkan Notifikasi Perangkat</span></span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${notifStatus.isConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'}">
                          ${notifStatus.isConnected ? "Aktif" : "Atur"}
                        </span>
                      </button>
                      <button type="button" onclick="appState.accountMenuOpen=false; triggerInstallHomeScreenShortcut();" class="w-full px-4 py-2.5 text-left text-xs font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                        <span>📲</span><span>Pasang Pintasan Layar Utama</span>
                      </button>
                      <button type="button" onclick="openAccountSettingsModal()" class="w-full px-4 py-2.5 text-left text-xs font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                        <span>⚙️</span><span>Pengaturan Akun & Foto Profil</span>
                      </button>
                      ${isAdmin ? `
                        <button type="button" onclick="appState.accountMenuOpen=false; openDeadlineSettingsModal();" class="w-full px-4 py-2.5 text-left text-xs font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                          <span>⏰</span><span>Atur Batas Waktu Pelaporan</span>
                        </button>
                        <button type="button" onclick="appState.accountMenuOpen=false; openSupabaseConfigModal();" class="w-full px-4 py-2.5 text-left text-xs font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                          <span>🗄️</span><span>Koneksi Database Supabase</span>
                        </button>
                      ` : ""}
                      <div class="my-1 border-t border-slate-100"></div>
                      <button type="button" onclick="handleLogout()" class="w-full px-4 py-2.5 text-left text-xs font-extrabold text-rose-600 hover:bg-rose-50 flex items-center gap-2">
                        <span>🚪</span><span>Keluar (Logout)</span>
                      </button>
                    </div>
                  ` : ""}
                </div>
              </div>
            </div>

            <!-- Navigasi Menu (Desktop & Tablet) -->
            <nav class="hidden md:block bg-white text-slate-700 border-b border-slate-200 overflow-x-auto">
              <div class="max-w-7xl mx-auto px-3 sm:px-6 flex items-center gap-1 py-1.5">
                ${navTabs.map(t => {
                  const active = appState.activeTab === t.id;
                  return `
                    <button type="button" onclick="appState.activeTab='${t.id}'; renderApp();"
                      class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition flex items-center gap-1.5 ${active ? 'bg-emerald-700 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}">
                      <span>${t.label}</span>
                      ${t.badge ? `<span class="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold ${active ? 'bg-amber-400 text-slate-950' : 'bg-rose-600 text-white'}">${t.badge}</span>` : ""}
                    </button>
                  `;
                }).join("")}
              </div>
            </nav>
          </header>

          <!-- Konten Utama -->
          <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 pt-5 pb-24 md:py-6">
            ${tabContent}
          </main>

          <!-- Bilah Navigasi Bawah Khusus HP (Mobile Bottom Navigation Bar) -->
          <nav aria-label="Menu Navigasi HP"
            class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_16px_rgba(15,23,42,0.08)] no-print"
            style="padding-bottom: env(safe-area-inset-bottom);">
            <div class="grid grid-cols-6 gap-0.5 px-1 py-1.5">
              ${navTabs.map(t => {
                const active = appState.activeTab === t.id;
                return `
                  <button type="button" onclick="appState.activeTab='${t.id}'; renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });"
                    class="relative flex flex-col items-center justify-center py-1 px-0.5 rounded-xl transition ${active ? 'bg-emerald-50 text-emerald-800' : 'text-slate-500 hover:text-slate-900 active:bg-slate-100'}">

                    <span class="text-[10px] mt-1 leading-tight truncate max-w-full ${active ? 'font-extrabold text-emerald-900' : 'font-semibold'}">${t.shortLabel}</span>
                    ${t.badge ? `<span class="absolute top-0.5 right-2 min-w-[16px] h-4 px-1 rounded-full bg-rose-600 text-white text-[9px] font-extrabold flex items-center justify-center">${t.badge}</span>` : ""}
                  </button>
                `;
              }).join("")}
            </div>
          </nav>
        </div>
      `;
    }

    // ============================================================================
    // BERANDA USER (KELOMPOK)
    // ============================================================================
    function renderUserDashboard() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const deadlineInfo = getReportDeadlineInfo(bulan, tahun);
      const notifStatus = getDeviceNotificationStatusInfo();

      const myRombels = getGroupRombels(uid);
      const myPeserta = dbStore.peserta.filter(p => p.kelompok_id === uid && p.aktif);
      const myJurnal = dbStore.jurnal_guru.filter(j => {
        const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
        return j.kelompok_id === uid && jm === bulan && jy === tahun;
      });
      const presSummary = calculatePresensiSummary(uid, bulan, tahun);
      const myLaporan = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      const myPhotos = dbStore.dokumentasi_kegiatan.filter(d => d.kelompok_id === uid && Number(d.bulan) === bulan && Number(d.tahun) === tahun);
      const myKendala = dbStore.kendala_evaluasi.filter(k => k.kelompok_id === uid && Number(k.bulan) === bulan && Number(k.tahun) === tahun);

      const checklistItems = [
        {
          done: myJurnal.length > 0,
          label: "1. Jurnal Guru Mengajar",
          desc: myJurnal.length > 0 ? `${myJurnal.length} pertemuan tercatat` : "Belum ada jurnal bulan ini",
          tab: "jurnal"
        },
        {
          done: presSummary.total > 0,
          label: "2. Presensi Peserta",
          desc: presSummary.total > 0 ? `${presSummary.uniqueDates.length} hari (${presSummary.pctH}% hadir)` : "Belum ada presensi bulan ini",
          tab: "presensi"
        },
        {
          done: Boolean(myLaporan && ["Dikirim", "Disetujui"].includes(myLaporan.status)),
          label: "3. Laporan Kegiatan Bulanan",
          desc: myLaporan ? `Status: ${myLaporan.status}${myLaporan.terlambat ? " (Terlambat)" : ""}` : "Belum dibuat / dikirim",
          tab: "laporan"
        },
        {
          done: myPhotos.length > 0,
          label: "4. Dokumentasi Kegiatan",
          desc: `${myPhotos.length} dari ${APP_CONFIG.MAX_PHOTOS_PER_MONTH} foto terunggah`,
          tab: "dokumentasi"
        },
        {
          done: myKendala.length > 0,
          label: "5. Kendala & Evaluasi",
          desc: myKendala.length > 0 ? `${myKendala.length} catatan evaluasi` : "Opsional jika ada hambatan",
          tab: "kendala"
        }
      ];

      const chartMonths = [];
      for (let i = 5; i >= 0; i--) {
        let m = bulan - i;
        let y = tahun;
        while (m <= 0) { m += 12; y -= 1; }
        const s = calculatePresensiSummary(uid, m, y);
        chartMonths.push({ label: NAMA_BULAN[m - 1].slice(0, 3), pct: s.pctH });
      }

      return `
        <div class="space-y-6">
          <!-- Bilah Status Sambungkan Notifikasi Perangkat -->
          <div class="p-3.5 sm:p-4 rounded-2xl border flex flex-wrap items-center justify-between gap-3 ${
            notifStatus.isConnected
              ? 'bg-emerald-50/90 border-emerald-200 text-emerald-950'
              : 'bg-white border-amber-300 shadow-sm text-slate-900'
          }">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0 ${notifStatus.isConnected ? 'bg-emerald-700 text-white' : 'bg-amber-400 text-slate-950'}">
                🔔
              </div>
              <div>
                <div class="font-extrabold text-xs sm:text-sm">
                  ${notifStatus.isConnected ? "Notifikasi Perangkat Aktif" : "Sambungkan Notifikasi Perangkat"}
                </div>
                <div class="text-[11px] sm:text-xs text-slate-600 mt-0.5">
                  ${notifStatus.isConnected
                    ? "Terhubung untuk pengumuman resmi Admin Daerah & pengingat otomatis batas waktu pelaporan."
                    : "Aktifkan notifikasi di HP/Laptop agar otomatis menerima pengumuman Admin & pengingat tenggat laporan."}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              ${notifStatus.isConnected ? `
                <button type="button" onclick="openDeviceNotificationModal()" class="px-3.5 py-2 rounded-xl bg-white border border-emerald-300 hover:bg-emerald-100 text-emerald-900 font-bold text-xs">
                  ⚙️ Atur Notifikasi
                </button>
              ` : `
                <button type="button" onclick="connectDeviceNotifications()" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs shadow-sm">
                  🔔 Sambungkan Sekarang
                </button>
              `}
            </div>
          </div>

          ${dbStore.pengumuman.length > 0 ? `
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 sm:p-5 shadow-sm space-y-3">
              ${dbStore.pengumuman.slice(0, 3).map((ann, idx) => `
                <div class="flex items-start gap-3 ${idx > 0 ? 'pt-3 border-t border-amber-200/80' : ''}">
                  <span class="text-xl sm:text-2xl">${idx === 0 ? "📢" : "📌"}</span>
                  <div class="flex-1">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <h3 class="font-extrabold text-amber-950 text-sm sm:text-base">${escapeHTML(ann.judul)}</h3>
                      <span class="text-xs text-amber-700">${formatDateTimeWIB(ann.created_at)}</span>
                    </div>
                    <p class="text-xs sm:text-sm text-amber-900/90 mt-1 leading-relaxed">${escapeHTML(ann.isi)}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          ` : ""}

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold uppercase text-slate-400">Generus Aktif</div>
              <div class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">${myPeserta.length}</div>
              <div class="text-xs text-slate-500 mt-1">${myRombels.length} Kelas / Rombel</div>
            </div>
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold uppercase text-slate-400">Jurnal Pertemuan</div>
              <div class="text-2xl sm:text-3xl font-extrabold text-emerald-700 mt-1">${myJurnal.length}x</div>
              <div class="text-xs text-slate-500 mt-1">Bulan ${NAMA_BULAN[bulan - 1]}</div>
            </div>
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold uppercase text-slate-400">Kehadiran Rata-Rata</div>
              <div class="text-2xl sm:text-3xl font-extrabold text-sky-700 mt-1">${presSummary.pctH}%</div>
              <div class="text-xs text-slate-500 mt-1">${presSummary.uniqueDates.length} hari tercatat</div>
            </div>
            <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold uppercase text-slate-400">Status & Batas Laporan</div>
              <div class="text-lg sm:text-xl font-extrabold text-amber-700 mt-1.5">
                ${escapeHTML(myLaporan?.status || "Belum Dibuat")}
                ${myLaporan?.terlambat ? `<span class="text-xs font-bold text-rose-600">(Terlambat)</span>` : ""}
              </div>
              <div class="text-xs text-slate-500 mt-1">Batas: ${deadlineInfo.formattedDate}</div>
            </div>
          </div>

          ${myLaporan?.komentar_admin ? `
            <div class="p-4 rounded-2xl border ${myLaporan.status === 'Perlu Revisi' ? 'bg-rose-50 border-rose-200 text-rose-900' : 'bg-emerald-50 border-emerald-200 text-emerald-900'}">
              <div class="font-bold text-sm">💬 Catatan Review Admin Daerah:</div>
              <p class="text-sm mt-1">${escapeHTML(myLaporan.komentar_admin)}</p>
            </div>
          ` : ""}

          <!-- Checklist Kesiapan Pelaporan Bulan Ini -->
          <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <h3 class="font-extrabold text-slate-900 text-sm sm:text-base">📋 Checklist Kesiapan Laporan (${NAMA_BULAN[bulan - 1]} ${tahun})</h3>
                <p class="text-xs text-slate-500">
                  Batas pengiriman periode ini: <strong>${deadlineInfo.formattedDate}</strong>
                  ${deadlineInfo.isPassed
                    ? (deadlineInfo.allowLate ? `<span class="text-amber-700 font-bold">(Melewati batas • tetap diterima dengan status Terlambat)</span>` : `<span class="text-rose-700 font-bold">(Waktu pelaporan telah ditutup)</span>`)
                    : `<span class="text-emerald-700 font-bold">(${deadlineInfo.daysLeft} hari tersisa)</span>`}
                </p>
              </div>
              <span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 text-xs font-extrabold">
                ${checklistItems.filter(c => c.done).length}/${checklistItems.length} Terpenuhi
              </span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
              ${checklistItems.map(c => `
                <button type="button" onclick="appState.activeTab='${c.tab}'; renderApp();"
                  class="p-3 rounded-xl border text-left transition flex items-start gap-2.5 ${c.done ? 'bg-emerald-50/70 border-emerald-200 hover:bg-emerald-100/70' : 'bg-slate-50 border-slate-200 hover:border-amber-400'}">
                  <span class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${c.done ? 'bg-emerald-600 text-white' : 'bg-amber-200 text-amber-950'}">
                    ${c.done ? "✓" : "!"}
                  </span>
                  <div class="min-w-0">
                    <div class="font-bold text-xs text-slate-900 truncate">${escapeHTML(c.label)}</div>
                    <div class="text-[11px] text-slate-600 mt-0.5 truncate">${escapeHTML(c.desc)}</div>
                  </div>
                </button>
              `).join("")}
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
              <h3 class="font-extrabold text-slate-900 text-sm sm:text-base mb-4">📊 Grafik Kehadiran 6 Bulan Terakhir</h3>
              <div class="grid grid-cols-6 gap-2 items-end h-40 pt-4 px-2 bg-slate-50 rounded-xl border border-slate-100">
                ${chartMonths.map(cm => `
                  <div class="flex flex-col items-center gap-1.5 h-full justify-end">
                    <span class="text-[11px] font-extrabold text-slate-700">${cm.pct}%</span>
                    <div class="w-full max-w-[36px] bg-emerald-600 rounded-t-lg transition-all" style="height: ${Math.max(8, cm.pct)}%"></div>
                    <span class="text-[11px] font-bold text-slate-500 pb-1">${cm.label}</span>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between space-y-4">
              <div>
                <h3 class="font-extrabold text-slate-900 text-sm sm:text-base">⚡ Pintasan Input Cepat</h3>
                <p class="text-xs text-slate-500 mt-0.5">Kelompok: <strong>${escapeHTML(appState.currentUser.nama_kelompok)}</strong> (${escapeHTML(appState.currentUser.nama_desa || "-")})</p>
              </div>

    function detectWeekAndSlotForJurnal(uid, rombelId, isoDate) {
      const cleanDate = String(isoDate || getWIBParts().isoDate).slice(0, 10);
      const parts = cleanDate.split("-").map(Number);
      const jy = parts[0] || appState.selectedYear;
      const jm = parts[1] || appState.selectedMonth;
      const jd = parts[2] || 1;
      const autoWeek = Math.min(5, Math.max(1, Math.ceil(jd / 7)));

      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      const maxPt = Math.min(7, Math.max(1, Number(rombelObj?.pertemuan_per_minggu) || (isMudaMudiRombel(rombelObj?.nama_rombel) ? 2 : 5)));

      const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === jm && Number(l.tahun) === jy);
      if (lap) {
        const sameDateRow = dbStore.laporan_mingguan.find(w => w.laporan_id === lap.id && w.rombel_id === rombelId && w.tanggal === cleanDate);
        if (sameDateRow) {
          return { week: Number(sameDateRow.minggu_ke) || autoWeek, pertemuan: Number(sameDateRow.pertemuan_ke || 1), maxPt };
        }
        const weekRows = dbStore.laporan_mingguan
          .filter(w => w.laporan_id === lap.id && w.rombel_id === rombelId && Number(w.minggu_ke) === autoWeek)
          .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));
        const firstEmpty = weekRows.find(w => !w.tanggal && !w.tidak_ada_kegiatan && !MATERI_OPTIONS_LIST.some(m => String(w[m.key] || "").trim() !== ""));
        if (firstEmpty) {
          return { week: autoWeek, pertemuan: Number(firstEmpty.pertemuan_ke || 1), maxPt };
        }
      }
      return { week: autoWeek, pertemuan: 1, maxPt };
    }

    async function syncJurnalToLaporanKegiatan(jurnalRow, targetWeek, targetPertemuan) {
      const uid = jurnalRow.kelompok_id;
      const rombelId = jurnalRow.rombel_id;
      if (!uid || !rombelId || !jurnalRow.tanggal) return false;

      const [jy, jm] = String(jurnalRow.tanggal).split("-").map(Number);
      if (!jy || !jm) return false;

      const lap = ensureMonthlyReportAndRows(uid, jm, jy);

      let targetRow = dbStore.laporan_mingguan.find(w =>
        w.laporan_id === lap.id &&
        w.rombel_id === rombelId &&
        w.tanggal === jurnalRow.tanggal
      );

      if (!targetRow) {
        targetRow = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === lap.id &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === Number(targetWeek) &&
          Number(w.pertemuan_ke || 1) === Number(targetPertemuan)
        );
      }

      if (!targetRow) {
        targetRow = {
          id: generateUUID(),
          laporan_id: lap.id,
          rombel_id: rombelId,
          minggu_ke: Number(targetWeek) || 1,
          pertemuan_ke: Number(targetPertemuan) || 1,
          tanggal: jurnalRow.tanggal,
          pegon: "",
          bacaan: "",
          tajwid: "",
          hafalan: "",
          makna: "",
          lain_lain: "",
          tidak_ada_kegiatan: false,
          alasan: "",
          keterangan: ""
        };
        dbStore.laporan_mingguan.push(targetRow);
      }

      targetRow.tanggal = jurnalRow.tanggal;
      targetRow.tidak_ada_kegiatan = false;
      targetRow.alasan = "";
      targetRow.pegon = jurnalRow.pegon || "";
      targetRow.tajwid = jurnalRow.tajwid || "";
      targetRow.hafalan = jurnalRow.hafalan || "";
      targetRow.bacaan = jurnalRow.bacaan || "";
      targetRow.makna = jurnalRow.makna || "";
      targetRow.lain_lain = jurnalRow.lain_lain || "";

      const ketParts = [
        jurnalRow.metode ? `Metode: ${jurnalRow.metode}` : "",
        jurnalRow.catatan || ""
      ].filter(Boolean);
      targetRow.keterangan = ketParts.join(" • ");

      appState.weeklySelectedMateriMap[targetRow.id] = MATERI_OPTIONS_LIST
        .filter(m => String(targetRow[m.key] || "").trim() !== "")
        .map(m => m.key);

      if (Number(targetRow.minggu_ke) === 5) {
        appState.showWeek5 = true;
      }

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        await resilientSupabaseMutation(
          "laporan_mingguan",
          "upsert",
          { ...targetRow, tanggal: targetRow.tanggal || null },
          null,
          { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" }
        );
      }

      return true;
    }
