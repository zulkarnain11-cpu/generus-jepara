    const NAMA_BULAN = [

    function getWIBParts(dateObj = new Date()) {
      try {
        const formatter = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Jakarta",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
        const parts = formatter.formatToParts(dateObj);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const year = parseInt(map.year, 10);
        const month = parseInt(map.month, 10);
        const day = parseInt(map.day, 10);
        const hour = parseInt(map.hour, 10) % 24;
        const minute = parseInt(map.minute, 10);
        const hh = String(hour).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${map.year}-${map.month}-${map.day}`,
          timeStr: `${hh}:${map.minute} WIB`
        };
      } catch (e) {
        const utc = dateObj.getTime() + dateObj.getTimezoneOffset() * 60000;
        const wib = new Date(utc + 7 * 3600000);
        const year = wib.getFullYear();
        const month = wib.getMonth() + 1;
        const day = wib.getDate();
        const hour = wib.getHours();
        const minute = wib.getMinutes();
        const pad = (n) => String(n).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${year}-${pad(month)}-${pad(day)}`,
          timeStr: `${pad(hour)}:${pad(minute)} WIB`
        };
      }
    }

    function formatTanggalID(isoDateStr) {
      if (!isoDateStr) return "-";
      const clean = String(isoDateStr).slice(0, 10);
      const parts = clean.split("-");
      if (parts.length !== 3) return escapeHTML(String(isoDateStr));
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      if (!m || !d || m < 1 || m > 12) return escapeHTML(clean);
      return `${d} ${NAMA_BULAN[m - 1]} ${y}`;
    }

    function formatDateTimeWIB(isoTimestamp) {
      if (!isoTimestamp) return "-";
      const d = new Date(isoTimestamp);
      if (isNaN(d.getTime())) return "-";
      const p = getWIBParts(d);
      return `${p.day} ${NAMA_BULAN[p.month - 1].slice(0, 3)} ${p.year}, ${p.timeStr}`;
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const styles = {
        success: "bg-emerald-900 text-white border-emerald-700",
        error: "bg-rose-900 text-white border-rose-700",
        warning: "bg-amber-500 text-slate-950 border-amber-600",
        info: "bg-slate-900 text-white border-slate-700"
      };
      const icons = {
        success: "✅",
        error: "❌",
        warning: "⚠️",
        info: "ℹ️"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base leading-none mt-0.5">${icons[type] || icons.info}</span>
        <div class="flex-1 leading-snug">${escapeHTML(message)}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => toast.remove(), 300);
      }, 4200);
    }

        try {
          supabaseClient = window.supabase.createClient(cleanUrl, key);
          isLiveSupabase = true;
          return true;

          console.error("Gagal menginisialisasi Supabase:", err);
        }

      supabaseClient = null;
      isLiveSupabase = false;
      return false;

      const namaKelompok = document.getElementById("regKelompok").value.trim();

      if (!username || username.length < 4) {
        showToast("Username minimal 4 karakter (huruf kecil, angka, atau garis bawah tanpa spasi).", "error");
        return;
      }
      if (username === "admin" || username === "admin_jepara") {
        showToast("Username tersebut dicadangkan untuk Admin Daerah.", "error");
        return;
      }
      if (password.length < 8) {
        showToast("Password minimal 8 karakter demi keamanan.", "error");
        return;
      }
      if (password !== confirmPass) {
        showToast("Konfirmasi password tidak cocok!", "error");
        return;
      }
      if (!namaKelompok) {
        showToast("Nama Kelompok wajib diisi.", "error");
        return;
      }

      const daftarGuru = [];
      for (let i = 0; i < appState.regJumlahGuru; i++) {
        const val = document.getElementById(`regGuru_${i}`)?.value.trim();
        if (!val) {
          showToast(`Nama Guru ke-${i + 1} belum diisi.`, "error");
          return;
        }
        daftarGuru.push(val);
      }

      const daftarRombel = [];
      for (let i = 0; i < appState.regJumlahRombel; i++) {
        const val = document.getElementById(`regRombel_${i}`)?.value.trim();
        if (!val) {
          showToast(`Nama Kelas/Rombel ke-${i + 1} belum diisi.`, "error");
          return;
        }
        daftarRombel.push(val);
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          const internalEmail = username + APP_CONFIG.INTERNAL_EMAIL_DOMAIN;
          const { error } = await supabaseClient.auth.signUp({
            email: internalEmail,
            password: password,
            options: {
              data: {
                username,
                nama_kelompok: namaKelompok,
                daftar_guru: daftarGuru,
                jumlah_guru: daftarGuru.length,
                jumlah_rombel: daftarRombel.length,
                daftar_rombel: daftarRombel
              }
            }
          });
          if (error) throw error;
          await supabaseClient.auth.signOut();
          showToast("Pendaftaran berhasil! Status akun Anda: Menunggu Persetujuan Admin.", "success");
          appState.authTab = "login";
          renderApp();
          return;
        } catch (err) {
          showToast("Gagal mendaftar: " + (err.message || "Username mungkin sudah dipakai."), "error");
          return;
        }
      }

      if (dbStore.profiles.some(p => p.username === username)) {
        showToast("Username sudah terdaftar! Silakan pilih username lain.", "error");
        return;
      }

      const newUserId = generateUUID();
      dbStore.profiles.push({
        id: newUserId,
        username,
        password_hash: password,
        role: "user",
        nama_kelompok: namaKelompok,
        daftar_guru: daftarGuru,
        jumlah_guru: daftarGuru.length,
        jumlah_rombel: daftarRombel.length,
        status_akun: "pending",
        reset_requested: false,
        reset_note: "",
        created_at: new Date().toISOString()
      });

      daftarRombel.forEach((namaRombel, idx) => {
        dbStore.rombel.push({
          id: generateUUID(),
          kelompok_id: newUserId,
          nama_rombel: namaRombel,
          pertemuan_per_minggu: isMudaMudiRombel(namaRombel) ? 2 : 5,
          urutan: idx + 1
        });
      });

      showToast("Pendaftaran berhasil dikirim! Status akun: Menunggu Persetujuan Admin.", "success");
      appState.authTab = "login";
      renderApp();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = sanitizeUsername(document.getElementById("loginUsername").value.trim());
      const password = document.getElementById("loginPassword").value;

      if (!username || !password) {
        showToast("Masukkan username dan password Anda.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          const internalEmail = username + APP_CONFIG.INTERNAL_EMAIL_DOMAIN;
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: internalEmail,
            password
          });
          if (error) throw error;

          const { data: profile, error: profErr } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", data.user.id)
            .single();

          if (profErr || !profile) {
            await supabaseClient.auth.signOut();
            showToast("Profil akun tidak ditemukan di database. Pastikan skema SQL sudah dijalankan.", "error");
            return;
          }

          if (profile.status_akun === "pending") {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
            return;
          }
          if (profile.status_akun === "rejected") {
            await supabaseClient.auth.signOut();
            showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
            return;
          }
          if (profile.status_akun === "inactive") {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
            return;
          }

          await syncAllFromSupabase();
          completeUserSession(profile);
          return;
        } catch (err) {
          showToast("Login gagal: " + (err.message || "Username atau password salah."), "error");
          return;
        }
      }

      const user = dbStore.profiles.find(p => p.username === username);
      if (!user || user.password_hash !== password) {
        showToast("Username atau password tidak sesuai.", "error");
        return;
      }
      if (user.status_akun === "pending") {
        showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
        return;
      }
      if (user.status_akun === "rejected") {
        showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
        return;
      }
      if (user.status_akun === "inactive") {
        showToast("Akun Anda dinonaktifkan sementara oleh Admin.", "error");
        return;
      }

      completeUserSession(user);
    }

    // HELPER QUERY DATA KELOMPOK & REKAP KEHADIRAN OTOMATIS
    // ============================================================================
    function isMudaMudiRombel(namaRombel) {
      return /muda[\s-]*mudi/i.test(String(namaRombel || ""));
    }

    function getRombelMeetingsPerWeek(rombelObj) {
      if (!rombelObj) return 5;
      if (rombelObj.pertemuan_per_minggu) return Number(rombelObj.pertemuan_per_minggu);
      return isMudaMudiRombel(rombelObj.nama_rombel) ? 2 : 5;
    }

    function getGroupRombels(kelompokId) {
      return dbStore.rombel
        .filter(r => r.kelompok_id === kelompokId)
        .sort((a, b) => (a.urutan || 1) - (b.urutan || 1));
    }

    function getRombelName(rombelId) {
      const r = dbStore.rombel.find(x => x.id === rombelId);
      return r ? r.nama_rombel : "Umum / Semua Kelas";
    }

    function getKelompokName(kelompokId) {
      const p = dbStore.profiles.find(x => x.id === kelompokId);
      return p ? p.nama_kelompok : "-";
    }

    function calculatePresensiSummary(kelompokId, bulan, tahun, rombelIdFilter = null) {
      const records = dbStore.presensi.filter(p =>
        p.kelompok_id === kelompokId &&
        Number(p.bulan) === Number(bulan) &&
        Number(p.tahun) === Number(tahun) &&
        (!rombelIdFilter || p.rombel_id === rombelIdFilter)
      );

      let H = 0, I = 0, S = 0, A = 0;
      const uniqueDates = new Set();
      records.forEach(r => {
        uniqueDates.add(r.tanggal);
        if (r.status === "H") H++;
        else if (r.status === "I") I++;
        else if (r.status === "S") S++;
        else if (r.status === "A") A++;
      });

      const total = H + I + S + A;
      const pctH = total > 0 ? Number(((H / total) * 100).toFixed(1)) : 0;
      const pctI = total > 0 ? Number(((I / total) * 100).toFixed(1)) : 0;
      const pctS = total > 0 ? Number(((S / total) * 100).toFixed(1)) : 0;
      const pctA = total > 0 ? Number(((A / total) * 100).toFixed(1)) : 0;

      return {
        H, I, S, A, total,
        pctH, pctI, pctS, pctA,
        uniqueDates: Array.from(uniqueDates).sort()
      };
    }

    // ============================================================================
    // KOMPRESI FOTO OTOMATIS DI BROWSER (MAKS 1280 PX, TARGET ±300 KB)
    // ============================================================================
    async function compressImageInBrowser(file, maxWidth = APP_CONFIG.MAX_PHOTO_WIDTH, targetKB = APP_CONFIG.TARGET_PHOTO_KB) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) {
          reject(new Error("File harus berupa gambar (JPG/PNG/WebP)."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
        reader.onload = (event) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Format gambar tidak didukung."));
          img.onload = async () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            let quality = 0.85;
            let blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));

            while (blob && blob.size / 1024 > targetKB && quality > 0.35) {
              quality -= 0.08;
              blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
            }

            const dataUrl = await new Promise(res => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.readAsDataURL(blob);
            });

            resolve({
              blob,
              dataUrl,
              sizeKB: Math.round(blob.size / 1024),
              width,
              height
            });
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ============================================================================
    // SHARE HASIL KEGIATAN & PRESENSI MINGGUAN KE WHATSAPP / GRUP ORANG TUA
    // ============================================================================
    function buildWeeklyWhatsAppReportText(laporanId, rombelId, weekNum) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return "";
      const kelompokName = appState.currentUser?.nama_kelompok || getKelompokName(lap.kelompok_id);
      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      const rombelName = rombelObj ? rombelObj.nama_rombel : "Semua Kelas";
      const meetingsPerWeek = getRombelMeetingsPerWeek(rombelObj);
      const bulanName = NAMA_BULAN[Number(lap.bulan) - 1];

      const dailyRows = dbStore.laporan_mingguan
        .filter(m =>
          m.laporan_id === lap.id &&
          m.rombel_id === rombelId &&
          Number(m.minggu_ke) === Number(weekNum) &&
          Number(m.pertemuan_ke || 1) <= meetingsPerWeek
        )
        .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));

      let materiLines = [];
      const weekDates = [];

      dailyRows.forEach(w => {
        const pt = Number(w.pertemuan_ke || 1);
        const tglLabel = w.tanggal ? ` (${formatTanggalID(w.tanggal)})` : "";
        if (w.tanggal) weekDates.push(w.tanggal);

        if (w.tidak_ada_kegiatan) {
          materiLines.push(`*Pertemuan ke-${pt}${tglLabel}:*\n  _Libur / Tidak ada kegiatan (${w.alasan || "-"})_`);
        } else {
          const parts = [];
          if (w.pegon && w.pegon.trim()) parts.push(`  • Pegon: ${w.pegon.trim()}`);
          if (w.bacaan && w.bacaan.trim()) parts.push(`  • Bacaan: ${w.bacaan.trim()}`);
          if (w.tajwid && w.tajwid.trim()) parts.push(`  • Tajwid: ${w.tajwid.trim()}`);
          if (w.hafalan && w.hafalan.trim()) parts.push(`  • Hafalan: ${w.hafalan.trim()}`);
          if (w.makna && w.makna.trim()) parts.push(`  • Makna: ${w.makna.trim()}`);
          if (w.lain_lain && w.lain_lain.trim()) parts.push(`  • Lain-lain: ${w.lain_lain.trim()}`);
          if (w.keterangan && w.keterangan.trim()) parts.push(`  • Catatan: ${w.keterangan.trim()}`);

          if (parts.length === 0) {
            materiLines.push(`*Pertemuan ke-${pt}${tglLabel}:*\n  _Belum ada catatan materi_`);
          } else {
            materiLines.push(`*Pertemuan ke-${pt}${tglLabel}:*\n${parts.join("\n")}`);
          }
        }
      });

      const pesertaList = dbStore.peserta.filter(p =>
        p.kelompok_id === lap.kelompok_id &&
        p.rombel_id === rombelId &&
        p.aktif
      );

      const presRecords = dbStore.presensi.filter(p =>
        p.kelompok_id === lap.kelompok_id &&
        p.rombel_id === rombelId &&
        Number(p.bulan) === Number(lap.bulan) &&
        Number(p.tahun) === Number(lap.tahun)
      );

      let presensiSection = "";
      if (pesertaList.length === 0) {
        presensiSection = "_Belum ada data peserta terdaftar di kelas ini._";
      } else {
        const weekPresRecords = weekDates.length > 0
          ? presRecords.filter(r => weekDates.includes(r.tanggal))
          : [];

        if (weekPresRecords.length > 0) {
          const sortedWeekDates = Array.from(new Set(weekPresRecords.map(r => r.tanggal))).sort();
          presensiSection = pesertaList.map((p, idx) => {
            const statuses = sortedWeekDates.map(dt => {
              const rec = weekPresRecords.find(r => r.peserta_id === p.id && r.tanggal === dt);
              return rec ? rec.status : "-";
            });
            const hadirCount = statuses.filter(s => s === "H").length;
            return `${idx + 1}. ${p.nama_peserta} : *${statuses.join(", ")}* (Hadir ${hadirCount}/${sortedWeekDates.length})`;
          }).join("\n");
        } else {
          presensiSection = pesertaList.map((p, idx) => {
            const pRecs = presRecords.filter(r => r.peserta_id === p.id);
            const H = pRecs.filter(r => r.status === "H").length;
            const I = pRecs.filter(r => r.status === "I").length;
            const S = pRecs.filter(r => r.status === "S").length;
            const A = pRecs.filter(r => r.status === "A").length;
            const tot = H + I + S + A;
            if (tot === 0) {
              return `${idx + 1}. ${p.nama_peserta} : _Belum ada absensi bulan ini_`;
            }
            const pct = Math.round((H / tot) * 100);
            return `${idx + 1}. ${p.nama_peserta} : H=${H}, I=${I}, S=${S}, A=${A} (*${pct}%*)`;
          }).join("\n");
        }
      }

      return [
        `*LAPORAN KEGIATAN PENGAJIAN GENERUS JEPARA*`,
        `Assalamu'alaikum Wr. Wb.`,
        `Berikut kami sampaikan laporan hasil kegiatan & kehadiran putra-putri Bapak/Ibu Wali Santri:`,
        ``,
        `🕌 *Kelompok:* ${kelompokName}`,
        `📚 *Kelas / Rombel:* ${rombelName}`,

    async function copyWhatsAppShareText() {
      const ta = document.getElementById("waShareMessageText");
      if (!ta) return;
      try {
        await navigator.clipboard.writeText(ta.value);
        showToast("Teks laporan mingguan berhasil disalin! Siap ditempel di Grup WA.", "success");
      } catch (e) {
        ta.select();
        document.execCommand("copy");
        showToast("Teks laporan mingguan berhasil disalin!", "success");
      }
    }

    function sendToWhatsAppExternal() {
      const ta = document.getElementById("waShareMessageText");
      if (!ta || !ta.value.trim()) return;
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(ta.value)}`;
      logActivity("Share Laporan Mingguan ke WhatsApp", "Membagikan hasil kegiatan & kehadiran mingguan ke grup orang tua.");
      window.open(waUrl, "_blank", "noopener,noreferrer");
    }

    async function saveJurnalForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        rombel_id: document.getElementById("jRombel").value || null,
        tanggal: document.getElementById("jTanggal").value,
        nama_guru: document.getElementById("jGuru").value.trim(),
        materi: document.getElementById("jMateri").value.trim(),
        metode: document.getElementById("jMetode").value.trim(),
        jumlah_hadir: parseInt(document.getElementById("jHadir").value, 10) || 0,
        catatan: document.getElementById("jCatatan").value.trim()
      };

      if (isLiveSupabase && supabaseClient) {
        const { error } = await supabaseClient.from("jurnal_guru").upsert(payload);
        if (error) {
          showToast("Gagal menyimpan jurnal: " + error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.jurnal_guru.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.jurnal_guru[idx] = payload;
        logActivity("Edit Jurnal Guru", `Mengubah jurnal tanggal ${payload.tanggal}`);
      } else {
        dbStore.jurnal_guru.unshift(payload);
        logActivity("Tambah Jurnal Guru", `Menambah jurnal materi: ${payload.materi}`);
      }

      closeModal();
      showToast("Jurnal guru berhasil disimpan!", "success");
      renderApp();
    }

    function deleteJurnalItem(id) {
      confirmDialog("Hapus Jurnal?", "Catatan jurnal pertemuan ini akan dihapus permanen.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await supabaseClient.from("jurnal_guru").delete().eq("id", id);
        }
        dbStore.jurnal_guru = dbStore.jurnal_guru.filter(x => x.id !== id);
        showToast("Jurnal berhasil dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    async function addPresensiMeetingDate() {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const dateInput = document.getElementById("newMeetingDateInput")?.value;
      if (!dateInput) {
        showToast("Pilih tanggal pertemuan terlebih dahulu.", "warning");
        return;
      }
      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);
      if (pesertaList.length === 0) {
        showToast("Tambahkan peserta di rombel ini terlebih dahulu sebelum menambah tanggal absensi.", "warning");
        return;
      }

      const [y, m] = dateInput.split("-").map(Number);
      let addedCount = 0;

      for (const p of pesertaList) {
        const exists = dbStore.presensi.find(r => r.peserta_id === p.id && r.tanggal === dateInput);
        if (!exists) {
          const rec = {
            id: generateUUID(),
            kelompok_id: uid,
            rombel_id: rombelId,
            peserta_id: p.id,
            bulan: m,
            tahun: y,
            tanggal: dateInput,
            status: "H"
          };
          dbStore.presensi.push(rec);
          await persistPresensiRecord(rec);
          addedCount++;
        }
      }

      if (addedCount === 0) {
        showToast("Tanggal pertemuan tersebut sudah ada di tabel.", "info");
      } else {
        appState.selectedMonth = m;
        appState.selectedYear = y;
        showToast(`Kolom presensi tanggal ${formatTanggalID(dateInput)} ditambahkan!`, "success");
      }
      renderApp();
    }

    async function cyclePresensiCell(pesertaId, tanggal) {
      const order = ["H", "I", "S", "A"];
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const [y, m] = tanggal.split("-").map(Number);

      let rec = dbStore.presensi.find(r => r.peserta_id === pesertaId && r.tanggal === tanggal);
      if (!rec) {
        rec = {
          id: generateUUID(),
          kelompok_id: uid,
          rombel_id: rombelId,
          peserta_id: pesertaId,
          bulan: m,
          tahun: y,
          tanggal,
          status: "I"
        };
        dbStore.presensi.push(rec);
      } else {
        const nextIdx = (order.indexOf(rec.status) + 1) % order.length;
        rec.status = order[nextIdx];
      }

      await persistPresensiRecord(rec);
      renderApp();
    }

    async function persistPresensiRecord(rec) {
      if (appState.isOfflineMode) {
        const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === rec.peserta_id && q.tanggal === rec.tanggal);
        if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = { ...rec };
        else appState.offlinePresensiQueue.push({ ...rec });
        return;
      }
      if (isLiveSupabase && supabaseClient) {
        await supabaseClient.from("presensi").upsert(rec, { onConflict: "peserta_id,tanggal" });
      }
    }

    async function processImportPesertaExcel() {
      const fileInput = document.getElementById("excelPesertaFile");
      const file = fileInput?.files?.[0];
      if (!file) {
        showToast("Pilih file Excel terlebih dahulu.", "warning");
        return;
      }
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type: "array" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(sheet);
          const uid = appState.currentUser.id;
          const rombelId = appState.presensiSelectedRombel;
          let added = 0;

          for (const row of json) {
            const nama = String(row["Nama Lengkap"] || row.Nama || row.nama || row["Nama Peserta"] || "").trim();
            const jkRaw = String(row.JK || row.jk || row["Jenis Kelamin"] || "L").trim().toUpperCase();
            const jk = jkRaw === "P" ? "P" : "L";
            const tempatLahir = String(row["Tempat Lahir"] || row.tempat_lahir || "Jepara").trim();
            const tglLahir = String(row["Tanggal Lahir"] || row.tanggal_lahir || "").trim().slice(0, 10) || null;
            const ortuWali = String(row["Nama Orang Tua / Wali"] || row["Orang Tua"] || row.nama_ortu_wali || "-").trim();

            if (nama) {
              const payload = {
                id: generateUUID(),
                kelompok_id: uid,
                rombel_id: rombelId,
                nama_peserta: nama,
                jenis_kelamin: jk,
                tempat_lahir: tempatLahir,
                tanggal_lahir: tglLahir,
                nama_ortu_wali: ortuWali,
                aktif: true
              };
              if (isLiveSupabase && supabaseClient) {
                await supabaseClient.from("peserta").insert(payload);
              }
              dbStore.peserta.push(payload);
              added++;
            }
          }
          closeModal();
          showToast(`Berhasil mengimpor ${added} peserta ke rombel!`, "success");
          renderApp();
        } catch (err) {
          showToast("Gagal membaca file Excel: " + err.message, "error");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function exportPresensiExcel() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.presensiSelectedRombel;
      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);
      const presRecords = dbStore.presensi.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && Number(p.bulan) === bulan && Number(p.tahun) === tahun);
      const dates = Array.from(new Set(presRecords.map(r => r.tanggal))).sort();

      const rows = pesertaList.map((p, idx) => {
        let H = 0, I = 0, S = 0, A = 0;
        const rowObj = {
          No: idx + 1,
          "Nama Lengkap": p.nama_peserta,
          JK: p.jenis_kelamin,
          "Tempat Lahir": p.tempat_lahir || "-",
          "Tanggal Lahir": p.tanggal_lahir || "-",
          "Nama Orang Tua / Wali": p.nama_ortu_wali || "-"
        };
        dates.forEach(dt => {
          const st = presRecords.find(r => r.peserta_id === p.id && r.tanggal === dt)?.status || "H";
          rowObj[dt] = st;
          if (st === "H") H++; else if (st === "I") I++; else if (st === "S") S++; else if (st === "A") A++;
        });
        const tot = H + I + S + A;
        rowObj.Hadir = H;
        rowObj.Izin = I;
        rowObj.Sakit = S;
        rowObj.Alpha = A;
        rowObj["Persentase (%)"] = tot > 0 ? Math.round((H / tot) * 100) + "%" : "0%";
        return rowObj;
      });

      exportToExcelFile(rows, "Presensi", `Presensi_${appState.currentUser.username}_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
    }

      const dates = Array.from(new Set(presRecords.map(r => r.tanggal))).sort();

      const tableHTML = `

        <table>

            ${pesertaList.map((p, idx) => {

              const tds = dates.map(dt => {

                if (st === "H") H++; else if (st === "I") I++; else if (st === "S") S++; else if (st === "A") A++;

              }).join("");
              const tot = H + I + S + A;
              const pct = tot > 0 ? Math.round((H / tot) * 100) : 0;
              return `<tr><td>${idx + 1}</td><td>${escapeHTML(p.nama_peserta)}</td><td style="text-align:center;">${p.jenis_kelamin}</td>${tds}<td style="text-align:center;">${H}</td><td style="text-align:center;">${I}</td><td style="text-align:center;">${S}</td><td style="text-align:center;">${A}</td><td style="text-align:center;"><strong>${pct}%</strong></td></tr>`;

      `;
      triggerOfficialPrint("DAFTAR PRESENSI PESERTA PENGAJIAN", `Bulan ${NAMA_BULAN[bulan - 1]} ${tahun}`, tableHTML);

    function ensureMonthlyReportObject(kelompokId, bulan, tahun) {
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === kelompokId && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      const presSum = calculatePresensiSummary(kelompokId, bulan, tahun);
      const aktifCount = dbStore.peserta.filter(p => p.kelompok_id === kelompokId && p.aktif).length;

      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: kelompokId,
          bulan,
          tahun,
          jumlah_pertemuan: presSum.uniqueDates.length,
          jumlah_peserta_aktif: aktifCount,
          rekap_hadir: presSum.pctH,
          rekap_izin: presSum.pctI,
          rekap_sakit: presSum.pctS,
          rekap_alpha: presSum.pctA,
          catatan_umum: "",
          capaian_bulanan: "",
          catatan_tambahan: "",
          status: "Draft",
          komentar_admin: "",
          submitted_at: null
        };
        dbStore.laporan_bulanan.push(lap);
      } else {
        lap.rekap_hadir = presSum.pctH;
        lap.rekap_izin = presSum.pctI;
        lap.rekap_sakit = presSum.pctS;
        lap.rekap_alpha = presSum.pctA;
      }

      const rombels = getGroupRombels(kelompokId);
      rombels.forEach(r => {
        const maxMeetings = getRombelMeetingsPerWeek(r);
        for (let w = 1; w <= 5; w++) {
          for (let pt = 1; pt <= maxMeetings; pt++) {
            const exists = dbStore.laporan_mingguan.find(m =>
              m.laporan_id === lap.id &&
              m.rombel_id === r.id &&
              Number(m.minggu_ke) === w &&
              Number(m.pertemuan_ke || 1) === pt
            );
            if (!exists) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: pt,
                tanggal: "",
                pegon: "",
                bacaan: "",
                tajwid: "",
                hafalan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan: "",
                keterangan: ""
              });
            }
          }
        }
      });

      return lap;
    }

    function syncLaporanFieldsToMemory(laporanId) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;
      const elPert = document.getElementById("lapPertemuan");
      const elAktif = document.getElementById("lapPesertaAktif");
      const elCatUmum = document.getElementById("lapCatatanUmum");
      const elCapaian = document.getElementById("lapCapaianBulanan");
      const elCatTamb = document.getElementById("lapCatatanTambahan");

      if (elPert) lap.jumlah_pertemuan = parseInt(elPert.value, 10) || 0;
      if (elAktif) lap.jumlah_peserta_aktif = parseInt(elAktif.value, 10) || 0;
      if (elCatUmum) lap.catatan_umum = elCatUmum.value;
      if (elCapaian) lap.capaian_bulanan = elCapaian.value;
      if (elCatTamb) lap.catatan_tambahan = elCatTamb.value;
    }

    function updateWeeklyField(weeklyId, field, value) {
      const row = dbStore.laporan_mingguan.find(w => w.id === weeklyId);
      if (!row) return;
      row[field] = value;

    function toggleWeeklyLibur(weeklyId, isLibur) {
      const row = dbStore.laporan_mingguan.find(w => w.id === weeklyId);

    function copyFromPreviousMeeting(laporanId, rombelId, weekNum, targetPertemuan) {
      const prev = dbStore.laporan_mingguan.find(w =>
        w.laporan_id === laporanId &&
        w.rombel_id === rombelId &&
        Number(w.minggu_ke) === weekNum &&
        Number(w.pertemuan_ke || 1) === targetPertemuan - 1
      );
      const curr = dbStore.laporan_mingguan.find(w =>
        w.laporan_id === laporanId &&
        w.rombel_id === rombelId &&
        Number(w.minggu_ke) === weekNum &&
        Number(w.pertemuan_ke || 1) === targetPertemuan
      );
      if (!prev || !curr) return;

      curr.pegon = prev.pegon;
      curr.bacaan = prev.bacaan;
      curr.tajwid = prev.tajwid;
      curr.hafalan = prev.hafalan;
      curr.makna = prev.makna;
      curr.lain_lain = prev.lain_lain;
      curr.keterangan = prev.keterangan;
      curr.tidak_ada_kegiatan = false;

      showToast(`Materi Pertemuan ke-${targetPertemuan - 1} berhasil disalin ke Pertemuan ke-${targetPertemuan}.`, "success");
      renderApp();
    }

    function copyWholeWeekFromPrevious(laporanId, rombelId, targetWeek, meetingsPerWeek) {
      for (let pt = 1; pt <= meetingsPerWeek; pt++) {
        const prev = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === targetWeek - 1 &&
          Number(w.pertemuan_ke || 1) === pt
        );
        const curr = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === targetWeek &&
          Number(w.pertemuan_ke || 1) === pt
        );
        if (prev && curr) {
          curr.pegon = prev.pegon;
          curr.bacaan = prev.bacaan;
          curr.tajwid = prev.tajwid;
          curr.hafalan = prev.hafalan;
          curr.makna = prev.makna;
          curr.lain_lain = prev.lain_lain;
          curr.keterangan = prev.keterangan;
          curr.tidak_ada_kegiatan = prev.tidak_ada_kegiatan;
          curr.alasan = prev.alasan;
        }
      }
      showToast(`Seluruh pertemuan Minggu ke-${targetWeek - 1} disalin ke Minggu ke-${targetWeek}.`, "success");
      renderApp();
    }

    async function saveMonthlyReport(laporanId, targetStatus) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;

      syncLaporanFieldsToMemory(laporanId);

      if (targetStatus === "Dikirim") {
        if (!lap.capaian_bulanan.trim()) {
          showToast("Capaian Pembelajaran Bulan Ini (Bagian C) wajib diisi sebelum dikirim.", "error");
          return;
        }

        const rombels = getGroupRombels(lap.kelompok_id);
        const maxWeek = appState.showWeek5 ? 5 : 4;

        for (const r of rombels) {
          const maxMeetings = getRombelMeetingsPerWeek(r);
          const rows = dbStore.laporan_mingguan.filter(m =>
            m.laporan_id === lap.id &&
            m.rombel_id === r.id &&
            Number(m.minggu_ke) <= maxWeek &&
            Number(m.pertemuan_ke || 1) <= maxMeetings
          );
          for (const w of rows) {
            const pt = Number(w.pertemuan_ke || 1);
            if (w.tidak_ada_kegiatan) {
              if (!w.alasan.trim()) {
                showToast(`Rombel "${r.nama_rombel}" Minggu ${w.minggu_ke} Pertemuan ${pt}: Alasan tidak ada kegiatan wajib diisi.`, "error");
                return;
              }
            } else {
              const hasAnyMaterial = [w.pegon, w.bacaan, w.tajwid, w.hafalan, w.makna, w.lain_lain].some(v => v && v.trim() !== "");
              if (!hasAnyMaterial) {
                showToast(`Rombel "${r.nama_rombel}" Minggu ${w.minggu_ke} Pertemuan ${pt}: Minimal 1 materi harus diisi (atau centang Tidak ada kegiatan).`, "error");
                return;
              }
            }
          }
        }
        lap.submitted_at = new Date().toISOString();
      }

      lap.status = targetStatus;

      if (isLiveSupabase && supabaseClient) {
        const { error: lapErr } = await supabaseClient.from("laporan_bulanan").upsert(lap);
        if (lapErr) {
          showToast("Gagal menyimpan laporan: " + lapErr.message, "error");
          return;
        }
        const weeklyToSave = dbStore.laporan_mingguan.filter(m => m.laporan_id === lap.id).map(w => ({
          ...w,
          pertemuan_ke: Number(w.pertemuan_ke || 1),
          tanggal: w.tanggal || null
        }));
        await supabaseClient.from("laporan_mingguan").upsert(weeklyToSave, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });
      }

      logActivity(
        targetStatus === "Dikirim" ? "Mengirim Laporan Bulanan" : "Menyimpan Draft Laporan",
        `Laporan ${NAMA_BULAN[lap.bulan - 1]} ${lap.tahun} (${targetStatus})`
      );
      showToast(targetStatus === "Dikirim" ? "Laporan berhasil dikirim ke Admin Daerah!" : "Draft laporan tersimpan.", "success");
      renderApp();
    }

    async function handlePhotoBatchUpload(event) {
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;

      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const tanggal = document.getElementById("dokTanggal")?.value || getWIBParts().isoDate;
      const keterangan = document.getElementById("dokKeterangan")?.value.trim() || `Dokumentasi Pengajian ${NAMA_BULAN[bulan - 1]} ${tahun}`;

      const existingCount = dbStore.dokumentasi_kegiatan.filter(d =>
        d.kelompok_id === uid && Number(d.bulan) === bulan && Number(d.tahun) === tahun
      ).length;

      const allowedCount = APP_CONFIG.MAX_PHOTOS_PER_MONTH - existingCount;
      if (allowedCount <= 0) {
        showToast(`Batas maksimal ${APP_CONFIG.MAX_PHOTOS_PER_MONTH} foto per bulan telah tercapai.`, "warning");
        event.target.value = "";
        return;
      }

      const toProcess = files.slice(0, allowedCount);
      if (files.length > allowedCount) {
        showToast(`Hanya ${allowedCount} foto pertama yang diproses sesuai batas kuota bulanan.`, "warning");
      }

      showToast(`Mengompresi ${toProcess.length} foto otomatis...`, "info");

      let successCount = 0;
      for (const file of toProcess) {
        try {
          const compressed = await compressImageInBrowser(file);
          const photoId = generateUUID();
          const filePath = `${uid}/${tahun}-${String(bulan).padStart(2, "0")}/${photoId}.jpg`;
          let publicUrl = compressed.dataUrl;

          if (isLiveSupabase && supabaseClient) {
            const { error: upErr } = await supabaseClient.storage
              .from(APP_CONFIG.STORAGE_BUCKET)
              .upload(filePath, compressed.blob, { contentType: "image/jpeg", upsert: true });
            if (upErr) throw upErr;

            const { data: urlData } = supabaseClient.storage
              .from(APP_CONFIG.STORAGE_BUCKET)
              .getPublicUrl(filePath);
            publicUrl = urlData.publicUrl;
          }

          const record = {
            id: photoId,
            kelompok_id: uid,
            bulan,
            tahun,
            tanggal,
            keterangan,
            file_path: filePath,
            public_url: publicUrl,
            ukuran_kb: compressed.sizeKB
          };

          if (isLiveSupabase && supabaseClient) {
            const { error: insErr } = await supabaseClient.from("dokumentasi_kegiatan").insert(record);
            if (insErr) throw insErr;
          }

          dbStore.dokumentasi_kegiatan.unshift(record);
          successCount++;
        } catch (err) {
          showToast(`Gagal mengunggah ${file.name}: ${err.message}`, "error");
        }
      }

      event.target.value = "";
      if (successCount > 0) {
        logActivity("Upload Dokumentasi", `Mengunggah ${successCount} foto kegiatan bulan ${NAMA_BULAN[bulan - 1]}`);
        showToast(`${successCount} foto berhasil dikompresi & disimpan!`, "success");
        renderApp();
      }
    }

    async function saveKendalaForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        bulan: appState.selectedMonth,
        tahun: appState.selectedYear,
        kategori: document.getElementById("kKategori").value,
        uraian: document.getElementById("kUraian").value.trim(),
        prioritas: document.getElementById("kPrioritas").value,
        solusi: document.getElementById("kSolusi").value.trim(),
        evaluasi_bulan_ini: document.getElementById("kEvaluasi").value.trim(),
        rencana_bulan_depan: document.getElementById("kRencana").value.trim(),
        status: document.getElementById("kStatus").value
      };

      if (isLiveSupabase && supabaseClient) {
        const { error } = await supabaseClient.from("kendala_evaluasi").upsert(payload);
        if (error) {
          showToast("Gagal menyimpan kendala: " + error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.kendala_evaluasi.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.kendala_evaluasi[idx] = payload;
      } else {
        dbStore.kendala_evaluasi.unshift(payload);
      }

      logActivity("Simpan Kendala & Evaluasi", `Kategori: ${payload.kategori} (${payload.status})`);
      closeModal();
      showToast("Laporan kendala & evaluasi tersimpan!", "success");
      renderApp();
    }

    function exportFullBackupJSON() {
      const backupPayload = {
        exported_at_wib: formatDateTimeWIB(new Date().toISOString()),
        app: "Laporan Kegiatan Pengajian Generus Jepara",
        data: dbStore
      };
      const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Backup_Generus_Jepara_${getWIBParts().isoDate}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("File backup JSON lengkap berhasil diunduh!", "success");
    }

    async function updateAccountStatus(userId, newStatus) {
      const user = dbStore.profiles.find(p => p.id === userId);
      if (!user) return;
      user.status_akun = newStatus;

      if (isLiveSupabase && supabaseClient) {
        const { error } = await supabaseClient.from("profiles").update({ status_akun: newStatus }).eq("id", userId);
        if (error) {
          showToast("Gagal memperbarui status akun: " + error.message, "error");
          return;
        }
      }

      logActivity("Ubah Status Akun", `Akun ${user.nama_kelompok} diubah menjadi ${newStatus}`);
      showToast(`Status akun ${user.nama_kelompok} berhasil diperbarui!`, "success");
      renderApp();
    }

    function openAdminEditUserModal(userId) {
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      openModal(
        `Edit Data Akun — ${u.nama_kelompok}`,
        `
          <form id="formAdmEditUser" onsubmit="saveAdminEditUser(event, '${userId}')" class="space-y-3.5">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Nama Kelompok *</label>
              <input id="admEditKelompok" type="text" required value="${escapeHTML(u.nama_kelompok)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Daftar Nama Guru (pisahkan dengan koma) *</label>
              <textarea id="admEditGurus" rows="3" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm">${escapeHTML((u.daftar_guru || []).join(", "))}</textarea>
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formAdmEditUser" class="px-5 py-2 rounded-xl bg-emerald-700 text-white text-sm font-bold">Simpan Perubahan</button>
        `
      );
    }

    async function saveAdminEditUser(e, userId) {
      e.preventDefault();
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      const namaKelompok = document.getElementById("admEditKelompok").value.trim();
      const guruArr = document.getElementById("admEditGurus").value.split(",").map(s => s.trim()).filter(Boolean);

      u.nama_kelompok = namaKelompok;
      u.daftar_guru = guruArr;
      u.jumlah_guru = guruArr.length;

      if (isLiveSupabase && supabaseClient) {
        await supabaseClient.from("profiles").update({
          nama_kelompok: namaKelompok,
          daftar_guru: guruArr,
          jumlah_guru: guruArr.length
        }).eq("id", userId);
      }

      closeModal();
      showToast("Data kelompok berhasil diperbarui!", "success");
      renderApp();
    }

    function openAdminResetPasswordModal(userId) {
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      openModal(
        `Reset Password — ${u.nama_kelompok}`,
        `
          <form id="formAdmResetPass" onsubmit="submitAdminResetPassword(event, '${userId}')" class="space-y-3.5">
            <p class="text-xs sm:text-sm text-slate-600">
              Password lama terenkripsi dan tidak dapat dilihat. Buat password baru (minimal 8 karakter) untuk username <strong>${escapeHTML(u.username)}</strong> lalu sampaikan ke pengurus kelompok.
            </p>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Password Baru (min. 8 karakter) *</label>
              <input id="admNewPassInput" type="text" required minlength="8" placeholder="Contoh: JeparaBaru2026!" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" />
            </div>
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formAdmResetPass" class="px-5 py-2 rounded-xl bg-sky-700 text-white text-sm font-bold">Simpan Password Baru</button>
        `
      );
    }

    async function submitAdminResetPassword(e, userId) {
      e.preventDefault();
      const u = dbStore.profiles.find(p => p.id === userId);
      const newPass = document.getElementById("admNewPassInput").value;
      if (!u || newPass.length < 8) {
        showToast("Password baru minimal 8 karakter.", "error");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        const { error } = await supabaseClient.rpc("admin_reset_user_password", {
          target_user_id: userId,
          new_password: newPass
        });
        if (error) {
          showToast("Gagal mereset password: " + error.message, "error");
          return;
        }
      } else {
        u.password_hash = newPass;
      }

      u.reset_requested = false;
      u.reset_note = "";
      logActivity("Reset Password User", `Admin mereset password akun ${u.username}`);
      closeModal();
      showToast(`Password akun ${u.username} berhasil direset!`, "success");
      renderApp();
    }

    async function submitAdminReportReview(laporanId, newStatus) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;
      const comment = document.getElementById("adminReviewComment")?.value.trim() || "";
      lap.status = newStatus;
      lap.komentar_admin = comment;
      lap.reviewed_at = new Date().toISOString();

      if (isLiveSupabase && supabaseClient) {
        await supabaseClient.from("laporan_bulanan").update({
          status: newStatus,
          komentar_admin: comment,
          reviewed_at: lap.reviewed_at
        }).eq("id", laporanId);
      }

      logActivity("Review Laporan", `Admin menandai laporan ${getKelompokName(lap.kelompok_id)} sebagai ${newStatus}`);
      showToast(`Status laporan berhasil diubah menjadi "${newStatus}".`, "success");
      renderApp();
    }

    // ============================================================================
    function renderAdminRekapGabungan() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const approvedUsers = dbStore.profiles.filter(p => p.role === "user" && p.status_akun === "approved");
      const matFilter = appState.adminWeeklyMaterialFilter;

      const rekapRows = approvedUsers.map(u => {
        const pres = calculatePresensiSummary(u.id, bulan, tahun);
        const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === u.id && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
        return {
          kelompok: u.nama_kelompok,
          jmlGuru: (u.daftar_guru || []).length,
          jmlRombel: getGroupRombels(u.id).length,
          pertemuan: lap ? lap.jumlah_pertemuan : pres.uniqueDates.length,
          hadirPct: pres.pctH,
          statusLaporan: lap ? lap.status : "Belum Lapor",
          capaian: lap ? lap.capaian_bulanan : "-"
        };
      });

      const lapsThisMonth = dbStore.laporan_bulanan.filter(l => Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      const lapIds = new Set(lapsThisMonth.map(l => l.id));
      let weeklyAll = dbStore.laporan_mingguan.filter(w =>
        lapIds.has(w.laporan_id) &&
        !w.tidak_ada_kegiatan &&
        (w.pegon || w.bacaan || w.tajwid || w.hafalan || w.makna || w.lain_lain)
      );

      if (matFilter !== "ALL") {
        weeklyAll = weeklyAll.filter(w => w[matFilter] && w[matFilter].trim() !== "");
      }

      const MATERI_OPTS = [
        { id: "ALL", label: "Semua Kolom Materi" },
        { id: "pegon", label: "Pegon" },
        { id: "bacaan", label: "Bacaan" },
        { id: "tajwid", label: "Tajwid" },
        { id: "hafalan", label: "Hafalan" },
        { id: "makna", label: "Makna" },
        { id: "lain_lain", label: "Lain-lain" }
      ];

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 class="text-lg sm:text-xl font-extrabold text-slate-900">Rekap Gabungan Semua Kelompok (${NAMA_BULAN[bulan - 1]} ${tahun})</h2>
                <p class="text-xs text-slate-500">Konsolidasi kehadiran dan status laporan seluruh kelompok se-Daerah Jepara</p>
              </div>
              <div class="flex gap-2">
                <button type="button" onclick="exportAdminRekapBulananExcel()" class="px-3.5 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">📤 Ekspor Excel</button>
                <button type="button" onclick="printAdminRekapBulananPDF()" class="px-3.5 py-2 rounded-xl bg-slate-800 text-white text-xs font-bold">🖨 Cetak PDF</button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs sm:text-sm">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-xs font-extrabold uppercase text-slate-700">
                    <th class="p-3">Kelompok</th>
                    <th class="p-3 text-center">Guru</th>
                    <th class="p-3 text-center">Rombel</th>
                    <th class="p-3 text-center">Pertemuan</th>
                    <th class="p-3 text-center">Kehadiran</th>
                    <th class="p-3">Status Laporan</th>
                    <th class="p-3">Ringkasan Capaian</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${rekapRows.length === 0 ? `
                    <tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada data rekap kelompok pada bulan ini.</td></tr>
                  ` : rekapRows.map(r => `
                    <tr>
                      <td class="p-3 font-bold text-slate-900">${escapeHTML(r.kelompok)}</td>
                      <td class="p-3 text-center">${r.jmlGuru}</td>
                      <td class="p-3 text-center">${r.jmlRombel}</td>
                      <td class="p-3 text-center">${r.pertemuan}x</td>
                      <td class="p-3 text-center font-extrabold text-emerald-700">${r.hadirPct}%</td>
                      <td class="p-3"><span class="px-2.5 py-1 rounded-full bg-slate-100 font-bold text-xs">${escapeHTML(r.statusLaporan)}</span></td>
                      <td class="p-3 text-xs text-slate-600 max-w-xs truncate">${escapeHTML(r.capaian)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 class="text-lg font-extrabold text-emerald-900">Rekap Rincian Kegiatan per Minggu (Semua Kelompok)</h3>
                <p class="text-xs text-slate-500">Filter materi pengajaran se-Daerah Jepara berdasarkan kolom materi</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <select onchange="appState.adminWeeklyMaterialFilter = this.value; renderApp();" class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm font-bold bg-white">
                  ${MATERI_OPTS.map(o => `<option value="${o.id}" ${matFilter === o.id ? "selected" : ""}>Filter: ${o.label}</option>`).join("")}
                </select>
                <button type="button" onclick="exportAdminWeeklyExcel()" class="px-3.5 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">📤 Ekspor Excel</button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-xs">
                <thead>
                  <tr class="bg-emerald-900 text-white uppercase">
                    <th class="p-2.5">Kelompok</th>
                    <th class="p-2.5">Rombel</th>
                    <th class="p-2.5">Minggu</th>
                    ${(matFilter === "ALL" || matFilter === "pegon") ? `<th class="p-2.5">Pegon</th>` : ""}
                    ${(matFilter === "ALL" || matFilter === "bacaan") ? `<th class="p-2.5">Bacaan</th>` : ""}
                    ${(matFilter === "ALL" || matFilter === "tajwid") ? `<th class="p-2.5">Tajwid</th>` : ""}
                    ${(matFilter === "ALL" || matFilter === "hafalan") ? `<th class="p-2.5">Hafalan</th>` : ""}
                    ${(matFilter === "ALL" || matFilter === "makna") ? `<th class="p-2.5">Makna</th>` : ""}
                    ${(matFilter === "ALL" || matFilter === "lain_lain") ? `<th class="p-2.5">Lain-lain</th>` : ""}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${weeklyAll.length === 0 ? `
                    <tr><td colspan="9" class="p-6 text-center text-slate-400">Belum ada data rincian mingguan yang sesuai filter pada bulan ini.</td></tr>
                  ` : weeklyAll.map(w => {
                    const parentLap = lapsThisMonth.find(l => l.id === w.laporan_id);
                    return `
                      <tr>
                        <td class="p-2.5 font-bold text-slate-900">${escapeHTML(getKelompokName(parentLap?.kelompok_id))}</td>
                        <td class="p-2.5">${escapeHTML(getRombelName(w.rombel_id))}</td>
                        <td class="p-2.5 font-bold">Minggu ${w.minggu_ke} • Pert. ${w.pertemuan_ke || 1}</td>
                        ${(matFilter === "ALL" || matFilter === "pegon") ? `<td class="p-2.5">${escapeHTML(w.pegon || "-")}</td>` : ""}
                        ${(matFilter === "ALL" || matFilter === "bacaan") ? `<td class="p-2.5">${escapeHTML(w.bacaan || "-")}</td>` : ""}
                        ${(matFilter === "ALL" || matFilter === "tajwid") ? `<td class="p-2.5">${escapeHTML(w.tajwid || "-")}</td>` : ""}
                        ${(matFilter === "ALL" || matFilter === "hafalan") ? `<td class="p-2.5">${escapeHTML(w.hafalan || "-")}</td>` : ""}
                        ${(matFilter === "ALL" || matFilter === "makna") ? `<td class="p-2.5">${escapeHTML(w.makna || "-")}</td>` : ""}
                        ${(matFilter === "ALL" || matFilter === "lain_lain") ? `<td class="p-2.5">${escapeHTML(w.lain_lain || "-")}</td>` : ""}
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function exportAdminRekapBulananExcel() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const approvedUsers = dbStore.profiles.filter(p => p.role === "user" && p.status_akun === "approved");
      const rows = approvedUsers.map((u, i) => {
        const pres = calculatePresensiSummary(u.id, bulan, tahun);
        const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === u.id && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
        return {
          No: i + 1,
          "Nama Kelompok": u.nama_kelompok,
          "Jumlah Guru": (u.daftar_guru || []).length,
          "Jumlah Rombel": getGroupRombels(u.id).length,
          "Jumlah Pertemuan": lap ? lap.jumlah_pertemuan : pres.uniqueDates.length,
          "Kehadiran (%)": pres.pctH + "%",
          "Status Laporan": lap ? lap.status : "Belum Lapor",
          "Capaian Bulanan": lap ? lap.capaian_bulanan : "-"
        };
      });
      exportToExcelFile(rows, "Rekap_Daerah", `Rekap_Daerah_Jepara_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
    }

    function exportAdminWeeklyExcel() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const lapsThisMonth = dbStore.laporan_bulanan.filter(l => Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      const lapIds = new Set(lapsThisMonth.map(l => l.id));
      const rows = dbStore.laporan_mingguan
        .filter(w => lapIds.has(w.laporan_id) && !w.tidak_ada_kegiatan)
        .map(w => {
          const parentLap = lapsThisMonth.find(l => l.id === w.laporan_id);
          return {
            Kelompok: getKelompokName(parentLap?.kelompok_id),
            Rombel: getRombelName(w.rombel_id),
            "Minggu Ke": w.minggu_ke,
            "Pertemuan Ke": w.pertemuan_ke || 1,
            Tanggal: w.tanggal || "-",
            Pegon: w.pegon || "-",
            Bacaan: w.bacaan || "-",
            Tajwid: w.tajwid || "-",
            Hafalan: w.hafalan || "-",
            Makna: w.makna || "-",
            "Lain-lain": w.lain_lain || "-",
            Keterangan: w.keterangan || "-"
          };
        });
      exportToExcelFile(rows, "Rekap_Mingguan", `Rekap_Materi_Mingguan_Jepara_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);
    }

    function printAdminRekapBulananPDF() {
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const approvedUsers = dbStore.profiles.filter(p => p.role === "user" && p.status_akun === "approved");
      const html = `
        <table>
          <thead>
            <tr style="background:#f1f5f9;">
              <th>No</th><th>Nama Kelompok</th><th>Guru</th><th>Rombel</th><th>Pertemuan</th><th>Kehadiran</th><th>Status Laporan</th>
            </tr>
          </thead>
          <tbody>
            ${approvedUsers.map((u, i) => {
              const pres = calculatePresensiSummary(u.id, bulan, tahun);
              const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === u.id && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
              return `<tr><td>${i + 1}</td><td>${escapeHTML(u.nama_kelompok)}</td><td style="text-align:center;">${(u.daftar_guru || []).length}</td><td style="text-align:center;">${getGroupRombels(u.id).length}</td><td style="text-align:center;">${lap ? lap.jumlah_pertemuan : pres.uniqueDates.length}</td><td style="text-align:center;"><strong>${pres.pctH}%</strong></td><td>${lap ? lap.status : "Belum Lapor"}</td></tr>`;
            }).join("")}
          </tbody>
        </table>
      `;
      triggerOfficialPrint("REKAPITULASI LAPORAN KELOMPOK SE-DAERAH JEPARA", `Periode ${NAMA_BULAN[bulan - 1]} ${tahun}`, html);
    }

    // ============================================================================
    // ADMIN VIEW 5: PENGUMUMAN & RIWAYAT LOG AKTIVITAS
    // ============================================================================
    function renderAdminPengumuman() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div class="lg:col-span-7 space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-3">
              <h2 class="text-lg font-extrabold text-slate-900">📢 Buat Pengumuman untuk Semua Kelompok</h2>
              <form onsubmit="submitNewPengumuman(event)" class="space-y-3">
                <input id="annJudul" type="text" required placeholder="Judul pengumuman..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold" />
                <textarea id="annIsi" rows="3" required placeholder="Isi pengumuman untuk pengurus dan guru kelompok..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm">Terbitkan Pengumuman</button>
              </form>
            </div>

            <div class="space-y-3">
              ${dbStore.pengumuman.map(a => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex items-start justify-between gap-3">
                  <div>
                    <div class="font-extrabold text-slate-900 text-sm">${escapeHTML(a.judul)}</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">${formatDateTimeWIB(a.created_at)}</div>
                    <p class="text-xs sm:text-sm text-slate-700 mt-1.5">${escapeHTML(a.isi)}</p>
                  </div>
                  <button type="button" onclick="deletePengumuman('${a.id}')" class="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-700 text-xs font-bold shrink-0">Hapus</button>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
            <h3 class="text-lg font-extrabold text-slate-900 mb-3">🕒 Riwayat Perubahan (Log Aktivitas)</h3>
            <div class="space-y-3 max-h-[65vh] overflow-y-auto pr-1">
              ${dbStore.log_aktivitas.length === 0 ? `
                <p class="text-xs text-slate-400">Belum ada catatan aktivitas.</p>
              ` : dbStore.log_aktivitas.map(l => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                  <div class="flex justify-between font-bold text-emerald-900">
                    <span>${escapeHTML(l.aksi)}</span>
                    <span class="text-slate-400 font-normal">${formatDateTimeWIB(l.created_at)}</span>
                  </div>
                  <div class="text-slate-700 font-semibold mt-0.5">${escapeHTML(l.nama_pelaku)}</div>
                  <div class="text-slate-500 mt-0.5">${escapeHTML(l.detail)}</div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    async function submitNewPengumuman(e) {
      e.preventDefault();
      const payload = {
        id: generateUUID(),
        judul: document.getElementById("annJudul").value.trim(),
        isi: document.getElementById("annIsi").value.trim(),
        penting: true,
        created_by: appState.currentUser.id,
        created_at: new Date().toISOString()
      };
      if (isLiveSupabase && supabaseClient) {
        await supabaseClient.from("pengumuman").insert(payload);
      }
      dbStore.pengumuman.unshift(payload);
      document.getElementById("annJudul").value = "";
      document.getElementById("annIsi").value = "";
      showToast("Pengumuman berhasil diterbitkan!", "success");
      renderApp();
    }

    async function deletePengumuman(id) {
      if (isLiveSupabase && supabaseClient) {
        await supabaseClient.from("pengumuman").delete().eq("id", id);
      }
      dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
      showToast("Pengumuman dihapus.", "info");
      renderApp();
    }

    // ============================================================================
    // RENDERER UTAMA (DISPATCHER)
    // ============================================================================
    function renderApp() {
      const root = document.getElementById("appRoot");
      if (!appState.currentUser) {
        root.innerHTML = renderAuthPage();
        return;
      }

      const isAdmin = appState.currentUser.role === "admin";
      let pageHTML = "";

      if (isAdmin) {
        switch (appState.activeTab) {
          case "pendaftaran": pageHTML = renderAdminPendaftaran(); break;
          case "data_generus": pageHTML = renderAdminDataGenerus(); break;
          case "laporan_masuk": pageHTML = renderAdminLaporanMasuk(); break;
          case "rekap_gabungan": pageHTML = renderAdminRekapGabungan(); break;
          case "pengumuman": pageHTML = renderAdminPengumuman(); break;
          default: pageHTML = renderAdminDashboard(); break;
        }
      } else {
        switch (appState.activeTab) {
          case "jurnal": pageHTML = renderMenuJurnal(); break;
          case "presensi": pageHTML = renderMenuPresensi(); break;
          case "laporan": pageHTML = renderMenuLaporan(); break;
          case "dokumentasi": pageHTML = renderMenuDokumentasi(); break;
          case "kendala": pageHTML = renderMenuKendala(); break;
          default: pageHTML = renderUserDashboard(); break;
        }
      }

      root.innerHTML = renderAppShell(pageHTML);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      renderApp();
      await restoreSupabaseSession();
    });
  </script>
</body>
</html>
