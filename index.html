  <script>
    /**
     * ============================================================================

     * ============================================================================
     */
    const APP_CONFIG = {
      SUPABASE_URL: "https://egfyloqtzxzihnxjmrhh.supabase.co",
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnZnlsb3F0enh6aWhueGptcmhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNzk5MDEsImV4cCI6MjExMDY1NTkwMX0.LbJy9vwvpxZ0GOEIQx6jLASWGzRJLGSNxGQgLXk-qCk",
      INTERNAL_EMAIL_DOMAIN: "@generus-jepara.com",
      STORAGE_BUCKET: "dokumentasi-kegiatan",
      MAX_PHOTO_WIDTH: 1280,
      TARGET_PHOTO_KB: 300,
      MAX_PHOTOS_PER_MONTH: 6,
      REPORT_DEADLINE_DAY: 5,
      REPORT_DEADLINE_HOUR_WIB: 21,
      ALLOW_LATE_REPORT: true
    };

    try {
      const savedUrl = localStorage.getItem("digenara_supa_url");
      const savedKey = localStorage.getItem("digenara_supa_key");
      if (savedUrl && savedKey) {
        APP_CONFIG.SUPABASE_URL = savedUrl;
        APP_CONFIG.SUPABASE_ANON_KEY = savedKey;
      }
      const savedDeadlineRaw = localStorage.getItem("digenara_deadline_cfg");
      if (savedDeadlineRaw) {
        const parsed = JSON.parse(savedDeadlineRaw);
        if (parsed.batas_tanggal) APP_CONFIG.REPORT_DEADLINE_DAY = Math.min(28, Math.max(1, Number(parsed.batas_tanggal) || 5));
        if (parsed.batas_jam_wib !== undefined) APP_CONFIG.REPORT_DEADLINE_HOUR_WIB = Math.min(23, Math.max(0, Number(parsed.batas_jam_wib)));
        if (parsed.izinkan_terlambat !== undefined) APP_CONFIG.ALLOW_LATE_REPORT = Boolean(parsed.izinkan_terlambat);
      }
    } catch (e) {}

    // ============================================================================
    // KONSTANTA WILAYAH DESA, MATERI, BATAS PELAPORAN & KOMPONEN UI
    // ============================================================================
    const NAMA_BULAN = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    const DESA_OPTIONS = [
      "Desa Timur 1",
      "Desa Timur 2",
      "Desa Barat",
      "Desa Utara"
    ];

    const MATERI_OPTIONS_LIST = [
      { key: "pegon", label: "Pegon", placeholder: "Contoh: Menyambung huruf / menulis kata Pegon" },
      { key: "tajwid", label: "Tajwid", placeholder: "Contoh: Hukum Nun Mati & Tanwin / Makhraj huruf" },
      { key: "hafalan", label: "Hafalan", placeholder: "Contoh: QS. Al-Ma'un & Doa sebelum belajar" },
      { key: "bacaan", label: "Bacaan", placeholder: "Contoh: Tilawati Jilid 2 hal. 14 / Tadarus Juz 1" },
      { key: "makna", label: "Makna", placeholder: "Contoh: Makna & penjelasan Kitab As-Sholah" },
      { key: "lain_lain", label: "Lain-lain", placeholder: "Contoh: Praktik wudhu, adab & akhlakul karimah" }
    ];

    function isAccountActiveStatus(status) {
      return status === "approved" || status === "active";
    }

    function applySystemSettingsObject(cfg) {
      if (!cfg) return;
      if (cfg.batas_tanggal !== undefined && cfg.batas_tanggal !== null) {
        APP_CONFIG.REPORT_DEADLINE_DAY = Math.min(28, Math.max(1, parseInt(cfg.batas_tanggal, 10) || 5));
      }
      if (cfg.batas_jam_wib !== undefined && cfg.batas_jam_wib !== null) {
        APP_CONFIG.REPORT_DEADLINE_HOUR_WIB = Math.min(23, Math.max(0, parseInt(cfg.batas_jam_wib, 10)));
      }
      if (cfg.izinkan_terlambat !== undefined && cfg.izinkan_terlambat !== null) {
        APP_CONFIG.ALLOW_LATE_REPORT = Boolean(cfg.izinkan_terlambat);
      }
      try {
        localStorage.setItem("digenara_deadline_cfg", JSON.stringify({
          batas_tanggal: APP_CONFIG.REPORT_DEADLINE_DAY,
          batas_jam_wib: APP_CONFIG.REPORT_DEADLINE_HOUR_WIB,
          izinkan_terlambat: APP_CONFIG.ALLOW_LATE_REPORT
        }));
      } catch (e) {}
    }

    function getReportDeadlineInfo(bulan, tahun) {
      const m = Number(bulan);
      const y = Number(tahun);
      const dueMonth = m === 12 ? 1 : m + 1;
      const dueYear = m === 12 ? y + 1 : y;
      const dueDay = Math.min(28, Math.max(1, Number(APP_CONFIG.REPORT_DEADLINE_DAY) || 5));
      const dueHour = Math.min(23, Math.max(0, Number(APP_CONFIG.REPORT_DEADLINE_HOUR_WIB) ?? 21));
      const hhStr = String(dueHour).padStart(2, "0");

      // WIB adalah UTC+7 tetap tanpa DST
      const deadlineUtcMs = Date.UTC(dueYear, dueMonth - 1, dueDay, dueHour - 7, 0, 0);
      const nowMs = Date.now();
      const isPassed = nowMs > deadlineUtcMs;
      const diffMs = deadlineUtcMs - nowMs;
      const daysLeft = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
      const formattedDate = `${dueDay} ${NAMA_BULAN[dueMonth - 1]} ${dueYear}, ${hhStr}.00 WIB`;

      return {
        dueDay,
        dueMonth,
        dueYear,
        dueHour,
        hhStr,
        formattedDate,
        isPassed,
        daysLeft,
        allowLate: Boolean(APP_CONFIG.ALLOW_LATE_REPORT)
      };
    }

    function getWIBParts(dateObj = new Date()) {
      try {
        const formatter = new Intl.DateTimeFormat("en-GB", {
          timeZone: "Asia/Jakarta",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });
        const parts = formatter.formatToParts(dateObj);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const year = parseInt(map.year, 10);
        const month = parseInt(map.month, 10);
        const day = parseInt(map.day, 10);
        const hour = parseInt(map.hour, 10) % 24;
        const minute = parseInt(map.minute, 10);
        const hh = String(hour).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${map.year}-${map.month}-${map.day}`,
          timeStr: `${hh}:${map.minute} WIB`
        };
      } catch (e) {
        const utc = dateObj.getTime() + dateObj.getTimezoneOffset() * 60000;
        const wib = new Date(utc + 7 * 3600000);
        const year = wib.getFullYear();
        const month = wib.getMonth() + 1;
        const day = wib.getDate();
        const hour = wib.getHours();
        const minute = wib.getMinutes();
        const pad = (n) => String(n).padStart(2, "0");
        return {
          year,
          month,
          day,
          hour,
          minute,
          isoDate: `${year}-${pad(month)}-${pad(day)}`,
          timeStr: `${pad(hour)}:${pad(minute)} WIB`
        };
      }
    }

    function formatTanggalID(isoDateStr) {
      if (!isoDateStr) return "-";
      const clean = String(isoDateStr).slice(0, 10);
      const parts = clean.split("-");
      if (parts.length !== 3) return escapeHTML(String(isoDateStr));
      const y = parts[0];
      const m = parseInt(parts[1], 10);
      const d = parseInt(parts[2], 10);
      if (!m || !d || m < 1 || m > 12) return escapeHTML(clean);
      return `${d} ${NAMA_BULAN[m - 1]} ${y}`;
    }

    function formatDateTimeWIB(isoTimestamp) {
      if (!isoTimestamp) return "-";
      const d = new Date(isoTimestamp);
      if (isNaN(d.getTime())) return "-";
      const p = getWIBParts(d);
      return `${p.day} ${NAMA_BULAN[p.month - 1].slice(0, 3)} ${p.year}, ${p.timeStr}`;
    }

    function shiftISODate(isoDateStr, deltaDays) {
      const clean = String(isoDateStr || getWIBParts().isoDate).slice(0, 10);
      const [y, m, d] = clean.split("-").map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + deltaDays));
      const yy = dt.getUTCFullYear();
      const mm = String(dt.getUTCMonth() + 1).padStart(2, "0");
      const dd = String(dt.getUTCDate()).padStart(2, "0");
      return `${yy}-${mm}-${dd}`;
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function generateUUID() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c) {
        const r = (Math.random() * 16) | 0;
        const v = c === "x" ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    function getUserInitials(name) {
      const words = String(name || "GJ").trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "GJ";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const styles = {
        success: "bg-emerald-900 text-white border-emerald-700",
        error: "bg-rose-900 text-white border-rose-700",
        warning: "bg-amber-500 text-slate-950 border-amber-600",
        info: "bg-slate-900 text-white border-slate-700"
      };
      const icons = {
        success: "✅",
        error: "❌",
        warning: "⚠️",
        info: "ℹ️"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-xs sm:text-sm font-semibold transition-all duration-300 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base leading-none mt-0.5">${icons[type] || icons.info}</span>
        <div class="flex-1 leading-snug">${escapeHTML(message)}</div>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => toast.remove(), 300);
      }, 4200);
    }

    let pendingConfirmCallback = null;

    function openModal(title, bodyHTML, footerHTML = "", maxWidthClass = "max-w-xl") {
      const container = document.getElementById("modalContainer");
      if (!container) return;
      container.innerHTML = `
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full ${maxWidthClass} overflow-hidden my-auto">
          <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-3">
            <h3 class="font-extrabold text-base sm:text-lg text-slate-900">${escapeHTML(title)}</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-xl bg-slate-200/70 hover:bg-slate-300 text-slate-700 font-bold flex items-center justify-center">✕</button>
          </div>
          <div class="p-5 max-h-[75vh] overflow-y-auto">
            ${bodyHTML}
          </div>
          ${footerHTML ? `
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-end gap-2">
              ${footerHTML}
            </div>
          ` : ""}
        </div>
      `;
      container.classList.remove("hidden");
      container.classList.add("flex");
    }

    function closeModal() {
      const container = document.getElementById("modalContainer");
      if (!container) return;
      container.classList.add("hidden");
      container.classList.remove("flex");
      container.innerHTML = "";
      pendingConfirmCallback = null;
    }

    function confirmDialog(title, message, onConfirm, confirmLabel = "Ya, Lanjutkan", isDanger = false) {
      pendingConfirmCallback = onConfirm;
      openModal(
        title,
        `<p class="text-sm text-slate-700 leading-relaxed">${escapeHTML(message)}</p>`,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-semibold text-sm">Batal</button>
          <button type="button" onclick="executePendingConfirm()" class="px-5 py-2 rounded-xl ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-700 hover:bg-emerald-800'} text-white font-bold text-sm">
            ${escapeHTML(confirmLabel)}
          </button>
        `,
        "max-w-md"
      );
    }

    async function executePendingConfirm() {
      const cb = pendingConfirmCallback;
      closeModal();
      if (typeof cb === "function") {
        await cb();
      }
    }

        const pts = [];
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? outerR : innerR;
          const angle = ((i * 36 - 90) * Math.PI) / 180;
          pts.push([cx + r * Math.cos(angle), cy + r * Math.sin(angle)]);
        }
        const polyStr = pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
        const facets = [];
        for (let i = 0; i < 10; i++) {
          const p1 = pts[i];
          const p2 = pts[(i + 1) % 10];
          const fillShade = i % 2 === 0 ? "#f0d377" : "#8d630c";
          facets.push(`<polygon points="${cx},${cy} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" fill="${fillShade}" />`);
        }
        return `
          <g transform="rotate(${rotDeg} ${cx} ${cy})">
            ${facets.join("")}
            <polygon points="${polyStr}" fill="none" stroke="#3b2804" stroke-width="0.9" stroke-linejoin="round" />
          </g>

    function initSupabase(url, key) {
      const cleanUrl = String(url || "").trim().replace(/\/rest\/v1\/?$/i, "").replace(/\/+$/, "");
      if (cleanUrl && key && window.supabase) {
        try {
          supabaseClient = window.supabase.createClient(cleanUrl, key);
          isLiveSupabase = true;
          return true;
        } catch (err) {
          console.error("Gagal menginisialisasi Supabase:", err);
        }
      }
      supabaseClient = null;
      isLiveSupabase = false;
      return false;
    }

    initSupabase(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_ANON_KEY);

    async function resilientSupabaseMutation(table, method, payload, matchObj = null, options = {}) {
      if (!isLiveSupabase || !supabaseClient) return { error: null };
      let currentPayload = Array.isArray(payload)
        ? payload.map(item => ({ ...item }))
        : (payload ? { ...payload } : null);

      for (let attempt = 0; attempt < 5; attempt++) {
        let query;
        if (method === "insert") {
          query = supabaseClient.from(table).insert(currentPayload);
        } else if (method === "upsert") {
          query = supabaseClient.from(table).upsert(currentPayload, options);
        } else if (method === "update") {
          query = supabaseClient.from(table).update(currentPayload);
          if (matchObj) {
            Object.entries(matchObj).forEach(([k, v]) => { query = query.eq(k, v); });
          }
        }
        const res = await query;
        if (!res.error) return res;

        const msg = String(res.error.message || "");
        const colMatch = msg.match(/Could not find the '([^']+)' column/i) || msg.match(/column "([^"]+)" of relation/i);
        if (colMatch && colMatch[1] && currentPayload) {
          const missingCol = colMatch[1];
          if (Array.isArray(currentPayload)) {
            currentPayload.forEach(item => { delete item[missingCol]; });
          } else {
            delete currentPayload[missingCol];
          }
          continue;
        }
        return res;
      }
      return { error: null };
    }

    async function saveReportDeadlineSettings(dayVal, hourVal, allowLateVal, shouldCloseModal = false) {

      const cleanDay = Math.min(28, Math.max(1, dayVal || 5));
      const cleanHour = Math.min(23, Math.max(0, isNaN(hourVal) ? 21 : hourVal));
      const cleanAllowLate = Boolean(allowLateVal);

      const payload = {
        id: "default",
        batas_tanggal: cleanDay,
        batas_jam_wib: cleanHour,
        izinkan_terlambat: cleanAllowLate,
        updated_by: appState.currentUser.id,
        updated_at: new Date().toISOString()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengaturan_sistem", "upsert", payload, null, { onConflict: "id" });
        if (res.error) {
          showToast("Gagal menyimpan batas pelaporan ke database: " + res.error.message, "error");
          return;
        }
      }

      applySystemSettingsObject(payload);
      if (shouldCloseModal) closeModal();
      const hhStr = String(cleanHour).padStart(2, "0");
      showToast(`Batas pelaporan diperbarui: Tanggal ${cleanDay} pukul ${hhStr}.00 WIB!`, "success");
      logActivity("Atur Batas Pelaporan", `Tgl ${cleanDay} pukul ${hhStr}.00 WIB (${cleanAllowLate ? "Izinkan Terlambat" : "Kunci Otomatis"})`);

        .eq("id", userId)
        .maybeSingle();

      if (!isLiveSupabase || !supabaseClient) return;

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          const unameHint = session.user.email ? session.user.email.split("@")[0] : "";
          const profile = await fetchOrRepairProfile(session.user.id, unameHint);
          if (profile && isAccountActiveStatus(profile.status_akun)) {
            await syncAllFromSupabase();
            completeUserSession(profile, true);
            return;
          } else {
            await supabaseClient.auth.signOut();

                jumlah_guru: daftarGuru.length,
                jumlah_rombel: daftarRombel.length,
                status_akun: "pending"
              },
              null,
              { onConflict: "id" }
            );

            if (daftarRombel.length > 0) {
              const rombelRows = daftarRombel.map((rName, idx) => ({
                id: generateUUID(),
                kelompok_id: newUserId,
                nama_rombel: rName,
                pertemuan_per_minggu: isMudaMudiRombel(rName) ? 2 : 5,
                urutan: idx + 1
              }));
              await resilientSupabaseMutation("rombel", "insert", rombelRows);
            }
          }
          await supabaseClient.auth.signOut();
        } catch (err) {
          showToast("Gagal mendaftar: " + (err.message || "Terjadi kesalahan."), "error");
          return;
        }
      } else {
        if (dbStore.profiles.some(p => p.username === username)) {
          showToast("Username sudah digunakan akun lain.", "error");
          return;
        }
        const newId = generateUUID();
        dbStore.profiles.push({
          id: newId,
          username,
          password_hash: password,
          role: "user",
          nama_kelompok: namaKelompok,
          nama_desa: namaDesa,
          avatar_url: "",
          daftar_guru: daftarGuru,
          jumlah_guru: daftarGuru.length,
          jumlah_rombel: daftarRombel.length,
          status_akun: "pending",
          reset_requested: false,
          reset_note: "",
          created_at: new Date().toISOString()
        });
        daftarRombel.forEach((rName, idx) => {
          dbStore.rombel.push({
            id: generateUUID(),
            kelompok_id: newId,
            nama_rombel: rName,
            pertemuan_per_minggu: isMudaMudiRombel(rName) ? 2 : 5,
            urutan: idx + 1
          });
        });
      }

      appState.regDraft = {
        username: "",
        nama_kelompok: "",
        nama_desa: "",
        gurus: ["", ""],
        rombels: ["Caberawit (PAUD - SD)", "Pra-Remaja (SMP)", "Remaja (SMA/SMK)", "Muda-Mudi"]
      };
      appState.authTab = "login";
      showToast("Pendaftaran akun berhasil dikirim! Tunggu persetujuan Admin Daerah Jepara.", "success");
      renderApp();
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = sanitizeUsername(document.getElementById("loginUsername")?.value.trim() || "");
      const password = document.getElementById("loginPassword")?.value || "";

      if (!username || !password) {
        showToast("Masukkan username dan password Anda.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        try {
          const internalEmail = username + APP_CONFIG.INTERNAL_EMAIL_DOMAIN;
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: internalEmail,
            password
          });
          if (error) throw error;

          const profile = await fetchOrRepairProfile(data.user.id, username);
          if (!profile) {
            await supabaseClient.auth.signOut();
            showToast("Profil akun tidak ditemukan di database.", "error");
            return;
          }

          if (profile.status_akun === "pending") {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
            return;
          }
          if (profile.status_akun === "rejected") {
            await supabaseClient.auth.signOut();
            showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
            return;
          }
          if (!isAccountActiveStatus(profile.status_akun)) {
            await supabaseClient.auth.signOut();
            showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
            return;
          }

          await syncAllFromSupabase();
          completeUserSession(profile);
          return;
        } catch (err) {
          showToast("Login gagal: " + (err.message || "Username atau password salah."), "error");
          return;
        }
      }

      const user = dbStore.profiles.find(p => p.username === username);
      if (!user || user.password_hash !== password) {
        showToast("Username atau password tidak sesuai.", "error");
        return;
      }
      if (user.status_akun === "pending") {
        showToast("Akun Anda masih berstatus 'Menunggu Persetujuan' Admin Daerah.", "warning");
        return;
      }
      if (user.status_akun === "rejected") {
        showToast("Pendaftaran akun Anda ditolak oleh Admin.", "error");
        return;
      }
      if (!isAccountActiveStatus(user.status_akun)) {
        showToast("Akun Anda sedang dinonaktifkan sementara oleh Admin.", "error");
        return;
      }

      completeUserSession(user);
    }

          supabaseClient.from("peserta").select("*").order("nama_peserta", { ascending: true }),
          supabaseClient.from("jurnal_guru").select("*").order("tanggal", { ascending: false }),

          supabaseClient.from("pengumuman").select("*").order("created_at", { ascending: false }),

        finalAvatarUrl = appState.pendingAvatarDataUrl;

              .from(APP_CONFIG.STORAGE_BUCKET)
              .upload(path, appState.pendingAvatarBlob, { contentType: "image/jpeg", upsert: true });
            if (!up.error) {
              const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(path);
              if (pub?.data?.publicUrl) {
                finalAvatarUrl = pub.data.publicUrl;
              }
            }
          } catch (err) {}
        }

      if (isLiveSupabase && supabaseClient) {

          if (rpcRes.error) {

          }

        const updatePayload = {
          nama_kelompok: newNamaKelompok,
          nama_desa: newDesa,
          avatar_url: finalAvatarUrl,
          daftar_guru: newGurus,
          jumlah_guru: newGurus.length

        if (profRes.error) {
          showToast("Gagal menyimpan profil: " + profRes.error.message, "error");
          return;
        }
      } else {
        if (newUsername !== user.username && dbStore.profiles.some(p => p.username === newUsername && p.id !== user.id)) {
          showToast("Username sudah digunakan akun lain.", "error");
          return;
        }
        if (newPassword) user.password_hash = newPassword;
      }

      user.username = newUsername;
      user.nama_kelompok = newNamaKelompok;
      user.nama_desa = newDesa;
      user.avatar_url = finalAvatarUrl;
      user.daftar_guru = newGurus;

    function isMudaMudiRombel(nama) {

    function calculatePresensiSummary(kelompokId, bulan, tahun, rombelId = null) {
      const recs = dbStore.presensi.filter(p =>
        p.kelompok_id === kelompokId &&
        Number(p.bulan) === Number(bulan) &&
        Number(p.tahun) === Number(tahun) &&
        (!rombelId || p.rombel_id === rombelId)
      );
      const total = recs.length;
      const H = recs.filter(r => r.status === "H").length;
      const I = recs.filter(r => r.status === "I").length;
      const S = recs.filter(r => r.status === "S").length;
      const A = recs.filter(r => r.status === "A").length;
      const pctH = total > 0 ? Math.round((H / total) * 100) : 0;
      const uniqueDates = Array.from(new Set(recs.map(r => r.tanggal))).sort();
      return { total, H, I, S, A, pctH, uniqueDates };
    }

    function compressImageFile(file, maxWidth = APP_CONFIG.MAX_PHOTO_WIDTH, targetKB = APP_CONFIG.TARGET_PHOTO_KB) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);

            let quality = 0.82;
            let dataUrl = canvas.toDataURL("image/jpeg", quality);
            while (Math.round((dataUrl.length * 3) / 4 / 1024) > targetKB && quality > 0.35) {
              quality -= 0.1;
              dataUrl = canvas.toDataURL("image/jpeg", quality);
            }

            canvas.toBlob(
              (blob) => {
                const sizeKB = blob ? Math.max(1, Math.round(blob.size / 1024)) : Math.round((dataUrl.length * 3) / 4 / 1024);
                resolve({ blob, dataUrl, sizeKB });
              },
              "image/jpeg",
              quality
            );
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function exportToExcelFile(rows, sheetName, fileName) {
      if (!rows || rows.length === 0) {
        showToast("Tidak ada data untuk diekspor.", "warning");
        return;
      }
      try {
        if (window.XLSX) {
          const ws = XLSX.utils.json_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, String(sheetName || "Data").slice(0, 31));
          XLSX.writeFile(wb, fileName);
          showToast(`File Excel "${fileName}" berhasil diunduh!`, "success");
        } else {
          const headers = Object.keys(rows[0]);
          const csv = [
            headers.join(","),
            ...rows.map(r => headers.map(h => `"${String(r[h] ?? "").replace(/"/g, '""')}"`).join(","))
          ].join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = fileName.replace(/\.xlsx$/i, ".csv");
          link.click();
          showToast("File CSV berhasil diunduh!", "success");
        }
      } catch (err) {
        showToast("Gagal mengekspor file Excel: " + err.message, "error");
      }
    }

    function detectWeekAndSlotForJurnal(uid, rombelId, isoDate) {
      const cleanDate = String(isoDate || getWIBParts().isoDate).slice(0, 10);
      const parts = cleanDate.split("-").map(Number);
      const jy = parts[0] || appState.selectedYear;
      const jm = parts[1] || appState.selectedMonth;
      const jd = parts[2] || 1;
      const autoWeek = Math.min(5, Math.max(1, Math.ceil(jd / 7)));

      const rombelObj = dbStore.rombel.find(r => r.id === rombelId);
      const maxPt = Math.min(7, Math.max(1, Number(rombelObj?.pertemuan_per_minggu) || (isMudaMudiRombel(rombelObj?.nama_rombel) ? 2 : 5)));

      const lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === uid && Number(l.bulan) === jm && Number(l.tahun) === jy);
      if (lap) {
        const sameDateRow = dbStore.laporan_mingguan.find(w => w.laporan_id === lap.id && w.rombel_id === rombelId && w.tanggal === cleanDate);
        if (sameDateRow) {
          return { week: Number(sameDateRow.minggu_ke) || autoWeek, pertemuan: Number(sameDateRow.pertemuan_ke || 1), maxPt };
        }
        const weekRows = dbStore.laporan_mingguan
          .filter(w => w.laporan_id === lap.id && w.rombel_id === rombelId && Number(w.minggu_ke) === autoWeek)
          .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));
        const firstEmpty = weekRows.find(w => !w.tanggal && !w.tidak_ada_kegiatan && !MATERI_OPTIONS_LIST.some(m => String(w[m.key] || "").trim() !== ""));
        if (firstEmpty) {
          return { week: autoWeek, pertemuan: Number(firstEmpty.pertemuan_ke || 1), maxPt };
        }
      }
      return { week: autoWeek, pertemuan: 1, maxPt };
    }

    async function syncJurnalToLaporanKegiatan(jurnalRow, targetWeek, targetPertemuan) {
      const uid = jurnalRow.kelompok_id;
      const rombelId = jurnalRow.rombel_id;
      if (!uid || !rombelId || !jurnalRow.tanggal) return false;

      const [jy, jm] = String(jurnalRow.tanggal).split("-").map(Number);
      if (!jy || !jm) return false;

      const lap = ensureMonthlyReportAndRows(uid, jm, jy);

      // Cari baris dengan tanggal & rombel yang sama terlebih dahulu agar edit tidak menggandakan
      let targetRow = dbStore.laporan_mingguan.find(w =>
        w.laporan_id === lap.id &&
        w.rombel_id === rombelId &&
        w.tanggal === jurnalRow.tanggal
      );

      if (!targetRow) {
        targetRow = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === lap.id &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === Number(targetWeek) &&
          Number(w.pertemuan_ke || 1) === Number(targetPertemuan)
        );
      }

      if (!targetRow) {
        targetRow = {
          id: generateUUID(),
          laporan_id: lap.id,
          rombel_id: rombelId,
          minggu_ke: Number(targetWeek) || 1,
          pertemuan_ke: Number(targetPertemuan) || 1,
          tanggal: jurnalRow.tanggal,
          pegon: "",
          bacaan: "",
          tajwid: "",
          hafalan: "",
          makna: "",
          lain_lain: "",
          tidak_ada_kegiatan: false,
          alasan: "",
          keterangan: ""
        };
        dbStore.laporan_mingguan.push(targetRow);
      }

      targetRow.tanggal = jurnalRow.tanggal;
      targetRow.tidak_ada_kegiatan = false;
      targetRow.alasan = "";
      targetRow.pegon = jurnalRow.pegon || "";
      targetRow.tajwid = jurnalRow.tajwid || "";
      targetRow.hafalan = jurnalRow.hafalan || "";
      targetRow.bacaan = jurnalRow.bacaan || "";
      targetRow.makna = jurnalRow.makna || "";
      targetRow.lain_lain = jurnalRow.lain_lain || "";

      const ketParts = [
        jurnalRow.metode ? `Metode: ${jurnalRow.metode}` : "",
        jurnalRow.catatan || ""
      ].filter(Boolean);
      targetRow.keterangan = ketParts.join(" • ");

      appState.weeklySelectedMateriMap[targetRow.id] = MATERI_OPTIONS_LIST
        .filter(m => String(targetRow[m.key] || "").trim() !== "")
        .map(m => m.key);

      if (Number(targetRow.minggu_ke) === 5) {
        appState.showWeek5 = true;
      }

      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        await resilientSupabaseMutation(
          "laporan_mingguan",
          "upsert",
          { ...targetRow, tanggal: targetRow.tanggal || null },
          null,
          { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" }
        );
      }

      return true;
    }

    async function saveJurnalForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const selectedKeys = appState.jurnalModalSelectedMateri || [];

      const materiValues = {
        pegon: "",
        tajwid: "",
        hafalan: "",
        bacaan: "",
        makna: "",
        lain_lain: ""
      };

      selectedKeys.forEach(k => {
        const el = document.getElementById(`jMat_${k}`);
        materiValues[k] = el ? el.value.trim() : String(appState.jurnalModalDraftValues[k] || "").trim();
      });

      const filledPairs = MATERI_OPTIONS_LIST
        .filter(m => String(materiValues[m.key] || "").trim() !== "")
        .map(m => `${m.label}: ${materiValues[m.key]}`);

      if (filledPairs.length === 0) {
        showToast("Pilih dan isi minimal 1 opsi materi pembelajaran hari ini.", "warning");
        return;
      }

      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        rombel_id: document.getElementById("jRombel").value || null,
        tanggal: document.getElementById("jTanggal").value,
        nama_guru: document.getElementById("jGuru").value.trim(),
        materi: filledPairs.join(" | "),
        pegon: materiValues.pegon,
        tajwid: materiValues.tajwid,
        hafalan: materiValues.hafalan,
        bacaan: materiValues.bacaan,
        makna: materiValues.makna,
        lain_lain: materiValues.lain_lain,
        metode: document.getElementById("jMetode").value.trim(),
        jumlah_hadir: parseInt(document.getElementById("jHadir").value, 10) || 0,
        catatan: document.getElementById("jCatatan").value.trim()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = editId
          ? await resilientSupabaseMutation("jurnal_guru", "update", payload, { id: editId })
          : await resilientSupabaseMutation("jurnal_guru", "insert", payload);
        if (res.error) {
          showToast("Gagal menyimpan jurnal: " + res.error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.jurnal_guru.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.jurnal_guru[idx] = { ...dbStore.jurnal_guru[idx], ...payload };
      } else {
        dbStore.jurnal_guru.unshift({ ...payload, created_at: new Date().toISOString() });
      }

      const shouldAutoSync = document.getElementById("jAutoSyncLaporan")?.checked;
      let syncedOk = false;
      if (shouldAutoSync) {
        const syncWeek = parseInt(document.getElementById("jSyncWeek")?.value, 10) || 1;
        const syncPt = parseInt(document.getElementById("jSyncPertemuan")?.value, 10) || 1;
        syncedOk = await syncJurnalToLaporanKegiatan(payload, syncWeek, syncPt);
      }

      closeModal();
      showToast(
        syncedOk
          ? "Jurnal guru disimpan & otomatis terintegrasi ke Laporan Kegiatan!"
          : "Jurnal guru berhasil disimpan!",
        "success"
      );
      logActivity("Simpan Jurnal Guru", `${payload.nama_guru} - ${payload.materi}`);
      renderApp();
    }

    function syncJurnalHadirFromPresensi(notify = false) {
      const uid = appState.currentUser?.id;
      const tgl = document.getElementById("jTanggal")?.value;
      const rombelId = document.getElementById("jRombel")?.value;
      const hadirEl = document.getElementById("jHadir");
      if (!uid || !tgl || !rombelId || !hadirEl) return;
      const count = dbStore.presensi.filter(p =>
        p.kelompok_id === uid &&
        p.rombel_id === rombelId &&
        p.tanggal === tgl &&
        p.status === "H"
      ).length;
      if (count > 0 || notify) {
        hadirEl.value = count;

          showToast(count > 0 ? `Jumlah hadir otomatis diisi (${count} santri) dari data Presensi.` : "Belum ada catatan presensi pada tanggal & kelas tersebut.", count > 0 ? "success" : "info");
        }
      }
    }

    async function saveNewRombel(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const nama = document.getElementById("newRombelName").value.trim();
      const freq = parseInt(document.getElementById("newRombelFreq").value, 10) || 5;
      if (!nama) return;

      const existing = getGroupRombels(uid);
      const row = {
        id: generateUUID(),
        kelompok_id: uid,
        nama_rombel: nama,
        pertemuan_per_minggu: freq,
        urutan: existing.length + 1
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("rombel", "insert", row);
        if (res.error) {
          showToast("Gagal menambah rombel: " + res.error.message, "error");
          return;
        }
      }
      dbStore.rombel.push(row);
      appState.presensiSelectedRombel = row.id;
      closeModal();
      showToast(`Rombel "${nama}" (${freq}x pertemuan/minggu) ditambahkan!`, "success");
      renderApp();
    }

      const kelompokName = appState.currentUser?.nama_kelompok || "Pengurus Pengajian";

    async function cyclePresensiCell(pesertaId, tanggal) {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const [yStr, mStr] = tanggal.split("-");
      const bulan = parseInt(mStr, 10);
      const tahun = parseInt(yStr, 10);

      const order = ["H", "I", "S", "A", null];
      const existingIdx = dbStore.presensi.findIndex(r => r.peserta_id === pesertaId && r.tanggal === tanggal);
      const currentStatus = existingIdx >= 0 ? dbStore.presensi[existingIdx].status : null;
      const nextStatus = order[(order.indexOf(currentStatus) + 1) % order.length];

      if (nextStatus === null) {
        const removed = existingIdx >= 0 ? dbStore.presensi[existingIdx] : null;
        if (existingIdx >= 0) dbStore.presensi.splice(existingIdx, 1);
        if (removed && isLiveSupabase && supabaseClient && !appState.isOfflineMode) {
          await supabaseClient.from("presensi").delete().eq("peserta_id", pesertaId).eq("tanggal", tanggal);
        }
        renderApp();
        return;
      }

      const row = {
        id: existingIdx >= 0 ? dbStore.presensi[existingIdx].id : generateUUID(),
        kelompok_id: uid,
        rombel_id: rombelId,
        peserta_id: pesertaId,
        bulan,
        tahun,
        tanggal,
        status: nextStatus
      };

      if (existingIdx >= 0) dbStore.presensi[existingIdx] = row;
      else dbStore.presensi.push(row);

      if (appState.isOfflineMode) {
        const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === pesertaId && q.tanggal === tanggal);
        if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = row;
        else appState.offlinePresensiQueue.push(row);
      } else if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("presensi", "upsert", row, null, { onConflict: "peserta_id,tanggal" });
      }
      renderApp();
    }

    async function markAllPresentOnActiveDate() {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const tanggal = appState.presensiActiveDate;
      const [yStr, mStr] = tanggal.split("-");
      const bulan = parseInt(mStr, 10);
      const tahun = parseInt(yStr, 10);

      const pesertaList = dbStore.peserta.filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif);
      if (pesertaList.length === 0) {
        showToast("Belum ada santri di kelas ini.", "warning");
        return;
      }

      const upsertRows = [];
      pesertaList.forEach(p => {
        const existingIdx = dbStore.presensi.findIndex(r => r.peserta_id === p.id && r.tanggal === tanggal);
        const row = {
          id: existingIdx >= 0 ? dbStore.presensi[existingIdx].id : generateUUID(),
          kelompok_id: uid,
          rombel_id: rombelId,
          peserta_id: p.id,
          bulan,
          tahun,
          tanggal,
          status: "H"
        };
        if (existingIdx >= 0) dbStore.presensi[existingIdx] = row;
        else dbStore.presensi.push(row);
        upsertRows.push(row);
      });

      if (appState.isOfflineMode) {
        appState.offlinePresensiQueue.push(...upsertRows);
      } else if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("presensi", "upsert", upsertRows, null, { onConflict: "peserta_id,tanggal" });
      }

      showToast(`${pesertaList.length} santri ditandai Hadir (H) pada ${formatTanggalID(tanggal)}.`, "success");
      renderApp();
    }

    async function savePesertaForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        rombel_id: document.getElementById("pRombel").value,
        nama_peserta: document.getElementById("pNama").value.trim(),
        jenis_kelamin: document.getElementById("pGender").value,
        tempat_lahir: document.getElementById("pTempatLahir").value.trim(),
        tanggal_lahir: document.getElementById("pTanggalLahir").value || null,
        nama_ortu_wali: document.getElementById("pOrtu").value.trim(),
        aktif: true
      };

      if (isLiveSupabase && supabaseClient) {
        const res = editId
          ? await resilientSupabaseMutation("peserta", "update", payload, { id: editId })
          : await resilientSupabaseMutation("peserta", "insert", payload);
        if (res.error) {
          showToast("Gagal menyimpan data santri: " + res.error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.peserta.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.peserta[idx] = { ...dbStore.peserta[idx], ...payload };
      } else {
        dbStore.peserta.push(payload);

    async function handleImportPesertaExcel(event) {
      const file = event.target.files?.[0];
      if (!file || !window.XLSX) return;
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      if (!rombelId) {
        showToast("Pilih kelas/rombel terlebih dahulu.", "warning");
        return;
      }

      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const wb = XLSX.read(ev.target.result, { type: "binary" });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const jsonRows = XLSX.utils.sheet_to_json(sheet);
          const newRows = [];

          jsonRows.forEach(r => {
            const nama = String(r.Nama || r.nama || r["Nama Lengkap"] || "").trim();
            if (!nama) return;
            const jkRaw = String(r.JK || r["Jenis Kelamin"] || "L").trim().toUpperCase();
            newRows.push({
              id: generateUUID(),
              kelompok_id: uid,
              rombel_id: rombelId,
              nama_peserta: nama,
              jenis_kelamin: jkRaw.startsWith("P") ? "P" : "L",
              tempat_lahir: String(r["Tempat Lahir"] || r.tempat_lahir || "").trim(),
              tanggal_lahir: r["Tanggal Lahir"] ? String(r["Tanggal Lahir"]).slice(0, 10) : null,
              nama_ortu_wali: String(r["Nama Wali"] || r["Orang Tua"] || "").trim(),
              aktif: true
            });
          });

          if (newRows.length === 0) {
            showToast("Tidak ada baris valid dengan kolom 'Nama' ditemukan.", "warning");
            return;
          }

          if (isLiveSupabase && supabaseClient) {
            await resilientSupabaseMutation("peserta", "insert", newRows);
          }
          dbStore.peserta.push(...newRows);
          closeModal();
          showToast(`${newRows.length} santri berhasil diimpor!`, "success");
          renderApp();
        } catch (err) {
          showToast("Gagal membaca file Excel: " + err.message, "error");
        }
      };
      reader.readAsBinaryString(file);
    }

    function ensureMonthlyReportAndRows(kelompokId, bulan, tahun) {
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === kelompokId && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: kelompokId,
          bulan,
          tahun,
          jumlah_pertemuan: 0,
          jumlah_peserta_aktif: 0,
          rekap_hadir: 0,
          rekap_izin: 0,
          rekap_sakit: 0,
          rekap_alpha: 0,
          catatan_umum: "",
          capaian_bulanan: "",
          catatan_tambahan: "",
          status: "Draft",
          terlambat: false,
          komentar_admin: "",
          created_at: new Date().toISOString()
        };
        dbStore.laporan_bulanan.push(lap);
      }

      const rombels = getGroupRombels(kelompokId);
      rombels.forEach(r => {
        const freq = Math.min(7, Math.max(1, Number(r.pertemuan_per_minggu) || (isMudaMudiRombel(r.nama_rombel) ? 2 : 5)));
        for (let w = 1; w <= 5; w++) {
          for (let pt = 1; pt <= freq; pt++) {
            const exists = dbStore.laporan_mingguan.find(x =>
              x.laporan_id === lap.id &&
              x.rombel_id === r.id &&
              Number(x.minggu_ke) === w &&
              Number(x.pertemuan_ke || 1) === pt
            );
            if (!exists) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: pt,
                tanggal: "",
                pegon: "",
                bacaan: "",
                tajwid: "",
                hafalan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan: "",
                keterangan: ""
              });
            }
          }
        }
      });

      return lap;
    }

    function getSelectedMateriKeysForRow(row) {
      if (appState.weeklySelectedMateriMap[row.id]) {
        return appState.weeklySelectedMateriMap[row.id];
      }
      const detected = MATERI_OPTIONS_LIST.filter(m => String(row[m.key] || "").trim() !== "").map(m => m.key);
      appState.weeklySelectedMateriMap[row.id] = detected;
      return detected;
    }

    function toggleWeeklyMateriKey(rowId, key) {
      const row = dbStore.laporan_mingguan.find(w => w.id === rowId);
      if (!row) return;
      const cur = new Set(getSelectedMateriKeysForRow(row));
      if (cur.has(key)) {
        cur.delete(key);
        row[key] = "";
      } else {
        cur.add(key);
      }
      appState.weeklySelectedMateriMap[rowId] = Array.from(cur);
      renderApp();
    }

    function copyWholeWeekFromPrevious(laporanId, rombelId, targetWeek, meetingsPerWeek) {
      const prevWeek = targetWeek - 1;
      for (let pt = 1; pt <= meetingsPerWeek; pt++) {
        const src = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId && w.rombel_id === rombelId && Number(w.minggu_ke) === prevWeek && Number(w.pertemuan_ke || 1) === pt
        );
        const dst = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId && w.rombel_id === rombelId && Number(w.minggu_ke) === targetWeek && Number(w.pertemuan_ke || 1) === pt
        );
        if (src && dst) {
          dst.pegon = src.pegon;
          dst.bacaan = src.bacaan;
          dst.tajwid = src.tajwid;
          dst.hafalan = src.hafalan;
          dst.makna = src.makna;
          dst.lain_lain = src.lain_lain;
          dst.tidak_ada_kegiatan = src.tidak_ada_kegiatan;
          dst.alasan = src.alasan;
          dst.keterangan = src.keterangan;
          appState.weeklySelectedMateriMap[dst.id] = [...getSelectedMateriKeysForRow(src)];
        }
      }
      showToast(`Seluruh pertemuan Minggu ke-${targetWeek - 1} disalin ke Minggu ke-${targetWeek}.`, "success");
      renderApp();
    }

    function pullMaterialsFromJurnalToWeek(laporanId, rombelId, targetWeek, meetingsPerWeek) {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;

      const matchingJurnals = dbStore.jurnal_guru
        .filter(j => {
          const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
          return j.kelompok_id === uid && j.rombel_id === rombelId && jm === bulan && jy === tahun;
        })
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      if (matchingJurnals.length === 0) {
        showToast("Belum ada catatan Jurnal Guru untuk kelas & bulan ini.", "warning");
        return;
      }

      const startIdx = (targetWeek - 1) * meetingsPerWeek;
      const sliceJurnals = matchingJurnals.slice(startIdx, startIdx + meetingsPerWeek);
      const fallbackJurnals = sliceJurnals.length > 0 ? sliceJurnals : matchingJurnals.slice(0, meetingsPerWeek);

      let filled = 0;
      fallbackJurnals.forEach((j, idx) => {
        const pt = idx + 1;
        const targetRow = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === targetWeek &&
          Number(w.pertemuan_ke || 1) === pt
        );
        if (targetRow) {
          targetRow.tanggal = j.tanggal;
          targetRow.tidak_ada_kegiatan = false;
          targetRow.alasan = "";
          const hasStructured = MATERI_OPTIONS_LIST.some(m => String(j[m.key] || "").trim() !== "");
          if (hasStructured) {
            MATERI_OPTIONS_LIST.forEach(m => {
              targetRow[m.key] = j[m.key] || "";
            });
          } else {
            targetRow.lain_lain = j.materi || "";
          }
          targetRow.keterangan = [j.metode ? `Metode: ${j.metode}` : "", j.catatan || ""].filter(Boolean).join(" • ");
          appState.weeklySelectedMateriMap[targetRow.id] = MATERI_OPTIONS_LIST
            .filter(m => String(targetRow[m.key] || "").trim() !== "")
            .map(m => m.key);
          filled++;
        }
      });

      showToast(`${filled} pertemuan Minggu ke-${targetWeek} berhasil disinkronkan dari Jurnal Guru!`, "success");
      renderApp();
    }

    async function saveMonthlyReport(laporanId, targetStatus) {
      const uid = appState.currentUser.id;
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;

      const deadlineInfo = getReportDeadlineInfo(lap.bulan, lap.tahun);
      if (targetStatus === "Dikirim" && deadlineInfo.isPassed && !deadlineInfo.allowLate && lap.status !== "Perlu Revisi") {
        showToast(`Batas waktu pelaporan (${deadlineInfo.formattedDate}) telah ditutup oleh Admin Daerah.`, "error");
        return;
      }

      const presSum = calculatePresensiSummary(uid, lap.bulan, lap.tahun);
      const activePesertaCount = dbStore.peserta.filter(p => p.kelompok_id === uid && p.aktif).length;
      const myWeeklyRows = dbStore.laporan_mingguan.filter(w => w.laporan_id === lap.id);
      const activeMeetings = myWeeklyRows.filter(w => !w.tidak_ada_kegiatan && (w.tanggal || MATERI_OPTIONS_LIST.some(m => String(w[m.key] || "").trim() !== "")));

      lap.jumlah_pertemuan = activeMeetings.length;
      lap.jumlah_peserta_aktif = activePesertaCount;
      lap.rekap_hadir = presSum.H;
      lap.rekap_izin = presSum.I;
      lap.rekap_sakit = presSum.S;
      lap.rekap_alpha = presSum.A;
      lap.status = targetStatus;
      if (targetStatus === "Dikirim") {
        lap.submitted_at = new Date().toISOString();
        lap.terlambat = Boolean(deadlineInfo.isPassed);
      }

      if (isLiveSupabase && supabaseClient) {
        const resHeader = await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        if (resHeader.error) {
          showToast("Gagal menyimpan laporan: " + resHeader.error.message, "error");
          return;
        }
        const filledWeekly = myWeeklyRows.filter(w =>
          w.tanggal || w.tidak_ada_kegiatan || MATERI_OPTIONS_LIST.some(m => String(w[m.key] || "").trim() !== "") || w.keterangan
        ).map(w => ({
          ...w,
          tanggal: w.tanggal || null
        }));
        if (filledWeekly.length > 0) {
          await resilientSupabaseMutation("laporan_mingguan", "upsert", filledWeekly, null, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });
        }
      }

      const msgSent = lap.terlambat
        ? "Laporan bulanan berhasil dikirim ke Admin Daerah (dengan keterangan Terlambat)."
        : "Laporan bulanan berhasil dikirim ke Admin Daerah Jepara!";
      showToast(targetStatus === "Dikirim" ? msgSent : "Draft laporan berhasil disimpan!", targetStatus === "Dikirim" && lap.terlambat ? "warning" : "success");
      logActivity(targetStatus === "Dikirim" ? "Kirim Laporan Bulanan" : "Simpan Draft Laporan", `${NAMA_BULAN[lap.bulan - 1]} ${lap.tahun}${lap.terlambat ? " (Terlambat)" : ""}`);
      renderApp();
    }

    async function handleUploadDokumentasi(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const fileInput = document.getElementById("dokFile");
      const file = fileInput?.files?.[0];
      if (!file) return;

      const existingCount = dbStore.dokumentasi_kegiatan.filter(d =>
        d.kelompok_id === uid && Number(d.bulan) === bulan && Number(d.tahun) === tahun
      ).length;
      if (existingCount >= APP_CONFIG.MAX_PHOTOS_PER_MONTH) {
        showToast(`Batas maksimal ${APP_CONFIG.MAX_PHOTOS_PER_MONTH} foto per bulan telah tercapai.`, "warning");
        return;
      }

      try {
        const compressed = await compressImageFile(file);
        const filePath = `${uid}/${tahun}_${bulan}_${Date.now()}.jpg`;
        let publicUrl = compressed.dataUrl;

        if (isLiveSupabase && supabaseClient && compressed.blob) {
          const up = await supabaseClient.storage
            .from(APP_CONFIG.STORAGE_BUCKET)
            .upload(filePath, compressed.blob, { contentType: "image/jpeg", upsert: true });
          if (!up.error) {
            const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(filePath);
            if (pub?.data?.publicUrl) publicUrl = pub.data.publicUrl;
          }
        }

        const row = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan,
          tahun,
          tanggal: document.getElementById("dokTanggal").value,
          keterangan: document.getElementById("dokKeterangan").value.trim(),
          file_path: filePath,
          public_url: publicUrl,
          ukuran_kb: compressed.sizeKB,
          created_at: new Date().toISOString()
        };

        if (isLiveSupabase && supabaseClient) {
          const ins = await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", row);
          if (ins.error) {
            showToast("Gagal menyimpan dokumentasi: " + ins.error.message, "error");
            return;
          }
        }

        dbStore.dokumentasi_kegiatan.unshift(row);
        showToast(`Foto dokumentasi berhasil diunggah (${compressed.sizeKB} KB)!`, "success");
        logActivity("Unggah Dokumentasi", row.keterangan);
        renderApp();
      } catch (err) {
        showToast("Gagal mengunggah foto: " + err.message, "error");
      }
    }

    async function saveKendalaForm(e, editId) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        bulan: appState.selectedMonth,
        tahun: appState.selectedYear,
        kategori: document.getElementById("kKategori").value,
        prioritas: document.getElementById("kPrioritas").value,
        status: document.getElementById("kStatus").value,
        uraian: document.getElementById("kUraian").value.trim(),
        solusi: document.getElementById("kSolusi").value.trim(),
        evaluasi_bulan_ini: document.getElementById("kEvaluasi").value.trim(),
        rencana_bulan_depan: document.getElementById("kRencana").value.trim()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = editId
          ? await resilientSupabaseMutation("kendala_evaluasi", "update", payload, { id: editId })
          : await resilientSupabaseMutation("kendala_evaluasi", "insert", payload);
        if (res.error) {
          showToast("Gagal menyimpan kendala: " + res.error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.kendala_evaluasi.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.kendala_evaluasi[idx] = { ...dbStore.kendala_evaluasi[idx], ...payload };
      } else {
        dbStore.kendala_evaluasi.unshift({ ...payload, created_at: new Date().toISOString() });
      }

      closeModal();
      showToast("Catatan kendala & evaluasi berhasil disimpan!", "success");
      renderApp();
    }

    function deleteKendalaItem(id) {
      confirmDialog("Hapus Catatan?", "Catatan kendala ini akan dihapus.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await supabaseClient.from("kendala_evaluasi").delete().eq("id", id);
        }
        dbStore.kendala_evaluasi = dbStore.kendala_evaluasi.filter(x => x.id !== id);
        showToast("Catatan dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    function confirmSetUserAccountStatus(userId, newStatus) {
      const target = dbStore.profiles.find(p => p.id === userId);
      if (!target) return;

      const isActivating = newStatus === "approved";
      const isDeactivating = newStatus === "inactive";
      const title = isActivating
        ? "Aktifkan Akun Kelompok?"
        : isDeactivating
          ? "Nonaktifkan Akun Kelompok?"
          : "Tolak Pendaftaran Akun?";

      const msg = isActivating
        ? `Akun "${target.nama_kelompok}" (@${target.username}) akan diaktifkan sehingga pengurus kelompok dapat login dan mengirim laporan.`
        : isDeactivating
          ? `Akun "${target.nama_kelompok}" (@${target.username}) akan dinonaktifkan sementara sehingga tidak dapat login, namun seluruh data riwayat tetap aman tersimpan.`
          : `Pendaftaran akun "${target.nama_kelompok}" (@${target.username}) akan ditolak.`;

      confirmDialog(
        title,
        msg,
        async () => {
          await applyUserAccountStatusChange(userId, newStatus);
        },
        isActivating ? "Ya, Aktifkan" : isDeactivating ? "Ya, Nonaktifkan" : "Ya, Tolak",
        !isActivating
      );
    }

    async function applyUserAccountStatusChange(userId, newStatus) {
      const target = dbStore.profiles.find(p => p.id === userId);
      if (!target) return;

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", { status_akun: newStatus }, { id: userId });
        if (res.error) {
          showToast("Gagal memperbarui status akun: " + res.error.message, "error");
          return;
        }
      }

      target.status_akun = newStatus;
      const labelMsg = newStatus === "approved"
        ? `Akun "${target.nama_kelompok}" berhasil diaktifkan!`
        : newStatus === "inactive"
          ? `Akun "${target.nama_kelompok}" berhasil dinonaktifkan!`
          : `Pendaftaran "${target.nama_kelompok}" ditolak.`;

      showToast(labelMsg, newStatus === "approved" ? "success" : "info");
      logActivity("Ubah Status Akun", `${target.nama_kelompok} -> ${newStatus}`);
      renderApp();
    }

    function openAdminResetPasswordModal(userId) {
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;
      openModal(

    async function submitAdminResetPassword(e, userId) {
      e.preventDefault();
      const newPw = document.getElementById("adminNewPwInput").value.trim();
      if (newPw.length < 8) {
        showToast("Password minimal 8 karakter.", "warning");
        return;
      }

      if (isLiveSupabase && supabaseClient) {
        const res = await supabaseClient.rpc("admin_reset_user_password", {
          target_user_id: userId,
          new_password: newPw
        });
        if (res.error) {
          showToast("Gagal mereset password: " + res.error.message, "error");
          return;
        }
      }

      const u = dbStore.profiles.find(p => p.id === userId);
      if (u) {
        u.password_hash = newPw;
        u.reset_requested = false;
        u.reset_note = "";
      }

      closeModal();
      showToast("Password baru berhasil diterapkan! Sampaikan password baru kepada pengurus kelompok.", "success");
      logActivity("Reset Password Akun", `Reset password untuk ${u?.nama_kelompok || userId}`);
      renderApp();
    }

    async function saveAdminEditUser(e, userId) {
      e.preventDefault();
      const u = dbStore.profiles.find(p => p.id === userId);
      if (!u) return;

      const payload = {
        nama_kelompok: document.getElementById("admEditKelompok").value.trim(),
        nama_desa: document.getElementById("admEditDesa").value,
        status_akun: document.getElementById("admEditStatus").value
      };

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("profiles", "update", payload, { id: userId });
        if (res.error) {
          showToast("Gagal memperbarui akun: " + res.error.message, "error");

      }

      Object.assign(u, payload);
      closeModal();

      renderApp();

    async function reviewMonthlyReport(lapId, status) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === lapId);
      if (!lap) return;
      const comment = document.getElementById("adminReviewComment")?.value.trim() || "";
      lap.status = status;
      lap.komentar_admin = comment;
      lap.reviewed_at = new Date().toISOString();

      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("laporan_bulanan", "update", {
          status,
          komentar_admin: comment,
          reviewed_at: lap.reviewed_at
        }, { id: lapId });
        if (res.error) {
          showToast("Gagal menyimpan hasil review: " + res.error.message, "error");
          return;
        }
      }

      showToast(`Laporan ditandai sebagai "${status}"!`, "success");
      logActivity("Review Laporan Bulanan", `${getKelompokName(lap.kelompok_id)} -> ${status}`);
      renderApp();
    }

                  <textarea id="annIsi" rows="3" required placeholder="Tuliskan informasi untuk seluruh pengurus kelompok..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
                </div>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs sm:text-sm">
                  📣 Terbitkan Pengumuman
                </button>
              </form>

              <div class="space-y-3">
                ${dbStore.pengumuman.map(ann => `
                  <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-start justify-between gap-3">
                    <div>
                      <div class="font-extrabold text-sm text-slate-900">${escapeHTML(ann.judul)}</div>
                      <div class="text-xs text-slate-400 mt-0.5">${formatDateTimeWIB(ann.created_at)}</div>
                      <p class="text-xs sm:text-sm text-slate-700 mt-2 leading-relaxed">${escapeHTML(ann.isi)}</p>
                    </div>
                    <button type="button" onclick="deleteAnnouncement('${ann.id}')" class="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-700 font-bold text-xs shrink-0">Hapus</button>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>

          <div class="lg:col-span-5 space-y-4">
            <h2 class="text-xl font-extrabold text-slate-900">🕒 Log Aktivitas Terbaru</h2>
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-2.5 max-h-[640px] overflow-y-auto">
              ${dbStore.log_aktivitas.length === 0 ? `
                <div class="text-center text-xs text-slate-400 py-8">Belum ada catatan aktivitas.</div>
              ` : dbStore.log_aktivitas.slice(0, 30).map(log => `
                <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                  <div class="flex items-center justify-between font-bold text-slate-800">
                    <span>${escapeHTML(log.aksi)}</span>
                    <span class="text-[10px] text-slate-400">${formatDateTimeWIB(log.created_at)}</span>
                  </div>
                  <div class="text-slate-600 mt-0.5">${escapeHTML(log.nama_pelaku)} • ${escapeHTML(log.detail || "-")}</div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    async function createAnnouncementSubmit(e) {
      e.preventDefault();
      const row = {
        id: generateUUID(),
        judul: document.getElementById("annJudul").value.trim(),
        isi: document.getElementById("annIsi").value.trim(),
        penting: true,
        created_by: appState.currentUser.id,
        created_at: new Date().toISOString()
      };
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("pengumuman", "insert", row);
      }
      dbStore.pengumuman.unshift(row);
      showToast("Pengumuman berhasil diterbitkan!", "success");
      renderApp();
    }

    async function deleteAnnouncement(id) {
      if (isLiveSupabase && supabaseClient) {
        await supabaseClient.from("pengumuman").delete().eq("id", id);
      }
      dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
      showToast("Pengumuman dihapus.", "info");
      renderApp();
    }

    // ============================================================================
    // INISIALISASI SAAT HALAMAN DIMUAT
    // ============================================================================
    (async function bootApp() {
      renderApp();
      await restoreSupabaseSession();
    })();
  </script>
</body>
</html>
