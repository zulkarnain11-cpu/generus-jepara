      const uid = appState.currentUser.id;
      const selectedKeys = appState.jurnalModalSelectedMateri || [];

      selectedKeys.forEach(k => {
        const el = document.getElementById(`jMat_${k}`);
        materiValues[k] = el ? el.value.trim() : String(appState.jurnalModalDraftValues[k] || "").trim();
      });

      const filledPairs = MATERI_OPTIONS_LIST
        .filter(m => String(materiValues[m.key] || "").trim() !== "")
        .map(m => `${m.label}: ${materiValues[m.key]}`);

      if (filledPairs.length === 0) {
        showToast("Pilih dan isi minimal 1 opsi materi pembelajaran hari ini.", "warning");
        return;
      }

      const payload = {
        id: editId || generateUUID(),
        kelompok_id: uid,
        rombel_id: document.getElementById("jRombel").value || null,
        tanggal: document.getElementById("jTanggal").value,
        nama_guru: document.getElementById("jGuru").value.trim(),
        materi: filledPairs.join(" | "),
        pegon: materiValues.pegon,
        tajwid: materiValues.tajwid,
        hafalan: materiValues.hafalan,
        bacaan: materiValues.bacaan,
        makna: materiValues.makna,
        lain_lain: materiValues.lain_lain,
        metode: document.getElementById("jMetode").value.trim(),
        jumlah_hadir: parseInt(document.getElementById("jHadir").value, 10) || 0,
        catatan: document.getElementById("jCatatan").value.trim()
      };

      if (isLiveSupabase && supabaseClient) {
        const res = editId
          ? await resilientSupabaseMutation("jurnal_guru", "update", payload, { id: editId })
          : await resilientSupabaseMutation("jurnal_guru", "insert", payload);
        if (res.error) {
          showToast("Gagal menyimpan jurnal: " + res.error.message, "error");
          return;
        }
      }

      if (editId) {
        const idx = dbStore.jurnal_guru.findIndex(x => x.id === editId);
        if (idx >= 0) dbStore.jurnal_guru[idx] = { ...dbStore.jurnal_guru[idx], ...payload };
      } else {
        dbStore.jurnal_guru.unshift({ ...payload, created_at: new Date().toISOString() });
      }

      const shouldAutoSync = document.getElementById("jAutoSyncLaporan")?.checked;
      let syncedOk = false;
      if (shouldAutoSync) {
        const syncWeek = parseInt(document.getElementById("jSyncWeek")?.value, 10) || 1;
        const syncPt = parseInt(document.getElementById("jSyncPertemuan")?.value, 10) || 1;
        syncedOk = await syncJurnalToLaporanKegiatan(payload, syncWeek, syncPt);
      }

      closeModal();
      showToast(
        syncedOk
          ? "Jurnal guru disimpan & otomatis terintegrasi ke Laporan Kegiatan!"
          : "Jurnal guru berhasil disimpan!",
        "success"
      );
      logActivity("Simpan Jurnal Guru", `${payload.nama_guru} - ${payload.materi}`);
      renderApp();
    }

    function deleteJurnalItem(id) {
      confirmDialog("Hapus Jurnal?", "Catatan jurnal pertemuan ini akan dihapus permanen.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await supabaseClient.from("jurnal_guru").delete().eq("id", id);
        }
        dbStore.jurnal_guru = dbStore.jurnal_guru.filter(x => x.id !== id);
        showToast("Jurnal berhasil dihapus.", "info");
        renderApp();

    function syncJurnalHadirFromPresensi(notify = false) {
      const uid = appState.currentUser?.id;
      const tgl = document.getElementById("jTanggal")?.value;
      const rombelId = document.getElementById("jRombel")?.value;
      const hadirEl = document.getElementById("jHadir");
      if (!uid || !tgl || !rombelId || !hadirEl) return;
      const count = dbStore.presensi.filter(p =>
        p.kelompok_id === uid &&
        p.rombel_id === rombelId &&
        p.tanggal === tgl &&
        p.status === "H"
      ).length;
      if (count > 0 || notify) {
        hadirEl.value = count;
        if (notify) {
          showToast(count > 0 ? `Jumlah hadir otomatis diisi (${count} santri) dari data Presensi.` : "Belum ada catatan presensi pada tanggal & kelas tersebut.", count > 0 ? "success" : "info");
        }
      }
    }

    function exportJurnalExcel() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const list = dbStore.jurnal_guru
        .filter(j => {
          const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
          return j.kelompok_id === uid && jm === bulan && jy === tahun;
        })
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      const rows = list.map((j, idx) => ({
        No: idx + 1,
        Tanggal: j.tanggal,
        "Rombel / Kelas": getRombelName(j.rombel_id),
        "Nama Guru": j.nama_guru,
        Pegon: j.pegon || "-",
        Tajwid: j.tajwid || "-",
        Hafalan: j.hafalan || "-",
        Bacaan: j.bacaan || "-",
        Makna: j.makna || "-",
        "Lain-lain": j.lain_lain || (!j.pegon && !j.tajwid && !j.hafalan && !j.bacaan && !j.makna ? j.materi : "-"),
        "Metode Pembelajaran": j.metode || "-",
        "Jumlah Hadir": j.jumlah_hadir,
        Catatan: j.catatan || "-"
      }));
      exportToExcelFile(rows, "Jurnal_Guru", `Jurnal_Guru_${appState.currentUser.username}_${NAMA_BULAN[bulan - 1]}_${tahun}.xlsx`);

    async function cyclePresensiCell(pesertaId, tanggal) {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      if (!rombelId) {
        showToast("Pilih atau tambah kelas/rombel terlebih dahulu.", "warning");
        return;
      }
      const [yStr, mStr] = tanggal.split("-");
      const bulan = parseInt(mStr, 10);
      const tahun = parseInt(yStr, 10);

      const order = ["H", "I", "S", "A", null];
      const existingIdx = dbStore.presensi.findIndex(r => r.peserta_id === pesertaId && r.tanggal === tanggal);
      const currentStatus = existingIdx >= 0 ? dbStore.presensi[existingIdx].status : null;
      const nextStatus = order[(order.indexOf(currentStatus) + 1) % order.length];

      if (nextStatus === null) {
        const removed = existingIdx >= 0 ? dbStore.presensi[existingIdx] : null;
        if (existingIdx >= 0) dbStore.presensi.splice(existingIdx, 1);
        if (removed && isLiveSupabase && supabaseClient && !appState.isOfflineMode) {
          await supabaseClient.from("presensi").delete().eq("peserta_id", pesertaId).eq("tanggal", tanggal);
        }
        renderApp();
        return;
      }

      const row = {
        id: existingIdx >= 0 ? dbStore.presensi[existingIdx].id : generateUUID(),
        kelompok_id: uid,
        rombel_id: rombelId,
        peserta_id: pesertaId,
        bulan,
        tahun,
        tanggal,
        status: nextStatus
      };

      if (existingIdx >= 0) dbStore.presensi[existingIdx] = row;
      else dbStore.presensi.push(row);

      if (appState.isOfflineMode) {
        const qIdx = appState.offlinePresensiQueue.findIndex(q => q.peserta_id === pesertaId && q.tanggal === tanggal);
        if (qIdx >= 0) appState.offlinePresensiQueue[qIdx] = row;
        else appState.offlinePresensiQueue.push(row);
      } else if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("presensi", "upsert", row, null, { onConflict: "peserta_id,tanggal" });
      }
      renderApp();
    }

    async function handleImportPesertaExcel() {
      const uid = appState.currentUser.id;
      const rombelId = appState.presensiSelectedRombel;
      const fileInput = document.getElementById("importPesertaFile");
      const file = fileInput?.files?.[0];
      if (!file) {
        showToast("Pilih file Excel terlebih dahulu.", "warning");
        return;
      }
      if (!window.XLSX) {
        showToast("Library pembaca Excel belum siap. Muat ulang halaman.", "error");
        return;
      }
      try {
        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: "array" });
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const jsonRows = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

        const newRows = [];
        jsonRows.forEach(row => {
          const nama = String(row["Nama Santri"] || row["Nama"] || row["nama_peserta"] || "").trim();
          if (!nama) return;
          const jkRaw = String(row["JK"] || row["Jenis Kelamin"] || "L").trim().toUpperCase();
          const jk = jkRaw.startsWith("P") ? "P" : "L";
          newRows.push({
            id: generateUUID(),
            kelompok_id: uid,
            rombel_id: rombelId,
            nama_peserta: nama,
            jenis_kelamin: jk,
            tempat_lahir: String(row["Tempat Lahir"] || "").trim(),
            tanggal_lahir: String(row["Tanggal Lahir"] || "").trim() || null,
            nama_ortu_wali: String(row["Nama Orang Tua / Wali"] || row["Orang Tua / Wali"] || row["Wali"] || "").trim(),
            no_wa_wali: String(row["No WA Wali"] || row["No. WA Wali"] || row["WhatsApp"] || "").trim(),
            aktif: true
          });
        });

        if (newRows.length === 0) {
          showToast("Tidak ditemukan baris valid dengan kolom 'Nama Santri'.", "warning");
          return;
        }

        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("peserta", "insert", newRows);
          if (res.error) {
            showToast("Gagal mengimpor data ke database: " + res.error.message, "error");
            return;
          }
        }

        dbStore.peserta.push(...newRows);
        closeModal();
        showToast(`${newRows.length} data santri berhasil diimpor!`, "success");
        renderApp();
      } catch (err) {
        showToast("Gagal membaca file Excel: " + err.message, "error");
      }
    }

    function buildPresensiRecapGridData(uid, rombelId, bulan, tahun) {
      const kelompokName = getKelompokName(uid);
      const desaName = getKelompokDesa(uid);
      const rombelName = getRombelName(rombelId);
      const bulanName = NAMA_BULAN[bulan - 1];
      const daysInMonth = new Date(tahun, bulan, 0).getDate();

      const pesertaList = dbStore.peserta
        .filter(p => p.kelompok_id === uid && p.rombel_id === rombelId && p.aktif)
        .sort((a, b) => a.nama_peserta.localeCompare(b.nama_peserta));

      const presRecords = dbStore.presensi.filter(r =>
        r.kelompok_id === uid &&
        r.rombel_id === rombelId &&
        Number(r.bulan) === Number(bulan) &&
        Number(r.tahun) === Number(tahun)
      );

      const distinctDates = Array.from(new Set(presRecords.map(r => r.tanggal))).sort();
      const hariTerabsen = distinctDates.length;

      const dayColumns = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${tahun}-${String(bulan).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const isSunday = new Date(tahun, bulan - 1, d).getDay() === 0;
        dayColumns.push({ day: d, iso, isSunday });
      }

      const studentRows = pesertaList.map((p, idx) => {
        const pRecs = presRecords.filter(r => r.peserta_id === p.id);
        const byDate = {};
        pRecs.forEach(r => { byDate[r.tanggal] = r.status; });

        const dailyStatuses = dayColumns.map(col => byDate[col.iso] || "");
        const H = pRecs.filter(r => r.status === "H").length;
        const S = pRecs.filter(r => r.status === "S").length;
        const I = pRecs.filter(r => r.status === "I").length;
        const A = pRecs.filter(r => r.status === "A").length;
        const totalRecorded = H + S + I + A;
        const pct = totalRecorded > 0 ? Math.round((H / totalRecorded) * 100) : 0;

        return {
          no: idx + 1,
          id: p.id,
          nama: p.nama_peserta,
          dailyStatuses,
          H,
          S,
          I,
          A,
          pct
        };
      });

      return {
        kelompokName,
        desaName,
        rombelName,
        bulan,
        bulanName,
        tahun,
        daysInMonth,
        dayColumns,
        hariTerabsen,
        studentRows
      };
    }

    function exportPresensiExcel() {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const rombelId = appState.presensiSelectedRombel;
      if (!rombelId) {
        showToast("Pilih kelas/rombel terlebih dahulu.", "warning");
        return;
      }

      const gridData = buildPresensiRecapGridData(uid, rombelId, bulan, tahun);
      if (gridData.studentRows.length === 0) {
        showToast("Belum ada santri terdaftar pada kelas ini untuk diekspor.", "warning");
        return;
      }

      const fileName = `Rekap_Presensi_${gridData.rombelName.replace(/\s+/g, "_")}_${gridData.bulanName}_${tahun}.xlsx`;

      try {
        if (window.XLSX) {
          const totalCols = gridData.daysInMonth + 7; // No, Nama Santri, 1..N, H, S, I, A, %
          const aoa = [
            ["PENGGERAK PEMBINA GENERUS (PPG) DAERAH JEPARA"],
            ["DIGITALISASI GENERUS JEPARA (DIGENARA) • KABUPATEN JEPARA, JAWA TENGAH"],
            [],
            [`Rekap Presensi ${gridData.bulanName} ${tahun}`],
            ["Kelompok / Lembaga", `: ${gridData.kelompokName}`],
            ["Desa / Wilayah", `: ${gridData.desaName}`],
            ["Kelas / Rombel", `: ${gridData.rombelName}`],
            ["Bulan", `: ${gridData.bulanName} ${tahun}`],
            ["Hari terabsen", `: ${gridData.hariTerabsen} hari`],
            [],
            [
              "No",
              "Nama Santri",
              ...gridData.dayColumns.map(c => String(c.day)),
              "H",
              "S",
              "I",
              "A",
              "%"
            ],
            ...gridData.studentRows.map(r => [
              r.no,
              r.nama,
              ...r.dailyStatuses,
              r.H,
              r.S,
              r.I,
              r.A,
              r.pct
            ])
          ];

          const ws = XLSX.utils.aoa_to_sheet(aoa);
          ws["!merges"] = [
            { s: { r: 0, c: 0 }, e: { r: 0, c: totalCols - 1 } },
            { s: { r: 1, c: 0 }, e: { r: 1, c: totalCols - 1 } },
            { s: { r: 3, c: 0 }, e: { r: 3, c: totalCols - 1 } }
          ];
          ws["!cols"] = [
            { wch: 5 },
            { wch: 30 },
            ...gridData.dayColumns.map(() => ({ wch: 4 })),
            { wch: 5 },
            { wch: 5 },
            { wch: 5 },
            { wch: 5 },
            { wch: 6 }
          ];

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, `Presensi_${gridData.bulanName}`.slice(0, 31));
          XLSX.writeFile(wb, fileName);
          showToast(`File Excel "${fileName}" berhasil diunduh!`, "success");
        } else {
          const fallbackRows = gridData.studentRows.map(r => {
            const obj = { No: r.no, "Nama Santri": r.nama };
            gridData.dayColumns.forEach((c, idx) => { obj[String(c.day)] = r.dailyStatuses[idx]; });
            obj.H = r.H;
            obj.S = r.S;
            obj.I = r.I;
            obj.A = r.A;
            obj["%"] = r.pct;
            return obj;
          });
          exportToExcelFile(fallbackRows, "Rekap_Presensi", fileName);
        }
      } catch (err) {
        showToast("Gagal mengekspor Rekap Presensi Excel: " + err.message, "error");
      }
    }

    function ensureMonthlyReportAndRows(kelompokId, bulan, tahun) {
      let lap = dbStore.laporan_bulanan.find(l => l.kelompok_id === kelompokId && Number(l.bulan) === bulan && Number(l.tahun) === tahun);
      if (!lap) {
        lap = {
          id: generateUUID(),
          kelompok_id: kelompokId,
          bulan,
          tahun,
          jumlah_pertemuan: 0,
          jumlah_peserta_aktif: 0,
          rekap_hadir: 0,
          rekap_izin: 0,
          rekap_sakit: 0,
          rekap_alpha: 0,
          catatan_umum: "",
          capaian_bulanan: "",
          catatan_tambahan: "",
          status: "Draft",
          terlambat: false,
          komentar_admin: "",
          created_at: new Date().toISOString()
        };
        dbStore.laporan_bulanan.push(lap);
      }

      const rombels = getGroupRombels(kelompokId);
      rombels.forEach(r => {
        const freq = Math.min(7, Math.max(1, Number(r.pertemuan_per_minggu) || (isMudaMudiRombel(r.nama_rombel) ? 2 : 5)));
        for (let w = 1; w <= 5; w++) {
          for (let pt = 1; pt <= freq; pt++) {
            const exists = dbStore.laporan_mingguan.find(x =>
              x.laporan_id === lap.id &&
              x.rombel_id === r.id &&
              Number(x.minggu_ke) === w &&
              Number(x.pertemuan_ke || 1) === pt
            );
            if (!exists) {
              dbStore.laporan_mingguan.push({
                id: generateUUID(),
                laporan_id: lap.id,
                rombel_id: r.id,
                minggu_ke: w,
                pertemuan_ke: pt,
                tanggal: "",
                pegon: "",
                bacaan: "",
                tajwid: "",
                hafalan: "",
                makna: "",
                lain_lain: "",
                tidak_ada_kegiatan: false,
                alasan: "",
                keterangan: ""
              });
            }
          }
        }
      });

      return lap;
    }

    function getSelectedMateriKeysForRow(row) {
      if (appState.weeklySelectedMateriMap[row.id]) {
        return appState.weeklySelectedMateriMap[row.id];
      }
      const detected = MATERI_OPTIONS_LIST.filter(m => String(row[m.key] || "").trim() !== "").map(m => m.key);
      appState.weeklySelectedMateriMap[row.id] = detected;
      return detected;
    }

    function toggleWeeklyMateriKey(rowId, key) {
      const row = dbStore.laporan_mingguan.find(w => w.id === rowId);
      if (!row) return;
      const cur = new Set(getSelectedMateriKeysForRow(row));
      if (cur.has(key)) {
        cur.delete(key);
        row[key] = "";
      } else {
        cur.add(key);
      }
      appState.weeklySelectedMateriMap[rowId] = Array.from(cur);
      renderApp();
    }

    function updateWeeklyRowField(rowId, field, value, shouldRender = false) {
      const row = dbStore.laporan_mingguan.find(w => w.id === rowId);
      if (!row) return;
      row[field] = value;
      if (shouldRender) renderApp();
    }

    function updateMonthlyReportField(lapId, field, value) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === lapId);
      if (!lap) return;
      lap[field] = value;
    }

    function copyWholeWeekFromPrevious(laporanId, rombelId, targetWeek, meetingsPerWeek) {
      const prevWeek = targetWeek - 1;
      for (let pt = 1; pt <= meetingsPerWeek; pt++) {
        const src = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId && w.rombel_id === rombelId && Number(w.minggu_ke) === prevWeek && Number(w.pertemuan_ke || 1) === pt
        );
        const dst = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId && w.rombel_id === rombelId && Number(w.minggu_ke) === targetWeek && Number(w.pertemuan_ke || 1) === pt
        );
        if (src && dst) {
          dst.pegon = src.pegon;
          dst.bacaan = src.bacaan;
          dst.tajwid = src.tajwid;
          dst.hafalan = src.hafalan;
          dst.makna = src.makna;
          dst.lain_lain = src.lain_lain;
          dst.tidak_ada_kegiatan = src.tidak_ada_kegiatan;
          dst.alasan = src.alasan;
          dst.keterangan = src.keterangan;
          appState.weeklySelectedMateriMap[dst.id] = [...getSelectedMateriKeysForRow(src)];
        }
      }
      showToast(`Seluruh pertemuan Minggu ke-${targetWeek - 1} disalin ke Minggu ke-${targetWeek}.`, "success");
      renderApp();
    }

    function pullMaterialsFromJurnalToWeek(laporanId, rombelId, targetWeek, meetingsPerWeek) {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;

      const matchingJurnals = dbStore.jurnal_guru
        .filter(j => {
          const [jy, jm] = String(j.tanggal || "").split("-").map(Number);
          return j.kelompok_id === uid && j.rombel_id === rombelId && jm === bulan && jy === tahun;
        })
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      if (matchingJurnals.length === 0) {
        showToast("Belum ada catatan Jurnal Guru untuk kelas & bulan ini.", "warning");
        return;
      }

      const startIdx = (targetWeek - 1) * meetingsPerWeek;
      const sliceJurnals = matchingJurnals.slice(startIdx, startIdx + meetingsPerWeek);
      const fallbackJurnals = sliceJurnals.length > 0 ? sliceJurnals : matchingJurnals.slice(0, meetingsPerWeek);

      let filled = 0;
      fallbackJurnals.forEach((j, idx) => {
        const pt = idx + 1;
        const targetRow = dbStore.laporan_mingguan.find(w =>
          w.laporan_id === laporanId &&
          w.rombel_id === rombelId &&
          Number(w.minggu_ke) === targetWeek &&
          Number(w.pertemuan_ke || 1) === pt
        );
        if (targetRow) {
          targetRow.tanggal = j.tanggal;
          targetRow.tidak_ada_kegiatan = false;
          targetRow.alasan = "";
          const hasStructured = MATERI_OPTIONS_LIST.some(m => String(j[m.key] || "").trim() !== "");
          if (hasStructured) {
            MATERI_OPTIONS_LIST.forEach(m => {
              targetRow[m.key] = j[m.key] || "";
            });
          } else {
            targetRow.lain_lain = j.materi || "";
          }
          targetRow.keterangan = [j.metode ? `Metode: ${j.metode}` : "", j.catatan || ""].filter(Boolean).join(" • ");
          appState.weeklySelectedMateriMap[targetRow.id] = MATERI_OPTIONS_LIST
            .filter(m => String(targetRow[m.key] || "").trim() !== "")
            .map(m => m.key);
          filled++;
        }
      });

      showToast(`${filled} pertemuan Minggu ke-${targetWeek} berhasil disinkronkan dari Jurnal Guru!`, "success");
      renderApp();
    }

    async function saveMonthlyReport(laporanId, targetStatus) {
      const uid = appState.currentUser.id;
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;

      const deadlineInfo = getReportDeadlineInfo(lap.bulan, lap.tahun);
      if (targetStatus === "Dikirim" && deadlineInfo.isPassed && !deadlineInfo.allowLate && lap.status !== "Perlu Revisi") {
        showToast(`Batas waktu pelaporan (${deadlineInfo.formattedDate}) telah ditutup oleh Admin Daerah.`, "error");
        return;
      }

      const presSum = calculatePresensiSummary(uid, lap.bulan, lap.tahun);
      const activePesertaCount = dbStore.peserta.filter(p => p.kelompok_id === uid && p.aktif).length;
      const myWeeklyRows = dbStore.laporan_mingguan.filter(w => w.laporan_id === lap.id);
      const activeMeetings = myWeeklyRows.filter(w => !w.tidak_ada_kegiatan && (w.tanggal || MATERI_OPTIONS_LIST.some(m => String(w[m.key] || "").trim() !== "")));

      lap.jumlah_pertemuan = activeMeetings.length;
      lap.jumlah_peserta_aktif = activePesertaCount;
      lap.rekap_hadir = presSum.H;
      lap.rekap_izin = presSum.I;
      lap.rekap_sakit = presSum.S;
      lap.rekap_alpha = presSum.A;
      lap.status = targetStatus;
      if (targetStatus === "Dikirim") {
        lap.submitted_at = new Date().toISOString();
        lap.terlambat = Boolean(deadlineInfo.isPassed);
      }

      if (isLiveSupabase && supabaseClient) {
        const resHeader = await resilientSupabaseMutation("laporan_bulanan", "upsert", lap, null, { onConflict: "kelompok_id,bulan,tahun" });
        if (resHeader.error) {
          showToast("Gagal menyimpan laporan: " + resHeader.error.message, "error");
          return;
        }
        const filledWeekly = myWeeklyRows.filter(w =>
          w.tanggal || w.tidak_ada_kegiatan || MATERI_OPTIONS_LIST.some(m => String(w[m.key] || "").trim() !== "") || w.keterangan
        ).map(w => ({
          ...w,
          tanggal: w.tanggal || null
        }));
        if (filledWeekly.length > 0) {
          await resilientSupabaseMutation("laporan_mingguan", "upsert", filledWeekly, null, { onConflict: "laporan_id,rombel_id,minggu_ke,pertemuan_ke" });
        }
      }

      const msgSent = lap.terlambat
        ? "Laporan bulanan berhasil dikirim ke Admin Daerah (dengan keterangan Terlambat)."
        : "Laporan bulanan berhasil dikirim ke Admin Daerah Jepara!";
      showToast(targetStatus === "Dikirim" ? msgSent : "Draft laporan berhasil disimpan!", targetStatus === "Dikirim" && lap.terlambat ? "warning" : "success");
      logActivity(targetStatus === "Dikirim" ? "Kirim Laporan Bulanan" : "Simpan Draft Laporan", `${NAMA_BULAN[lap.bulan - 1]} ${lap.tahun}${lap.terlambat ? " (Terlambat)" : ""}`);
      renderApp();
    }

    const WA_DRAFTS_STORAGE_KEY = "digenara_wa_saved_drafts_v1";

    function normalizeIndonesianPhoneForWA(rawPhone) {
      let digits = String(rawPhone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.startsWith("0")) digits = "62" + digits.slice(1);
      else if (digits.startsWith("8")) digits = "62" + digits;
      return digits;
    }

    function getSavedWhatsAppDraft(draftKey) {
      try {
        const raw = localStorage.getItem(WA_DRAFTS_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return typeof parsed[draftKey] === "string" ? parsed[draftKey] : null;
      } catch (e) {
        return null;
      }
    }

    function persistWhatsAppDraft(draftKey, textVal) {
      try {
        const raw = localStorage.getItem(WA_DRAFTS_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        parsed[draftKey] = String(textVal || "");
        localStorage.setItem(WA_DRAFTS_STORAGE_KEY, JSON.stringify(parsed));
        return true;
      } catch (e) {
        return false;
      }
    }

    function clearWhatsAppDraft(draftKey) {
      try {
        const raw = localStorage.getItem(WA_DRAFTS_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        delete parsed[draftKey];
        localStorage.setItem(WA_DRAFTS_STORAGE_KEY, JSON.stringify(parsed));
      } catch (e) {}
    }

    function generateDefaultGroupWeeklyWAText(laporanId, rombelId, weekNum) {
      const kelompokName = appState.currentUser.nama_kelompok;
      const rombelName = getRombelName(rombelId);
      const bulanName = NAMA_BULAN[appState.selectedMonth - 1];
      const rows = dbStore.laporan_mingguan
        .filter(w => w.laporan_id === laporanId && w.rombel_id === rombelId && Number(w.minggu_ke) === Number(weekNum))
        .sort((a, b) => Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1));

      const lines = [
        `*LAPORAN KEGIATAN PENGAJIAN GENERUS*`,
        `Kelompok: *${kelompokName}*`,
        `Kelas: *${rombelName}*`,
        `Periode: *Minggu ke-${weekNum} (${bulanName} ${appState.selectedYear})*`,
        ``
      ];

      rows.forEach(r => {
        const tglStr = r.tanggal ? formatTanggalID(r.tanggal) : `Pertemuan ${r.pertemuan_ke || 1}`;
        if (r.tidak_ada_kegiatan) {
          lines.push(`• *${tglStr}*: Tidak ada kegiatan (${r.alasan || "Libur"})`);
        } else {
          const mats = MATERI_OPTIONS_LIST
            .filter(m => String(r[m.key] || "").trim() !== "")
            .map(m => `${m.label}: ${r[m.key]}`);
          if (mats.length > 0 || r.tanggal) {
            lines.push(`• *${tglStr}*: ${mats.length > 0 ? mats.join(" | ") : "Kegiatan pengajian rutin"}`);
          }
        }
      });

      lines.push(``, `_Jazakumullahu khairan katsiran atas perhatian & dukungan Bapak/Ibu orang tua/wali._`);
      return lines.join("\n");
    }

    function generateDefaultPesertaWAText(pesertaId, rombelId, laporanId, scopeMode = "BULAN", weekNum = 1) {
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const bulanName = NAMA_BULAN[bulan - 1];
      const kelompokName = appState.currentUser.nama_kelompok;
      const rombelName = getRombelName(rombelId);
      const student = dbStore.peserta.find(p => p.id === pesertaId);
      const namaSantri = student?.nama_peserta || "Ananda";
      const namaWali = student?.nama_ortu_wali || "Bapak/Ibu Orang Tua/Wali";

      const lap = laporanId
        ? dbStore.laporan_bulanan.find(l => l.id === laporanId)
        : ensureMonthlyReportAndRows(uid, bulan, tahun);

      const allPres = dbStore.presensi
        .filter(r => r.kelompok_id === uid && r.rombel_id === rombelId && r.peserta_id === pesertaId && Number(r.bulan) === bulan && Number(r.tahun) === tahun)
        .sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)));

      const filteredPres = scopeMode === "MINGGU"
        ? allPres.filter(r => Math.min(5, Math.max(1, Math.ceil(Number(String(r.tanggal).slice(8, 10)) / 7))) === Number(weekNum))
        : allPres;

      const cH = filteredPres.filter(r => r.status === "H").length;
      const cI = filteredPres.filter(r => r.status === "I").length;
      const cS = filteredPres.filter(r => r.status === "S").length;
      const cA = filteredPres.filter(r => r.status === "A").length;
      const total = filteredPres.length;
      const pct = total > 0 ? Math.round((cH / total) * 100) : 0;

      const statusLabelMap = { H: "Hadir", I: "Izin", S: "Sakit", A: "Alpha" };

      const weeklyRows = dbStore.laporan_mingguan
        .filter(w =>
          w.laporan_id === lap.id &&
          w.rombel_id === rombelId &&
          (scopeMode !== "MINGGU" || Number(w.minggu_ke) === Number(weekNum))
        )
        .sort((a, b) => (Number(a.minggu_ke) - Number(b.minggu_ke)) || (Number(a.pertemuan_ke || 1) - Number(b.pertemuan_ke || 1)));

      const jurnalRows = dbStore.jurnal_guru.filter(j => {
        const [jy, jm, jd] = String(j.tanggal || "").split("-").map(Number);
        const wk = Math.min(5, Math.max(1, Math.ceil((jd || 1) / 7)));
        return j.kelompok_id === uid && j.rombel_id === rombelId && jm === bulan && jy === tahun && (scopeMode !== "MINGGU" || wk === Number(weekNum));
      });

      const periodTitle = scopeMode === "MINGGU"
        ? `Minggu ke-${weekNum} (${bulanName} ${tahun})`
        : `Bulan ${bulanName} ${tahun}`;

      const lines = [
        `Assalamu'alaikum Wr. Wb.`,
        `Yth. *${namaWali}*, orang tua/wali dari ananda *${namaSantri}*.`,
        ``,
        `Berikut laporan perkembangan kegiatan pengajian ananda di *${kelompokName}* (Kelas: *${rombelName}*) periode *${periodTitle}*:`,
        ``,
        `*1. Rekap Kehadiran Ananda:*`,
        total > 0
          ? `• Hadir: *${cH}x* | Izin: *${cI}x* | Sakit: *${cS}x* | Alpha: *${cA}x* (Persentase Hadir: *${pct}%*)`
          : `• Belum ada catatan presensi pada periode ini.`,
      ];

      if (filteredPres.length > 0) {
        const dateStatusList = filteredPres.map(r => `${formatTanggalID(r.tanggal)} (${statusLabelMap[r.status] || r.status})`);
        lines.push(`• Rincian Tanggal: ${dateStatusList.join(", ")}`);
      }

      lines.push(``, `*2. Materi & Kegiatan Pengajian:*`);

      const activityBullets = [];
      weeklyRows.forEach(w => {
        if (w.tidak_ada_kegiatan) return;
        const mats = MATERI_OPTIONS_LIST
          .filter(m => String(w[m.key] || "").trim() !== "")
          .map(m => `${m.label}: ${w[m.key]}`);
        if (mats.length > 0) {
          const tglInfo = w.tanggal ? formatTanggalID(w.tanggal) : `Minggu ${w.minggu_ke} Pt-${w.pertemuan_ke || 1}`;
          const presOnDate = w.tanggal ? filteredPres.find(p => p.tanggal === w.tanggal) : null;
          const stTag = presOnDate ? ` [${statusLabelMap[presOnDate.status] || presOnDate.status}]` : "";
          activityBullets.push(`• *${tglInfo}*${stTag}: ${mats.join(" | ")}`);
        }
      });

      if (activityBullets.length === 0 && jurnalRows.length > 0) {
        jurnalRows.forEach(j => {
          activityBullets.push(`• *${formatTanggalID(j.tanggal)}*: ${j.materi}`);
        });
      }

      if (activityBullets.length > 0) {
        lines.push(...activityBullets);
      } else {
        lines.push(`• Kegiatan pengajian rutin sesuai jadwal kelas.`);
      }

      lines.push(
        ``,
        `Semoga ananda *${namaSantri}* senantiasa diberikan ilmu yang manfaat & barokah serta menjadi generus yang alim-faqih, berakhlakul karimah, dan mandiri.`,
        `_Jazakumullahu khairan katsiran._`,
        `Wassalamu'alaikum Wr. Wb.`
      );

      return lines.join("\n");
    }

    function saveEditedWhatsAppText() {
      const textarea = document.getElementById("waSharePreview");
      if (!textarea) return;
      const draftKey = getCurrentWADraftKey();
      if (persistWhatsAppDraft(draftKey, textarea.value)) {
        const ind = document.getElementById("waSavedIndicator");
        if (ind) {
          ind.textContent = "✅ Tersimpan";
          ind.className = "text-[11px] font-bold text-emerald-700";
        }
        showToast("Perubahan pesan WhatsApp berhasil disimpan!", "success");
      }
    }

    function resetWhatsAppEditorToAuto() {
      const draftKey = getCurrentWADraftKey();
      clearWhatsAppDraft(draftKey);
      const freshText = waModalState.mode === "PESERTA" && waModalState.pesertaId
        ? generateDefaultPesertaWAText(waModalState.pesertaId, waModalState.rombelId, waModalState.laporanId, waModalState.pesertaScope, waModalState.weekNum)
        : generateDefaultGroupWeeklyWAText(waModalState.laporanId, waModalState.rombelId, waModalState.weekNum);
      const textarea = document.getElementById("waSharePreview");
      if (textarea) textarea.value = freshText;
      const ind = document.getElementById("waSavedIndicator");
      if (ind) {
        ind.textContent = "Draft otomatis";
        ind.className = "text-[11px] font-bold text-slate-400";
      }
      showToast("Pesan dikembalikan ke format otomatis terbaru.", "info");
    }

    function copyEditedWhatsAppText() {
      const textarea = document.getElementById("waSharePreview");
      if (!textarea) return;
      textarea.select();
      textarea.setSelectionRange(0, 99999);
      try {
        document.execCommand("copy");
        showToast("Teks pesan WhatsApp berhasil disalin ke clipboard!", "success");
      } catch (e) {
        showToast("Silakan salin teks secara manual dari kotak pesan.", "warning");
      }
    }

    async function saveParentPhoneFromWAModal(pesertaId) {
      const student = dbStore.peserta.find(p => p.id === pesertaId);
      const phoneInput = document.getElementById("waRecipientPhone");
      if (!student || !phoneInput) return;
      const val = phoneInput.value.trim();
      student.no_wa_wali = val;
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("peserta", "update", { no_wa_wali: val }, { id: pesertaId });
      }
      showToast(`Nomor WhatsApp wali untuk ${student.nama_peserta} disimpan!`, "success");
    }

    function launchWhatsAppWithEditedText() {
      const textarea = document.getElementById("waSharePreview");
      const textToSend = textarea ? textarea.value : "";
      if (!textToSend.trim()) {
        showToast("Isi pesan WhatsApp tidak boleh kosong.", "warning");
        return;
      }
      // Otomatis simpan draft terbaru saat dikirim
      persistWhatsAppDraft(getCurrentWADraftKey(), textToSend);

      let targetUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(textToSend)}`;
      if (waModalState.mode === "PESERTA") {
        const phoneInput = document.getElementById("waRecipientPhone");
        const cleanPhone = normalizeIndonesianPhoneForWA(phoneInput ? phoneInput.value : "");
        if (cleanPhone) {
          targetUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(textToSend)}`;
        }
      }
      window.open(targetUrl, "_blank", "noopener,noreferrer");
    }

    async function handleUploadDokumentasi(e) {
      e.preventDefault();
      const uid = appState.currentUser.id;
      const bulan = appState.selectedMonth;
      const tahun = appState.selectedYear;
      const fileInput = document.getElementById("dokFile");
      const file = fileInput?.files?.[0];
      if (!file) return;

      const existingCount = dbStore.dokumentasi_kegiatan.filter(d =>
        d.kelompok_id === uid && Number(d.bulan) === bulan && Number(d.tahun) === tahun
      ).length;
      if (existingCount >= APP_CONFIG.MAX_PHOTOS_PER_MONTH) {
        showToast(`Batas maksimal ${APP_CONFIG.MAX_PHOTOS_PER_MONTH} foto per bulan telah tercapai.`, "warning");
        return;
      }

      try {
        const compressed = await compressImageFile(file);
        let publicUrl = compressed.dataUrl;
        let filePath = "";

        if (isLiveSupabase && supabaseClient && compressed.blob) {
          filePath = `${uid}/${tahun}_${bulan}_${Date.now()}.jpg`;
          const up = await supabaseClient.storage
            .from(APP_CONFIG.STORAGE_BUCKET)
            .upload(filePath, compressed.blob, { contentType: "image/jpeg", upsert: true });
          if (!up.error) {
            const pub = supabaseClient.storage.from(APP_CONFIG.STORAGE_BUCKET).getPublicUrl(filePath);
            if (pub?.data?.publicUrl) publicUrl = pub.data.publicUrl;
          }
        }

        const row = {
          id: generateUUID(),
          kelompok_id: uid,
          bulan,
          tahun,
          tanggal: document.getElementById("dokTanggal").value,
          keterangan: document.getElementById("dokKeterangan").value.trim(),
          file_path: filePath,
          public_url: publicUrl,
          ukuran_kb: compressed.sizeKB,
          created_at: new Date().toISOString()
        };

        if (isLiveSupabase && supabaseClient) {
          const res = await resilientSupabaseMutation("dokumentasi_kegiatan", "insert", row);
          if (res.error) {
            showToast("Gagal menyimpan dokumentasi: " + res.error.message, "error");
            return;
          }
        }

        dbStore.dokumentasi_kegiatan.unshift(row);
        showToast(`Foto berhasil dikompres (${compressed.sizeKB} KB) dan diunggah!`, "success");
        renderApp();
      } catch (err) {
        showToast("Gagal mengunggah foto: " + err.message, "error");
      }
    }

    function sendAdminReminderWA(namaKelompok, deadlineStr) {
      const bulanName = NAMA_BULAN[appState.selectedMonth - 1];

        `Yth. Pengurus & Guru *${namaKelompok}*.`,
        ``,
        `Mengingatkan dengan hormat untuk segera mengirimkan *Laporan Bulanan Pengajian Generus (DIGENARA)* periode *${bulanName} ${appState.selectedYear}* sebelum batas waktu *${deadlineStr}*.`,

    async function adminAssignDesa(userId, desaName) {
      const prof = dbStore.profiles.find(p => p.id === userId);
      if (!prof) return;
      prof.nama_desa = desaName;
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("profiles", "update", { nama_desa: desaName }, { id: userId });
      }
      showToast(`Wilayah ${prof.nama_kelompok} diatur ke ${desaName || "Belum Diatur"}.`, "success");
      renderApp();
    }

    async function adminChangeAccountStatus(userId, newStatus) {
      const prof = dbStore.profiles.find(p => p.id === userId);
      if (!prof) return;
      prof.status_akun = newStatus;
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("profiles", "update", { status_akun: newStatus }, { id: userId });
      }
      showToast(`Status akun ${prof.nama_kelompok} diubah menjadi ${newStatus}.`, "success");
      renderApp();
    }

    function openAdminResetPasswordModal(userId) {
      const prof = dbStore.profiles.find(p => p.id === userId);
      if (!prof) return;
      openModal(
        `Reset Password: ${prof.nama_kelompok}`,
        `
          <form id="formAdminResetPw" onsubmit="submitAdminResetPassword(event, '${userId}')" class="space-y-3.5">
            <p class="text-xs text-slate-600">Masukkan password baru untuk akun <strong>@${escapeHTML(prof.username)}</strong> (minimal 8 karakter):</p>
            <input id="adminNewPwInput" type="text" required minlength="8" value="GenerusJepara2026" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono" />
          </form>
        `,
        `
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-sm font-semibold">Batal</button>
          <button type="submit" form="formAdminResetPw" class="px-5 py-2 rounded-xl bg-emerald-700 text-white text-sm font-bold">Simpan Password Baru</button>
        `,
        "max-w-md"
      );
    }

    async function submitAdminResetPassword(e, userId) {
      e.preventDefault();
      const prof = dbStore.profiles.find(p => p.id === userId);
      const newPw = document.getElementById("adminNewPwInput").value.trim();
      if (!prof || newPw.length < 8) return;

      if (isLiveSupabase && supabaseClient) {
        const res = await supabaseClient.rpc("admin_reset_user_password", { target_user_id: userId, new_password: newPw });
        if (res.error) {
          showToast("Gagal mereset password di server: " + res.error.message, "error");
          return;
        }
      } else {
        prof.password_hash = newPw;
      }
      prof.reset_requested = false;
      prof.reset_note = "";
      closeModal();
      showToast(`Password baru untuk @${prof.username} berhasil diterapkan!`, "success");
      renderApp();
    }

    async function adminVerifyMonthlyReport(laporanId, newStatus) {
      const lap = dbStore.laporan_bulanan.find(l => l.id === laporanId);
      if (!lap) return;
      const comment = document.getElementById("adminReviewComment")?.value.trim() || "";
      lap.status = newStatus;
      lap.komentar_admin = comment;
      if (isLiveSupabase && supabaseClient) {
        await resilientSupabaseMutation("laporan_bulanan", "update", { status: newStatus, komentar_admin: comment }, { id: laporanId });
      }
      showToast(`Status laporan diperbarui menjadi "${newStatus}".`, "success");
      renderApp();
    }

              </div>
              <div class="sm:col-span-2">
                <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 font-extrabold text-xs sm:text-sm">
                  Simpan
                </button>
              </div>
            </form>
          </div>

          <!-- Form Buat Pengumuman Baru -->
          <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <h3 class="font-extrabold text-base text-slate-900">📢 Terbitkan Pengumuman Baru</h3>
            <form onsubmit="createAnnouncementSubmit(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Judul Pengumuman *</label>
                <input id="annJudul" type="text" required placeholder="Contoh: Jadwal Musyawarah PPG & Pengumpulan Laporan" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Isi Pengumuman *</label>
                <textarea id="annIsi" rows="3" required placeholder="Tuliskan pesan pengumuman untuk seluruh pengurus & guru kelompok se-Daerah Jepara..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"></textarea>
              </div>
              <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs sm:text-sm">
                📢 Publikasikan Pengumuman
              </button>
            </form>
          </div>

          <!-- Daftar Pengumuman Aktif -->
          <div class="space-y-3">
            ${dbStore.pengumuman.map(ann => `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-sm flex items-start justify-between gap-3">
                <div>
                  <div class="font-extrabold text-sm sm:text-base text-slate-900">${escapeHTML(ann.judul)}</div>
                  <div class="text-xs text-slate-400 mt-0.5">${formatDateTimeWIB(ann.created_at)}</div>
                  <p class="text-xs sm:text-sm text-slate-700 mt-2 leading-relaxed">${escapeHTML(ann.isi)}</p>
                </div>
                <button type="button" onclick="deleteAnnouncementItem('${ann.id}')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs shrink-0">
                  Hapus
                </button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    async function createAnnouncementSubmit(e) {
      e.preventDefault();
      const row = {
        id: generateUUID(),
        judul: document.getElementById("annJudul").value.trim(),
        isi: document.getElementById("annIsi").value.trim(),
        penting: true,
        created_at: new Date().toISOString()
      };
      if (isLiveSupabase && supabaseClient) {
        const res = await resilientSupabaseMutation("pengumuman", "insert", row);
        if (res.error) {
          showToast("Gagal menerbitkan pengumuman: " + res.error.message, "error");
          return;
        }
      }
      dbStore.pengumuman.unshift(row);
      deviceNotifState.seenAnnouncementIds.push(row.id);
      persistDeviceNotifState();
      if (getDeviceNotificationStatusInfo().isConnected) {
        await triggerNativeDeviceNotification(
          `📢 Pengumuman Diterbitkan: ${row.judul}`,
          row.isi,
          `digenara-ann-${row.id}`,
          "pengumuman"
        );
      }
      showToast("Pengumuman berhasil dipublikasikan ke seluruh kelompok!", "success");
      renderApp();
    }

    function deleteAnnouncementItem(id) {
      confirmDialog("Hapus Pengumuman?", "Pengumuman ini akan dihapus dari beranda kelompok.", async () => {
        if (isLiveSupabase && supabaseClient) {
          await supabaseClient.from("pengumuman").delete().eq("id", id);
        }
        dbStore.pengumuman = dbStore.pengumuman.filter(a => a.id !== id);
        showToast("Pengumuman dihapus.", "info");
        renderApp();
      }, "Hapus", true);
    }

    // ============================================================================
    // BOOT APLIKASI
    // ============================================================================
    initBrandingIconsAndManifest();
    renderApp();
    if (isLiveSupabase) {
      restoreSupabaseSession();
    }
  </script>
</body>
</html>
